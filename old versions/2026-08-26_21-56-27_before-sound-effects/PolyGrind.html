  if (D.golemN > 0 && !mCount('golemN')) return 'golemN';
  if (mCount('skeleton') < D.maxSkel) return 'skeleton';
  if (mCount('hunter')   < D.maxHunt) return 'hunter';
  if (mCount('warlock')  < D.maxWarl) return 'warlock';
  return null;
}

/* ---------- 6b. ПРИСПЕШНИКИ ----------
   Скелет — самостоятельная сущность: ищет ближайшего врага в радиусе,
   добегает и бьёт. Его урон считается от вашего среднего удара,
   поэтому вся прокачка урона косвенно усиливает и свиту.            */
function spawnMinion(x, y, kind){
  kind = kind || needKind();
  if (!kind) return false;
  const hp = minionHp(kind), px = x !== undefined ? x : G.player.x, py = y !== undefined ? y : G.player.y;
  G.minions.push({
    kind, x: px + rnd(-20,20), y: py + rnd(-20,20),
    r: minionR(kind), hp, max: hp,
    cd: rnd(0, 0.4), rot: rnd(0,6.28), hit:0, born:0, tgt:null, blinkT:undefined, hitN:0,
  });
  G.fx.push({t:'ring', x:px, y:py, r:4, max:26, life:0.25, col:MKIND[kind].col});
  return true;
}

/* Урон приспешника: отдельный, более простой путь — без условных бонусов,
   но с учётом брони цели, шока и крита свиты. */
/* Удар приспешника идёт по ТОМУ ЖЕ пути, что и удар игрока: damage() с меткой
   src.minion. Раньше здесь была своя укороченная копия формулы, и мимо свиты
   проходило почти всё — поджог, охлаждение, шок с разрядом, яд, оглушение,
   отбрасывание, добивание, сверхкриты, кольца, перчатки, счётчики «каждый N-й»
   и двойные удары. Некромант получал половину каталога вхолостую.
   Отличий у свиты ровно три, и все они внутри damage(): свой шанс крита,
   отбрасывание считается от приспешника, а не от игрока, и свой вампиризм. */
const FRENZY_R = 70;               // база радиуса взрыва «Буйства демонов»
const WHIRL_R  = 55;               // база радиуса «Вихря когтей»
/* КИПЯЩАЯ КРОВЬ. Лужа бьёт долей ТЕКУЩЕГО здоровья, поэтому урон не растёт
   с этажом и не убивает сам по себе: три тика по 5% снимают около 14% запаса
   у кого угодно. Ценность в том, что доля не зависит ни от брони, ни от
   множителей врага — это ответ на жирные цели, а не источник дпс.
   Потолок на число луж стоит от спама: свита получает удары десятками в секунду. */
const BOIL_R = 60, BOIL_LIFE = 3, BOIL_PCT = 0.05, BOIL_MAX = 24;
function boilRoll(m){
  if (!D.minBoil || Math.random() >= 0.05) return;
  if (G.boils.length >= BOIL_MAX) G.boils.shift();
  G.boils.push({x:m.x, y:m.y, r:BOIL_R*D.aoeR, life:BOIL_LIFE, t:1});
  G.fx.push({t:'ring', x:m.x, y:m.y, r:6, max:BOIL_R*D.aoeR, life:0.3, col:'#e0405a'});
}
function tickBoils(dt){
  for (let i = G.boils.length-1; i >= 0; i--){
    const b2 = G.boils[i];
    b2.life -= dt; b2.t -= dt;
    if (b2.life <= 0){ G.boils.splice(i,1); continue; }
    if (b2.t > 0) continue;
    b2.t = 1;                                        // тик раз в секунду, а не каждый кадр
    for (const e of G.enemies){
      if (dist(e, b2) > b2.r + e.r) continue;
      applyDamage(e, e.hp*BOIL_PCT, false, true);
      burst(e.x, e.y, 2, '#e0405a', 90, 2, 0.3);
    }
  }
}
/* Поводок свиты: дальше этого от ХОЗЯИНА цели не берутся вовсе. Раньше каждый
   приспешник искал ближайшего к себе, и стая всем составом уносилась за одним
   убегающим врагом через всю комнату, оставляя игрока голым. */
const MINION_LEASH = 640;
/* Штраф за занятую цель, в единицах расстояния. 500 означает «занятый враг
   считается на 500 дальше»: свита разбирает толпу параллельно, но если врагов
   меньше, чем бойцов, они всё равно добивают вместе, а не стоят без дела. */
const MINION_CLAIM_PENALTY = 500;

/* Перенос приспешника к цели со взрывом. Взрыв идёт через damage() с меткой
   приспешника, то есть по тому же пути, что и обычный удар: книги, статусы,
   кольца, счётчики «каждый N-й» — всё срабатывает.
   Единственное, чего он НЕ вызывает, — «Буйство демонов» и «Кровавую баню»:
   они висят на minionHit, и цепочка «взрыв рождает взрыв» была бы лавиной. */
function minionBlink(m, e, dt){
  const B = D.minBlink;
  m.blinkT = (m.blinkT === undefined ? rnd(0, B.cd) : m.blinkT) - dt;
  if (m.blinkT > 0) return false;
  m.blinkT = B.cd;
  const a = rnd(0, Math.PI*2), off = e.r + m.r + 4;
  G.fx.push({t:'ring', x:m.x, y:m.y, r:m.r, max:4, life:0.25, col:'#c08cff'});
  m.x = clamp(e.x + Math.cos(a)*off, -ARENA, ARENA);
  m.y = clamp(e.y + Math.sin(a)*off, -ARENA, ARENA);
  const R = B.r * D.aoeR;
  G.fx.push({t:'ring', x:m.x, y:m.y, r:6, max:R, life:0.3, col:'#c08cff'});
  burst(m.x, m.y, 10, '#c08cff', 220, 3, 0.45);
  const mul = D.minDmgMul * B.mul * (G.bloodT > 0 ? 2 : 1);
  for (const o of G.enemies){
    if (o.dead || dist(o, m) > R + o.r) continue;
    damage(o, {mul, minion:m, noDouble:true});
  }
  return true;
}

function minionHit(e, m){
  // Голем крови масштабируется от вас напрямую, остальные — через множитель свиты
  const rage = G.bloodT > 0 ? 2 : 1;                 // КРОВНЫЕ УЗЫ: ярость от вашей крови
  const mul = (m.kind === 'golemB' ? D.golemBMul : D.minDmgMul) * rage;
  damage(e, {mul, minion:m});

  /* КОГТИ. Счётчик у каждого приспешника свой: общий на всю свиту означал бы,
     что десять бойцов выбивают «каждый пятый» пять раз в секунду на всех вместе,
     и период перестал бы что-либо значить для отдельного скелета.
     Добавочные удары идут с noDouble: иначе двойное попадание игрока плодило бы
     их дальше, и один взмах разрастался бы в очередь. */
  if (D.minClaws || D.minWhirl){
    m.hitN = (m.hitN || 0) + 1;
    if (D.minClaws && m.hitN % 5 === 0){
      damage(e, {mul:mul*0.30, minion:m, noDouble:true});
      burst(e.x, e.y, 4, '#e6e2d6', 160, 2, 0.3);
    }
    if (D.minWhirl && m.hitN % 10 === 0){
      const R = WHIRL_R * D.aoeR;
      G.fx.push({t:'ring', x:m.x, y:m.y, r:8, max:R, life:0.24, col:'#e6e2d6'});
      for (const o of G.enemies){
        if (o.dead || dist(o, m) > R + o.r) continue;
        damage(o, {mul:mul*0.20, minion:m, noDouble:true});
      }
    }
  }
  /* БУЙСТВО ДЕМОНОВ: взрыв вокруг цели тем же ударом и по тому же пути,
     то есть со всеми эффектами игрока — книгами, статусами, кольцами.
     Цель исключена: по ней удар уже прошёл, иначе получилось бы двойное
     попадание в упор. Рекурсии нет — взрыв зовёт damage() напрямую, а не
     minionHit(), поэтому сам себя не порождает. */
  /* КРОВАВАЯ БАНЯ. Сила стака берётся с книги крови, если она найдена, иначе
     считается по базовой доле в 15% от удара — той же, что у книги первого ранга.
     Так карточка работает и в связке с книгой, и сама по себе, а стаки при этом
     сливаются в один эффект по общему правилу усреднения кровотечения. */
  if (D.minBath && Math.random() < 0.10){
    addBleed(e, bookBleedDps() || avgHit()*0.15*D.ailEff);
    statusText(e, 'КРОВЬ', '#e0405a');
  }
  if (D.minFrenzy){
    const R = FRENZY_R * D.aoeR;
    G.fx.push({t:'ring', x:e.x, y:e.y, r:8, max:R, life:0.28, col:'#ff5a4e'});
    for (const o of G.enemies){
      if (o === e || o.dead) continue;
      if (dist(o, e) > R + o.r) continue;
      damage(o, {mul, minion:m, noDouble:true});
    }
  }
  if (m.kind === 'golemB'){                          // тяжёлый удар отбрасывает
    const a = Math.atan2(e.y-m.y, e.x-m.x);
    e.kb.x += Math.cos(a)*200; e.kb.y += Math.sin(a)*200;
    burst(e.x, e.y, 8, '#d4506a', 200, 4, 0.5);
  }
}

/* Костяной голем: прямого урона нет вовсе — только кровотечение,
   после чего он сразу уходит к следующей цели. Добить никого не может. */
function boneGolemHit(e){
  addBleed(e, avgHit() * 0.03 * D.golemN * D.ailEff);
  burst(e.x, e.y, 7, '#e0405a', 170, 3, 0.5);
}

/* Выстрел приспешника: тот же снаряд, что у игрока, но с урезанным множителем */
function minionShot(m, e, spell){
  const a = Math.atan2(e.y-m.y, e.x-m.x);
  // Снаряды охотников и колдунов наследуют вашу скорость и размер снаряда.
  // Дальность держим постоянной: скорость умножается, а время жизни делится,
  // иначе +100% к скорости вдвое удлиняли бы и выстрел, а это уже другая карточка.
  G.shots.push({
    x:m.x, y:m.y, a,
    vx:Math.cos(a)*470*D.projSpd, vy:Math.sin(a)*470*D.projSpd,
    r: (spell ? 7 : 4) * D.projSize, life:1.1/D.projSpd,
    pierce:D.pierce, chain:D.chain, ric:0, hitSet:[], orb:false,
    mul:0.20, pierced:0, spell,                       // 20% урона от вашего
  });
}

function killMinion(i){
  if (i < 0 || i >= G.minions.length) return;   // защита от индекса -1 у уже убитого
  const m = G.minions[i];
  if (D.minBoom) nova(m.x, m.y, 95*D.aoeR, avgHit()*D.minDmgMul*1.2*(G.bloodT>0?2:1), MKIND[m.kind].col);
  G.fx.push({t:'ring', x:m.x, y:m.y, r:m.r, max:m.r*2.2, life:0.25, col:MKIND[m.kind].col});
  burst(m.x, m.y, m.kind.startsWith('golem') ? 26 : 12, MKIND[m.kind].col, 190, 4, 0.7);
  G.minions.splice(i,1);
}

function enemyCause(e, attack){
  const rank = e.kind === 'boss' ? 'БОСС' : e.kind === 'elite' ? 'ЭЛИТА' : 'ВРАГ';
  return rank + ' · ' + e.t.nm + (e.affNm ? ' · ' + e.affNm : '') + ' · ' + attack;
}
function hurt(v, ignoreDefense, selfBlast, cause){
  const p = G.player, b = G.bag;
  if (p.inv > 0) return;                                          // i-frames рывка
  // СЕРДЦЕ ГОЛЕМА: заряд копится сам, тратится на первый же удар после готовности
  if (amu('golem') && G.amuT.golem <= 0 && !selfBlast){
    G.amuT.golem = 10;
    G.fx.push({t:'txt', x:p.x, y:p.y-30, s:'ЗАБЛОКИРОВАНО', life:0.9, col:'#9aa7b4'});
    G.fx.push({t:'ring', x:p.x, y:p.y, r:p.r, max:44, life:0.3, col:'#9aa7b4'});
    return;
  }
  if (!ignoreDefense){
    if (Math.random()*100 < D.dodge){ G.fx.push({t:'txt',x:p.x,y:p.y-24,s:'уворот',life:.5,col:'#8be04e'}); return; }
    if (Math.random()*100 < D.block) v *= 0.35;
    v *= 1 - D.armor/(D.armor + 90);
    v = Math.max(1, v - D.drFlat);
    v *= 1 - D.dr/100;
    if (D.drShop) v *= 1 - D.drShop/100;      // магазинная броня поверх, отдельным множителем
  }
  // ПАНЦИРЬ ЦЕЛОГО и ПОСЛЕДНЯЯ БРОНЯ: два взаимоисключающих порога
  if (amu('fullplate') && p.hp >= D.life) v *= 0.65;
  if (amu('lastplate') && p.hp/D.life < 0.20) v *= 0.60;
  // СТАЛЬНАЯ ВОЛЯ: потолок на один удар, не чаще раза в 10 сек
  if (amu('steel') && G.amuT.steel <= 0 && v > D.life*0.8){
    v = D.life*0.8; G.amuT.steel = 10;
    G.fx.push({t:'txt', x:p.x, y:p.y-30, s:'СТАЛЬНАЯ ВОЛЯ', life:1.1, col:'#6fb3ff'});
  }
  // ТАЛИСМАН ПОКОЯ: барьер съедает урон раньше здоровья
  if (p.barrier > 0){
    const eaten = Math.min(p.barrier, v);
    p.barrier -= eaten; v -= eaten;
    G.fx.push({t:'ring', x:p.x, y:p.y, r:p.r+6, max:p.r+16, life:0.2, col:'#5ec2e0'});
    if (p.barrier <= 0) G.amuT.calm = 5;              // откат считается от момента расхода
    if (v <= 0) return;
  }
  // ПОСЛЕДНИЙ ВЗДОХ: оставляет единицу здоровья и две секунды неуязвимости
  if (p.hp - v <= 0 && amu('breath') && G.amuT.breath <= 0){
    G.amuT.breath = 120; p.hp = 1; p.inv = 2;
    G.fx.push({t:'txt', x:p.x, y:p.y-30, s:'ПОСЛЕДНИЙ ВЗДОХ', life:1.6, col:'#ff5a4e'});
    G.fx.push({t:'ring', x:p.x, y:p.y, r:8, max:170, life:0.7, col:'#ff5a4e'});
    return;
  }
  // КУКЛА СМЕРТИ: один заряд на этаж, гасит удар целиком
  if (p.hp - v <= 0 && amu('doll') && G.amuT.doll > 0){
    G.amuT.doll = 0; p.inv = 1.5;
    G.fx.push({t:'txt', x:p.x, y:p.y-30, s:'КУКЛА РАССЫПАЛАСЬ', life:1.4, col:'#ff5a4e'});
    G.fx.push({t:'ring', x:p.x, y:p.y, r:8, max:150, life:0.6, col:'#ff5a4e'});
    burst(p.x, p.y, 40, '#ff5a4e', 280, 4, 0.9);
    return;
  }
  // Ангел-хранитель: один раз в 25 секунд гасим смертельный удар
  if (p.hp - v <= 0 && b.flat('cheat') && p.cheatCd <= 0 && Math.random()*100 < b.flat('cheat')){
    p.cheatCd = 25; p.hp = D.life*0.35; p.inv = 1.2;
    G.fx.push({t:'txt', x:p.x, y:p.y-30, s:'СПАСЕНИЕ', life:1.2, col:'#ffb340'}); return;
  }
  // min.bond / кейстоун «Некромантская связь»: часть урона принимает свита.
  // Свой же взрыв трупа сюда не попадает: перекладывать его на скелетов значит
  // убивать собственную армию за то, что билд работает как задумано.
  // КРОВНЫЕ УЗЫ: отсчёт идёт от ЛЮБОГО попадания по игроку, даже если перехват
  // съел его целиком — свиту злит сам факт удара, а не остаток урона
  if (D.bloodTies && !selfBlast){
    G.bloodT = 3;
    G.fx.push({t:'ring', x:p.x, y:p.y, r:p.r, max:70, life:0.35, col:'#ff2a2a'});
  }
  if (D.minBond && G.minions.length && !selfBlast){
    const share = v * D.minBond/100; v -= share;
    const m = pick(G.minions); m.hp -= share; m.hit = 0.12;
    boilRoll(m);                                       // перехваченный удар тоже считается ударом
    if (m.hp <= 0) killMinion(G.minions.indexOf(m));   // индекс проверяется внутри killMinion
  }
  p.hp -= v; p.combatT = Math.max(p.combatT, 0);
  if (v > 0) p.deathLog = {cause:cause || (selfBlast ? 'СОБСТВЕННЫЙ ВЗРЫВ' : 'НЕИЗВЕСТНЫЙ УРОН'), dmg:Math.ceil(v)};
  if (b.flat('recoup')) p.recoup += v * b.flat('recoup')/100;     // возврат урона со временем
  if (b.has('retal')) nova(p.x, p.y, 130*D.aoeR, avgHit()*0.5, '#e0405a');
  if (amu('riposte')) p.riposte = true;          // КОНТРУДАР заряжается от любого попадания
  // ЧЁРНОЕ ЗЕРКАЛО: копия встаёт от удара, а не по таймеру — это реакция, не аура
  if (amu('mirror') && G.amuT.mirror <= 0 && !selfBlast){
    G.amuT.mirror = 10;
    G.clone = {x:p.x + rnd(-40,40), y:p.y + rnd(-40,40), aim:p.aim, cd:0, life:3};
    G.fx.push({t:'ring', x:G.clone.x, y:G.clone.y, r:8, max:60, life:0.4, col:'#c08cff'});
  }
  G.fx.push({t:'shake', life:0.14});
  burst(p.x, p.y, 7, '#e0405a', 150, 3, 0.45);
  if (p.hp <= 0) gameOver();
}

/* ---------- 6c. КРУГОВЫЕ ОРБЫ ----------
   Орбы висят на общем кольце вокруг игрока и равномерно расставлены по нему.
   Урон идёт через обычный damage(), поэтому криты, стихии, книги и статусы
   работают на них так же, как на автоатаке. */
const ORBIT_R = 74, ORBIT_SIZE = 7, ORBIT_SPD = 1.7;

function orbitPos(i){
  const a = G.orbitA + i * Math.PI*2 / D.orbitN;
  const r = ORBIT_R * D.aoeR;                       // радиус кольца растёт от модификаторов области
  return {x: G.player.x + Math.cos(a)*r, y: G.player.y + Math.sin(a)*r};
}

function updateOrbits(dt){
  if (!D.orbitN) return;
  // Кольцо крутится тем быстрее, чем выше скорость атаки: орб — это оружие,
  // и логично, что «быстрее бьёшь» означает «быстрее обходишь цели».
  // Учти, что на большом числе орбов прибавка съедается откатом e.orbCd:
  // при десяти орбах цель и так задевается каждые 0.37 сек против отката 0.45.
  G.orbitA += ORBIT_SPD * D.aspd * dt;
  const size = ORBIT_SIZE * D.projSize;
  for (const e of G.enemies){
    e.orbCd -= dt;
    if (e.orbCd > 0) continue;                      // откат на цель, иначе орб бьёт 60 раз в секунду
    for (let i = 0; i < D.orbitN; i++){
      const o = orbitPos(i);
      if (dist(o, e) > e.r + size) continue;
      damage(e, {mul:0.15});                        // 15% от автоатаки со всеми модификаторами
      burst(o.x, o.y, 3, '#6fb3ff', 120, 3, 0.3);
      e.orbCd = 0.45;
      break;
    }
  }
}

/* ---------- 7. АТАКА ИГРОКА (автоматическая) ----------
   Игрок не целится и не жмёт кнопку: персонаж сам выбирает ближайшего врага
   в пределах дальности оружия и бьёт по готовности отката.
   Остаётся только позиционирование — то есть решение «куда встать», а не «куда кликнуть». */

/* Дальность автозахвата: ближний бой ограничен длиной дуги, дальний — полётом снаряда */
function attackRange(){
  const w = G.weapon;
  if (w.type === 'melee') return w.reach * D.arc;
  return w.type === 'orb' ? 430 : 520;
}

/* Ближайшая цель в радиусе. Расстояние меряем до края врага,
   иначе крупные боссы «не достаются» вплотную. */
function findTarget(range){
  const p = G.player;
  let best = null, bd = Infinity;
  for (const e of G.enemies){
    const d = dist(e,p) - e.r;
    if (d < range && d < bd){ bd = d; best = e; }
  }
  return best;
}

/* src — откуда бьём. Пусто значит сам игрок; копия «Чёрного зеркала» подставляет
   себя и стреляет тем же оружием с теми же характеристиками. */
function attack(src){
  const p = G.player, w = G.weapon;
  const o = src || p;
  const ang = o.aim;                                              // направление задаёт автозахват
  if (!src) p.atkCd = D.atkCd;

  if (w.type === 'melee'){
    const reach = w.reach * D.arc, arc = w.arc * D.arc;
    G.fx.push({t:'arc', x:o.x, y:o.y, a:ang, arc, r:reach, life:0.16});
    for (const e of G.enemies){
      if (dist(e,o) > reach + e.r) continue;
      let da = Math.atan2(e.y-o.y, e.x-o.x) - ang;
      da = Math.atan2(Math.sin(da), Math.cos(da));                 // нормализуем угол
      if (Math.abs(da) < arc/2) damage(e, {});
    }
  } else {
    const n = D.projN, spread = D.shotgun ? 0.035 : 0.16;   // дробовик стягивает залп в пучок
    for (let i = 0; i < n; i++){
      const a = ang + (i - (n-1)/2) * spread;
      G.shots.push({
        x:o.x, y:o.y, a,
        vx:Math.cos(a)*w.speed*D.projSpd, vy:Math.sin(a)*w.speed*D.projSpd,
        r:(w.type==='orb'?9:5) * D.projSize, life:w.life,
        pierce:D.pierce, chain:D.chain, ric:D.ricochet, hitSet:[], orb:w.type==='orb',
        mul:1, pierced:0,
      });
    }
  }
}

/* ---------- 8. ГЛАВНЫЙ ЦИКЛ ---------- */
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  if (G && !G.paused && !G.over && !G.pending) update(dt);
  if (G) render();
  if (menuMode) menuTick(dt);
  requestAnimationFrame(loop);
}

function update(dt){
  const p = G.player, b = G.bag, k = G.keys;
  G.time += dt;

  /* --- Движение игрока: две схемы управления --- */
  let mx = 0, my = 0;
  if (G.control === 'mouse'){
    // Персонаж всё время бежит к курсору. Мёртвая зона вокруг него нужна,
    // чтобы можно было осознанно стоять на месте — иначе «стойка» недостижима,
    // а от неё зависит cond.while_still и прицельная стрельба.
    const dx = G.mouse.x - W/2, dy = G.mouse.y - H/2;
    const d = Math.hypot(dx, dy);
    if (d > MOUSE_DEADZONE){ mx = dx/d; my = dy/d; }
  } else {
    mx = (k['d']||k['arrowright']?1:0) - (k['a']||k['arrowleft']?1:0);
    my = (k['s']||k['arrowdown'] ?1:0) - (k['w']||k['arrowup']  ?1:0);
    const len = Math.hypot(mx,my) || 1; mx/=len; my/=len;
  }
  p.moving = (mx || my) !== 0;
  if (p.moving){ p.faceX = mx; p.faceY = my; }        // запоминаем направление для рывка
  p.stillT = p.moving ? 0 : p.stillT + dt;
  p.moveT  = p.moving ? p.moveT + dt : 0;            // РАЗГОН и МАРАФОНЕЦ считают непрерывный бег
  p.combatT = G.enemies.length ? p.combatT + dt : 0;
  p.killT = Math.max(0, p.killT - dt);
  p.cheatCd = Math.max(0, p.cheatCd - dt);
  p.healCd  = Math.max(0, p.healCd  - dt);
  /* Всё, что разгоняет по условию, живёт в D.mspd и D.aspd, а условия меняются
     в кадре. Пересчёт зовём только на ПЕРЕКЛЮЧЕНИИ, а не каждый кадр: recalc()
     тяжёлый, и гонять его шестьдесят раз в секунду ради пары множителей незачем. */
  const wasKill = p.spdKill > 0, wasMove = p.dashMoving,
        wasSwift = p.swiftT > 0, wasLow = p.lowHp;
  p.spdKill = Math.max(0, (p.spdKill||0) - dt);
  p.swiftT  = Math.max(0, (p.swiftT||0)  - dt);
  p.dashMoving = p.moving;
  p.lowHp   = p.hp/D.life < 0.30;
  if ((p.spdKill > 0) !== wasKill || (amu('runner') && p.moving !== wasMove) ||
      (p.swiftT > 0) !== wasSwift || p.lowHp !== wasLow) recalc();
  p.predT   = Math.max(0, (p.predT||0)   - dt);      // ГЛАЗ ХИЩНИКА

  let sp = D.mspd;                                   // разгон уже внутри, см. recalc()
  if (amu('marathon')) sp *= 1 + Math.min(0.30, Math.floor(p.moveT/3)*0.03);
  if (amu('panic') && p.hp/D.life < 0.30) sp *= 1.60;
  if (amu('siege') && p.stillT > 1.5) sp *= 0.5;     // цена осадного огня
  if (p.dash > 0){
    sp *= 3.4; p.dash -= dt;
    if (!p.moving){ mx = p.faceX; my = p.faceY; }     // рывок с места — в последнюю сторону                                       // рывок = кратковременный разгон
    if (D.dashDmg) for (const e of G.enemies){                     // ТАРАННЫЙ РЫВОК
      if (p.dashHits.includes(e) || dist(e,p) > p.r + e.r + 12) continue;
      p.dashHits.push(e); damage(e, {mul:1.2}); e.ail.dizzy = 2*D.ailDur;
      burst(e.x, e.y, 6, '#ffb340', 200, 3, 0.4);
    }
  }
  p.inv = Math.max(0, p.inv - dt);
  p.dashCd = Math.max(0, p.dashCd - dt);
  if (p.dashN < D.dashMax && p.dashCd <= 0){ p.dashN++; p.dashCd = D.dashCd; }

  p.x = clamp(p.x + mx*sp*dt, -ARENA, ARENA);
  p.y = clamp(p.y + my*sp*dt, -ARENA, ARENA);

  /* --- Восстановление --- */
  if (D.regen) heal(D.regen * dt);
  if (G.bloodT > 0) G.bloodT = Math.max(0, G.bloodT - dt);         // КРОВНЫЕ УЗЫ
  if (p.leechPool > 0){                                            // вытягивание течёт ~2 сек
    const v = Math.min(p.leechPool, Math.max(6, p.leechPool*1.2) * dt);
    p.dreadLeech = true; heal(v); p.dreadLeech = false;
    p.leechPool -= v;
  }
  if (p.recoup > 0){ const v = Math.min(p.recoup, D.life*0.14*dt); heal(v); p.recoup -= v; }
  if (b.has('autoHeal') && p.hp/D.life < 0.3 && p.healCd <= 0){
    heal(D.life*0.25); p.healCd = 20;
    G.fx.push({t:'txt', x:p.x, y:p.y-30, s:'автолечение', life:1, col:'#4fd1c5'});
  }

  updateOrbits(dt);

  /* --- Атака --- */
  p.atkCd -= dt;
  G.target = findTarget(attackRange());                            // цель обновляем каждый кадр
  if (G.target){
    p.aim = Math.atan2(G.target.y - p.y, G.target.x - p.x);        // корпус доворачивается к цели
    if (p.atkCd <= 0 && !G.weapon.noAttack) attack();
  }

  /* --- Амулеты: всё, что живёт на таймере --- */
  if (Object.keys(G.amu).length) tickAmulets(dt);
  if (amu('lava') || amu('frost')) tickTrail(dt);
  if (G.boils.length) tickBoils(dt);

  /* --- Появление врагов волнами --- */
  G.spawnT -= dt;
  // Потолок одновременно живых: 500. Раньше было 64, и он упирался начиная
  // примерно с 15 этажа — комната на 60-м выглядела так же, как на 20-м,
  // а вся глубина уходила в продолжительность, а не в давление.
  // Порог проверяется ДО подсыпки пачки, поэтому фактический пик чуть выше.
  // Пачку подняли до 6-14: набирать пятьсот по шесть штук игрок не дождётся.
  if (G.spawnQueue > 0 && G.spawnT <= 0 && G.enemies.length < 500){
    // Пачка поменьше при вчетверо более частых волнах: 8-16 за раз вываливали
    // весь этаж за полторы секунды, и «поток» превращался в один хлопок.
    const batch = Math.min(G.spawnQueue, rndi(4,9));
    for (let i = 0; i < batch; i++) spawnEnemy();
    G.spawnQueue -= batch;
    // Пауза между волнами: было max(0.35, 2.0 - этаж*0.05), то есть на первых
    // этажах почти две секунды простоя. Стало вчетверо плотнее — этаж больше
    // не «подаётся порциями», а идёт сплошным потоком. Дальняя точка появления
    // это компенсирует: враги успевают дойти, а не сваливаются на голову.
    G.spawnT = Math.max(0.15, 0.55 - G.floor*0.015);
  }

  /* --- Логика врагов --- */
  const slowAura = b.has('slowAura');
  // Источники ауры охлаждения собираем один раз за кадр: перебирать всех врагов
  // на каждом враге — это n^2 по всей комнате, а охлаждённых обычно единицы
  const chillSrc = G.enemies.filter(x => x.ail.chill > 0);
  // ЗНАМЯ читаем один раз за кадр, а не на каждом враге
  G.banner = false;
  for (const x of G.enemies)
    if (x.kind === 'boss' && x.aff.length && x.aff.some(a => a.id === 'banner')){ G.banner = true; break; }
  // Пачки: аффиксы, которые распоряжаются группой целиком (прыжок одного из своих)
  for (const pk of G.packs) if (pk.members.length)
    for (const a of pk.aff) if (a.packTick) a.packTick(pk, dt);
  for (let i = G.enemies.length-1; i >= 0; i--){
    const e = G.enemies[i];
    e.hit = Math.max(0, e.hit - dt); e.rot += dt*0.8;
    e.noDmgT += dt; e.rage = Math.max(0, e.rage - dt);

    // Тики негативных эффектов
    for (const key in e.ail) if (e.ail[key] > 0) e.ail[key] -= dt;
    // Все три типа урона со временем тикают и утекают по одной формуле
    for (const type in e.dots){
      const d = e.dots[type];
      if (d.dps <= 0) continue;
      const v = d.dps * dt;
      applyDamage(e, v, false, true);
      e.dotAcc[type] += v;
      const k = Math.min(1, dt / d.dur);            // утечка стаков
      d.dps -= d.dps * k; d.n -= d.n * k;
      if (d.dps < 0.02){ d.dps = 0; d.n = 0; }
    }
    // Урон со временем копится и всплывает раз в 0.4 сек своим цветом:
    // огонь красным, яд зелёным, кровотечение багровым
    e.dotT -= dt;
    if (e.dotT <= 0){
      e.dotT = 0.4;
      const emit = (v, col, dx) => { if (v >= 1)
        G.fx.push({t:'num', x:e.x+dx, y:e.y-e.r-4, v:Math.round(v), life:0.7, col}); };
      emit(e.dotAcc.fire,  '#ff4a2f', -14);
      emit(e.dotAcc.poison,'#8be04e',  14);
      emit(e.dotAcc.bleed, '#e0405a',   0);
      e.dotAcc.fire = e.dotAcc.poison = e.dotAcc.bleed = 0;
    }
    // ИНФЕРНО: горящий враг раз в полсекунды поджигает соседей
    if (D.inferno && e.dots.fire.dps > 0){
      e.infT -= dt;
      if (e.infT <= 0){
        e.infT = 0.5;
        for (const o2 of G.enemies){
          if (o2 === e || o2.dots.fire.dps > 0) continue;
          if (dist(o2,e) > D.infernoR + o2.r) continue;
          addDot(o2, 'fire', e.dots.fire.dps*0.5, 3*D.ailDur);
          burst(o2.x, o2.y, 4, '#ff7a2f', 90, 3, 0.4);
        }
      }
    }

    if (e.hp <= 0){ killEnemy(e, i); continue; }
    // РАЗДЕЛЯЮЩИЕСЯ: порог половины здоровья проверяем тут же, до всего остального
    if (e.pack && e.pack.has.split && !e.didSplit && e.hp <= e.maxHp*0.5) packSplit(e);

    // Скорость с учётом охлаждения, ауры замедления и оглушения
    let spd = e.spd;
    // Под знаменем вся комната быстрее и злее — это и есть повод убивать босса первым
    const flag = G.banner && e.kind !== 'boss';
    if (flag) spd *= 1.30;
    let edmg = e.dmg * (flag ? 1.20 : 1);
    let aspdMul = 1;
    if (e.pack){ const pm = packMods(e); spd *= pm.spd; edmg *= pm.dmg; aspdMul *= pm.aspd; }
    if (e.rage > 0){ spd *= 1.3; edmg *= 1.3; }        // след мстителей: чужая смерть разогнала
    if (e.ail.chill > 0) spd *= 1 - 0.35*(1 + b.sum('slowMag')/100);
    // АУРА ОХЛАЖДЕНИЯ: соседи охлаждённого тоже вязнут.
    // Аура только замедляет и сам статус не накладывает. Если бы накладывала,
    // один прок расползся бы по всей комнате цепочкой (A морозит B, B морозит C),
    // и каждый враг получил бы +25% к принимаемому урону бесплатно и навсегда.
    e.frost = false;
    if (e.ail.chill <= 0 && chillSrc.length){
      for (const cs of chillSrc){
        if (cs === e || dist(cs, e) > D.chillAuraR + e.r) continue;
        e.frost = true; break;
      }
      if (e.frost) spd *= 1 - CHILL_AURA_SLOW*(1 + b.sum('slowMag')/100);
    }
    if (slowAura && dist(e,p) < D.slowAuraR) spd *= 0.75;
    if (e.ail.dizzy > 0) spd *= 0.5;                     // головокружение после отбрасывания
    if (e.ail.stun > 0 || e.ail.freeze > 0) spd = 0;      // оглушение и заморозка держат на месте

    // Выбор цели: свита перехватывает агро. С min.taunt радиус перехвата большой,
    // без него приспешники просто мешают телом на ближней дистанции.
    let tgt = p;
    if (G.minions.length){
      let best = null, bs = Infinity;
      for (const m of G.minions){
        const golem = m.kind === 'golemB';                    // у голема крови своя провокация
        const range = golem ? 430 : (D.minTaunt ? 340 : 120);
        const d = dist(m,e); if (d > range) continue;
        const score = d - (golem ? 250 : 0);                  // голем перетягивает на себя первым
        if (score < bs){ bs = score; best = m; }
      }
      if (best) tgt = best;
    }
    // ОХОТНИК: единственный, кого свита не перехватывает
    if (e.roles.length && e.roles.indexOf('hunter') >= 0) tgt = p;

    // Аффиксы работают до обычного шага: таран забирает движение себе
    let affLock = e.aff.length ? tickAffixes(e, dt, tgt, edmg) : false;
    if (e.pack && packTick(e, dt, tgt, edmg)) affLock = true;   // прыжок тоже забирает движение

    let a = Math.atan2(tgt.y-e.y, tgt.x-e.x);
    if (e.madA) a += e.madA;                       // безумный идёт криво, а не по прямой
    const ranged = e.t.ranged || !!e.madRanged;
    if (affLock){ /* движением распоряжается аффикс */ }
    else if (ranged){
      // Стрелок держит дистанцию 260 и стреляет
      const d = dist(e,tgt);
      const dir = d > 300 ? 1 : d < 220 ? -1 : 0;
      e.x += Math.cos(a)*spd*dir*dt; e.y += Math.sin(a)*spd*dir*dt;
      e.cd -= dt;
      if (e.cd <= 0 && d < 460 && e.ail.stun <= 0){
        e.cd = 2.2 / aspdMul;
        G.eshots.push({x:e.x, y:e.y, vx:Math.cos(a)*230, vy:Math.sin(a)*230,
                       r:6, life:2.6, dmg:edmg*0.8, pk:e.pack, cause:enemyCause(e, 'снаряд')});
      }
    } else {
      e.x += Math.cos(a)*spd*dt; e.y += Math.sin(a)*spd*dt;
    }
    // Отбрасывание затухает
    e.x += e.kb.x*dt; e.y += e.kb.y*dt;
    e.kb.x *= 0.86; e.kb.y *= 0.86;

    // Контактный урон по текущей цели
    if (dist(e,tgt) < e.r + tgt.r){
      e.cd2 = (e.cd2||0) - dt;
      if (e.cd2 <= 0){
        e.cd2 = 0.6 / aspdMul;
        if (tgt === p){
          if (!(D.phasing && p.moving)){ hurt(edmg, false, false, enemyCause(e, 'контакт')); packDealt(e.pack, edmg); }
          if (D.reflect) applyDamage(e, edmg * D.reflect/100, false);
        }
        else {
          // Големы каменные: 60% входящего гасится. Иначе провокация их же и убивает.
          const mit = tgt.kind.startsWith('golem') ? 0.4 : 1;
          tgt.hp -= edmg * mit; tgt.hit = 0.12;
          boilRoll(tgt);                                   // КИПЯЩАЯ КРОВЬ
          if (tgt.hp <= 0) killMinion(G.minions.indexOf(tgt));
        }
        if (D.thorns) applyDamage(e, D.thorns, false);
      }
    }
  }

  /* --- Свита: трупы, подъём и бой --- */
  if (D.hasMin){
    for (let i = G.corpses.length-1; i >= 0; i--){
      G.corpses[i].life -= dt;
      if (G.corpses[i].life <= 0) G.corpses.splice(i,1);
    }
    // Пока свита неполная — поднимаем из ближайшего трупа, а без трупов ждём таймер
    if (needKind()){
      G.raiseT += dt;
      // Оба пути подъёма идут за одно и то же время: из трупа поднимается на месте
      // трупа, без трупа — рядом с хозяином. Разного ожидания больше нет.
      if (G.raiseT >= D.minRevive){
        if (G.corpses.length){ const c = G.corpses.shift(); spawnMinion(c.x, c.y); }
        else spawnMinion(undefined, undefined, needKind());
        G.raiseT = 0;
      }
    } else G.raiseT = 0;

    /* Список целей на кадр: только те, кто угрожает игроку. Считаем расстояние
       до хозяина один раз здесь, а не заново на каждом приспешнике — при 500
       врагах и десяти бойцах это разница между 5000 и 500 вычислений. */
    const cand = [];
    for (const e of G.enemies){
      const dp = dist(e, p);
      if (dp <= MINION_LEASH) cand.push({e, dp});
    }
    /* Кто кем уже занят. Свита должна разбирать толпу по одному, а не наваливаться
       вдесятером на одного: занятая цель штрафуется так, будто она дальше. */
    const claims = new Map();
    const claim = e => claims.set(e, (claims.get(e) || 0) + 1);
    for (const mm of G.minions){
      if (mm.tgt && !mm.tgt.dead && dist(mm.tgt, p) <= MINION_LEASH) claim(mm.tgt);
      else mm.tgt = null;
    }

    for (let i = G.minions.length-1; i >= 0; i--){
      const m = G.minions[i];
      m.hit = Math.max(0, m.hit - dt); m.rot += dt*2.4; m.cd -= dt; m.born += dt;
      const mode = MKIND[m.kind].mode;

      /* Цель держится между кадрами, пока жива и не убежала от хозяина: без этой
         липкости приспешник перевыбирал бы цель каждый кадр и дёргался на месте
         вместо того, чтобы добежать. */
      let best = m.tgt && !m.tgt.dead ? m.tgt : null;
      if (best && dist(best, p) > MINION_LEASH) best = null;
      if (!best){
        let bs = Infinity;
        for (const c of cand){
          const e = c.e;
          /* Порядок слагаемых и есть вся логика:
             1) кто ближе к ИГРОКУ — того и бьём, свита защищает хозяина;
             2) занятые цели отодвигаются, чтобы толпа разбиралась параллельно;
             3) расстояние до самого приспешника входит с малым весом — только
                чтобы из двух равных он выбрал того, до кого ближе бежать. */
          let score = c.dp + (claims.get(e) || 0) * MINION_CLAIM_PENALTY + dist(e, m)*0.3;
          // Костяной голем поверх этого избегает тех, на ком стаки крови уже висят
          if (mode === 'golemN') score += e.dots.bleed.n * 500;
          if (score < bs){ bs = score; best = e; }
        }
        if (best){ m.tgt = best; claim(best); }
      }
      const bd = best ? dist(best, m) : Infinity;

      if (best && mode === 'ranged'){                        // ОХОТНИК: держит дистанцию и стреляет
        const want = 250, spd2 = D.minSpd;
        const a2 = Math.atan2(best.y-m.y, best.x-m.x);
        const dir = bd > want+40 ? 1 : bd < want-60 ? -1 : 0;
        m.x += Math.cos(a2)*spd2*dir*dt; m.y += Math.sin(a2)*spd2*dir*dt;
        if (D.minBlink && bd > 520) minionBlink(m, best, dt);     // отставший стрелок догоняет переносом
        if (m.cd <= 0 && bd < 460){ m.cd = 0.64 / D.minAspd; minionShot(m, best, null); }
      } else if (best && mode === 'caster'){                 // КОЛДУН: бьёт заклинанием со статусом
        const want = 290;
        const a2 = Math.atan2(best.y-m.y, best.x-m.x);
        const dir = bd > want+40 ? 1 : bd < want-60 ? -1 : 0;
        m.x += Math.cos(a2)*D.minSpd*dir*dt; m.y += Math.sin(a2)*D.minSpd*dir*dt;
        if (D.minBlink && bd > 560) minionBlink(m, best, dt);     // и у колдуна
        if (m.cd <= 0 && bd < 500){
          m.cd = 0.96 / D.minAspd;
          minionShot(m, best, pick(['fire','cold','poison']));
        }
      } else if (best){                                      // ближний бой: скелеты и големы
        const reach = m.r + best.r + 3;
        if (D.minBlink && bd > reach) minionBlink(m, best, dt);   // перенос вместо долгой беготни
        const slow = m.kind === 'golemB' ? 0.65 : m.kind === 'golemN' ? 1.25 : 1;
        if (bd > reach){
          const a2 = Math.atan2(best.y-m.y, best.x-m.x);
          m.x += Math.cos(a2)*D.minSpd*slow*dt; m.y += Math.sin(a2)*D.minSpd*slow*dt;
        } else if (m.cd <= 0){
          if (m.kind === 'golemB'){ m.cd = D.golemBCd / D.minAspd; minionHit(best, m); }
          else if (m.kind === 'golemN'){ m.cd = 0.35 / D.minAspd; boneGolemHit(best); }
          else { m.cd = 0.50 / (D.minAspd*D.skelAspd); minionHit(best, m); }   // скелет: два удара в секунду
        }
      } else {                                               // без врагов держатся у хозяина
        m.tgt = null;
        const d = dist(m,p);
        if (d > 74){
          const a2 = Math.atan2(p.y-m.y, p.x-m.x);
          m.x += Math.cos(a2)*D.minSpd*dt; m.y += Math.sin(a2)*D.minSpd*dt;
        }
      }
      if (m.hp <= 0) killMinion(i);
    }
  }

  /* --- Снаряды игрока --- */
  for (let i = G.shots.length-1; i >= 0; i--){
    const s = G.shots[i];
    s.life -= dt;
    // Самонаведение подкручивает вектор к ближайшей цели
    if (D.homing > 0){
      let best = null, bd = 400;
      for (const e of G.enemies){ const d = dist(e,s); if (d < bd){ bd = d; best = e; } }
      if (best){
        const ta = Math.atan2(best.y-s.y, best.x-s.x);
        const cur = Math.atan2(s.vy, s.vx);
        let da = Math.atan2(Math.sin(ta-cur), Math.cos(ta-cur));
        const na = cur + da * Math.min(1, D.homing*dt*4);
        const sp2 = Math.hypot(s.vx, s.vy);
        s.vx = Math.cos(na)*sp2; s.vy = Math.sin(na)*sp2;
      }
    }
    s.x += s.vx*dt; s.y += s.vy*dt;

    // Рикошет от границ арены
    if (s.ric > 0){
      if (Math.abs(s.x) > ARENA){ s.vx *= -1; s.ric--; }
      if (Math.abs(s.y) > ARENA){ s.vy *= -1; s.ric--; }
    }
    let dead = s.life <= 0 || Math.abs(s.x) > ARENA+50 || Math.abs(s.y) > ARENA+50;

    if (!dead) for (const e of G.enemies){
      if (s.hitSet.includes(e)) continue;
      if (dist(e,s) > e.r + s.r) continue;
      damage(e, {mul: s.mul * (D.pierceBonus ? 1 + 0.2*s.pierced : 1)});
      s.hitSet.push(e);
      if (s.spell){                                            // колдун кладёт статус гарантированно
        const base = avgHit() * 0.20;
        if (s.spell === 'fire'){ addDot(e, 'fire', base*0.25*D.ailEff, 3*D.ailDur);
                                 burst(e.x,e.y,5,'#ff7a2f',120,3,0.4); }
        if (s.spell === 'cold'){ if (e.ail.chill<=0) statusText(e,'SLOWED','#ffe14a'); e.ail.chill = 2.5*D.ailDur;
                                 if (D.freeze){ if(e.ail.freeze<=0) statusText(e,'FROZEN','#7fd6ff'); e.ail.freeze = Math.max(e.ail.freeze, 1.4*D.ailDur*D.freezeDur); }
                                 burst(e.x,e.y,5,'#7fd6ff',120,3,0.4); }
        if (s.spell === 'poison'){ addDot(e, 'poison', base*0.15*D.ailEff*(D.radiation?2:1), 4*D.ailDur);
                                   burst(e.x,e.y,5,'#8be04e',120,3,0.4); }
      }
      if (s.orb){ nova(s.x, s.y, G.weapon.aoe*D.aoeR, avgHit()*0.55, '#c08cff'); dead = true; break; }
      if (s.chain > 0){                                            // отскок на новую цель
        s.chain--;
        // Перчатки рикошета переворачивают знак: отскок не гасит снаряд, а разгоняет
        if (amu('ricochet')) s.mul *= 1.10;
        else if (!D.chainKeep) s.mul *= 0.75;                      // без эко-отскоков урон затухает
        const next = G.enemies.filter(x => !s.hitSet.includes(x)).sort((a2,b2)=>dist(a2,s)-dist(b2,s))[0];
        if (next){ const na = Math.atan2(next.y-s.y, next.x-s.x), sp2 = Math.hypot(s.vx,s.vy);
                   s.vx = Math.cos(na)*sp2; s.vy = Math.sin(na)*sp2; s.life = Math.max(s.life,0.5); }
        else dead = true;
      } else if (s.pierce > 0){ s.pierce--; s.pierced++; }
      else dead = true;
      break;
    }
    if (dead) G.shots.splice(i,1);
  }

  /* --- Снаряды врагов --- */
  for (let i = G.eshots.length-1; i >= 0; i--){
    const s = G.eshots[i];
    s.x += s.vx*dt; s.y += s.vy*dt; s.life -= dt;
    // ЗЕРКАЛЬНЫЙ ОСКОЛОК: снаряд не гасится, а разворачивается и летит уже как ваш
    if (dist(s,p) < s.r + p.r && amu('shard') && Math.random() < 0.10){
      const sp2 = Math.hypot(s.vx, s.vy) * 1.4;
      const a2 = Math.atan2(-s.vy, -s.vx);
      G.shots.push({x:p.x + Math.cos(a2)*(p.r+8), y:p.y + Math.sin(a2)*(p.r+8), a:a2,
        vx:Math.cos(a2)*sp2, vy:Math.sin(a2)*sp2, r:6*D.projSize, life:2.2,
        pierce:D.pierce, chain:0, ric:0, hitSet:[], orb:false, mul:1, pierced:0});
      G.fx.push({t:'txt', x:p.x, y:p.y-24, s:'отбито', life:0.5, col:'#6fb3ff'});
      G.eshots.splice(i,1); continue;
    }
    if (dist(s,p) < s.r + p.r){ hurt(s.dmg, false, false, s.cause || 'ВРАЖЕСКИЙ СНАРЯД'); packDealt(s.pk, s.dmg); G.eshots.splice(i,1); continue; }
    if (s.life <= 0) G.eshots.splice(i,1);
  }

  /* --- Сферы опыта --- */
  const magnet = b.has('magnet');
  for (let i = G.orbs.length-1; i >= 0; i--){
    const o = G.orbs[i], d = dist(o,p);
    const a = Math.atan2(p.y-o.y, p.x-o.x);
    // Внутри радиуса подбора сфера летит к игроку, снаружи — медленно дрейфует,
    // иначе опыт от дальних убийств (особенно свитой) просто оставался бы лежать.
    const loot = o.gold || o.v !== undefined;
    const pull = magnet ? 420 : loot && d < D.lootPickup ? D.lootPull : d < D.pickup ? 340 : 75;
    o.x += Math.cos(a)*pull*dt; o.y += Math.sin(a)*pull*dt;
    if (d < p.r + ((o.book || o.amu || o.totem) ? 14 : 6)){
      if (o.amu) takeAmulet(o.amu);
      else if (o.totem) takeTotem(o.totem);
      else if (o.book) takeBook(o.book);
      else if (o.gold) G.gold += o.v;
      else gainXp(o.v);
      G.orbs.splice(i,1);
    }
  }

  /* --- Частицы: разлёт с трением --- */
  const friction = Math.pow(0.12, dt);
  for (let i = G.parts.length-1; i >= 0; i--){
    const q = G.parts[i];
    q.life -= dt;
    q.x += q.vx*dt; q.y += q.vy*dt;
    q.vx *= friction; q.vy *= friction;
    if (q.life <= 0) G.parts.splice(i,1);
  }

  /* --- Лужи смолы --- */
  // Урон тикает раз в полсекунды общим таймером, а не каждый кадр и не на каждую
  // лужу: иначе hurt() съедал бы шанс уворота шестьдесят раз в секунду.
  let poolDmg = 0;
  for (let i = G.pools.length-1; i >= 0; i--){
    const pl = G.pools[i]; pl.life -= dt;
    if (pl.life <= 0){ G.pools.splice(i,1); continue; }
    if (pl.arm > 0){ pl.arm -= dt; continue; }                   // лужа ещё растекается
    if (dist(pl, p) < pl.r + p.r) poolDmg = Math.max(poolDmg, pl.dmg);
  }
  p.poolCd = Math.max(0, (p.poolCd||0) - dt);
  if (poolDmg > 0 && p.poolCd <= 0){ p.poolCd = 0.5; hurt(poolDmg*0.5, false, false, 'ЛУЖА СМОЛЫ'); }

  /* --- Эффекты --- */
  for (let i = G.fx.length-1; i >= 0; i--){
    const f = G.fx[i]; f.life -= dt;
    if (f.t === 'num') f.y -= 26*dt;
    if (f.t === 'txt') f.y -= 34*dt;                    // статусы всплывают быстрее цифр
    if (f.t === 'ring') f.r += (f.max - f.r) * Math.min(1, dt*14);
    if (f.t === 'wave'){
      // Фронт волны бьёт один раз, когда проходит через игрока: значит уцелеть
      // можно либо оставшись вплотную к боссу, либо убежав за её край
      f.r += f.spd*dt;
      if (!f.hit && Math.abs(dist(f, p) - f.r) < 26 + p.r){ f.hit = true; hurt(f.dmg, false, false, 'УДАРНАЯ ВОЛНА БОССА'); }
    }
    if (f.life <= 0) G.fx.splice(i,1);
  }

  /* --- Портал на следующий этаж --- */
  if (!G.portal && G.spawnQueue === 0 && G.enemies.length === 0){
    const pa = rnd(0, Math.PI*2);
    G.portal = {x:clamp(p.x+Math.cos(pa)*300,-ARENA+60,ARENA-60),
                y:clamp(p.y+Math.sin(pa)*300,-ARENA+60,ARENA-60), r:34, t:0};
    toast('ПОРТАЛ ОТКРЫТ');
  }
  if (G.portal){
    G.portal.t += dt;
    if (dist(G.portal, p) < G.portal.r + p.r && G.portal.t > 0.6){
      G.gold += Math.round((12 + G.floor*6) * D.goldFind);        // премия за зачистку
      G.floor++; G.rerolls++; heal(D.life*0.25);
      G.amuT.doll = 1;                                             // кукла смерти чинится на новом этаже
      buildFloor();
    }
  }
}

/* Всё, что амулеты делают сами по себе: таймеры, копия, барьер.
   Отдельной функцией, потому что в update() это был бы ещё один экран кода
   посреди и без того длинного кадра. */
function tickAmulets(dt){
  const p = G.player;
  for (const k in G.amuT) if (k !== 'doll') G.amuT[k] = Math.max(0, G.amuT[k] - dt);

  // ЧЁРНОЕ ЗЕРКАЛО: копия стоит на месте и лупит по своей цели
  if (G.clone){
    const c = G.clone;
    c.life -= dt; c.cd -= dt;
    const t = findTargetFrom(c, attackRange());
    if (t){
      c.aim = Math.atan2(t.y - c.y, t.x - c.x);
      if (c.cd <= 0 && !G.weapon.noAttack){ c.cd = D.atkCd; attack(c); }
    }
    if (Math.random() < 0.3) burst(c.x, c.y, 1, '#c08cff', 40, 2, 0.3);
    if (c.life <= 0) G.clone = null;
  }

  // СЕРДЦЕ БУРИ
  if (amu('storm') && G.amuT.storm <= 0){
    const t = findTargetFrom(p, 700);
    if (t){
      G.amuT.storm = 8;
      G.fx.push({t:'bolt', x:p.x, y:p.y, x2:t.x, y2:t.y, life:0.22, col:'#ffe14a'});
      damage(t, {mul:3});
      t.ail.shock = Math.max(t.ail.shock, 3*D.ailDur);
      burst(t.x, t.y, 14, '#ffe14a', 220, 3, 0.5);
    }
  }

  // ЧАСОВОЙ МЕХАНИЗМ: радиус считается через «Радиус области действия», как всё площадное
  if (amu('clock') && G.amuT.clock <= 0){
    G.amuT.clock = 30;
    const R = 240 * D.aoeR;
    G.fx.push({t:'ring', x:p.x, y:p.y, r:10, max:R, life:0.6, col:'#4fd1c5'});
    for (const e of G.enemies){
      if (dist(e,p) > R) continue;
      if (e.ail.freeze <= 0) statusText(e, 'FROZEN', '#7fd6ff');
      e.ail.freeze = Math.max(e.ail.freeze, 1.0*D.freezeDur);
    }
  }

  // ПУЛЬС ЖИЗНИ
  if (amu('pulse') && G.amuT.pulse <= 0){
    G.amuT.pulse = 15; heal(D.life*0.05);
    G.fx.push({t:'ring', x:p.x, y:p.y, r:p.r, max:60, life:0.5, col:'#e0405a'});
  }
  // ГРАВИТАЦИОННЫЙ КОЛОДЕЦ: секунду тянет, потом взрывается
  if (amu('gravity') && G.amuT.gravity <= 0 && G.enemies.length){
    G.amuT.gravity = 12;
    const t = findTargetFrom(p, 520) || p;
    G.well = {x:t.x, y:t.y, t:1, r:170*D.aoeR};
    G.fx.push({t:'ring', x:G.well.x, y:G.well.y, r:G.well.r, max:12, life:1, col:'#c08cff'});
  }
  if (G.well){
    G.well.t -= dt;
    for (const o of G.enemies){
      const d = dist(o, G.well);
      if (d > G.well.r || d < 1) continue;
      const a = Math.atan2(G.well.y-o.y, G.well.x-o.x);
      o.kb.x += Math.cos(a)*260*dt*6; o.kb.y += Math.sin(a)*260*dt*6;
    }
    if (G.well.t <= 0){
      nova(G.well.x, G.well.y, G.well.r, avgHit()*1.6, '#c08cff');
      G.well = null;
    }
  }
  // ТАЛИСМАН ПОКОЯ
  if (amu('calm') && p.stillT > 2 && p.barrier <= 0 && G.amuT.calm <= 0){
    p.barrier = D.life*0.10;
    G.fx.push({t:'ring', x:p.x, y:p.y, r:p.r, max:p.r+22, life:0.5, col:'#5ec2e0'});
  }
}

/* След от ботинок. Узлы кладутся по времени, а не по кадрам: иначе на 240 Гц
   след был бы вчетверо гуще, чем на 60, и урон зависел бы от монитора. */
const TRAIL_STEP = 0.11, TRAIL_LIFE = 2.6, TRAIL_R = 30;
function tickTrail(dt){
  const p = G.player;
  p.trailT = (p.trailT || 0) - dt;
  if (p.moving && p.trailT <= 0){
    p.trailT = TRAIL_STEP;
    // Огонь и лёд кладутся одним узлом с двумя флагами: два отдельных следа
    // друг друга перекрывали бы и считались бы дважды на одном враге
    G.trails.push({x:p.x, y:p.y, r:TRAIL_R*D.aoeR, life:TRAIL_LIFE,
                   fire:amu('lava'), cold:amu('frost')});
    if (G.trails.length > 40) G.trails.shift();       // потолок держит кадр
  }
  // Урон следа растёт от скорости бега: медленный игрок оставляет тлеющий след,
  // быстрый — сплошную полосу огня. Отсчёт от базовых 235.
  const dps = avgHit() * 0.5 * (D.mspd/235) * D.ailEff;
  for (let i = G.trails.length-1; i >= 0; i--){
    G.trails[i].life -= dt;
    if (G.trails[i].life <= 0) G.trails.splice(i,1);
  }
  // Считаем по врагу, а не по узлу: узлы лежат внахлёст, и урон «за каждый узел»
  // работал ровно наоборот замыслу — стоящий на месте игрок наваливал их горкой
  // и жёг втрое сильнее бегущего. Замер до правки: 254 урона при скорости 235
  // и 208 при 470, то есть быстрые ботинки жгли ХУЖЕ медленных.
  for (const e of G.enemies){
    let f = false, cd = false;
    for (const tr of G.trails){
      if (dist(e, tr) > tr.r + e.r) continue;
      if (tr.fire) f = true;
      if (tr.cold) cd = true;
      if (f && cd) break;
    }
    if (f) applyDamage(e, dps*dt, false, true);
    if (cd){
      if (e.ail.chill <= 0) statusText(e, 'SLOWED', '#ffe14a');
      e.ail.chill = Math.max(e.ail.chill, 0.6*D.ailDur);
    }
  }
}

/* Ближайшая цель от произвольной точки — нужна копии и молнии.
   findTarget() считает только от игрока и остаётся как есть. */
function findTargetFrom(o, range){
  let best = null, bd = Infinity;
  for (const e of G.enemies){
    const d = dist(e,o) - e.r;
    if (d < range && d < bd){ bd = d; best = e; }
  }
  return best;
}

/* Опыт и повышение уровня */
function gainXp(v){
  G.xp += v * D.xpGain;
  while (G.xp >= G.xpNext){
    G.xp -= G.xpNext; G.lvl++;
    G.xpNext = Math.round(14 * Math.pow(1.17, G.lvl-1));
    G.pending++;
  }
  if (G.pending) showLevelUp();
}

/* ---------- 9. ОТРИСОВКА ---------- */
function drawPoly(x, y, r, sides, rot){
  ctx.beginPath();
  for (let i = 0; i < sides; i++){
    const a = rot + i*Math.PI*2/sides;
    const px = x + Math.cos(a)*r, py = y + Math.sin(a)*r;
    i ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
  }
  ctx.closePath();
}
function drawShape(sh, x, y, r, rot){
  if (sh === 'circle'){ ctx.beginPath(); ctx.arc(x,y,r,0,6.29); }
  else if (sh === 'triangle') drawPoly(x,y,r,3,rot);
  else if (sh === 'square')   drawPoly(x,y,r,4,rot+0.785);
  else if (sh === 'diamond')  drawPoly(x,y,r,4,rot);
  else drawPoly(x,y,r,6,rot);
}

function render(){
  const p = G.player;
  let sx = 0, sy = 0;
  const shake = G.fx.find(f => f.t === 'shake');
  if (shake){ sx = rnd(-5,5); sy = rnd(-5,5); }

  ctx.fillStyle = '#0d1014'; ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2 - p.x + sx, H/2 - p.y + sy);                   // камера следует за игроком

  // Сетка пола
  const step = 80;
  ctx.strokeStyle = '#171d24'; ctx.lineWidth = 1;
  const x0 = Math.floor((p.x - W/2)/step)*step, y0 = Math.floor((p.y - H/2)/step)*step;
  ctx.beginPath();
  for (let x = x0; x < p.x + W/2 + step; x += step){ ctx.moveTo(x, y0); ctx.lineTo(x, y0 + H + step*2); }
  for (let y = y0; y < p.y + H/2 + step; y += step){ ctx.moveTo(x0, y); ctx.lineTo(x0 + W + step*2, y); }
  ctx.stroke();

  // Граница арены
  ctx.strokeStyle = '#2c3742'; ctx.lineWidth = 3;
  ctx.strokeRect(-ARENA, -ARENA, ARENA*2, ARENA*2);

  // Аура замедления
  if (G.bag.has('slowAura')){
    ctx.strokeStyle = '#5ec2e022'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, D.slowAuraR, 0, 6.29); ctx.stroke();
  }

  // Портал
  if (G.portal){
    const t = G.portal.t;
    ctx.strokeStyle = '#4fd1c5'; ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++){
      const rr = G.portal.r * (0.5 + i*0.28) + Math.sin(t*3 + i)*4;
      drawPoly(G.portal.x, G.portal.y, rr, 6, t*(i%2?1:-1)); ctx.stroke();
    }
  }

  // Трупы — ресурс некроманта
  ctx.strokeStyle = '#4a5560'; ctx.lineWidth = 2;
  for (const c of G.corpses){
    const k = clamp(c.life/3,0,1), r = c.big ? 9 : 6;
    ctx.globalAlpha = 0.35 + k*0.5;
    ctx.beginPath();
    ctx.moveTo(c.x-r,c.y-r); ctx.lineTo(c.x+r,c.y+r);
    ctx.moveTo(c.x+r,c.y-r); ctx.lineTo(c.x-r,c.y+r);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Сферы опыта (бирюзовые круги) и золото (янтарные ромбы)
  for (const o of G.orbs){
    if (o.book){
      // Книга — важнейшая находка, поэтому подсвечена нарочито громко:
      // радужный ореол, пульсирующие кольца и искры.
      const B = BOOKS[o.book];
      const puls = 1 + Math.sin(G.time*4)*0.18;
      const R = 62 * puls;
      const hue = (G.time*150) % 360;

      const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, R);
      g.addColorStop(0,    'hsla(' + hue + ',100%,72%,0.55)');
      g.addColorStop(0.45, 'hsla(' + ((hue+80)%360) + ',100%,62%,0.22)');
      g.addColorStop(1,    'hsla(' + ((hue+160)%360) + ',100%,60%,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(o.x, o.y, R, 0, 6.29); ctx.fill();

      ctx.lineWidth = 2;                                  // три кольца, крутятся в разные стороны
      for (let ri = 0; ri < 3; ri++){
        ctx.strokeStyle = 'hsla(' + ((hue + ri*120) % 360) + ',100%,68%,' + (0.75 - ri*0.18) + ')';
        drawPoly(o.x, o.y, (18 + ri*11) * puls, 6, G.time*(ri%2 ? 1.6 : -1.2) + ri);
        ctx.stroke();
      }
      ctx.strokeStyle = 'hsl(' + hue + ',100%,80%)'; ctx.lineWidth = 3;
      ctx.fillStyle = B.col + '66';
      drawPoly(o.x, o.y, 13*puls, 4, 0.785); ctx.fill(); ctx.stroke();

      ctx.fillStyle = '#ffffff';                          // иконка стихии в центре
      ctx.font = 'bold 15px ui-monospace,monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(B.ico, o.x, o.y);
      ctx.textBaseline = 'alphabetic';

      if (Math.random() < 0.30)                           // непрерывный сноп искр
        burst(o.x, o.y, 1, 'hsl(' + ((hue+rnd(0,360))%360) + ',100%,70%)', 90, 3, 0.7);
    }
    else if (o.amu){                                   // амулет на земле: пульсирующий ромб
      const A = AMULETS[o.amu], pu = 0.65 + 0.35*Math.sin(G.time*5);
      ctx.globalAlpha = pu; ctx.fillStyle = A.col;
      drawPoly(o.x, o.y, 11, 4, G.time*1.4); ctx.fill();
      ctx.globalAlpha = 1; ctx.strokeStyle = A.col; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(o.x, o.y, 17 + 4*pu, 0, 6.29); ctx.stroke();
      ctx.font = 'bold 12px ui-monospace,monospace'; ctx.textAlign = 'center';
      ctx.fillStyle = A.col; ctx.fillText(A.ico, o.x, o.y + 4);
    }
    else if (o.totem){                                 // тотем: столбик с меткой стихии
      const T = TOTEMS[o.totem], pu = 0.7 + 0.3*Math.sin(G.time*4);
      ctx.globalAlpha = pu; ctx.fillStyle = T.col;
      drawPoly(o.x, o.y, 10, 3, -Math.PI/2); ctx.fill();
      ctx.globalAlpha = 1; ctx.strokeStyle = T.col; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(o.x, o.y, 16 + 3*pu, 0, 6.29); ctx.stroke();
    }
    else if (o.gold){ ctx.fillStyle = '#f0c040'; drawPoly(o.x, o.y, 4.5, 4, G.time*2); ctx.fill(); }
    else { ctx.fillStyle = '#4fd1c5'; ctx.beginPath(); ctx.arc(o.x,o.y,4,0,6.29); ctx.fill(); }
  }

  // Воронка гравитационного колодца — под всеми
  if (G.well){
    ctx.globalAlpha = 0.18 + 0.12*Math.sin(G.time*10);
    ctx.fillStyle = '#c08cff';
    ctx.beginPath(); ctx.arc(G.well.x, G.well.y, G.well.r*(0.4 + 0.6*G.well.t), 0, 6.29); ctx.fill();
    ctx.globalAlpha = 0.5; ctx.strokeStyle = '#c08cff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(G.well.x, G.well.y, G.well.r, 0, 6.29); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // Кипящая кровь — под всеми, это часть пола
  for (const b2 of G.boils){
    const k = clamp(b2.life/BOIL_LIFE, 0, 1);
    ctx.globalAlpha = 0.22*k + 0.10*Math.abs(Math.sin(G.time*6));
    ctx.fillStyle = '#e0405a';
    ctx.beginPath(); ctx.arc(b2.x, b2.y, b2.r, 0, 6.29); ctx.fill();
    ctx.globalAlpha = 0.5*k; ctx.strokeStyle = '#e0405a'; ctx.lineWidth = 2; ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // След от ботинок — под всеми, это часть пола
  for (const tr of G.trails){
    const k = clamp(tr.life/TRAIL_LIFE, 0, 1);
    ctx.globalAlpha = 0.30*k;
    ctx.fillStyle = tr.fire ? '#ff7a2f' : '#7fd6ff';
    ctx.beginPath(); ctx.arc(tr.x, tr.y, tr.r*(0.55 + 0.45*k), 0, 6.29); ctx.fill();
    if (tr.fire && tr.cold){                      // оба следа сразу: ледяная кайма поверх
      ctx.globalAlpha = 0.22*k; ctx.strokeStyle = '#7fd6ff'; ctx.lineWidth = 2; ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  // Лужи смолы — под всеми, это часть пола
  for (const pl of G.pools){
    const k = clamp(pl.life/pl.max, 0, 1);
    const arming = pl.arm > 0;
    const rr = arming ? pl.r * (1 - pl.arm/0.55) : pl.r;        // растекается на глазах
    ctx.globalAlpha = arming ? 0.15 : 0.22 + 0.18*k;
    ctx.fillStyle = '#6b4a12'; ctx.beginPath(); ctx.arc(pl.x, pl.y, rr, 0, 6.29); ctx.fill();
    ctx.globalAlpha = 0.5 + 0.4*k;
    ctx.strokeStyle = '#c08a3a'; ctx.lineWidth = 2; ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Враги
  for (const e of G.enemies){
    ctx.lineWidth = e.kind === 'norm' ? 2 : 3;
    ctx.strokeStyle = e.hit > 0 ? '#ffffff' : (e.kind === 'boss' ? '#ff5a4e' : e.kind === 'elite' ? '#ffd24a' : e.t.col);
    ctx.fillStyle = e.hit > 0 ? '#ffffff44' : e.t.col + '22';
    drawShape(e.t.shape, e.x, e.y, e.r, e.rot); ctx.fill(); ctx.stroke();

    // Индикаторы состояний
    if (e.dots.fire.dps > 0){ ctx.strokeStyle = '#ff7a2f'; drawShape(e.t.shape,e.x,e.y,e.r+4,-e.rot); ctx.stroke(); }
    if (e.ail.chill  > 0){
      ctx.strokeStyle = '#7fd6ff'; drawShape(e.t.shape,e.x,e.y,e.r+7,e.rot*0.5); ctx.stroke();
      // Радиус ауры виден, иначе игрок не поймёт, почему соседи вязнут
      ctx.globalAlpha = 0.13 + 0.07*Math.sin(G.time*3);
      ctx.beginPath(); ctx.arc(e.x, e.y, D.chillAuraR, 0, 6.29); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (e.frost){                                   // задетый аурой: бледная метка
      ctx.strokeStyle = '#7fd6ff'; ctx.globalAlpha = 0.4;
      drawShape(e.t.shape, e.x, e.y, e.r+5, -e.rot*0.5); ctx.stroke(); ctx.globalAlpha = 1;
    }
    if (e.ail.shock  > 0){ ctx.strokeStyle = '#ffe14a'; ctx.beginPath(); ctx.arc(e.x,e.y,e.r+10,0,6.29); ctx.stroke(); }
    if (e.ail.freeze > 0){ ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; drawPoly(e.x,e.y,e.r+5,6,0.4); ctx.stroke(); }
    // Счётчики стаков: огонь, яд, кровь
    const st = [];
    if (e.dots.fire.n   >= 0.5) st.push(['\u25C6' + Math.round(e.dots.fire.n),   '#ff7a2f']);
    if (e.dots.poison.n >= 0.5) st.push(['\u2620' + Math.round(e.dots.poison.n), '#8be04e']);
    if (e.dots.bleed.n  >= 0.5) st.push(['\u2716' + Math.round(e.dots.bleed.n),  '#e0405a']);
    if (st.length){
      ctx.font = 'bold 13px ui-monospace,monospace'; ctx.textAlign = 'center';
      st.forEach(([txt,col], si) => {
        ctx.fillStyle = col;
        ctx.fillText(txt, e.x + (si - (st.length-1)/2)*22, e.y + e.r + 13);
      });
    }

    // Пачка: кольцо в цвет группы и метки ролей. Кольцами каждый аффикс
    // не показать — их бывает десять, поэтому список висит на панели внизу.
    if (e.pack){
      ctx.strokeStyle = e.pack.col; ctx.lineWidth = 2;
      ctx.globalAlpha = 0.75; ctx.beginPath(); ctx.arc(e.x, e.y, e.r+6, 0, 6.29); ctx.stroke();
      ctx.globalAlpha = 1;
      if (e.roles.length){
        // Круги ролей рисуем по земле: игроку нужно видеть их границы, а не догадываться
        const bc = e.roles.indexOf('beacon')  >= 0 ? 180 : 0;
        const sc = e.roles.indexOf('circle')  >= 0 ? 150 : 0;
        ctx.globalAlpha = 0.10 + 0.05*Math.sin(G.time*3);
        if (bc){ ctx.strokeStyle = '#ffe14a'; ctx.beginPath(); ctx.arc(e.x,e.y,bc,0,6.29); ctx.stroke(); }
        if (sc){ ctx.strokeStyle = '#6fd98f'; ctx.beginPath(); ctx.arc(e.x,e.y,sc,0,6.29); ctx.stroke(); }
        ctx.globalAlpha = 1;
        const marks = e.roles.map(rl => {
          const a = PACK_AFFIXES.find(x => x.role === rl);
          return a ? [a.mark, a.col] : null;
        }).filter(Boolean);
        ctx.font = 'bold 15px ui-monospace,monospace'; ctx.textAlign = 'center';
        marks.forEach(([mk, col], mi) => {
          ctx.fillStyle = col;
          ctx.fillText(mk, e.x + (mi - (marks.length-1)/2)*16, e.y - e.r - 13);
        });
      }
      if (e.jumpTo && e.jumpT > 0){                 // замах прыжка: видно, что сейчас прыгнет
        ctx.strokeStyle = '#c08cff'; ctx.lineWidth = 2; ctx.globalAlpha = 0.8;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 10 + 6*Math.sin(G.time*18), 0, 6.29); ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
    if (e.rage > 0){                                 // разогнан мстителями
      ctx.strokeStyle = '#ffd24a'; ctx.globalAlpha = 0.5;
      drawShape(e.t.shape, e.x, e.y, e.r+3, -e.rot); ctx.stroke(); ctx.globalAlpha = 1;
    }

    // Аффиксы мини-босса: по кольцу на каждый, плюс телеграф тарана
    if (e.aff.length){
      const puls = 0.6 + 0.4*Math.sin(G.time*4);
      e.aff.forEach((a, ai) => {
        ctx.strokeStyle = a.id === 'ward' ? e.wardCol : a.col;
        ctx.globalAlpha = puls; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 11 + ai*6, 0, 6.29); ctx.stroke();
        ctx.globalAlpha = 1;
      });
      if (e.affT.warn > 0){                       // замах тарана: линия по будущей траектории
        ctx.strokeStyle = '#ff5a4e'; ctx.globalAlpha = 0.35 + 0.45*Math.sin(G.time*22);
        ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(e.x, e.y);
        ctx.lineTo(e.x + Math.cos(e.affT.ca)*430, e.y + Math.sin(e.affT.ca)*430);
        ctx.stroke(); ctx.globalAlpha = 1;
      }
    }

    // Полоса здоровья: у раненых, а у босса всегда — по ней читается прогресс боя
    if (e.hp < e.maxHp || e.kind === 'boss'){
      const w = e.r*2, hpw = w * clamp(e.hp/e.maxHp,0,1);
      ctx.fillStyle = '#000a'; ctx.fillRect(e.x-w/2, e.y-e.r-9, w, 3);
      ctx.fillStyle = e.kind === 'boss' ? '#ff5a4e' : '#e0405a'; ctx.fillRect(e.x-w/2, e.y-e.r-9, hpw, 3);
    }
    // Подпись босса: без неё игрок не свяжет кольца с тем, что его убивает
    if (e.kind === 'boss' && e.affNm){
      ctx.font = 'bold 12px ui-monospace,monospace'; ctx.textAlign = 'center';
      ctx.fillStyle = '#ff5a4e99'; ctx.fillText('БОСС', e.x, e.y-e.r-32);
      // Аффикс над самим боссом тоже был серым и мелким — поднимаем до читаемого
      ctx.font = 'bold 16px ui-monospace,monospace'; ctx.fillStyle = '#ffd24a';
      ctx.fillText(e.affNm.toUpperCase(), e.x, e.y-e.r-15);
    }
  }

  // Снаряды врагов
  ctx.fillStyle = '#d95ec2';
  for (const s of G.eshots){ ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.29); ctx.fill(); }

  // Снаряды игрока
  for (const s of G.shots){
    ctx.fillStyle = s.orb ? '#c08cff' : '#ffb340';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.29); ctx.fill();
  }

  // Эффекты
  for (const f of G.fx){
    if (f.t === 'bolt'){
      ctx.strokeStyle = '#ffe14a'; ctx.globalAlpha = clamp(f.life*5,0,1); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(f.x, f.y);
      const seg = 5;                                       // ломаем линию, чтобы читалась как разряд
      for (let k = 1; k <= seg; k++){
        const t2 = k/seg, jitter = k === seg ? 0 : 12;
        ctx.lineTo(f.x + (f.x2-f.x)*t2 + rnd(-jitter,jitter),
                   f.y + (f.y2-f.y)*t2 + rnd(-jitter,jitter));
      }
      ctx.stroke(); ctx.globalAlpha = 1;
    } else if (f.t === 'wave'){
      ctx.strokeStyle = f.col; ctx.globalAlpha = clamp(f.life*0.8, 0, 0.9); ctx.lineWidth = 9;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.29); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (f.t === 'ring'){
      ctx.strokeStyle = f.col; ctx.globalAlpha = clamp(f.life*3,0,1); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,6.29); ctx.stroke(); ctx.globalAlpha = 1;
    } else if (f.t === 'arc'){
      ctx.strokeStyle = '#ffb340'; ctx.globalAlpha = clamp(f.life*7,0,1); ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(f.x,f.y,f.r,f.a-f.arc/2,f.a+f.arc/2); ctx.stroke(); ctx.globalAlpha = 1;
    } else if (f.t === 'num'){
      ctx.globalAlpha = clamp(f.life*2,0,1);
      ctx.fillStyle = f.col || (f.crit ? '#ffd24a' : '#e8eef5');
      ctx.font = (f.crit ? 'bold 19px ' : 'bold 15px ') + 'ui-monospace,monospace';
      ctx.textAlign = 'center'; ctx.fillText(f.v, f.x, f.y); ctx.globalAlpha = 1;
    } else if (f.t === 'txt'){
      ctx.globalAlpha = clamp(f.life*2.5,0,1); ctx.fillStyle = f.col;
      ctx.font = 'bold 17px ui-monospace,monospace'; ctx.textAlign = 'center';
      ctx.fillText(f.s, f.x, f.y); ctx.globalAlpha = 1;
    }
  }

  // Частицы: рисуем квадратами по целым координатам — отсюда «пиксельность»
  for (const q of G.parts){
    ctx.globalAlpha = clamp(q.life/q.max, 0, 1);
    ctx.fillStyle = q.col;
    ctx.fillRect(Math.round(q.x), Math.round(q.y), q.sz, q.sz);
  }
  ctx.globalAlpha = 1;

  // Круговые орбы
  if (D.orbitN){
    const size = ORBIT_SIZE * D.projSize;
    ctx.strokeStyle = '#6fb3ff22'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(p.x, p.y, ORBIT_R*D.aoeR, 0, 6.29); ctx.stroke();
    for (let i = 0; i < D.orbitN; i++){
      const o = orbitPos(i);
      ctx.fillStyle = '#6fb3ff44'; ctx.strokeStyle = '#6fb3ff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(o.x, o.y, size, 0, 6.29); ctx.fill(); ctx.stroke();
    }
  }

  // Свита: костяные треугольники с ниткой к хозяину
  for (const m of G.minions){
    const K = MKIND[m.kind], golem = m.kind.startsWith('golem');
    ctx.strokeStyle = K.col + '22'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(m.x,m.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    ctx.lineWidth = golem ? 3 : 2;
    ctx.strokeStyle = m.hit > 0 ? '#ffffff' : K.col;
    ctx.fillStyle = K.col + (golem ? '33' : '22');
    drawPoly(m.x, m.y, m.r, K.sides, m.rot); ctx.fill(); ctx.stroke();
    // КРОВНЫЕ УЗЫ: пока идёт ярость, свита в красном ореоле — игрок должен
    // видеть окно удвоенного урона, а не считать секунды в уме
    if (G.bloodT > 0){
      ctx.strokeStyle = '#ff2a2a';
      ctx.globalAlpha = 0.35 + 0.35*Math.min(1, G.bloodT/3) * (0.6 + 0.4*Math.sin(G.time*11));
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r + 5, 0, 6.29); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (m.kind === 'golemB'){                       // метка провокации
      ctx.strokeStyle = K.col + '44'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(m.x, m.y, 34, 0, 6.29); ctx.stroke();
    }
    if (m.hp < m.max){
      const w = m.r*2;
      ctx.fillStyle = '#000a'; ctx.fillRect(m.x-w/2, m.y-m.r-7, w, 2);
      ctx.fillStyle = K.col;   ctx.fillRect(m.x-w/2, m.y-m.r-7, w*clamp(m.hp/m.max,0,1), 2);
    }
  }

  // Отметка текущей цели — чтобы было видно, куда бьёт автоатака
  if (G.target){
    const e = G.target, rr = e.r + 7;
    ctx.strokeStyle = '#ffb340aa'; ctx.lineWidth = 2;
    for (let q = 0; q < 4; q++){
      const a0 = q*Math.PI/2 + 0.35;
      ctx.beginPath(); ctx.arc(e.x, e.y, rr, a0, a0 + 0.55); ctx.stroke();
    }
  }

  // Управление мышью: кольцо покоя вокруг игрока и метка курсора
  if (G.control === 'mouse'){
    const mwx = p.x + G.mouse.x - W/2, mwy = p.y + G.mouse.y - H/2;
    const inZone = Math.hypot(G.mouse.x - W/2, G.mouse.y - H/2) <= MOUSE_DEADZONE;
    ctx.strokeStyle = inZone ? '#ffb34066' : '#ffb34022'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(p.x, p.y, MOUSE_DEADZONE, 0, 6.29); ctx.stroke();
    ctx.strokeStyle = '#ffb340aa'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(mwx-7, mwy); ctx.lineTo(mwx+7, mwy);
    ctx.moveTo(mwx, mwy-7); ctx.lineTo(mwx, mwy+7); ctx.stroke();
  }

  // Копия от «Чёрного зеркала»: тот же силуэт, но полупрозрачный и фиолетовый
  if (G.clone){
    const c = G.clone;
    ctx.globalAlpha = 0.35 + 0.25*Math.sin(G.time*9);
    ctx.strokeStyle = '#c08cff'; ctx.fillStyle = '#c08cff22'; ctx.lineWidth = 3;
    drawPoly(c.x, c.y, p.r, 4, 0.785); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(c.x, c.y);
    ctx.lineTo(c.x + Math.cos(c.aim)*(p.r+11), c.y + Math.sin(c.aim)*(p.r+11)); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // Барьер «Талисмана покоя»: толщина кольца показывает остаток
  if (p.barrier > 0){
    ctx.strokeStyle = '#5ec2e0'; ctx.globalAlpha = 0.75;
    ctx.lineWidth = 2 + 4*clamp(p.barrier/(D.life*0.10), 0, 1);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r+9, 0, 6.29); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // Заряд «Сердца голема» готов — тусклое серое кольцо
  if (amu('golem') && G.amuT.golem <= 0){
    ctx.strokeStyle = '#9aa7b4'; ctx.globalAlpha = 0.5; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r+14, 0, 6.29); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Игрок: янтарный квадрат с указателем направления атаки
  const ang = p.aim;
  ctx.strokeStyle = p.inv > 0 ? '#ffffff' : '#ffb340';
  ctx.fillStyle = '#ffb34033'; ctx.lineWidth = 3;
  drawPoly(p.x, p.y, p.r, 4, 0.785); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(p.x, p.y);
  ctx.lineTo(p.x + Math.cos(ang)*(p.r+11), p.y + Math.sin(ang)*(p.r+11)); ctx.stroke();

  ctx.restore();
  updateHud();
}

/* ---------- 10. ИНТЕРФЕЙС ---------- */
const $ = s => document.querySelector(s);
function updateHud(){
  const p = G.player;
  $('#hpbar i').style.width = clamp(p.hp/D.life*100,0,100) + '%';
  $('#hpbar span').textContent = Math.ceil(Math.max(0,p.hp)) + ' / ' + Math.round(D.life);
  $('#xpbar i').style.width = clamp(G.xp/G.xpNext*100,0,100) + '%';
  $('#lvl').textContent = G.lvl;
  $('#floor').textContent = G.floor;
  $('#left').textContent = 'врагов: ' + (G.enemies.length + G.spawnQueue);
  $('#goldbox').innerHTML = Math.floor(G.gold) + ' <span class="k">золота</span>';
  // Панель мини-босса: имя, аффиксы и здоровье, пока он жив
  const bb = $('#bossbar');
  const bs = G.enemies.find(e => e.kind === 'boss');
  if (bs){
    bb.style.display = 'block';
    // Цвет каждой метки берём из самого аффикса: тогда надпись и кольцо вокруг
    // босса опознаются как одно и то же, а не как два независимых значка.
    // Порядок меток в affNm совпадает с порядком в aff — они собраны вместе.
    const tags = (bs.affNm || '').split(' \u00B7 ').map((txt, i) => {
      const a = bs.aff[i];
      const col = a ? (a.id === 'ward' ? bs.wardCol : a.col) : '#ffd24a';
      return '<span style="color:' + col + '">' + txt + '</span>';
    }).join('<span class="bsep">\u00B7</span>');
    bb.innerHTML = '<div class="bt">БОСС</div>' +
      '<div class="ba">' + tags + '</div>' +
      '<div class="bh"><i style="width:' + clamp(bs.hp/bs.maxHp*100,0,100) + '%"></i></div>';
  } else bb.style.display = 'none';
  // Панель пачки: список аффиксов и сколько её ещё живо
  const pb = $('#packbar');
  const pkAlive = G.packs.filter(x => x.members.length)[0];
  if (pkAlive){
    pb.style.display = 'block';
    const tags = pkAlive.aff.map(a =>
      '<span style="color:' + a.col + '">' + a.nm + '</span>')
      .join('<span class="psep">\u00B7</span>');
    pb.innerHTML = '<div class="pt">ПАЧКА \u00B7 ЖИВЫХ ' + pkAlive.members.length + '</div>' +
                   '<div class="pa">' + tags + '</div>';
  } else pb.style.display = 'none';
  // Иконки найденных книг: цвет стихии, значение и тир
  $('#books').innerHTML = BOOK_KEYS.filter(k => G.items[k]).map(k => {
    const B = BOOKS[k], it = G.items[k];
    const val = (B.pct || k === 'monster' || k === 'xp') ? '+' + it.val + '%' : '+' + it.val;
    return '<div class="bk" style="border-color:' + B.col + ';color:' + B.col + '" title="' + B.nm + '">' +
      '<span class="ic">' + B.ico + '</span>' +
      '<span class="vl">' + val + '</span>' +
      (B.proc ? '<span class="tr">' + bookChance(k) + '%</span>' : '') +
      '<span class="tr">T' + it.tier + '</span></div>';
  }).join('') +
  // Амулеты рядом с книгами: у них нет тира, зато у части есть откат — его и показываем
  TOTEM_KEYS.filter(k => totemTier(k)).map(k => {
    const T = TOTEMS[k];
    return '<div class="bk" style="border-color:' + T.col + ';color:' + T.col + '" title="' +
      TOTEM_RANKS[totemTier(k)-1] + ' ' + T.nm + '">' +
      '<span class="ic">' + T.ico + '</span><span class="tr">+' + totemVal(k) + '%</span></div>';
  }).join('') +
  AMU_KEYS.filter(k => G.amu[k]).map(k => {
    const A = AMULETS[k];
    const cd = G.amuT[k];
    const rdy = k === 'doll' ? (G.amuT.doll > 0) : (cd !== undefined ? cd <= 0 : true);
    return '<div class="bk" style="border-color:' + A.col + ';color:' + A.col +
      (rdy ? '' : ';opacity:.45') + '" title="' + A.nm + '">' +
      '<span class="ic">' + A.ico + '</span>' +
      (cd !== undefined && k !== 'doll' && cd > 0 ? '<span class="tr">' + Math.ceil(cd) + 'с</span>' : '') +
      (k === 'doll' ? '<span class="tr">' + (G.amuT.doll > 0 ? 'цел' : 'разбит') + '</span>' : '') +
      '</div>';
  }).join('');
  // У некроманта в строке показываем урон свиты: своего у него нет
  $('#dpsinfo').textContent = G.weapon.noAttack
    ? 'свита ≈ ' + Math.round(avgHit()*D.minDmgMul*(D.minAspd/0.5)*Math.max(1, G.minions.length)) + ' урона/сек'
    : 'урон/сек ≈ ' + Math.round(avgHit()/D.atkCd*(G.weapon.type==='proj'?D.projN:1))
    + ' · рывки ' + G.player.dashN + '/' + D.dashMax
    + (D.hasMin ? ' · свита ' + G.minions.length + '/' + D.minMax : '');
}

let toastT = null;
function toast(s){
  const el = $('#toast'); el.textContent = s; el.style.opacity = 1;
  clearTimeout(toastT); toastT = setTimeout(()=> el.style.opacity = 0, 1400);
}

/* Крупное объявление посреди экрана, без паузы. Заголовок и подпись под ним. */
let pickupT = null;
function pickupBanner(title, sub, col){
  const el = $('#pickup');
  el.innerHTML = '<div class="pn" style="color:' + col + '">' + title + '</div>' +
                 (sub ? '<div class="pv">' + sub + '</div>' : '');
  el.style.opacity = 1;
  clearTimeout(pickupT); pickupT = setTimeout(()=> el.style.opacity = 0, 1600);
}

/* Статы, чей бонус доходит до свиты. Держать этот список руками приходится
   потому, что «доходит» означает разные вещи: одни статы входят в avgHit(),
   другие срабатывают внутри damage() на ударе приспешника, третьи (скорости)
   не меняют силу удара, а меняют их количество. Автоматически такое не выведешь.
   Каждая строка проверена замером удара приспешника — см. minallunit.js.
   ЧЕГО ЗДЕСЬ НЕТ И ПОЧЕМУ: вся защита (броня, уклонение, блок, реген,
   вампиризм) — свита считает живучесть только от D.minLife; геометрия снарядов
   (число, пробитие, отскок, дробовик) — у приспешников свои выстрелы; лут и
   опыт — это про хозяина. */
const MINION_STATS = new Set([
  // Урон и его проценты: удар свиты считается от avgHit(), туда входит всё это
  'dmg','dmgAoe','dmgProj','dmgMelee','lucky','pctHp','execute',
  'dFire','iFire','dCold','iCold','dLit','iLit','dPoi','iPoi',
  'dblHit','triHit',
  // Статусы и эффекты — накладываются внутри damage() на ударе приспешника
  'igniteCh','chillCh','freeze','shockCh','poiCh','radiation','ailEff','ailDur',
  'knock','dizzy','stun','slowMag','inferno',
  // Условные проценты; дистанционные считаются от самого приспешника
  'vsLow','vsFull','vsBoss','whMove','whStill','whLow','perNear','afterKill','close','far','ramp',
  // Криты: шанс наследуется целиком, множитель и надстройки общие
  'critCh','critMul','superCh','critWave','critLucky',
  // Скорости наследуются целиком
  'aspd','mspd',
  // Площадь: радиус взрыва приспешника при смерти и «Буйства демонов»
  'aoeR',
  // Снаряды охотников и колдунов: скорость, размер, пробитие и отскок — ваши
  'projSpd','pierce','chain',
  // Срабатывает на убийстве — неважно, чьём
  'explode','explodeMega','novaKill','onKill',
  // Сужение разброса и «Радиус в урон» правят базу и D.incAll, а их свита читает
  'narrow','aoeToDmg',
  // Кейстоуны, идущие через общий множитель урона или через скорости
  'kGlass','kNoCrit','kHeavy','kFlurry','kAcro','kUnburd','kBond',
]);
/* Что уже накоплено по этому стату — чтобы игрок видел, к чему прибавляет.
   Читаем сумку напрямую: она и есть источник правды, никаких вторых счётчиков.
   Флаги пропускаем: у них нет «текущего значения», они либо взяты, либо нет,
   а взятые из раздачи и так вырезаны. */
function currentOf(m){
  if (m.kind === 'flag') return null;
  const e = G.bag.s[m.stat];
  if (!e) return m.kind === 'more' ? '×1.00' : '0';
  if (m.kind === 'more')   return '×' + e.more.toFixed(2);
  if (m.kind === 'inc')    return (e.inc ? '+' : '') + Math.round(e.inc) + '%';
  if (m.kind === 'chance') return Math.round(e.flat) + '%';
  return (e.flat ? '+' : '') + (e.flat < 10 ? +e.flat.toFixed(1) : Math.round(e.flat));
}

const affectsMinions = m => {
  if (!G.weapon.minions || m.req === 'min') return false;
  return MINION_STATS.has(m.stat);
};

/* Тип сложения на карточке словами: «inc» ничего не говорит игроку */
const KIND_HINT = {
  flat:  'к урону плюсом',
  inc:   'суммируется в процентах',
  more:  'отдельный множитель',
  chance:'шанс',
  flag:  'свойство',
};

/* Шанс, что начатая ветка круговых орбов займёт место в раздаче.
   Замер: при 0.30 до десяти орбов игрок доходил за 28 уровней, при 0.52 — за 16. */
const ORBIT_PRIORITY = 0.52;

/* Карточки свиты у некроманта. Первое место в раздаче отдаётся им ВСЕГДА,
   второе — с шансом MINION_PRIORITY_2. Работает только у некроманта: карточки
   с req:'min' и так показываются только ему.
   Зачем: у него две прокачки в одной партии — своя и свиты, а мест в раздаче
   столько же, сколько у остальных. Замер до правок: карточка свиты попадалась
   в 31.7% роллов и занимала 11.7% мест, то есть некромант качал свиту втрое
   реже, чем себя, и к 30 уровню приходил с базовыми тремя скелетами. */
const MINION_PRIORITY = 1.0, MINION_PRIORITY_2 = 0.55;

/* Выбор трёх карточек модификаторов по редкости */
function rollCards(){
  const taken = new Set(G.picks.map(x => x.id));
  const out = [];
  const weight = m => m.w !== undefined ? m.w
                    : m.rar === 4 ? 3 : m.rar === 3 ? 4 : m.rar === 2 ? 14 : m.rar === 1 ? 40 : 100;
  // Карта должна что-то делать этому классу: дуга удара бесполезна лучнику,
  // пробитие — жезлу (сфера взрывается на первой цели), свита — всем кроме некроманта.
  /* noMin — карточка не показывается классам со свитой. Некромант не стоит
     на месте: он бегает, пока армия дерётся, и «турель-архетип» ему прямо
     противопоказан. Отдельный флаг, а не список исключений по id, чтобы
     следующую такую карточку можно было пометить одним словом. */
  const fits = m => (!m.wep || m.wep.includes(G.weapon.type))
                 && (!m.req || G.weapon.minions)
                 && !(m.noMin && G.weapon.minions);
  const pool = MODS.filter(m => (!m.show || m.show()) && !(m.hide && m.hide())) // условные ветки прокачки
                   .filter(fits)
                   // Взятый флаг больше не показываем. Флаг — это переключатель
                   // («есть/нет»), второй раз он перезаписывает ту же единицу и не
                   // даёт ровно ничего. Раньше отсеивались только кейстоуны, и
                   // остальные 24 флага (вспышка при убийстве, дробовик, фазовое
                   // движение, магнит добычи и прочие) продолжали выпадать пустышками.
                   // Правило общее, а не список исключений: любой новый флаг
                   // подхватится сам, и про него не придётся помнить отдельно.
                   .filter(m => !(m.kind === 'flag' && taken.has(m.id)))
                   .filter(m => !(m.rar === 3 && G.lvl < 4));         // кейстоуны с 4 уровня
  const need = cardCount();          // 3, либо 4 если открыта покупка в магазине

  /* Круговой орб — ветка, которая работает только собранной: один орб бьёт на
     15% автоатаки, десять держат оборону. Наравне со всеми он выпадает редко:
     игрок берёт первый и до второго не доживает. Поэтому начатая ветка получает
     место в раздаче с шансом 52%, пока не упрётся в потолок.
     Сделано отдельным броском, а НЕ повышенным весом в общей рулетке: вес пришлось
     бы подгонять под размер пула, а пул зависит от класса и от уже взятого.
     Замер веса 130 давал 6% вместо 30% — цифру пришлось бы искать заново
     после каждой новой карточки в каталоге. Бросок даёт ровно то, что написано. */
  /* Приоритетные места. Общее правило: сколько бы приоритетов ни сработало,
     хотя бы одно место в раздаче обязано остаться свободным — иначе выбора
     не существует, а показывать игроку заранее известные карточки незачем. */
  const freeSlots = () => need - 1 - out.length;

  /* СВИТА: некромант качает две вещи сразу — себя и свиту, — а мест у него
     столько же, сколько у остальных. Поэтому первое место всегда его свиты,
     второе — в половине случаев. Внутри категории тянем по обычным весам,
     иначе редкие ветки (големы, колдуны, повышение ранга) выпадали бы наравне
     с рядовыми процентами и перестали бы быть событием. */
  if (G.weapon.minions){
    const mins = pool.filter(m => m.req === 'min' && !(m.kind === 'flag' && taken.has(m.id)));
    const drawMin = () => {
      const left = mins.filter(m => !out.includes(m));
      if (!left.length) return false;
      const tw = left.reduce((s2,m)=> s2 + weight(m), 0);
      let t2 = Math.random()*tw, chosen = left[0];
      for (const m of left){ t2 -= weight(m); if (t2 <= 0){ chosen = m; break; } }
      out.push(chosen); return true;
    };
    if (freeSlots() > 0 && Math.random() < MINION_PRIORITY) drawMin();
    if (freeSlots() > 0 && Math.random() < MINION_PRIORITY_2) drawMin();
  }

  const orbHooked = G.picks.some(x => x.id === 'shape.orbit') && D.orbitN < 10;
  if (orbHooked && freeSlots() > 0 && Math.random() < ORBIT_PRIORITY){
    const orb = pool.find(m => m.id === 'shape.orbit');
    if (orb && !out.includes(orb)) out.push(orb);
  }
  let guard = 0;
  while (out.length < need && pool.length && guard++ < 200){
    const total = pool.reduce((s,m)=> s + weight(m), 0);
    let t = Math.random()*total, chosen = pool[0];
    for (const m of pool){ t -= weight(m); if (t <= 0){ chosen = m; break; } }
    if (!out.includes(chosen)) out.push(chosen);
    if (out.length >= pool.length) break;
  }
  // Только что открывшаяся ветка обязана показаться сразу — иначе игрок
  // может не узнать, что его 100% взрыва вообще что-то разблокировали.
  const fresh = MODS.find(m => m.unlock && !taken.has(m.id)
                            && (!m.show || m.show()) && !(m.hide && m.hide()) && fits(m));
  if (fresh && !out.includes(fresh)) out.splice(0, 0, fresh), out.length = need;

  return out;
}

function showLevelUp(){
  const cards = rollCards();
  const rc = r => ['','r-rare','r-epic','r-key','r-blood'][r||0];
  const fmt = m => {
    const v = m.r[0] === m.r[1] ? m.r[0] : rnd(m.r[0], m.r[1]);
    const val = m.kind === 'flag' ? '' :
                m.kind === 'more' ? '×' + (1+v/100).toFixed(2) :
                m.kind === 'inc'  ? '+' + Math.round(v) + '%' :
                m.kind === 'chance'? Math.round(v) + '%' :
                '+' + (v < 10 ? v.toFixed(1) : Math.round(v));
    return {v, val};
  };
  const rolled = cards.map(m => ({m, ...fmt(m)}));

  $('#ov').style.display = 'flex';
  $('#ov').innerHTML =
    '<h1>УРОВЕНЬ ' + G.lvl + '</h1><h2>выберите модификатор · осталось повышений: ' + G.pending + '</h2>' +
    '<div class="cards">' + rolled.map((c,i) =>
