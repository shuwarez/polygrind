      '<div class="card ' + rc(c.m.rar) + '" data-i="' + i + '">' +
        '<div class="cat">' + c.m.cat + ' · ' + KIND_HINT[c.m.kind] + '</div>' +
        '<div class="nm">' + c.m.nm + '</div>' +
        '<div class="vl">' + c.val +
          (currentOf(c.m) !== null ?
            '<span class="cur">сейчас ' + currentOf(c.m) + '</span>' : '') + '</div>' +
        '<div class="nt">' + (c.m.nt || '') + '</div>' +
        (affectsMinions(c.m) ? '<div class="mn">ДЕЙСТВУЕТ И НА СВИТУ</div>' : '') +
        '<div class="id">' + c.m.id + '</div>' +
      '</div>').join('') + '</div>' +
    '<button id="rr"' + (G.rerolls ? '' : ' disabled') + '>ПЕРЕБРОСИТЬ (' + G.rerolls + ')</button>';

  document.querySelectorAll('#ov .card').forEach(el => el.onclick = () => {
    const c = rolled[+el.dataset.i];
    G.bag.add(c.m.stat, c.m.kind, c.v);
    G.picks.push({id:c.m.id, nm:c.m.nm, val:c.val, cat:c.m.cat});
    recalc();
    G.pending--;
    if (G.pending > 0) showLevelUp();
    else { $('#ov').style.display = 'none'; $('#ov').innerHTML = ''; last = performance.now(); }
    renderSheet();
  });
  const rr = $('#rr');
  if (rr) rr.onclick = () => { if (G.rerolls > 0){ G.rerolls--; showLevelUp(); } };
}

        (k==='bleed'  ? '<br><i>' + Math.round(bookBleedDps()) + ' урона/сек за прок</i>' : '') +
        '</div>').join('')
    : '') +
    '<h3>ВЗЯТО МОДИФИКАТОРОВ: ' + G.picks.length + '</h3>' +
      G.picks.map(p => '<div class="pick">' + p.val + ' ' + p.nm + '<br><i>' + p.id + '</i></div>').join('');
}

function gameOver(endedEarly){
  G.over = true;
  G.endedEarly = !!endedEarly;
  menuMode = false; $('#ov').classList.remove('menu');   // экран смерти — не меню
  const earned = Math.floor(G.gold);
  G.earned = earned;                     // запоминаем: экран смерти рисуется ещё и после магазина
  Store.data.gold += earned;                                       // золото уносится в банк
  Store.data.best = Math.max(Store.data.best || 0, G.floor);
  Store.save();
  deathScreen();
}

function endRun(){
  if (!G || G.over) return;
  if (!confirm('Завершить забег и сохранить ' + Math.floor(G.gold) + ' золота в банк?')) return;
  $('#pauseov').style.display = 'none';
  gameOver(true);
}

/* ---------- 10b. МАГАЗИН ----------
   back — чем рисовать экран, с которого пришли: стартовый или экран смерти. */
function shopScreen(back){
  $('#sheet').style.display = 'none';
  $('#ov').style.display = 'flex';
  menuMode = false; $('#ov').classList.remove('menu');   // в магазине факелы только мешают читать цены
  const money = n => Math.round(n).toLocaleString('ru-RU');
  const catOf = it => it.cat || (['dmg','aspd'].includes(it.id) ? 'attack' :
    ['sxp','sgold','smon'].includes(it.id) ? 'farm' :
    ['vacuum','startSkill','card4','mspd'].includes(it.id) ? 'qol' : 'defense');
  const cats = [
    ['attack','АТАКУЮЩИЕ', 'урон и темп атак'],
    ['defense','ЗАЩИТНЫЕ', 'живучесть, защита и рывок'],
    ['farm','ФАРМОВЫЕ', 'опыт, золото и плотность врагов'],
    ['qol','КАЧЕСТВО ЖИЗНИ', 'удобство и скорость сбора'],
  ];

  const row = it => {
    const lvl = shopLvl(it.id), maxed = lvl >= it.max;
    // Пачки: ×10 и ×100 показываем только там, где потолок их оправдывает,
    // иначе на «четвёртой карте» висели бы две мёртвые кнопки.
    const packs = [1, 10, 100].filter(n => n === 1 || it.max >= n * 2);
    const btns = maxed
      ? '<button disabled>МАКСИМУМ</button>'
      : packs.map(n => {
          const b = shopBatch(it, n);
          const can = b.cnt > 0 && Store.data.gold >= b.sum;
          return '<button data-id="' + it.id + '" data-n="' + n + '"' + (can ? '' : ' disabled') + '>' +
            (n > 1 ? '+' + b.cnt + ' · ' : '') + '<b>' + money(b.sum) + '</b></button>';
        }).join('');
    const val = it.fmt ? it.fmt(lvl) : '+' + lvl + (it.unit || '');
    return '<div class="srow' + (maxed ? ' done' : '') + '">' +
      '<div class="sinfo"><div class="snm">' + it.nm +
        '<i>ур. ' + lvl + ' / ' + it.max + '</i></div>' +
        '<div class="snt">' + it.nt + '</div></div>' +
      '<div class="sval">' + val + '</div>' +
      '<div class="sbuy">' + btns + '</div></div>';
  };

  $('#ov').innerHTML =
    '<h1>МАГАЗИН</h1>' +
    '<h2>золото тратится навсегда и действует во всех будущих партиях</h2>' +
    '<div id="bank">В БАНКЕ: ' + money(Store.data.gold) + ' золота' +
      '<span> · потрачено за всё время: ' + money(Store.data.spent || 0) + '</span></div>' +
    '<div id="shop">' + cats.map(([id,nm,nt]) => {
      const rows = SHOP.filter(it => catOf(it) === id).map(row).join('');
      return rows ? '<h2 style="margin:24px 0 8px;color:#f0c040;letter-spacing:3px">' + nm +
        '<span style="display:block;margin-top:4px;color:#7d8b9a;font-size:12px;letter-spacing:0">' + nt + '</span></h2>' + rows : '';
    }).join('') + '</div>' +
    '<button id="shopback">НАЗАД</button>';

  document.querySelectorAll('#shop button').forEach(el => el.onclick = () => {
    const it = SHOP.find(x => x.id === el.dataset.id);
    if (it) shopBuy(it, +el.dataset.n, back);
  });
  $('#shopback').onclick = () => back();
}

/* Покупка пачкой. Идём по одному уровню: цена растёт после каждого,
   поэтому «купить 10» может закончиться на седьмом — это не ошибка, а честный расчёт. */
function shopBuy(it, n, back){
  const sh = Store.data.shop || (Store.data.shop = {});
  let bought = 0, paid = 0;
  for (let i = 0; i < n; i++){
    const lvl = shopLvl(it.id);
    if (lvl >= it.max) break;
    const c = shopCost(it, lvl);
    if (Store.data.gold < c) break;
    Store.data.gold -= c;
    Store.data.spent = (Store.data.spent || 0) + c;
    sh[it.id] = lvl + 1;
    bought++; paid += c;
  }
  if (!bought) return;
  Store.save();
  // Если магазин открыли посреди партии (а это возможно только с экрана смерти),
  // билд уже собран — покупки вступят в силу со следующей партии.
  shopScreen(back);
}

/* ---------- 10c. ФАКЕЛЫ ГЛАВНОГО МЕНЮ ----------
   Рисуются той же математикой, что и всё в игре: тело пламени — полигон,
   ширина которого идёт по синусу от основания к кончику, а дрожание —
   сумма двух синусов разной частоты. Одна частота дала бы ровное «дыхание»,
   заметно искусственное; две несоизмеримые никогда не совпадают по фазе
   и читаются как настоящий огонь. Угли — те же частицы, что и в бою. */
let menuMode = false;                 // меню открыто: гоняем факелы из общего цикла
const TORCH = [{c:null, g:null, parts:[], seed:0}, {c:null, g:null, parts:[], seed:2.4}];
let torchFlick = 1;                   // общая яркость кадра, ею же дышит название

function torchInit(){
  const ids = ['#tl', '#tr'];
  for (let i = 0; i < 2; i++){
    const cv2 = $(ids[i]);
    if (!cv2) return false;
    const d = window.devicePixelRatio || 1;
    if (TORCH[i].c !== cv2 || cv2.width !== 96*d){
      cv2.width = 96*d; cv2.height = 200*d;
      TORCH[i].c = cv2; TORCH[i].g = cv2.getContext('2d');
      TORCH[i].g.setTransform(d,0,0,d,0,0);
      TORCH[i].parts.length = 0;
    }
  }
  return true;
}

/* Тело пламени: замкнутый полигон, левая сторона строится обратным проходом
   по тем же точкам — так контур гарантированно симметричен по построению. */
function flamePoly(g, x, y0, w, h, t, seed){
  const N = 20;
  const pts = [];
  for (let i = 0; i <= N; i++){
    const s = i/N;                                   // 0 у основания, 1 у кончика
    const wob = Math.sin(t*7.3 + s*6.2 + seed)*0.11 + Math.sin(t*13.1 + s*11 + seed*1.7)*0.06;
    const half = Math.pow(Math.sin(Math.PI*(0.06 + s*0.94)), 0.7) * w * (1 + wob);
    const lean = Math.sin(t*3.1 + seed)*4*s;         // язык слегка водит из стороны в сторону
    pts.push([x + half + lean, y0 - h*s]);
  }
  g.beginPath();
  g.moveTo(pts[0][0], pts[0][1]);
  for (const p2 of pts) g.lineTo(p2[0], p2[1]);
  for (let i = N; i >= 0; i--){
    const s = i/N;
    const wob = Math.sin(t*7.3 + s*6.2 + seed)*0.11 + Math.sin(t*13.1 + s*11 + seed*1.7)*0.06;
    const half = Math.pow(Math.sin(Math.PI*(0.06 + s*0.94)), 0.7) * w * (1 + wob);
    const lean = Math.sin(t*3.1 + seed)*4*s;
    g.lineTo(x - half + lean, y0 - h*s);
  }
  g.closePath();
}

function torchDraw(i, t, dt){
  const T = TORCH[i], g = T.g;
  if (!g) return;
  g.clearRect(0, 0, 96, 200);
  const x = 48, base = 138;                        // основание пламени = верх чаши

  // мерцание: две несоизмеримые частоты плюс редкий сильный всплеск
  const fl = 0.86 + 0.09*Math.sin(t*8.7 + T.seed) + 0.05*Math.sin(t*19.3 + T.seed*2)
           + 0.04*Math.sin(t*2.3 + T.seed*3);
  if (i === 0) torchFlick = fl;

  // Ореол
  const gr = g.createRadialGradient(x, base-34, 4, x, base-34, 74*fl);
  gr.addColorStop(0, 'rgba(255,180,64,' + (0.34*fl).toFixed(3) + ')');
  gr.addColorStop(0.45, 'rgba(255,122,47,' + (0.13*fl).toFixed(3) + ')');
  gr.addColorStop(1, 'rgba(255,122,47,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 96, 200);

  // Рукоять с перевязью и чаша
  g.fillStyle = '#3b2a1b';
  g.beginPath();
  g.moveTo(x-6, base); g.lineTo(x+6, base); g.lineTo(x+4, 198); g.lineTo(x-4, 198);
  g.closePath(); g.fill();
  g.fillStyle = '#2a1d12';
  for (let k = 0; k < 3; k++) g.fillRect(x-6, base + 16 + k*20, 12, 4);   // обмотка
  g.fillStyle = '#5a4426';
  g.beginPath();                                    // чаша: трапеция под пламенем
  g.moveTo(x-15, base-10); g.lineTo(x+15, base-10); g.lineTo(x+8, base+6); g.lineTo(x-8, base+6);
  g.closePath(); g.fill();
  g.strokeStyle = '#7a5c30'; g.lineWidth = 2; g.stroke();

  // Три слоя пламени: внешний дымный, средний рабочий, ядро добела
  g.globalAlpha = 0.55*fl; g.fillStyle = '#e0562a';
  flamePoly(g, x, base-6, 20, 96*fl, t, T.seed); g.fill();
  g.globalAlpha = 0.85*fl; g.fillStyle = '#ff9a2f';
  flamePoly(g, x, base-6, 14, 72*fl, t*1.15, T.seed+1.1); g.fill();
  g.globalAlpha = 1; g.fillStyle = '#ffe6a8';
  flamePoly(g, x, base-8, 7, 40*fl, t*1.35, T.seed+2.6); g.fill();
  g.globalAlpha = 1;

  // Угли: те же частицы, что в бою — квадратики с трением и затуханием
  if (T.parts.length < 26 && Math.random() < 0.55)
    T.parts.push({x:x + rnd(-7,7), y:base-14, vx:rnd(-12,12), vy:rnd(-46,-24),
                  life:rnd(0.5,1.3), max:1.3, sz:rndi(1,3)});
  for (let k = T.parts.length-1; k >= 0; k--){
    const q = T.parts[k];
    q.life -= dt; q.x += q.vx*dt; q.y += q.vy*dt;
    q.vy -= 12*dt;                                  // тяга вверх ускоряет уголёк
    q.vx += Math.sin(t*4 + k)*7*dt;
    if (q.life <= 0){ T.parts.splice(k,1); continue; }
    const a = clamp(q.life/q.max, 0, 1);
    g.globalAlpha = a;
    g.fillStyle = a > 0.6 ? '#ffd24a' : a > 0.3 ? '#ff7a2f' : '#7a3a1a';
    g.fillRect(q.x, q.y, q.sz, q.sz);
  }
  g.globalAlpha = 1;
}

/* Один тик меню: оба факела и дыхание названия. Зовётся из общего цикла,
   отдельного requestAnimationFrame заводить не за чем. */
function menuTick(dt){
  if (!torchInit()) return;
  const t = performance.now()/1000;
  torchDraw(0, t, dt); torchDraw(1, t + 0.7, dt);
  const nm = $('#brandnm');
  if (nm) nm.style.filter = 'drop-shadow(0 2px 0 #00000066) drop-shadow(0 0 ' +
    (16 + 14*torchFlick).toFixed(1) + 'px rgba(255,138,47,' + (0.30*torchFlick).toFixed(3) + '))';
}

/* Вывеска целиком: два факела и название между ними */
const brandHtml = () =>

    '<div><div id="brandnm">PolyGrind</div>' +

/* Второй шаг стартового экрана: чем играть */
const CONTROLS = {
  keys: {nm:'КЛАВИАТУРА', ico:'WASD',
         desc:'Движение на WASD или стрелках. Точный контроль остановки — удобно для билдов на стрельбу с места.'},
  mouse:{nm:'МЫШЬ', ico:'\u2316',
         desc:'Персонаж непрерывно бежит к курсору. Чтобы встать, наведите курсор на себя — вокруг персонажа есть зона покоя.'},
};
function controlScreen(wk){
  menuMode = true; $('#ov').classList.add('menu');       // всё ещё меню: факелы горят дальше
  $('#ov').innerHTML =
    brandHtml() +
    '<h2 style="color:var(--amber);letter-spacing:3px;font-size:22px">' + WEAPONS[wk].nm + '</h2>' +
    '<h2>чем управлять? · сменить можно в любой момент на C</h2>' +
    '<div class="cards">' + Object.keys(CONTROLS).map(ck => {
      const C = CONTROLS[ck];
      return '<div class="card" data-c="' + ck + '">' +
        '<div class="cat">управление</div>' +
        '<div class="nm">' + C.nm + '</div>' +
        '<div class="vl">' + C.ico + '</div>' +
        '<div class="nt">' + C.desc + '</div></div>';
    }).join('') + '</div>' +
    '<div class="k" style="font-size:13px">Атака автоматическая в обеих схемах · ПРОБЕЛ — рывок · ESC или P — пауза</div>' +
    '<button id="back">НАЗАД К ВЫБОРУ КЛАССА</button>';
  document.querySelectorAll('#ov .card').forEach(el => el.onclick = () => {
    newGame(wk, el.dataset.c);
    menuMode = false; $('#ov').classList.remove('menu');
    cv.classList.toggle('mouse-mode', el.dataset.c === 'mouse');
    setHint(); renderSheet(); last = performance.now();
    // Покупка «Первый шаг» выдаёт именно выборы из обычной раздачи: все фильтры,
    // приоритеты и правила классов остаются одними и теми же уже с первого боя.
    if (G.pending) showLevelUp();
    else { $('#ov').style.display = 'none'; $('#ov').innerHTML = ''; }
  });
  $('#back').onclick = startScreen;
}

/* Подсказка внизу экрана зависит от выбранной схемы */
/* Смена схемы управления на лету. Обе схемы уже полностью поддержаны в update(),
   так что переключение — это ровно смена флага плюс уборка за прошлой схемой. */
function toggleControl(){
  G.control = G.control === 'mouse' ? 'keys' : 'mouse';
  if (G.control === 'mouse'){
    // Курсор с прошлого раза мог остаться где угодно, а мышиная схема гонит
    // персонажа к нему постоянно. Ставим цель в центр экрана: камера держит
    // игрока ровно там, то есть это центр мёртвой зоны — до первого движения
    // мыши персонаж стоит, а не срывается в сторону.
    G.mouse.x = W/2; G.mouse.y = H/2;
  }
  // Зажатая WASD осталась бы в G.keys как нажатая: keyup по ней уже не придёт
  // в том смысле, в каком его ждёт схема. Гасим всё, что удерживалось.
  for (const k in G.keys) G.keys[k] = false;
  const p = G.player; p.moving = false;
  setHint();
  toast('УПРАВЛЕНИЕ: ' + CONTROLS[G.control].nm);
  G.fx.push({t:'ring', x:p.x, y:p.y, r:8, max:70, life:0.4, col:'#4fd1c5'});
}

function setHint(){
  $('#hint').textContent = (G.control === 'mouse'
      ? 'МЫШЬ — движение к курсору, наведите на себя чтобы встать'
      : 'WASD — движение')
    + ' · атака автоматическая · ПРОБЕЛ — рывок · C — сменить управление · TAB — характеристики · ESC/P — пауза';
}

/* ---------- 12. ВВОД ---------- */
addEventListener('keydown', e => {
  if (!G) return;
  const k = e.key.toLowerCase();
  G.keys[k] = true;
  if (k === ' '){                                                   // рывок
    e.preventDefault();
    const p = G.player;
    if (p.dashN > 0 && p.dash <= 0){ p.dashN--; p.dash = 0.14; p.inv = D.iframe; p.dashHits = []; }
  }
  // e.repeat: браузер шлёт keydown повторно, пока клавиша зажата.
  // Без этой проверки удержание C дёргало бы схему по десять раз в секунду.
  if (k === 'c' && !e.repeat) toggleControl();
  if ((k === 'tab' || k === 'v') && !e.repeat){
    if (k === 'tab') e.preventDefault();          // иначе Tab уводит фокус со страницы
    const sh = $('#sheet');
    sh.style.display = sh.style.display === 'block' ? 'none' : 'block';
    renderSheet();
  }
  if (k === 'p' || k === 'escape'){
    if (G.pending || G.over || $('#ov').style.display === 'flex') return;  // модалки паузу не трогают
    G.paused = !G.paused;
    $('#pauseov').style.display = G.paused ? 'flex' : 'none';
    last = performance.now();
  }
});
addEventListener('keyup', e => { if (G) G.keys[e.key.toLowerCase()] = false; });
$('#endrun').onclick = endRun;
cv.addEventListener('mousemove', e => {
  if (!G) return;
  const r = cv.getBoundingClientRect();
  G.mouse.x = e.clientX - r.left; G.mouse.y = e.clientY - r.top;
});
cv.addEventListener('contextmenu', e => e.preventDefault());

/* Подставляется на сборке. Если осталось как есть — файл открыт напрямую. */
const BUILD = '__BUILD__';
$('#build').textContent = BUILD.indexOf('BUILD') >= 0 ? 'dev' : BUILD;

resize();
Store.load().then(() => { startScreen(); requestAnimationFrame(loop); });
</script>
</body>
</html>
