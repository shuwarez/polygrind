<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PolyGrind</title>
<style>
/* ============================================================
   СТИЛИ ИНТЕРФЕЙСА
   Палитра: холодный графит + янтарный игрок + кислотные враги.
   ============================================================ */
:root{
  --bg:#0d1014;          /* фон арены */
  --grid:#171d24;        /* линии сетки */
  --ink:#f4f8fc;         /* основной текст */
  --dim:#b3c2d1;         /* второстепенный текст */
  --amber:#ffb340;       /* игрок */
  --hp:#e0405a;          /* здоровье */
  --xp:#4fd1c5;          /* опыт */
  --panel:#11161c;       /* панели UI */
  --line:#38434f;        /* рамки */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);
  font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;overflow:hidden;font-weight:600}
#wrap{position:relative;width:100vw;height:100vh}
canvas{display:block;width:100%;height:100%;cursor:default}
canvas.mouse-mode{cursor:none}

/* --- Верхняя строка состояния --- */
#hud{position:absolute;top:0;left:0;right:0;padding:10px 14px;pointer-events:none;
  display:flex;gap:14px;align-items:flex-start}
.bar{height:14px;background:#000a;border:1px solid var(--line);border-radius:2px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;transition:width .12s linear}
.bar>span{position:absolute;inset:0;font-size:12.5px;line-height:14px;text-align:center;letter-spacing:.5px}
#hpbar{width:280px}
#xpbar{width:280px;height:8px;margin-top:4px}
#floorbox{margin-left:auto;text-align:right;font-size:15px;line-height:1.5}
#floorbox b{font-size:25px;color:var(--amber)}
.k{color:var(--dim)}

/* --- Оверлеи (выбор оружия, уровень, смерть) --- */
.overlay{position:absolute;inset:0;background:#070a0dee;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:22px;padding:24px;z-index:10}
.overlay h1{font-size:37.5px;letter-spacing:6px;font-weight:600}

/* --- Главное меню --- */
/* Оверлей меню темнее к краям и светлее в середине: свет факелов должен
   куда-то падать, на равномерной заливке он не читается как свет. */
.overlay.menu{background:radial-gradient(ellipse 70% 60% at 50% 42%, #12100de8 0%, #05070af2 75%)}
/* Вывеска: факел — название — факел. Факелы стоят именно тут, а не по краям
   экрана: четыре карточки класса занимают 1122px, и на экране 1280 боковые
   факелы налезали бы на них. У заголовка места хватает всегда. */
#brand{display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,48px)}
#brand canvas{width:96px;height:200px;display:block;filter:drop-shadow(0 0 22px #ff8a2f55)}
#brandnm{font-size:clamp(44px,7.4vw,86px);font-weight:800;letter-spacing:2px;line-height:1;
  background:linear-gradient(178deg,#fff6e0 6%,#ffd24a 38%,#ff9a2f 72%,#e0562a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-fill-color:transparent;white-space:nowrap;
  filter:drop-shadow(0 2px 0 #00000066)}
#brandsub{font-size:13px;letter-spacing:7px;color:#8a704e;text-align:center;margin-top:6px;
  text-transform:uppercase}
/* Карточки классов в меню теплее: холодная синяя рамка спорила бы с огнём */
.overlay.menu .card:hover{border-color:#ff9a2f;box-shadow:0 0 22px #ff8a2f22}
.overlay.menu button{border-color:#6b4a24}
.overlay.menu button:hover{border-color:#ffb340;box-shadow:0 0 16px #ff8a2f33}
.overlay h2{font-size:18.8px;color:var(--dim);font-weight:400;letter-spacing:1px}
.cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:1160px}
/* 1000px разбивали четыре карточки на 3+1: при открытой в магазине четвёртой
   карте ряд обязан вставать в одну строку, иначе выбор читается как «3 и ещё одна». */
.card{width:270px;min-height:160px;background:var(--panel);border:1px solid var(--line);
  border-radius:4px;padding:16px;cursor:pointer;transition:.12s;display:flex;flex-direction:column;gap:8px}
.card:hover{border-color:var(--amber);transform:translateY(-3px)}
.card .cat{font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim)}
.card .nm{font-size:18.8px;font-weight:600;line-height:1.35}
.card .vl{font-size:27.5px;color:var(--amber);font-weight:700}
.card .nt{font-size:13.8px;color:var(--dim);line-height:1.5;margin-top:auto}
.card .id{font-size:11.2px;color:#3d4854;letter-spacing:.5px}
.card.r-rare{border-color:#3a6ea5}   .card.r-rare  .vl{color:#6fb3ff}
.card.r-epic{border-color:#7a4fb5}   .card.r-epic  .vl{color:#c08cff}
.card.r-key {border-color:#b55a2a;background:#1a1210} .card.r-key .vl{color:#ff8a3d}
/* Красная редкость: выше кейстоуна. Отдельный уровень нужен потому, что такие
   карточки не выпадают в общей рулетке вообще — их открывает только доведённая
   до потолка ветка, и игрок должен опознать это с одного взгляда. */
/* Метка «действует и на свиту». Показывается только некроманту и только на
   тех карточках, чей бонус реально доходит до приспешников. */
/* «Сейчас» рядом с прибавкой: игрок должен видеть, к чему прибавляет.
   +44% к урону свиты значат разное при нуле и при двухстах уже вложенных. */
.card .vl .cur{display:block;font-size:12.5px;letter-spacing:1px;color:#7d8b9a;
  font-weight:400;margin-top:2px}
.card .mn{display:inline-block;margin-top:7px;font-size:11px;letter-spacing:1.5px;
  color:#8be04e;border:1px solid #8be04e55;border-radius:3px;padding:2px 6px;font-weight:700}
.card.r-blood{border-color:#c02a2a;background:#1c0f11;box-shadow:0 0 18px #ff2a2a22}
.card.r-blood .vl{color:#ff5a4e}
.card.r-blood .nm{color:#ff8a80}
button{font-family:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);
  padding:9px 20px;border-radius:3px;cursor:pointer;font-size:15px;letter-spacing:1px}
button:hover{border-color:var(--amber)}
button:disabled{opacity:.35;cursor:default}

/* --- Панель характеристик --- */
#sheet{position:absolute;top:0;right:0;width:400px;height:100%;background:#0b0f14f2;
  border-left:1px solid var(--line);padding:16px;overflow-y:auto;display:none;z-index:9;font-size:15px}
#sheet h3{font-size:13.8px;letter-spacing:2px;color:#cfdae5;margin:14px 0 6px;font-weight:500}
#sheet h3:first-child{margin-top:0}
.row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #2a3440}
.row b{color:var(--amber);font-weight:600}
.pick{padding:5px 0;border-bottom:1px solid #2a3440;line-height:1.45}
.pick i{font-style:normal;color:#9fb0c0;font-size:12.5px}
#books{display:flex;gap:6px;margin-top:7px}
.bk{display:flex;align-items:center;gap:5px;padding:3px 8px 3px 6px;border:1px solid;border-radius:3px;
  background:#0b0f14cc;font-size:15px;line-height:1}
.bk .ic{font-size:17.5px}
.bk .tr{font-size:11.2px;opacity:.75;letter-spacing:.5px}
.bk .vl{font-weight:700}
/* Список уже найденных предметов в окне находки. Высота в vh, а не в пикселях:
   26 предметов при полном сборе выталкивали кнопку «Продолжить» за нижний край
   экрана, и её приходилось доставать зумом браузера. Потолок в 30vh держит окно
   в габаритах любого монитора — вместе с иконкой, названием и описанием это
   примерно 360px плюс треть экрана, то есть кнопка видна и на ноутбуке. */
#amuown{width:min(640px,90vw);border-top:1px solid var(--line);padding-top:12px}
#amulist{max-height:28vh;overflow-y:auto;padding-right:8px}
/* Иконка и отступы ужимаются вместе с окном: на ноутбуке с высотой 600
   фиксированные 80px иконки и шесть отступов по 22 съедали столько, что
   кнопка не влезала даже при прокручиваемом списке. */
#amuico{font-size:clamp(34px,7vh,80px);line-height:1}
.overlay{gap:clamp(9px,2.2vh,22px)}
/* Полоса прокрутки видимая: иначе непонятно, что список продолжается */
#amulist::-webkit-scrollbar{width:8px}
#amulist::-webkit-scrollbar-thumb{background:#2a323c;border-radius:4px}
#amulist::-webkit-scrollbar-thumb:hover{background:#3a4450}
#amulist::-webkit-scrollbar-track{background:#0d1116;border-radius:4px}
/* Двумя колонками, когда предметов много: вдвое короче список при той же читаемости */
#amulist.two{column-count:2;column-gap:18px}
#amulist.two .pick{break-inside:avoid}
/* Оверлей тоже прокручиваемый — страховка на случай, если что-то ещё разрастётся */
.overlay{overflow-y:auto}

/* --- Магазин --- */
#shop{display:flex;flex-direction:column;gap:9px;width:min(980px,94vw);
  max-height:56vh;overflow-y:auto;padding-right:6px}
.srow{display:flex;align-items:center;gap:14px;background:var(--panel);
  border:1px solid var(--line);border-radius:4px;padding:11px 14px}
.srow.done{border-color:#3c6b45;background:#101a13}
.srow .sinfo{flex:1;min-width:0}
.srow .snm{font-size:16.2px;letter-spacing:1px}
.srow .snm i{font-style:normal;color:var(--dim);font-size:12.5px;letter-spacing:.5px;margin-left:8px}
.srow .snt{font-size:12.8px;color:var(--dim);line-height:1.45;margin-top:3px}
.srow .sval{font-size:22px;color:var(--amber);font-weight:700;min-width:104px;text-align:right}
.srow .sbuy{display:flex;gap:6px}
.srow .sbuy button{padding:7px 11px;font-size:13.2px;letter-spacing:0;min-width:96px}
.srow .sbuy button b{color:#f0c040;font-weight:700}
#bank{font-size:18.8px;color:#f0c040;letter-spacing:1px}
#bank span{color:#7d8b9a;font-size:13.8px;letter-spacing:0}
#hint{position:absolute;bottom:10px;left:14px;font-size:13.8px;color:var(--dim);line-height:1.6;pointer-events:none;text-shadow:0 1px 3px #000}
#toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);font-size:16.2px;
  color:var(--amber);letter-spacing:2px;pointer-events:none;opacity:0;transition:opacity .3s}
/* Объявление повторной книги: крупно, по центру, без паузы и без кнопки.
   Первая находка по-прежнему открывает окно — там игрок читает, что книга
   вообще делает. Вторую и дальше он уже знает, и останавливать бой ради
   строчки «тир 2» значит рвать темп на каждом подъёме. */
#pickup{position:absolute;top:33%;left:50%;transform:translateX(-50%);pointer-events:none;
  opacity:0;transition:opacity .25s;text-align:center;white-space:nowrap}
#pickup .pn{font-size:clamp(30px,4.4vw,54px);font-weight:800;letter-spacing:5px;line-height:1.05}
#pickup .pv{font-size:17.5px;letter-spacing:3px;color:#7d8b9a;margin-top:4px}
/* Полоса босса висит всё время боя: тост живёт 1.4 сек, за это время
   три аффикса прочитать невозможно. */
/* Клеймо сборки: намеренно тусклое, читается только если вглядеться */
#build{position:absolute;right:8px;bottom:6px;font-size:10px;color:#3a4550;
  pointer-events:none;letter-spacing:1px;user-select:text}
/* Панель пачки: снизу, чтобы не спорить с панелью босса сверху.
   Аффиксов у пачки бывает до десяти — кольцами вокруг каждого монстра
   столько не показать, читается только списком. */
#packbar{position:absolute;bottom:46px;left:50%;transform:translateX(-50%);
  pointer-events:none;text-align:center;background:#0b0f14e6;border:1px solid #ffffff22;
  border-radius:8px;padding:7px 18px;max-width:92vw}
#packbar .pt{font-size:11.5px;letter-spacing:4px;color:#7d8b9a;font-weight:700}
#packbar .pa{font-size:16.5px;line-height:1.3;font-weight:700;letter-spacing:.5px;margin-top:2px}
#packbar .psep{color:#4a5561;margin:0 8px;font-weight:400}
#bossbar{position:absolute;top:96px;left:50%;transform:translateX(-50%);
  pointer-events:none;text-align:center;background:#0b0f14ee;border:2px solid #ff5a4e99;
  border-radius:9px;padding:10px 30px;max-width:92vw;
  box-shadow:0 0 22px #ff5a4e33}
/* «БОСС» — только подпись. Главное на панели это аффикс, поэтому он крупнее
   заголовка втрое и подсвечен цветом своего же кольца вокруг босса. */
#bossbar .bt{font-size:13px;letter-spacing:5px;color:#ff5a4e99;font-weight:700}
#bossbar .ba{font-size:30px;line-height:1.15;font-weight:800;letter-spacing:1.5px;
  margin-top:3px;text-transform:uppercase;text-shadow:0 0 14px currentColor}
#bossbar .bsep{color:#5a6675;margin:0 12px;font-weight:400}
#bossbar .bh{height:8px;background:#000a;border-radius:4px;margin-top:9px;overflow:hidden;
  width:360px;max-width:100%;margin-left:auto;margin-right:auto;border:1px solid #ff5a4e33}
#bossbar .bh i{display:block;height:100%;background:#ff5a4e;transition:width .12s linear}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div>
      <div class="bar" id="hpbar"><i style="background:var(--hp)"></i><span></span></div>
      <div class="bar" id="xpbar"><i style="background:var(--xp)"></i></div>
      <div style="font-size:13.8px;margin-top:5px" class="k">Ур. <b id="lvl" style="color:var(--ink)">1</b> · <span id="dpsinfo"></span></div>
      <div id="books"></div>
    </div>
    <div id="floorbox">
      <div class="k">ЭТАЖ</div><b id="floor">1</b>
      <div class="k" id="left">врагов: 0</div>
      <div id="goldbox" style="color:#f0c040;margin-top:4px">0 <span class="k">золота</span></div>
    </div>
  </div>

  <div id="bossbar" style="display:none"></div>
  <div id="packbar" style="display:none"></div>
  <div id="pickup"></div>
  <div id="build"></div>
  <div id="toast"></div>
  <div id="sheet"></div>
  <div id="hint">WASD — движение · атака автоматическая · ПРОБЕЛ — рывок · C — характеристики · P — пауза</div>

  <div class="overlay" id="pauseov" style="display:none;background:#070a0dcc">
    <h1>ПАУЗА</h1>
    <h2>ESC или P — продолжить</h2>
    <button id="endrun" style="margin-top:18px;border-color:#e0405a;color:#ff9a8a">ЗАВЕРШИТЬ ЗАБЕГ · СОХРАНИТЬ ЗОЛОТО</button>
  </div>
  <div class="overlay" id="ov"></div>
</div>

<script>
"use strict";
/* ==================================================================
   PolyGrind — top-down action RPG на примитивах
   Смесь Diablo 2 (лут-система заменена на модификаторы) и аренного гриндера.
   Вся прокачка построена на каталоге из 947 модификаторов:
   каждая карточка при повышении уровня — реальная запись из stats.csv
   со своим id, категорией и типом (flat / inc / more / chance / flag).
   ================================================================== */

/* ---------- 1. ХОЛСТ И БАЗОВЫЕ УТИЛИТЫ ---------- */
const cv = document.getElementById('cv');          // сам холст
const ctx = cv.getContext('2d');                   // 2D-контекст рисования
let W = 0, H = 0;                                  // размеры окна в пикселях
function resize(){                                 // подгоняем холст под окно с учётом retina
  const d = window.devicePixelRatio || 1;
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * d; cv.height = H * d;
  ctx.setTransform(d,0,0,d,0,0);
}
window.addEventListener('resize', resize);

const rnd  = (a,b)=> a + Math.random()*(b-a);      // случайное число в диапазоне
const rndi = (a,b)=> Math.floor(rnd(a,b+1));       // случайное целое включительно
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const clamp= (v,a,b)=> v<a?a:v>b?b:v;
const dist = (a,b)=> Math.hypot(a.x-b.x, a.y-b.y);

const ARENA = 1500;                                // арена — квадрат ARENA×ARENA вокруг нуля
const MOUSE_DEADZONE = 34;                         // радиус покоя вокруг игрока при управлении мышью

/* ---------- 2. КАТАЛОГ МОДИФИКАТОРОВ ----------
   Формат записи повторяет stats.csv:
     id    — идентификатор из каталога (attr.strength, life.max_flat, ...)
     cat   — человекочитаемая категория
     nm    — название
     kind  — flat | inc | more | chance | flag  (тип сложения)
     stat  — во что пишем значение внутри движка
     r     — диапазон ролла [min,max] (тир аффикса)
     rar   — редкость: 0 обычный, 1 редкий, 2 эпический, 3 кейстоун
     nt    — пояснение для игрока
   Движок сам умеет складывать flat/inc/more, поэтому новые строки
   каталога добавляются одной строчкой без правки логики.
*/
const MODS = [
// --- Здоровье ---
{id:'life.on_kill',    cat:'Здоровье', nm:'Здоровье за убийство',       kind:'flat', stat:'onKill',     r:[2,6]},
{id:'life.on_hit',     cat:'Здоровье', nm:'Здоровье за попадание',      kind:'flat', stat:'onHit',      r:[0.4,1.2], rar:1, nt:'сильно с быстрыми атаками'},
{id:'life.on_crit',    cat:'Здоровье', nm:'Здоровье за крит',           kind:'flat', stat:'onCrit',     r:[2,5], rar:1},
{id:'key.dread_vampire',cat:'Кейстоун',nm:'УЖАСАЮЩИЙ ВАМПИР',           kind:'flag', stat:'kDread',     r:[1,1], rar:3, nt:'единственный источник восстановления: 0.3% нанесённого урона. Всё остальное лечение и вампиризм — с карточек, книг, амулетов, зачистки этажа — перестаёт работать'},
{id:'life.leech_instant',cat:'Здоровье',nm:'МГНОВЕННЫЙ ВАМПИРИЗМ',      kind:'flag', stat:'leechInstant',r:[1,1], rar:2, w:45, unlock:true,
 nt:'вытягивание перестаёт течь во времени и лечит целиком в момент удара', show:()=>D.leechBase>=25},
{id:'life.degen_reduction',cat:'Здоровье',nm:'Снижение урона со временем по себе',kind:'inc',stat:'degenRed',r:[20,40], rar:1},

// --- Урон, общие ---
{id:'dmg.flat_all',    cat:'Урон', nm:'+N ко всему урону',              kind:'flat', stat:'dmg',        r:[3,7]},
{id:'dmg.inc_all',     cat:'Урон', nm:'+% ко всему урону',              kind:'inc',  stat:'dmg',        r:[12,22]},
{id:'dmg.more_all',    cat:'Урон', nm:'Множитель урона',                kind:'more', stat:'dmg',        r:[14,20], rar:2, nt:'самый ценный тип — множится, а не складывается'},
{id:'dmg.aoe',         cat:'Урон', nm:'Урон по площади',                kind:'inc',  stat:'dmgAoe',     r:[18,30], wep:['orb']},
{id:'dmg.projectile',  cat:'Урон', nm:'Урон снарядов',                  kind:'inc',  stat:'dmgProj',   r:[18,30], wep:['proj','orb']},
{id:'dmg.melee',       cat:'Урон', nm:'Урон ближнего боя',              kind:'inc',  stat:'dmgMelee',  r:[18,30], wep:['melee']},
{id:'dmg.thorns',      cat:'Урон', nm:'Шипы: N урона атакующему',       kind:'flat', stat:'thorns',     r:[6,14], hide:()=>D.thorns>=40},

/* ---------- 3. СУМКА МОДИФИКАТОРОВ И РАСЧЁТ ХАРАКТЕРИСТИК ---------- */
/* Сумка хранит по каждому стату три накопителя: flat, inc, more.
   Итог = (База + Σflat) × (1 + Σinc/100) × Π(1 + more_i/100)         */
function Bag(){ this.s = {}; }
Bag.prototype.get = function(k){ return this.s[k] || (this.s[k] = {flat:0, inc:0, more:1}); };
Bag.prototype.add = function(k, kind, v){
  const e = this.get(k);
  if (kind === 'more') e.more *= (1 + v/100);       // more перемножается — самый ценный тип
  else if (kind === 'inc') e.inc += v;              // inc складывается в один множитель
  else e.flat += v;                                  // flat и chance просто суммируются
};
Bag.prototype.calc = function(k, base){             // финальная формула из каталога
  const e = this.s[k]; if (!e) return base;
  return (base + e.flat) * (1 + e.inc/100) * e.more;
};
Bag.prototype.flat = function(k){ return this.s[k] ? this.s[k].flat : 0; };
/* sum() — для статов, которые в каталоге объявлены только как inc (или только flat):
   движку нужно одно число, а не разделение на базу и процент. */
Bag.prototype.sum  = function(k){ const e = this.s[k]; return e ? e.flat + e.inc : 0; };
Bag.prototype.has  = function(k){ return this.flat(k) > 0; };

   storage-API артефактов → localStorage → память на время вкладки.
   Игра работает в любом случае, разница только в том, переживёт ли банк перезагрузку. */
const STORE_KEY = 'grinder_meta_reset_2026'; // полный сброс: прежний банк и все покупки больше не читаются
const Store = {
  data: {gold:0, spent:0, best:0, unlocks:{}, shop:{}, economy:3},
  mode: 'память',
  async load(){
    try{
      const r = await window.storage.get(STORE_KEY);
      if (r && r.value) this.data = Object.assign(this.data, JSON.parse(r.value));
      if (this.data.economy !== 3){ this.data.gold = 0; this.data.spent = 0; this.data.shop = {}; this.data.economy = 3; await this.save(); }
      this.mode = 'облако'; return;
    }catch(e){}
    try{
      const v = localStorage.getItem(STORE_KEY);
      if (v) this.data = Object.assign(this.data, JSON.parse(v));
      if (this.data.economy !== 3){ this.data.gold = 0; this.data.spent = 0; this.data.shop = {}; this.data.economy = 3; await this.save(); }
      this.mode = 'браузер'; return;
    }catch(e){}
  },
  async save(){
    const j = JSON.stringify(this.data);
    try{ await window.storage.set(STORE_KEY, j); return; }catch(e){}
    try{ localStorage.setItem(STORE_KEY, j); }catch(e){}
  },
};

const shopLvl = id => (Store.data.shop && Store.data.shop[id]) || 0;

/* Цена следующего уровня. Округляем до трёх значащих цифр — «106 000» читается,
   «105 993» нет, а на баланс разница в четверть процента не влияет. */
function shopCost(it, lvl){
  const raw = it.base * Math.pow(it.grow, lvl);
  const p = Math.pow(10, Math.max(0, Math.floor(Math.log10(raw)) - 2));
  return Math.round(raw / p) * p;
}
/* Цена пачки из n уровней подряд, начиная с текущего. */
function shopBatch(it, n){
  let lvl = shopLvl(it.id), sum = 0, cnt = 0;
  for (let i = 0; i < n && lvl < it.max; i++, lvl++){ sum += shopCost(it, lvl); cnt++; }
  return {sum, cnt};
}

/* Единственная точка, где покупки превращаются в характеристики.
   Всё идёт через сумку: движку не нужно знать, откуда взялся процент. */
function shopApply(bag){
  if (shopLvl('hpFlat')) bag.add('life', 'flat', shopLvl('hpFlat'));
  if (shopLvl('hpPct'))  bag.add('life', 'inc',  shopLvl('hpPct'));
  if (shopLvl('dmg'))    bag.add('dmg',  'inc',  shopLvl('dmg'));
  if (shopLvl('aspd'))   bag.add('aspd', 'inc',  shopLvl('aspd'));
  if (shopLvl('mspd'))   bag.add('mspd', 'inc',  shopLvl('mspd'));
  if (shopLvl('regen'))  bag.add('regen', 'flat', shopLvl('regen'));
  if (shopLvl('armor'))  bag.add('armor', 'flat', shopLvl('armor'));
  if (shopLvl('dr'))     bag.add('dr', 'flat', shopLvl('dr'));
  if (shopLvl('drFlat')) bag.add('drFlat', 'flat', shopLvl('drFlat'));
  if (shopLvl('block'))  bag.add('block', 'flat', shopLvl('block'));
  if (shopLvl('dodge'))  bag.add('dodge', 'flat', shopLvl('dodge'));
  if (shopLvl('iframe')) bag.add('iframe', 'inc', shopLvl('iframe'));
  if (shopLvl('dashN'))  bag.add('dashN', 'flat', shopLvl('dashN'));
  if (shopLvl('dashCd')) bag.add('dashCd', 'inc', shopLvl('dashCd'));
  // Опыт и золото — обычные статы сумки, кладём туда же, где карточки и книги
  if (shopLvl('sxp'))    bag.add('xpGain',   'inc', shopLvl('sxp'));
  if (shopLvl('sgold'))  bag.add('goldFind', 'inc', shopLvl('sgold'));
  // Броня и плотность врагов своего стата в сумке не имеют — их читает recalc()
}

let D = {};
function recalc(){
  const b = G.bag, w = G.weapon;
  const glass  = b.has('kGlass'),  noCrit = b.has('kNoCrit'), heavy = b.has('kHeavy');
  const flurry = b.has('kFlurry'), acro   = b.has('kAcro');
  const unburd = b.has('kUnburd');

  // --- Живучесть ---
  D.life   = b.calc('life', 100 + G.lvl*8) * (glass ? 0.6 : 1);
  D.regen  = b.calc('regen', 0) + D.life * b.flat('regenPct')/100;
  D.armor  = unburd ? 0 : b.calc('armor', 0) + (amu('golem') ? 50 : 0);
  D.dr     = clamp(b.flat('dr'), 0, 60);
  // Магазинная броня — ОТДЕЛЬНЫЙ множитель, а не слагаемое к D.dr. Сложение
  // упёрлось бы в 130% при полной прокачке, то есть в неуязвимость и деление
  // на ноль в балансе. Перемножение даёт 0.40 * 0.30 = 0.12, то есть 88%
  // снижения на пределе — много, но конечно.
  D.drShop = shopLvl('sarmor');
  D.drFlat = b.flat('drFlat');
  D.block  = acro ? 0 : clamp(b.flat('block'), 0, 60);
  D.dodge  = clamp(b.flat('dodge') * (acro ? 2 : 1), 0, 70);
  D.thorns = clamp(b.flat('thorns'), 0, 40);            // потолок шипов, дальше — отражение
  D.reflect= b.flat('reflect');
  // Клык вампира прибавляется ПОСЛЕ потолка: иначе амулет не делал бы ничего
  // тому, кто уже упёрся в 25%, а это ровно тот билд, который его и ищет
  D.leechBase   = clamp(b.flat('leech'), 0, 25) + (amu('fang') ? 4 : 0);
  D.leech       = D.leechBase;
  /* УЖАСАЮЩИЙ ВАМПИР перекрывает всё разом: и вампиризм, и лечение.
     Реализован одним флагом, который читают ровно два места — эта строка
     и heal(). Гасить каждый источник лечения по отдельности (клык, чаша,
     пепел, зачистка этажа, регенерация, книги) означало бы пятнадцать
     проверок, из которых новый источник обязательно забыли бы добавить. */
  D.dread       = b.has('kDread');
  if (D.dread) D.leech = 0.3;
  D.leechInstant= b.has('leechInstant');
  D.onKill = b.flat('onKill'); D.onHit = b.flat('onHit'); D.onCrit = b.flat('onCrit');

  // --- Урон: база оружия + стихии, всё по формуле каталога ---
  D.incAll = (b.s.dmg ? b.s.dmg.inc : 0) + (w.type==='melee'? b.sum('dmgMelee') : 0)
           + (w.type!=='melee'? b.sum('dmgProj') : 0) + (w.type==='orb'? b.sum('dmgAoe') : 0);
  D.moreAll = (b.s.dmg ? b.s.dmg.more : 1) * (glass?1.6:1) * (noCrit?1.5:1) * (heavy?4:1) * (flurry?0.5:1);

  const phys = w.dmg[0] + G.lvl*0.9 + b.flat('dmg');
  const physMax = w.dmg[1] + G.lvl*1.4 + b.flat('dmg');
  D.baseMin = phys;  D.baseMax = physMax;
  // Разброс сужается модификатором dmg.range_narrow
  if (b.has('armorDmg')){ D.baseMin += D.armor*0.12; D.baseMax += D.armor*0.12; }  // conv.armor_damage
  const nr = clamp(b.sum('narrow'),0,80)/100;
  const mid = (D.baseMin+D.baseMax)/2;
  D.baseMin += (mid-D.baseMin)*nr; D.baseMax -= (D.baseMax-mid)*nr;

  // Книги — отдельный источник флэт-урона: сумка их не хранит, чтобы тир можно было поднимать
  const bk = k => (G.items && G.items[k]) ? G.items[k].val : 0;
  // Амулеты стихий кладутся в тот же процент, что и карточки: «+35% к огню»
  // с амулета и с карточки обязаны быть неотличимы, иначе появится вторая формула
  // Корона пепла бьёт по всем четырём стихиям сразу, поэтому кладётся в каждую
  const aAll  = amu('crown') ? 50 : 0;
  const aFire = (amu('ash') ? 35 : 0) + aAll, aCold = (amu('ice') ? 35 : 0) + aAll,
        aPoi  = (amu('plague') ? 35 : 0) + aAll, aLit = aAll;
  D.elem = {                                          // каждая стихия считается отдельно
    fire: (b.flat('dFire') + bk('fire')) * (1 + (b.sum('iFire')+aFire)/100),
    cold: (b.flat('dCold') + bk('cold')) * (1 + (b.sum('iCold')+aCold)/100),
    lit:   b.flat('dLit')               * (1 + (b.sum('iLit') +aLit )/100),
    poi:   b.flat('dPoi')               * (1 + (b.sum('iPoi') +aPoi )/100),
  };

  // --- Криты ---
  D.critCh  = noCrit ? 0 : clamp(b.calc('critCh', 5), 0, 100);
  D.superCh = clamp(b.flat('superCh'), 0, 100);
  D.critMul = 150 + b.flat('critMul');

  // --- Скорости ---
  /* Два талисмана разгона. Считаются здесь, вместе с прочими множителями
     скорости, а не отдельной поправкой в бою: свита наследует обе скорости
     хозяина целиком, и это единственный способ разогнать её заодно,
     не дублируя одно и то же правило в трёх местах. */
  const P = G.player;
  const rush = (amu('swift') && P && P.swiftT > 0 ? 1.20 : 1)
             * (amu('survive') && P && P.hp/Math.max(1, D.life) < 0.30 ? 1.20 : 1);
  /* Разгон движения: считается ЗДЕСЬ, а не множителем в кадре. Раньше три
     источника (+40% после убийства, «Последний рывок», «Талисман бегуна»)
     умножались прямо в шаге игрока, а свита берёт долю от скорости хозяина —
     то есть от значения ДО них, и не разгонялась вообще. Теперь всё в одном месте,
     и приспешники едут вместе с хозяином без отдельного правила. */
  const dash = (P && P.spdKill > 0 ? 1.40 : 1)
             * (amu('runner') && P && P.moving ? 1.20 : 1);
  D.aspd  = b.calc('aspd', 1) * (heavy?0.5:1) * (flurry?2:1) * (unburd?1.25:1)
          * (amu('clock') ? 1.10 : 1) * (amu('claws') ? 1.20 : 1) * (amu('brute') ? 0.90 : 1)
          * rush;
  D.mspd  = b.calc('mspd', 235) * (acro?1.15:1) * (unburd?1.35:1) * rush * dash;

  // --- Геометрия ---
  D.projN   = 1 + Math.round(b.flat('projN'));
  D.pierce  = Math.round(b.flat('pierce'));
  D.chain   = Math.round(b.flat('chain')) + (amu('ricochet') ? 1 : 0);
  D.ricochet= Math.round(b.flat('ricochet'));
  D.homing  = b.sum('homing')/100;
  D.projSpd = (1 + b.sum('projSpd')/100) * (amu('arrow') ? 1.5 : 1);
  D.projSize= 1 + b.sum('projSize')/100;
  D.aoeR    = 1 + b.sum('aoeR')/100;
  if (b.has('aoeToDmg')) D.incAll += (D.aoeR-1)*60;      // conv.aoe_to_damage
  // Площадные радиусы: считаются здесь один раз на смену билда, а не в кадре
  D.shockR     = SHOCK_RANGE    * D.aoeR;   // разлёт молний при шоке
  D.chillAuraR = CHILL_AURA_R   * D.aoeR;   // вязкость вокруг охлаждённого
  D.slowAuraR  = SLOW_AURA_BASE * D.aoeR;   // аура замедления врагов
  D.infernoR   = INFERNO_BASE   * D.aoeR;   // перекидывание поджога
  D.arc     = 1 + b.sum('arc')/100;
  D.orbitN      = clamp(Math.round(b.flat('orbit')), 0, 10);   // круговые орбы, потолок 10
  D.explode     = clamp(b.flat('explode') + (b.has('kVolat') ? 100 : 0), 0, 100);
  D.explodeMega = clamp(b.flat('explodeMega'), 0, 100);
  D.dblHit  = clamp(b.flat('dblHit'), 0, 100);
  D.triHit  = clamp(b.flat('triHit'), 0, 100);
  D.shotgun = b.has('shotgun'); D.chainKeep = b.has('chainKeep'); D.pierceBonus = b.has('pierceBonus');

  // --- Прочее ---
  D.pickup  = b.calc('pickup', 70) * (amu('looter') ? 5 : 1);
  D.lootVacuum = 1 + shopLvl('vacuum') * 0.20;
  D.lootPickup = D.pickup * D.lootVacuum;
  D.lootPull   = 340 * D.lootVacuum;
  D.xpGain  = 1 + b.sum('xpGain')/100;
  D.goldFind= 1 + b.sum('goldFind')/100;
  // Книга крови: N% от автоатаки в секунду. avgHit уже содержит все проценты,
  // поэтому отдельно домножать не нужно — иначе получится двойной скейл.
  D.bookBleedDps = 0;                                  // считается ниже, после avgHit
  D.monsterMore  = (1 + ((G.items && G.items.monster) ? G.items.monster.val : 0)/100)
                 * (amu('candle') ? 1.20 : 1)
                 * (1 + shopLvl('smon')/100);
  if (G.items && G.items.xp) D.xpGain += G.items.xp.val/100;
  if (amu('candle')) D.xpGain += 0.15;
  D.dashMax = clamp(1 + Math.round(b.flat('dashN')), 1, 3);
  D.dashDmg = b.has('dashDmg'); D.phasing = b.has('phasing');
  D.dashCd  = 1.4 * (1 - clamp(b.sum('dashCd'),0,60)/100);
  D.iframe  = 0.22 * (1 + b.sum('iframe')/100);
  D.igniteCh = clamp(b.flat('igniteCh'), 0, 100);       // потолки статусов — иначе ветки не откроются
  D.chillCh  = clamp(b.flat('chillCh'),  0, 100);
  D.poiCh    = clamp(b.flat('poiCh'),    0, 100);
  D.knock    = clamp(b.flat('knock') + (amu('brute') ? 50 : 0), 0, 100);
  D.knockPow = amu('brute') ? 1.5 : 1;                 // сила толчка отдельно от шанса
  D.inferno  = b.has('inferno'); D.freeze = b.has('freeze');
  D.radiation= b.has('radiation'); D.dizzy = b.has('dizzy');
  D.ailEff  = 1 + b.sum('ailEff')/100;
  D.ailDur  = 1 + b.sum('ailDur')/100;
  D.freezeDur = amu('ice') ? 1.4 : 1;        // ледяной кристалл продлевает только заморозку
  // Яд из книги обязан оставаться актуальным на любом этаже, поэтому скейлится полностью.
  // Стоит ИМЕННО ЗДЕСЬ, а не выше среди прочего: D — объект живучий, и расчёт,
  // стоявший до присвоения D.ailEff, брал значение с прошлого пересчёта. «+100% к силе
  // эффектов» с книгой яда давало 12 урона в секунду вместо 24, и выправлялось только
  // следующей взятой карточкой. Любую новую строку с D.ailEff/D.ailDur держать ниже этой.
  D.bookPoiDps = (G.items && G.items.poison)
    ? G.items.poison.val * 4 * (1 + (b.sum('iPoi')+aPoi)/100) * (1 + D.incAll/100) * D.moreAll * D.ailEff
    : 0;
  D.atkCd   = w.cd / D.aspd;

  // --- Свита: считается по той же формуле, наследование берёт % от ваших статов ---
  D.hasMin    = !!w.minions;
  D.minInherit= b.flat('minInherit')/100;
  D.minTier   = b.has('minTier');
  D.maxSkel   = D.hasMin ? clamp(3 + Math.round(b.flat('minCount')), 0, 6) : 0;
  D.maxHunt   = D.hasMin ? clamp(Math.round(b.flat('minHunt')), 0, 6) : 0;
  D.maxWarl   = D.hasMin ? clamp(Math.round(b.flat('minWarl')), 0, 6) : 0;
  D.golemB    = D.hasMin ? clamp(Math.round(b.flat('golemBlood')), 0, 10) : 0;
  D.golemN    = D.hasMin ? clamp(Math.round(b.flat('golemBone')),  0, 10) : 0;
  D.minMax    = D.maxSkel + D.maxHunt + D.maxWarl + (D.golemB?1:0) + (D.golemN?1:0);
  D.minDmgMul = 0.42 * (1 + b.sum('minDmg')/100) * (1 + D.minInherit) * (b.has('kBond') ? 1.5 : 1)
                * (D.minTier ? 1.45 : 1);
  /* ГОЛЕМ КРОВИ. На первом уровне бьёт вдвое реже скелета и втрое сильнее,
     дальше растёт урон и понемногу темп. Считается от D.minDmgMul, поэтому
     вбирает все карточки урона свиты, наследование и «Кровные узы».
     Раньше урон был 0.08 * уровень от avgHit() мимо множителя свиты — на
     десятом уровне это давало 0.92 от одного скелета, то есть десять карточек
     были слабее одного бесплатного приспешника. */
  D.golemBMul = D.golemB ? 3 * D.minDmgMul * (1 + 0.35*(D.golemB-1)) : 0;
  D.golemBCd  = D.golemB ? 1.0 / (1 + 0.05*(D.golemB-1)) : 1.0;
  D.minLifeRaw = b.sum('minLife');            // порог для «Вампиров хозяина»
  D.minDmgRaw  = b.sum('minDmg');             // порог для «Буйства демонов»
  D.minFrenzy  = b.has('minFrenzy');
  D.minSpdRaw  = b.sum('minSpd');             // порог для карточек переноса
  D.minAspdRaw = b.sum('minAspd');            // порог для карточек когтей
  D.minClaws   = b.has('minClaws');
  D.minWhirl   = b.has('minWhirl');
  /* Перенос свиты. Астральный набег ЗАМЕНЯЕТ внезапный взрыв, а не складывается
     с ним: два независимых таймера означали бы, что приспешник телепортируется
     дважды подряд и половина переносов уходит впустую. Поэтому одна механика
     с тремя числами, которые задаёт старшая из взятых карточек. */
  D.minBlink   = b.has('minRaid') ? {cd:4,  mul:0.50, r:100}
               : b.has('minBlink') ? {cd:10, mul:0.30, r:60}
               : null;
  D.minBath    = b.has('minBath');
  D.minBoil    = b.has('minBoil');
  D.minVamp   = b.has('minVamp') ? 25 : 0;    // % урона свиты, уходящий ей же в здоровье
  /* Здоровье свиты растёт по этажу тем же множителем, что и у врагов.
     Замер до правки: на 5 этаже жило 5.7 приспешника из 6, на 10-м — 0.1,
     дальше ноль. Линейный рост (30 + уровень*2.6) против здоровья врагов
     на 14% за этаж означал, что армия перестаёт существовать между пятым
     и десятым этажом, и весь класс держался на одном хозяине. */
  D.minLife   = (30 + G.lvl*2.6) * hpScale(G.floor) * (1 + b.sum('minLife')/100) * (D.minTier ? 1.6 : 1)
                + D.life * D.minInherit * 0.25;
  /* База скорости свиты. Бег: было 305 против 235 у игрока — приспешник еле
     обгонял хозяина и в бою плёлся сзади, не успевая добежать до цели и вернуться.
     Скорость атаки — чистый множитель к откатам ниже, а сами откаты приведены
     к тому, что скелет бьёт ровно дважды в секунду на старте. Множитель 1.5,
     которым это делалось раньше, убран: числа в цикле теперь честные секунды,
     и «0.5» читается как полсекунды, а не как «0.78, делённое на полтора». */
  /* Свита наследует скорости хозяина ЦЕЛИКОМ и без всяких условий: если игрок
     разогнался, армия разгоняется вместе с ним. Карточка «Свита наследует %
     ваших статов» тут ни при чём — она про урон, здоровье и крит.
     Обрати внимание: сюда заходит и D.aspd целиком, то есть кейстоуны тоже.
     «Тяжёлый удар» (вдвое медленнее) замедлит и свиту, «Шквал» — ускорит. */
  D.minAspd   = (1 + b.sum('minAspd')/100) * D.aspd;
  D.skelAspd  = amu('warskel') ? 1.25 : 1;      // БОЕВЫЕ СКЕЛЕТЫ: только рядовые скелеты
  D.minSpd    = 610 * (1 + b.sum('minSpd')/100) * (D.mspd/235);
  /* Шанс крита свиты. Раньше твой собственный шанс доходил до приспешников
     только через карточку наследования, то есть обе критовые ветки при её
     отсутствии не давали свите ровно ничего — а у некроманта свита и есть
     основной урон. Теперь твой шанс наследуется ЦЕЛИКОМ, как обе скорости,
     а карточка наследования сверх этого добавляет свою долю. */
  D.minCrit   = clamp(b.sum('minCrit') + D.critCh * (1 + D.minInherit), 0, 100);
  /* Воскрешение фиксированное для всех: скелетов, охотников, колдунов, големов.
     Раньше было 5 секунд с карточкой на ускорение, и карточка почти не работала:
     подъём из трупа шёл за 0.4 сек мимо неё, а «пустой» подъём нужен ровно тогда,
     когда убивать некого. Замер показывал разницу только на пятом этаже,
     дальше свиту выкашивали быстрее, чем она вставала при любой скорости. */
  D.minRevive = 0.25;
  D.minBoom   = b.has('minBoom');
  D.minTaunt  = b.has('minTaunt');
  D.minLeech  = b.flat('minLeech');
  /* Ветка перехвата качается до 50% — своим потолком, отдельно от кейстоуна.
     Раньше был общий потолок 75 без своего: из-за диапазона 20-35 за карточку
     ветка закрывалась двумя-тремя взятиями и никакой прокачки не получалось.
     Теперь шаг 8-14, то есть на 50% уходит четыре-пять карточек. */
  D.minBondRaw = clamp(b.flat('minBond'), 0, 50);
  D.minBond   = clamp(D.minBondRaw + (b.has('kBond') ? 40 : 0), 0, 75);
  D.bloodTies = b.has('bloodTies');

  if (G.player) G.player.hp = Math.min(G.player.hp, D.life);
}

/* Урон кровотечения из книги. Отдельной функцией, потому что зависит от avgHit(),
   а тот сам читает D — прямой расчёт внутри recalc дал бы циклическую ссылку. */
function bookBleedDps(){
  return (G.items && G.items.bleed) ? avgHit() * (G.items.bleed.val/100) * D.ailEff : 0;
}

/* Оценка среднего урона за удар — для строки ДПС в интерфейсе */
function avgHit(){
  const base = (D.baseMin+D.baseMax)/2;
  const el = D.elem.fire+D.elem.cold+D.elem.lit+D.elem.poi;
  const raw = (base+el) * (1 + D.incAll/100) * D.moreAll;
  const crit = 1 + (D.critCh/100) * (D.critMul/100 - 1);
  return raw * crit;
}

/* ---------- 5. ГЕНЕРАЦИЯ ЭТАЖА ---------- */
const ETYPES = {
  blob:  {shape:'circle',  nm:'Слизень',  hp:22,  spd:78,  dmg:9,  r:14, col:'#5ec2e0', xp:4},
  runner:{shape:'triangle',nm:'Бегун',    hp:14,  spd:158, dmg:7,  r:12, col:'#8be04e', xp:5},
  tank:  {shape:'square',  nm:'Глыба',    hp:70,  spd:48,  dmg:18, r:19, col:'#e0743c', xp:9},
  shooter:{shape:'diamond',nm:'Стрелок',  hp:20,  spd:62,  dmg:11, r:14, col:'#d95ec2', xp:8, ranged:true},
};

/* ---------- 5b. АФФИКСЫ МИНИ-БОССОВ ----------
   Мини-босс появляется каждый пятый этаж. Сам по себе он просто крупный враг
   с большим запасом здоровья — драки не получается, потому что решение у игрока
   ровно одно: где стоять. Аффиксы существуют затем, чтобы менять ответ именно
   на этот вопрос, а не добавлять боссу цифр.

   Формат записи:
     id    — ключ, по нему же хранится таймер в e.affT
     nm    — короткая метка для имени и подписи под здоровьем
     col   — цвет ауры и телеграфа
     nt    — что делает, человеческим языком (уходит в тост)
     init  — разовая правка врага при появлении
     tick  — поведение в кадре; вернуть true, если аффикс забрал себе движение
*/

/* Сколько аффиксов вешать: один с пятого этажа, два с пятнадцатого, три с тридцатого */
function affixCount(f){ return f >= 30 ? 3 : f >= 15 ? 2 : 1; }

function applyAffixes(e, f){
  const pool = BOSS_AFFIXES.slice();
  const n = Math.min(affixCount(f), pool.length);
  for (let i = 0; i < n; i++){
    const a = pool.splice(Math.floor(Math.random()*pool.length), 1)[0];
    e.aff.push(a);
    if (a.init) a.init(e);
  }
  // Имя собирается из меток, а не из прилагательных: «оберег огня» согласовать
  // с «Глыбой» по роду невозможно, а список меток читается одинаково для всех.
  const EL = {fire:'огня', cold:'льда', lit:'молний', poi:'яда'};
  e.affNm = e.aff.map(a => a.id === 'ward' ? 'оберег ' + EL[e.ward] : a.nm).join(' · ');
}

/* Общее снижение входящего урона у врага: обычная броня плюс панцирь.
   Вынесено отдельно, потому что путей урона два — игрок и свита. */
function mitigate(e, total){
  total *= 1 - e.armor/(e.armor + 60);
  if (e.bulwark) total *= total / (total + e.bulwark);
  if (e.pack) total = packTaken(e, total);      // броня пачки, связь, кровная связь
  return total;
}

/* Прогон аффиксов в кадре. true означает, что движение врага забрал аффикс. */
function tickAffixes(e, dt, tgt, edmg){
  let lock = false;
  for (const a of e.aff) if (a.tick && a.tick(e, dt, tgt, edmg)) lock = true;
  return lock;
}

/* ---------- 5c. ПАЧКИ ЭЛИТЫ ----------
   Пачка — это группа элитных монстров, которые появляются вместе и делят
   между собой набор аффиксов. Отличие от мини-босса принципиальное: у босса
   аффикс меняет поведение одной крупной цели, у пачки — задаёт порядок,
   в котором цели надо убивать. Отсюда роли: маяк, матка, командир, авангард —
   всё это ответ на вопрос «кого первым», а не «куда встать».

   Формат записи (все поля кроме id/nm/col/nt необязательны):
     role       — аффикс требует одного носителя; движок сам выберет монстра
     initRole   — разовая правка носителя роли
     init       — разовая правка каждого монстра пачки
     tick       — поведение монстра в кадре; true забирает движение себе
     packTick   — поведение пачки целиком, один раз за кадр
     spd/dmg/aspd — множители в кадре, функция (монстр, пачка)
     taken      — правка входящего урона, функция (монстр, урон) -> урон
     dealt      — урон прошёл по игроку, функция (пачка, величина)
     onDeath    — монстр пачки погиб
*/
const healEnemy = (e, v) => { if (!e.dead) e.hp = Math.min(e.maxHp, e.hp + v); };

/* Потолок на суммарное лечение пачки, доля здоровья в секунду.
   Замер на этаже 51 (10 аффиксов): три лечащих аффикса складывались в 6%/сек
   при том, что урон, растекающийся по пятерым, доходит до одного монстра
   примерно как 3%/сек — пачка становилась буквально неубиваемой (прогон
   упирался в потолок 300 сек, не сняв и половины). Со всеми аффиксами, кроме
   лечащих, тот же прогон давал ×3.8 запаса, то есть тяжело, но конечно.
   Поэтому источники складываются, а итог режется одним числом. */
const PACK_REGEN_CAP = 0.025;
/* Аффиксы не лечат напрямую, а копят проценты за кадр — иначе потолок
   пришлось бы знать каждому из них по отдельности. */
const packRegen = (e, pct) => { e.regPct = (e.regPct || 0) + pct; };
const packRole  = (pk, role) => { const m = pk.role[role]; return (m && !m.dead) ? m : null; };
const packLive  = pk => pk.members.filter(m => !m.dead);

    dmg:e => e.madDmg || 1 },
];

/* Сколько аффиксов у пачки: по одному на каждые пять этажей. */
function packAffixCount(f){
  // Маска босса добавляет аффикс всем последующим пачкам — предмет находится
  // посреди партии, а пачка собирается на входе в этаж, значит действует со следующего
  const bonus = (G && G.amu && G.amu.bmask) ? 1 : 0;
  return Math.min(Math.floor(f/5) + bonus, PACK_AFFIXES.length);
}

const PACK_COLS = ['#d95ec2','#5ec2e0','#8be04e','#ffb340','#c08cff','#ff5a4e'];

function spawnPack(f){
  const n = 4 + (f >= 20 ? 1 : 0) + (f >= 40 ? 1 : 0);
  const pk = {aff:[], has:{}, role:{}, members:[], nm:'', col:pick(PACK_COLS)};
  // Пачка выходит кучей из одной точки: в этом весь смысл ролей — если бы
  // монстры расползлись по арене, маяк и командир не встретились бы со своими.
  const ang = rnd(0, Math.PI*2), rad = rnd(520, 700), p = G.player;
  const cx = clamp(p.x + Math.cos(ang)*rad, -ARENA+80, ARENA-80);
  const cy = clamp(p.y + Math.sin(ang)*rad, -ARENA+80, ARENA-80);
  for (let i = 0; i < n; i++){
    const e = spawnEnemy('pack');
    e.x = clamp(cx + rnd(-46,46), -ARENA+40, ARENA-40);
    e.y = clamp(cy + rnd(-46,46), -ARENA+40, ARENA-40);
    e.pack = pk; pk.members.push(e);
  }
  applyPackAffixes(pk, f);
  G.packs.push(pk);
  return pk;
}

function applyPackAffixes(pk, f){
  const pool = PACK_AFFIXES.slice();
  const n = packAffixCount(f);
  for (let i = 0; i < n && pool.length; i++)
    pk.aff.push(pool.splice(Math.floor(Math.random()*pool.length), 1)[0]);
  for (const a of pk.aff) pk.has[a.id] = true;
  // Роли раздаём тому, у кого их меньше. Если ролей больше, чем монстров,
  // один тащит несколько — это честнее, чем молча потерять аффикс.
  for (const a of pk.aff){
    if (!a.role) continue;
    const m = pk.members.slice().sort((x,y)=> x.roles.length - y.roles.length)[0];
    if (!m) continue;
    m.roles.push(a.role); pk.role[a.role] = m;
    if (a.initRole) a.initRole(m, pk);
  }
  for (const a of pk.aff) if (a.init) for (const m of pk.members) a.init(m, pk);
  pk.nm = pk.aff.map(a => a.nm).join(' \u00B7 ');
}

/* Множители кадра. Все аффиксы собираются в одну функцию: иначе каждый лез бы
   в цикл врагов отдельной строчкой и цикл стало бы невозможно читать. */
function packMods(e){
  const pk = e.pack, m = {spd:1, dmg:1, aspd:1};
  for (const a of pk.aff){
    if (a.spd)  m.spd  *= a.spd(e, pk);
    if (a.dmg)  m.dmg  *= a.dmg(e, pk);
    if (a.aspd) m.aspd *= a.aspd(e, pk);
  }
  return m;
}

function packTick(e, dt, tgt, edmg){
  let lock = false;
  e.regPct = 0;
  for (const a of e.pack.aff) if (a.tick && a.tick(e, dt, tgt, edmg, e.pack)) lock = true;
  if (e.regPct) healEnemy(e, e.maxHp * Math.min(e.regPct, PACK_REGEN_CAP) * dt);
  return lock;
}

/* Правка входящего урона. Зовётся из mitigate(), то есть покрывает и удары
   игрока, и удары свиты — оба пути урона идут через неё. */
function packTaken(e, total){
  for (const a of e.pack.aff) if (a.taken) total = a.taken(e, total);
  return total;
}

/* Урон прошёл по игроку — сообщаем пачке (вампиры). */
function packDealt(pk, v){ if (pk) for (const a of pk.aff) if (a.dealt) a.dealt(pk, v); }

/* АВАНГАРД: часть попаданий по пачке уходит в передового вместо цели. */
function packRedirect(e){
  if (!e.pack || !e.pack.has.vanguard) return e;
  const v = packRole(e.pack, 'vanguard');
  if (!v || v === e || Math.random() > 0.35) return e;
  G.fx.push({t:'ring', x:v.x, y:v.y, r:v.r, max:v.r+9, life:0.16, col:'#9aa7b4'});
  return v;
}

/* Копия монстра: размножение и разделение. Поля со ссылками копируем вручную —
   Object.assign отдал бы детям те же объекты статусов, что и родителю. */
function packClone(src, {hp, r, dmg}){
  const c = Object.assign({}, src);
  c.ail = {chill:0, shock:0, stun:0, freeze:0, dizzy:0};
  c.dots = {fire:{dps:0,n:0,dur:3}, poison:{dps:0,n:0,dur:4}, bleed:{dps:0,n:0,dur:6}};
  c.dotAcc = {fire:0, poison:0, bleed:0};
  c.kb = {x:0, y:0}; c.roles = []; c.aff = [];
  c.dead = false; c.jumpTo = null; c.noBreed = true; c.didSplit = true;
  c.maxHp = Math.max(1, Math.round(src.maxHp*hp)); c.hp = c.maxHp;
  c.r = src.r*r; c.r0 = c.r; c.dmg = src.dmg*dmg;
  // Копии считаются рядовыми: иначе «размножение» превращалось бы в станок
  // по золоту — четыре элиты рожают восемь элитных выплат из воздуха.
  c.kind = 'norm'; c.xp = Math.max(1, Math.round(src.xp*0.3)); c.armor = 0;
  c.x = clamp(src.x + rnd(-26,26), -ARENA+40, ARENA-40);
  c.y = clamp(src.y + rnd(-26,26), -ARENA+40, ARENA-40);
  G.enemies.push(c);
  if (c.pack) c.pack.members.push(c);
  return c;
}

/* РАЗДЕЛЯЮЩИЕСЯ: на половине здоровья один жирный превращается в двух тощих. */
function packSplit(e){
  e.didSplit = true;
  const half = packClone(e, {hp:0.4, r:0.78, dmg:0.75});
  half.didSplit = true;
  e.maxHp = Math.max(1, Math.round(e.maxHp*0.4)); e.hp = e.maxHp;
  e.r *= 0.78; e.r0 = e.r; e.dmg *= 0.75;
  burst(e.x, e.y, 12, '#7fd6ff', 220, 3, 0.5);
}

/* Смерть монстра пачки: снимаем с учёта и запускаем предсмертные аффиксы. */
function packDeath(e){
  e.dead = true;
  const pk = e.pack;
  const i = pk.members.indexOf(e); if (i >= 0) pk.members.splice(i,1);
  for (const a of pk.aff) if (a.onDeath) a.onDeath(e, pk);
}

function buildFloor(){
  /* Пересчёт на входе в этаж. Раньше recalc() звался только при взятии карточки
     или книги, и этого хватало: от этажа не зависело ничего. Теперь от него
     зависит здоровье свиты, и без этой строки приспешники получали бы запас
     того этажа, на котором игрок последний раз брал уровень. */
  recalc();
  const f = G.floor;
  G.enemies.length = 0; G.eshots.length = 0; G.portal = null;
  G.pools.length = 0;                                // лужи смолы не переносятся между этажами
  G.trails.length = 0;
  G.boils.length = 0;
  G.packs.length = 0;
  G.banner = false;
  // Врагов на этаже: было 7 + этаж*2.4. Подняли до 4.0 — этаж стал длиннее,
  // а опыта, золота и находок с него больше. Это и есть замена силе удара.
  G.spawnQueue = Math.round((7 + Math.floor(f*4.0)) * D.monsterMore);   // книга монстров густит волны
  if (f % 5 === 0) G.spawnQueue += 4;                // на «боссовых» этажах гуще
  G.spawnT = 0;
  if (f % 5 === 0){
    const b = spawnEnemy('boss');                    // босс появляется сразу
    // Игрок обязан узнать про аффиксы до того, как получит ими по лицу
    toast('ЭТАЖ ' + f + '  ·  БОСС  ·  ' + b.affNm);
  } else if (packAffixCount(f) > 0){
    // Пачка выходит на этажах без босса: два таких события в одной комнате
    // не читаются — игрок не поймёт, кто именно его убил.
    const pk = spawnPack(f);
    G.spawnQueue = Math.max(4, G.spawnQueue - pk.members.length);   // общее население этажа держим прежним
    toast('ЭТАЖ ' + f + '  ·  ПАЧКА  ·  ' + pk.nm);
  } else toast('ЭТАЖ ' + f);
}

/* Масштабирование сложности: бесконечное, но плавное */
/* Здоровье врагов: было 1.185 за этаж. Замер силы игрока показал, что его урон
   в секунду растёт всего на 3.3% за этаж в среднем, а после двадцатого — на 1.5%:
   карточки складываются в общий процент и дают всё меньше относительной прибавки.
   Разрыв 18.5% против 3.3% и был настоящей стеной. При 1.08 разрыв падает
   до ~9.9% за этаж — сложность обгоняет игрока вдвое медленнее, чем при 1.185,
   но стена остаётся на месте и забег конечен.
   Осторожно с этой цифрой: она возводится в степень этажа, поэтому полпроцента
   на входе дают +45% здоровья на 30 этаже и +95% на 60-м. */
const hpScale  = f => Math.pow(1.14, f-1);
/* Урон врагов растёт на 14% за этаж по прямому запросу баланса.
   Это заметно выше почти линейного роста запаса игрока, поэтому после будущих
   изменений баланса глубину обязательно перепроверять ваншот-метрикой и ботом. */
const dmgScale = f => Math.pow(1.140, f-1);

function spawnEnemy(kind){
  const f = G.floor;
  let t, elite = false, boss = false;
  if (kind === 'boss'){ t = ETYPES.tank; boss = true; }
  else {
    const pool = ['blob','blob','runner'];
    if (f >= 2) pool.push('shooter');
    if (f >= 3) pool.push('tank','runner');
    t = ETYPES[pick(pool)];
    elite = kind === 'pack' || (f >= 3 && Math.random() < 0.10 + f*0.008);
  }
  const p = G.player;
  /* Точка появления. Было rnd(420,700) — на широком мониторе половина ширины
     экрана это 640, то есть враги проступали прямо на виду у игрока.
     Стало 650..950: на краю экрана и чуть за ним — видно, как подходят,
     но на голову не сваливаются. Проверенные 900..1250 давали десять секунд
     ходу и делали стрелковые классы вдвое живучее: половину волны успевали
     снять на подходе.

     Угол выбираем не случайно один раз, а лучшим из восьми: арена всего
     3000x3000, и у стены clamp() сплющивал бы все точки в край рядом с игроком.
     Берём тот из вариантов, который дальше всего от него. */
  let bx = 0, by = 0, bd = -1;
  for (let k = 0; k < 8; k++){
    const ang = rnd(0, Math.PI*2), rad = rnd(650, 950);
    const x = clamp(p.x + Math.cos(ang)*rad, -ARENA+40, ARENA-40);
    const y = clamp(p.y + Math.sin(ang)*rad, -ARENA+40, ARENA-40);
    const d = Math.hypot(x - p.x, y - p.y);
    if (d > bd){ bd = d; bx = x; by = y; }
    if (d > 620) break;                       // достаточно далеко — не перебираем дальше
  }
  /* Страховка на угол арены. Если игрок вжат в угол, все восемь бросков могут
     уйти в ту же четверть и склеиться clamp() у него под ногами: замер ловил
     появление в 57 единицах. Тогда отправляем врага в сторону центра арены —
     это направление всегда свободно, потому что игрок стоит у края. */
  if (bd < 520){
    const a2 = Math.atan2(-p.y, -p.x) + rnd(-0.7, 0.7);
    bx = clamp(p.x + Math.cos(a2)*760, -ARENA+40, ARENA-40);
    by = clamp(p.y + Math.sin(a2)*760, -ARENA+40, ARENA-40);
  }
  const e = {
    t, kind: boss?'boss':(elite?'elite':'norm'),
    x: bx, y: by,
    r: t.r * (boss?2.6:elite?1.45:1),
    hp:0, maxHp:0, spd:0, dmg:0, xp:0,
    cd: rnd(0.5,2), rot: rnd(0,6.28), hit:0, kb:{x:0,y:0},
    ail:{chill:0, shock:0, stun:0, freeze:0, dizzy:0}, armor:0, infT:0,
    dots:{fire:{dps:0,n:0,dur:3}, poison:{dps:0,n:0,dur:4}, bleed:{dps:0,n:0,dur:6}},
    dotAcc:{fire:0, poison:0, bleed:0}, dotT:0, orbCd:0,
    aff:[], affT:{}, affNm:'', ward:null, wardCol:null, bulwark:0,   // аффиксы мини-босса
    pack:null, roles:[], dead:false, rage:0, noDmgT:0, r0:0,         // пачка
    jumpTo:null, jumpT:0, didSplit:false, noBreed:false, madT:0, madA:0,
  };
  const mul = boss ? 14 : elite ? 3.2 : 1;
  e.maxHp = e.hp = Math.round(t.hp * mul * hpScale(f));
  // Прежние 1.265 дополнительно ускорены на 10%: кайт дороже для всех типов.
  e.spd = t.spd * 1.265 * 1.10 * (1 + G.bossKills*0.02) * (boss?1.15:elite?0.9:1);
  e.dmg = t.dmg * (boss?1.9:elite?1.3:1) * dmgScale(f);
  e.xp  = Math.round(t.xp * (boss?18:elite?4:1) * (1 + f*0.12));
  e.armor = elite||boss ? 8 + f*1.5 : 0;
  e.r0 = e.r;                            // исходный радиус: «безумные» его крутят
  if (boss) applyAffixes(e, f);          // аффиксы навешиваются после базовых чисел: панцирь режет уже готовое hp
  G.enemies.push(e);
  return e;
}

/* ---------- 6. НАНЕСЕНИЕ УРОНА ---------- */
/* Собирает все условные модификаторы в один процент и применяет формулу */
/* src — кто бьёт. Условия про состояние хозяина (движение, здоровье, недавнее
   убийство) остаются про хозяина: это его состояние, свита им пользуется.
   А вот условия про РАССТОЯНИЕ считаются от того, кто ударил: скелет в упор
   у врага на другом конце комнаты обязан получать «вблизи», а не «вдали». */
function conditionalInc(e, src){
  const b = G.bag, p = G.player, from = (src && src.minion) || p; let inc = 0;
  if (e.hp / e.maxHp < 0.35) inc += b.sum('vsLow');
  if (e.hp >= e.maxHp)       inc += b.sum('vsFull');
  if (e.kind !== 'norm')     inc += b.sum('vsBoss');
  if (p.moving)              inc += b.sum('whMove');
  if (p.stillT > 0.6)        inc += b.sum('whStill');
  if (amu('runner') && p.stillT > 1) inc += 20;         // талисман бегуна: награда за остановку
  // КОГТИ БЕРСЕРКА: по одному проценту за каждые полные 10% потерянного здоровья
  if (amu('claws')) inc += Math.floor((1 - p.hp/D.life) * 10);
  // КОЛЬЦО ДОБИВАНИЯ
  if (amu('exec') && e.hp/e.maxHp < 0.20) inc += 50;
  /* ТОТЕМЫ. Стоят здесь, а не в D.incAll, ровно потому, что процент условный:
     он смотрит на состояние цели. Заодно это значит, что тотемы работают
     и на удары свиты — conditionalInc общий для всех источников урона. */
  if (G.totems){
    if (e.dots.fire.dps   > 0) inc += totemVal('fire');
    if (e.ail.freeze      > 0) inc += totemVal('freeze');
    if (e.dots.poison.dps > 0) inc += totemVal('poison');
    if (e.dots.bleed.dps  > 0) inc += totemVal('blood');
  }
  // РАЗГОН: считаем полные двухсекундные отрезки непрерывного бега
  if (amu('momentum')) inc += Math.min(40, Math.floor(p.moveT/2)*4);
  // ОСАДНЫЙ ОГОНЬ: платой за +70% идёт половина скорости, см. движение игрока
  if (amu('siege') && p.stillT > 1.5) inc += 70;
  // ГЛАЗ ХИЩНИКА
  if (amu('predator') && p.predT > 0) inc += 20;
  // ОСКОЛОК БОССА: потолок в десять элит поставлен мной — без него комната
  // с элитной пачкой давала бы +100% и больше на ровном месте
  if (amu('shard')){
    let el = 0;
    for (const o of G.enemies) if (o.kind !== 'norm' && dist(o,p) < 250 && ++el >= 10) break;
    inc += el*5;
  }
  if (p.hp / D.life < 0.35)  inc += b.sum('whLow');
  if (p.killT > 0)           inc += b.sum('afterKill');
  const d = dist(from, e);
  if (d < 160) inc += b.sum('close');
  if (d > 330) inc += b.sum('far');
  const near = b.sum('perNear');
  if (near) inc += near * Math.min(8, G.enemies.filter(x => dist(x,from) < 220).length);
  const ramp = b.sum('ramp');
  if (ramp) inc += Math.min(40, ramp * p.combatT);
  return inc;
}

function damage(e, src){
  const b = G.bag, p = G.player;
  e = packRedirect(e);            // авангард может принять удар на себя вместо своего
  let base = rnd(D.baseMin, D.baseMax) * (src.mul || 1);
  if (b.has('lucky')) base = Math.max(base, rnd(D.baseMin, D.baseMax) * (src.mul||1));

  const el = D.elem;
  // ОБЕРЕГ: одна стихия срезается на 60% до всех умножений — то есть бьёт
  // ровно по флэту, который в этой системе и есть главный источник урона стихией
  const wd = e.ward ? 0.4 : 1;
  let total = (base
    + el.fire * (e.ward==='fire'?wd:1) + el.cold * (e.ward==='cold'?wd:1)
    + el.lit  * (e.ward==='lit' ?wd:1) + el.poi  * (e.ward==='poi' ?wd:1));
  total *= (1 + (D.incAll + conditionalInc(e, src))/100) * D.moreAll;

  // Крит: два ролла при crit.lucky, сверхкрит сверху.
  // У свиты свой шанс (D.minCrit), в который уже вложена доля наследования
  const critCh = src.minion ? D.minCrit : D.critCh;
  let isCrit = false;
  if (critCh > 0){
    isCrit = Math.random()*100 < critCh;
    if (!isCrit && b.has('critLucky')) isCrit = Math.random()*100 < critCh;
  }
  // КРИТИЧЕСКИЙ ПРИЦЕЛ и ЦЕПЬ КРИТОВ добавляют шанс поверх собранного
  let critBonus = 0;
  if (amu('critaim') && p.stillT > 1) critBonus += 25;
  if (amu('critchain')) critBonus += 10 * (p.critChain || 0);
  if (critBonus && !isCrit) isCrit = Math.random()*100 < critBonus;
  // ТРИЕДИНСТВО: три стихии на одной цели — крит без броска
  if (amu('trinity') && e.dots.fire.dps > 0 && e.ail.chill > 0 && e.dots.poison.dps > 0){
    isCrit = true; statusText(e, 'ТРИАДА', '#c08cff');
  }
  // Счётчик ударов один на всех: три предмета считают «каждый N-й», и если бы
  // каждый вёл свой счёт, их периоды зависели бы от того, в каком порядке найдены
  p.hitN = (p.hitN || 0) + 1;
  if (amu('bone') && p.hitN % 20 === 0){ isCrit = true; statusText(e, 'x20', '#ffd24a'); }
  if (isCrit){
    total *= D.critMul/100;
    if (Math.random()*100 < D.superCh){                          // СВЕРХКРИТ
      total *= 2;
      addBleed(e, total*0.03*D.ailEff);                          // 3% от удара в секунду, стакается
      burst(e.x, e.y, 8, '#e0405a', 200, 3, 0.5);
    }
    if (b.has('critWave')) nova(e.x, e.y, 90*D.aoeR, total*0.5, '#ffb340');
    if (D.onCrit) heal(D.onCrit);
    // КРИТИЧЕСКАЯ МАССА
    if (amu('critmass')) nova(e.x, e.y, 55*D.aoeR, total*0.5, '#ff9a2f');
    if (amu('critchain')) p.critChain = Math.min(3, (p.critChain||0) + 1);
  } else if (amu('critchain')) p.critChain = 0;   // цепь рвётся на первом же некрите
  // Урон в размере % от максимального HP цели — против «жирных»
  if (b.flat('pctHp')) total += e.maxHp * b.flat('pctHp')/100;
  // Шок увеличивает получаемый целью урон
  if (e.ail.shock > 0) total *= 1.30;
  // Охлаждение делает то же самое: раньше оно только замедляло, и вся ветка холода
  // была чистой утилитой при том, что заморозка открывается лишь на 100% охлаждения
  if (e.ail.chill > 0) total *= CHILL_TAKEN;
  // РУКА ПАЛАЧА: множитель поверх формулы, иначе удвоение растворилось бы
  if (amu('headsman') && e.hp/e.maxHp < 0.15) total *= 2;
  // КОНТРУДАР: заряд тратится на первый же удар игрока, свите не достаётся
  if (amu('riposte') && p.riposte && !src.minion){
    p.riposte = false; total *= 2.5;
    statusText(e, 'КОНТРУДАР', '#e0405a');
  }
  // КОЛЬЦО ДУЭЛИ: множитель именно more — он идёт поверх всей формулы,
  // иначе «x1.75» растворилось бы среди сотен процентов у собранного билда
  if (amu('duel')){
    let near = 0;
    for (const o of G.enemies) if (dist(o, p) < 300 && ++near > 1) break;
    if (near === 1) total *= 1.75;
  }
  // Броня и панцирь: единый путь снижения для игрока и свиты
  total = mitigate(e, total);
  // КОЛЬЦО СМЕРТИ: заряд копится убийствами и тратится на первую же цель
  if (amu('reaper') && p.reaper){
    p.reaper = false;
    statusText(e, 'СМЕРТЬ', '#9aa7b4');
    G.fx.push({t:'ring', x:e.x, y:e.y, r:e.r, max:e.r*3.4, life:0.45, col:'#9aa7b4'});
    total += e.hp;
  }

  applyDamage(e, total, isCrit);

  // Вампиризм и здоровье за попадание
  if (D.leech){                                                  // вампиризм: мгновенно или в пул
    const lv = total * D.leech/100;
    p.dreadLeech = true;                                         // единственный разрешённый канал
    if (D.leechInstant) heal(lv); else p.leechPool = (p.leechPool||0) + lv;
    p.dreadLeech = false;
  }
  if (D.onHit) heal(D.onHit);
  // ВАМПИРЫ ХОЗЯИНА: приспешник лечит сам себя и только себя
  if (src.minion && D.minVamp){
    const mm = src.minion;
    mm.hp = Math.min(mm.max, mm.hp + total*D.minVamp/100);
  }
  if (src.minion && D.minLeech) heal(total * D.minLeech/100);   // min.leech_to_owner

  applyBookAilments(e, total);                                   // книги действуют на каждом ударе

  // Наложение негативных эффектов
  const roll = v => Math.random()*100 < v;
  if (roll(D.igniteCh)){
    addDot(e, 'fire', total*0.25*D.ailEff, 3*D.ailDur);
    // ПЕРЕГРУЗКА: огонь по шокированному замыкает разряд
    if (amu('overload') && e.ail.shock > 0){
      shockBurst(e, total * SHOCK_SHARE * D.ailEff);
      G.fx.push({t:'ring', x:e.x, y:e.y, r:6, max:120*D.aoeR, life:0.3, col:'#ffe14a'});
    }
  }
  if (roll(D.chillCh)){
    if (e.ail.chill <= 0) statusText(e, 'SLOWED', '#ffe14a');
    e.ail.chill = Math.max(e.ail.chill, 2.5*D.ailDur);
    if (D.freeze){                                                        // ЗАМОРОЗКА
      if (e.ail.freeze <= 0) statusText(e, 'FROZEN', '#7fd6ff');
      e.ail.freeze = Math.max(e.ail.freeze, 1.4*D.ailDur*D.freezeDur);
    }
  }
  if (roll(b.flat('shockCh'))){
    e.ail.shock = Math.max(e.ail.shock, 3*D.ailDur);
    shockBurst(e, total * SHOCK_SHARE * D.ailEff);        // разряд по округе
  }
  if (roll(D.poiCh))                                                      // РАДИАЦИЯ: двойной стак
    addDot(e, 'poison', total*0.15*D.ailEff*(D.radiation?2:1), 4*D.ailDur);
  if (roll(b.flat('stun')))  e.ail.stun = 0.7 * D.ailDur;   // единственный статус, ходивший мимо длительности
  // ТАРАННАЯ ПЕРЧАТКА: свой толчок мимо шанса отбрасывания, каждый восьмой удар
  if (amu('shove') && p.hitN % 8 === 0){
    const from = src.minion || p;
    const a = Math.atan2(e.y-from.y, e.x-from.x);
    e.kb.x += Math.cos(a)*780; e.kb.y += Math.sin(a)*780;
    burst(e.x, e.y, 6, '#c08a3a', 220, 3, 0.4);
  }
  if (roll(D.knock)){
    const from = src.minion || p;               // толкает тот, кто ударил
    const a = Math.atan2(e.y-from.y, e.x-from.x);
    e.kb.x += Math.cos(a)*260*D.knockPow; e.kb.y += Math.sin(a)*260*D.knockPow;
    if (D.dizzy){                                                         // ГОЛОВОКРУЖЕНИЕ
      if (e.ail.dizzy <= 0) statusText(e, 'SLOWED', '#ffe14a');
      e.ail.dizzy = 2*D.ailDur;
    }
  }
  // Добивание: мгновенная смерть под порогом
  if (b.flat('execute') && e.kind==='norm' && e.hp/e.maxHp < b.flat('execute')/100) applyDamage(e, e.hp, false);
  // ПЕРЧАТКИ ГРОМА: свой период, но общий счётчик ударов
  if (amu('thunder') && p.hitN % 12 === 0){
    e.ail.shock = Math.max(e.ail.shock, 3*D.ailDur);
    shockBurst(e, total * SHOCK_SHARE * D.ailEff);
    G.fx.push({t:'bolt', x:p.x, y:p.y, x2:e.x, y2:e.y, life:0.18, col:'#ffe14a'});
  }
  // КОЛЬЦО ИМПУЛЬСА
  if (amu('pulse') && p.hitN % 8 === 0)
    nova(e.x, e.y, 130*D.aoeR, avgHit()*0.9, '#4fd1c5');
  // Двойное и тройное попадание
  if (!src.noDouble){
    // Метку приспешника обязательно тащим в добавочные удары: иначе двойной
    // удар свиты считался бы по криту игрока и лечил бы не того
    if (Math.random()*100 < D.dblHit) damage(e, {mul:(src.mul||1)*0.6, noDouble:true, minion:src.minion});
    if (Math.random()*100 < D.triHit) damage(e, {mul:(src.mul||1)*0.4, noDouble:true, minion:src.minion});
  }
}

function applyDamage(e, amount, crit, silent){
  e.hp -= amount; if (!silent) e.hit = 0.12;
  e.noDmgT = 0;                   // регенераторы считают время с последнего попадания
  if (!silent){
    G.fx.push({t:'num', x:e.x, y:e.y-e.r-6, v:Math.round(amount), life:0.65, crit});
    burst(e.x, e.y, crit ? 9 : 3, crit ? '#ffd24a' : e.t.col, crit ? 220 : 110, 3, 0.35);
  }
}

/* Шанс книги: 0.4% с рядового, впятеро с элиты, в сорок раз с мини-босса.
   Потолка тиров нет — на глубоких этажах книга продолжает расти. */
/* Одна проверка на находку, затем выбор категории. Амулеты не имеют своего
   ролла: иначе два независимых шанса разъезжались бы при любой правке дропа. */
function tryDropBook(e){
  const mult = e.kind === 'boss' ? 40 : e.kind === 'elite' ? 5 : 1;
  if (Math.random()*100 >= 0.4 * mult) return;
  dropItem(e);
}

/* Выбор категории находки. Отдельной функцией, потому что «Маска босса»
   вызывает её мимо ролла на шанс. */
function dropItem(e){
  // Ненайденные предметы, вес по редкости
  const pool = [];
  for (const k of AMU_KEYS){
    if (G.amu[k]) continue;
    if (AMULETS[k].minOnly && !G.weapon.minions) continue;   // предмет только для классов со свитой
    const w = [16, 10, 5, 2][AMULETS[k].rar];    // обычный, редкий, эпический, легендарный
    for (let i = 0; i < w; i++) pool.push(k);
  }
  // Тотемы, ещё не доросшие до великого
  const tot = TOTEM_KEYS.filter(k => totemTier(k) < 4);
  const r = Math.random();
  if (pool.length && r < AMU_SHARE)
    G.orbs.push({x:e.x, y:e.y, r:9, amu:pick(pool)});
  else if (tot.length && r < AMU_SHARE + TOTEM_SHARE)
    G.orbs.push({x:e.x, y:e.y, r:9, totem:pick(tot)});
  else
    G.orbs.push({x:e.x, y:e.y, r:9, book:pick(BOOK_KEYS)});
}

function takeTotem(key){
  const T = TOTEMS[key];
  const tier = Math.min(4, totemTier(key) + 1);
  const prev = totemVal(key);
  G.totems[key] = tier;
  recalc();
  const p = G.player;
  G.fx.push({t:'ring', x:p.x, y:p.y, r:10, max:150, life:0.6, col:T.col});
  burst(p.x, p.y, 40, T.col, 280, 4, 1.0);
  renderSheet();
  // Первый тотем объясняем окном, дальнейшие ранги — надписью без паузы:
  // ровно как с книгами, чтобы подъём не рвал темп боя.
  if (tier === 1) showTotemModal(key, prev);
  else pickupBanner(TOTEM_RANKS[tier-1] + ' ' + T.nm,
    '+' + TOTEM_VALS[tier-1] + '% урона по ' + T.st + '  ·  было +' + prev + '%', T.col);
}

function takeBook(key){
  const B = BOOKS[key], cur = G.items[key];
  const tier = cur ? cur.tier + 1 : 1;              // тиров бесконечно: дубликат всегда поднимает
  let val;
  if (tier <= B.tiers.length){                      // первые тиры берутся из таблицы
    const [lo, hi] = B.tiers[tier-1];
    val = lo === hi ? lo : Math.round(rnd(lo, hi));
    if (cur) val = Math.max(val, cur.val + 2);      // повышение обязано читаться
  } else {                                          // дальше растём шагом от достигнутого
    val = cur.val + Math.round(rnd(B.step[0], B.step[1]));
  }
  const prev = cur ? cur.val : 0;
  G.items[key] = {tier, val};
  recalc();
  const p = G.player;
  G.fx.push({t:'ring', x:p.x, y:p.y, r:10, max:160, life:0.6, col:B.col});
  burst(p.x, p.y, 50, B.col, 300, 5, 1.1);
  renderSheet();
  // Первая находка книги — полноценное окно с паузой: игрок должен прочитать,
  // что это вообще такое. Повторные — только объявление, бой не прерывается.
  if (tier === 1) showBookModal(key, prev);
  else {
    const unit = (B.pct || key === 'monster' || key === 'xp') ? '%' : '';
    pickupBanner(B.nm + ' ' + tier, '+' + val + unit +
      (prev ? '  ·  было +' + prev + unit : '') +
      (B.proc ? '  ·  срабатывание ' + bookChance(key) + '%' : ''), B.col);
  }
}

/* Сводка по всем книгам — что суммарно даёт коллекция */
function bookTotals(){
  const t = [];
  const bk = k => G.items[k] ? G.items[k].val : 0;
  if (bk('fire'))  t.push(['Флэт-урон огнём',  '+' + bk('fire')  + ' (в бою ' + D.elem.fire.toFixed(1) + ' после процентов)']);
  if (bk('cold'))  t.push(['Флэт-урон холодом','+' + bk('cold')  + ' (в бою ' + D.elem.cold.toFixed(1) + ')']);
  if (bk('poison'))t.push(['Отравление за прок', Math.round(D.bookPoiDps) + ' урона/сек, 3 сек']);
  if (bk('bleed')) t.push(['Кровотечение за прок', Math.round(bookBleedDps()) + ' урона/сек, 4 сек']);
  if (bk('monster'))t.push(['Плотность волн', '+' + bk('monster') + '% врагов']);
  if (bk('xp'))    t.push(['Получаемый опыт', '+' + bk('xp') + '%']);
  return t;
}

function killEnemy(e, i){
  const b = G.bag, p = G.player;
  e.dead = true;                   // свита держит цель между кадрами и должна знать, что она мертва
  if (e.kind === 'boss') G.bossKills++;
  if (e.pack) packDeath(e);        // до всего прочего: аффиксы пачки могут поднять новых врагов
  tryDropBook(e);
  // МЕШОК ОПЫТА: надбавка только за элиту и боссов
  const xpv = e.xp * (amu('xpbag') && e.kind !== 'norm' ? 1.5 : 1);
  G.orbs.push({x:e.x, y:e.y, v:xpv, r:4});                        // сфера опыта
  // Золото: монеты падают отдельно от опыта, крупные враги роняют горстью
  /* Золото за врага. Коэффициент при этаже срезан с 0.9 до 0.3, база поднята
     с 2 до 5. Причина: после смены скейлов игрок доходит до 60 этажа вместо 10,
     а населения на этаже вчетверо больше — доход за партию вырос с ~4 000 до
     700 000, и магазин на 322 млн выкупался за 400 партий вместо тысяч.
     Срезать один коэффициент было мало: он же кормит и ранние этажи, где
     игрок как раз и умирает. Поднятая база держит первые десять этажей почти
     на прежнем уровне (4 438 против 3 900), а глубина падает вдвое. */
  const gv = (5 + G.floor*0.3) * (e.kind === 'boss' ? 22 : e.kind === 'elite' ? 4.5 : 1) * D.goldFind
           * (amu('goldbag') && e.kind !== 'norm' ? 1.5 : 1);   // МЕШОК ЗОЛОТА: только крупные
  const coins = e.kind === 'boss' ? 6 : e.kind === 'elite' ? 2 : 1;
  for (let ci = 0; ci < coins; ci++)
    G.orbs.push({x:e.x + rnd(-12,12), y:e.y + rnd(-12,12), v:Math.max(1, Math.round(gv/coins*rnd(0.75,1.3))), r:4, gold:true});
  if (D.hasMin){
    G.corpses.push({x:e.x, y:e.y, life:14, big:e.kind !== 'norm'}); // труп — ресурс для призыва
  }
  // Счётчик убийств: на нём висят кольцо смерти и чаша крови
  p.kills = (p.kills || 0) + 1;
  if (amu('reaper') && p.kills % 100 === 0){
    p.reaper = true;
    G.fx.push({t:'txt', x:p.x, y:p.y-32, s:'КОЛЬЦО СМЕРТИ ГОТОВО', life:1.4, col:'#9aa7b4'});
  }
  if (amu('chalice') && p.kills % 50 === 0){
    heal(D.life);
    G.fx.push({t:'ring', x:p.x, y:p.y, r:10, max:150, life:0.6, col:'#e0405a'});
    G.fx.push({t:'txt', x:p.x, y:p.y-32, s:'ЧАША ПОЛНА', life:1.2, col:'#e0405a'});
  }
  // МАСКА БОССА: последний боец пачки роняет находку гарантированно.
  // Сундуков в игре нет, поэтому «дополнительный chest» — это принудительный дроп
  // из того же пула, что и обычные находки.
  if (amu('bmask') && e.pack && e.pack.members.length === 0) dropItem(e);
  if (D.onKill){
    heal(D.onKill);
    /* Свита лечится ТОЙ ЖЕ ДОЛЕЙ своего запаса, а не теми же очками.
       Плоские 5 хп для игрока с запасом 460 — это 1.1%, а для приспешника
       с 3544 — 0.14%, то есть карточка формально работала бы, а по факту
       не значила бы ничего. Доля переносит смысл карточки, а не её число. */
    const share = D.onKill / D.life;
    for (const mn of G.minions) mn.hp = Math.min(mn.max, mn.hp + mn.max*share);
  }
  // КЛЫК ВАМПИРА: крупная цель окупает подход вплотную
  if (amu('fang') && e.kind !== 'norm') heal(D.life*0.15);
  // ПЕПЕЛЬНОЕ СЕРДЦЕ: платит только за горящих, то есть за собранный билд огня
  if (amu('ash') && e.dots.fire.dps > 0) heal(D.life*0.01);
  // ЧУМНОЙ ЗУБ: яд не пропадает с трупом, а перепрыгивает на соседа
  if (amu('plague') && e.dots.poison.dps > 0 && Math.random() < 0.10){
    let best = null, bd = 260;
    for (const o of G.enemies){ if (o === e) continue; const d = dist(o,e); if (d < bd){ bd = d; best = o; } }
    if (best){
      addDot(best, 'poison', e.dots.poison.dps, e.dots.poison.dur + 2);
      G.fx.push({t:'ring', x:best.x, y:best.y, r:6, max:34, life:0.35, col:'#8be04e'});
    }
  }
  if (b.has('spdKill') || amu('sprint')) p.spdKill = 2;
  if (amu('predator')) p.predT = 2;              // ГЛАЗ ХИЩНИКА, продлевается каждым убийством
  // ТАЛИСМАН СКОРОСТИ: платит только за крупную цель
  if (amu('swift') && e.kind !== 'norm'){
    p.swiftT = 5; recalc();
    G.fx.push({t:'ring', x:p.x, y:p.y, r:p.r, max:64, life:0.4, col:'#4fd1c5'});
  }
  // ВАКУУМ: короткий подсос соседей к месту смерти
  if (amu('vacuum')){
    G.fx.push({t:'ring', x:e.x, y:e.y, r:110*D.aoeR, max:8, life:0.3, col:'#5ec2e0'});
    for (const o of G.enemies){
      const d = dist(o, e);
      if (d > 110*D.aoeR || d < 1) continue;
      const a = Math.atan2(e.y-o.y, e.x-o.x);
      o.kb.x += Math.cos(a)*190; o.kb.y += Math.sin(a)*190;
    }
  }
  p.killT = 3;
  if (b.has('novaKill')) nova(e.x, e.y, 110*D.aoeR, avgHit()*0.6, '#ffb340');
  if (Math.random()*100 < D.explode){
    // Мега-взрыв — отдельный ролл поверх сработавшего обычного
    const mega = D.explodeMega > 0 && Math.random()*100 < D.explodeMega;
    const dmgV = avgHit() * (mega ? 1.6 : 0.8);
    const rad  = 105 * D.aoeR * (mega ? 2 : 1);
    nova(e.x, e.y, rad, dmgV, mega ? '#ff7a2f' : '#e0743c',
         mega ? {ignite: dmgV*0.35*D.ailEff} : null);
    if (mega){                                                  // отдельная подача: гуще и ярче
      G.fx.push({t:'ring', x:e.x, y:e.y, r:8, max:rad*0.6, life:0.4, col:'#ffd24a'});
      burst(e.x, e.y, 30, '#ff7a2f', 340, 5, 0.9);
      burst(e.x, e.y, 12, '#ffd24a', 260, 4, 0.7);
      G.fx.push({t:'shake', life:0.12});
    }
    if (b.has('kVolat') && dist(p,{x:e.x,y:e.y}) < rad) hurt(dmgV*0.35, true, true); // цена кейстоуна, но свиту не задевает
  }
  G.fx.push({t:'ring', x:e.x, y:e.y, r:e.r, max:e.r*2.4, life:0.3, col:e.t.col});
  // Смерть: тем крупнее враг — тем гуще брызги
  const grade = e.kind === 'boss' ? 3 : e.kind === 'elite' ? 1.7 : 1;
  burst(e.x, e.y, Math.round(14*grade), e.t.col, 190*grade, 4, 0.75);
  burst(e.x, e.y, Math.round(5*grade),  '#e8eef5', 120*grade, 3, 0.5);
  if (e.dots.fire.dps > 0) burst(e.x, e.y, 10, '#ff7a2f', 160, 3, 0.6);
  if (e.ail.chill  > 0) burst(e.x, e.y, 10, '#7fd6ff', 160, 3, 0.6);
  G.enemies.splice(i,1);
}

/* ---------- ЧАСТИЦЫ ----------
   Мелкие квадратные пиксели, разлетающиеся из точки. Живут недолго,
   тормозят трением и гаснут. Потолок в 700 штук держит кадр стабильным. */
function burst(x, y, n, col, spd, size, life){
  if (G.parts.length > 700) n = Math.min(n, 4);
  for (let i = 0; i < n; i++){
    const a = rnd(0, 6.283), v = rnd(spd*0.2, spd);
    G.parts.push({
      x: x + rnd(-3,3), y: y + rnd(-3,3),
      vx: Math.cos(a)*v, vy: Math.sin(a)*v,
      life: rnd(life*0.45, life), max: life,
      sz: rndi(2, size), col,
    });
  }
}

/* Шок бьёт молнией по округе: до 20 ближайших целей в радиусе 400
   получают долю от того удара, который наложил шок. */
const SHOCK_TARGETS = 20, SHOCK_RANGE = 400, SHOCK_SHARE = 0.20;
/* Базы площадных радиусов игрока. Все они умножаются на D.aoeR в recalc():
   правило простое — если область принадлежит игроку, «Радиус области действия»
   её растит. Раньше через aoeR ходило только то, что зовёт nova(), а шок,
   обе ауры и инферно считали дистанцию своим циклом и мимо стата прошли. */
const SLOW_AURA_BASE = 260, INFERNO_BASE = 110;
/* Аура охлаждения. Радиус намеренно маленький: она должна поощрять бой в толпе,
   а не замораживать комнату с одного прока. Замедление слабее прямого (20% против
   35%), и самого статуса аура НЕ накладывает — см. комментарий в цикле врагов. */
const CHILL_AURA_R = 96, CHILL_AURA_SLOW = 0.20, CHILL_TAKEN = 1.25;
function shockBurst(src, dmg){
  const list = [];
  for (const x of G.enemies){
    if (x === src) continue;
    const d = dist(x, src);
    if (d < D.shockR) list.push([d, x]);
  }
  list.sort((a,b) => a[0]-b[0]);
  for (let i = 0; i < Math.min(SHOCK_TARGETS, list.length); i++){
    const t = list[i][1];
    applyDamage(t, dmg, false);
    G.fx.push({t:'bolt', x:src.x, y:src.y, x2:t.x, y2:t.y, life:0.2});
    burst(t.x, t.y, 3, '#ffe14a', 130, 3, 0.3);
  }
}

/* Волна урона по площади вокруг точки */
function nova(x, y, r, dmg, col, opt){
  G.fx.push({t:'ring', x, y, r:8, max:r, life:0.28, col});
  for (const e of G.enemies){
    if (dist(e,{x,y}) >= r + e.r) continue;
    applyDamage(e, dmg, false);
    if (opt && opt.ignite) addDot(e, 'fire', opt.ignite, 3*D.ailDur);   // мега-взрыв поджигает задетых
  }
}

/* Единственная дверь для любого восстановления здоровья в игре.
   УЖАСАЮЩИЙ ВАМПИР закрывает её целиком: всё, что не идёт через вампиризм,
   гасится здесь, и никакой источник лечения мимо не пролезет. */
function heal(v){
  const p = G.player;
  if (D.dread && !p.dreadLeech) return;         // лечит только вытягивание, см. damage()
  p.hp = Math.min(D.life, p.hp + v);
}

/* Всплывающее слово над врагом — статус должен читаться мгновенно */
function statusText(e, txt, col){
  G.fx.push({t:'txt', x:e.x, y:e.y - e.r - 14, s:txt, life:0.55, col});
}

/* Эффекты книг. Вызывается и из атак игрока, и из ударов свиты —
   книги работают на всех, как и задумано. */
function applyBookAilments(e, total){
  const it = G.items; if (!it) return;
  const proc = k => it[k] && Math.random()*100 < bookChance(k);
  if (proc('fire'))  addDot(e, 'fire', total * 0.20 * D.ailEff, 1.5 * D.ailDur);
  if (proc('poison')) addDot(e, 'poison', D.bookPoiDps, 3 * D.ailDur);
  if (proc('bleed'))  addDot(e, 'bleed', bookBleedDps(), 4 * D.ailDur);
  if (proc('cold')){
    if (e.ail.chill <= 0) statusText(e, 'SLOWED', '#ffe14a');
    e.ail.chill = Math.max(e.ail.chill, 1.0 * D.ailDur);
  }
}

/* ---------- УРОН СО ВРЕМЕНЕМ: СТАКИ ----------
   Каждое срабатывание добавляет свой урон в общий котёл, а котёл непрерывно
   утекает со скоростью dps/длительность. Математически это тождественно тому,
   как если бы каждый стак жил отдельным таймером и истекал сам, но стоит O(1)
   памяти вместо списка из сотен объектов.
   Установившийся уровень = частота проков x урон за прок x длительность. */
function addDot(e, type, dps, dur){
  // Оберег гасит и урон со временем своей стихии, иначе поджог обходил бы защиту
  if (e.ward && ((e.ward === 'fire' && type === 'fire') || (e.ward === 'poi' && type === 'poison')))
    dps *= 0.4;
  const d = e.dots[type];
  // Длительность у котла одна на всех, а базы у источников разные: поджог от
  // карточки горит 3 секунды, от книги огня — 1.5. Раньше здесь стояло d.dur = dur,
  // то есть длительность задавал последний прок, и слабый прок книги обрезал вдвое
  // весь котёл, накопленный карточкой (замер: −749 из 1500 от прока ценой в 1 урона).
  // Берём средневзвешенную по урону. Это не приближение: суммарный урон котла равен
  // dps × dur, и при таком слиянии он в точности равен сумме вкладов обоих проков.
  const tot = d.dps + dps;
  d.dur = tot > 0 ? (d.dps*d.dur + dps*dur) / tot : dur;
  d.dps = tot; d.n += 1;
}
/* Совместимость: кровотечение теперь просто один из типов DoT */
function addBleed(e, dps){ addDot(e, 'bleed', dps, 6 * D.ailDur); }

/* Виды приспешников. mode задаёт поведение, остальное — внешний вид. */
const MKIND = {
  skeleton:{nm:'Скелет',          sides:3, col:'#8fd4b0', mode:'melee'},
  hunter:  {nm:'Охотник',         sides:4, col:'#d4c98f', mode:'ranged'},
  warlock: {nm:'Колдун',          sides:5, col:'#b98fd4', mode:'caster'},
  golemB:  {nm:'Голем крови',     sides:6, col:'#d4506a', mode:'golemB'},
  golemN:  {nm:'Костяной голем',  sides:5, col:'#e6e2d6', mode:'golemN'},
};
const mCount = k => G.minions.reduce((n,m)=> n + (m.kind === k ? 1 : 0), 0);

/* Здоровье и размер зависят от вида: големы считаются от статов игрока напрямую */
function minionHp(kind){
  /* Запас голема считается от запаса свиты, а не от вашего. Ваше здоровье
     растёт линейно по уровню, а свита — по этажу через hpScale: привязка
     к игроку делала танка тем бесполезнее, чем глубже забег. Замер до правки
     на 35 этаже: голем десятого уровня имел 2% от запаса обычного скелета. */
  if (kind === 'golemB') return D.minLife * 0.35 * D.golemB;   // 10 уровней → 3.5 скелета
  /* Та же правка, что и у голема крови: запас считается от свиты, а не от вас.
     Замер до неё на 35 этаже — 1.1% от запаса обычного скелета, при том что
     костяной по своей роли лезет в самую гущу и стягивает удары.
     Доля вдвое ниже, чем у голема крови (0.35): этот не танк, а бегун. */
  if (kind === 'golemN') return D.minLife * 0.20 * D.golemN;   // 10 уровней → 2 скелета
  if (kind === 'hunter') return D.minLife * 0.8;
  if (kind === 'warlock') return D.minLife * 0.7;
  return D.minLife;
}
function minionR(kind){
  return kind === 'golemB' ? 22 : kind === 'golemN' ? 17
       : kind === 'hunter' ? 10 : kind === 'warlock' ? 11 : (D.minTier ? 13 : 10);
}
/* Кого поднимать следующим. Големы идут первыми: каждый стоит до десяти карт,
   и держать их в конце очереди за восемнадцатью рядовыми — значит обесценить вложение. */
function needKind(){
  if (D.golemB > 0 && !mCount('golemB')) return 'golemB';
