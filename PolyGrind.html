/* D — производные характеристики. Пересчитываются только при изменении билда. */
let D = {};
function recalc(){
  const b = G.bag, w = G.weapon;
  const glass  = b.has('kGlass'),  noCrit = b.has('kNoCrit'), heavy = b.has('kHeavy');
  const flurry = b.has('kFlurry'), acro   = b.has('kAcro');
  const unburd = b.has('kUnburd');
  const sub = G.subclass;
  const thief = sub === 'thief', hunter = sub === 'hunter', dancer = sub === 'dancer';
  const destroyer = sub === 'destroyer', multiplier = sub === 'multiplier', elementalist = sub === 'elementalist';
  const graverobber = sub === 'graverobber', animator = sub === 'animator';
  const berserker = sub === 'berserker', guardian = sub === 'guardian', swordmaster = sub === 'swordmaster';
  const thiefMove = thief ? 1 + G.lvl/100 : 1;
  const graveMove = graverobber ? 1 + G.lvl/100 : 1;

  // --- Живучесть ---
  D.life   = b.calc('life', 100 + G.lvl*4) * (glass ? 0.6 : 1) * (guardian ? 1 + G.lvl*0.0075 : 1);
  D.regen  = b.calc('regen', 0) + D.life * b.flat('regenPct')/100;
  D.respite = b.has('respite');
  D.durabilityReserve = b.has('durabilityReserve');
  if (G.player){
    G.player.reserveBarrier = D.durabilityReserve ? Math.min(G.player.reserveBarrier||0,D.life*0.12) : 0;
    if (!D.durabilityReserve) G.player.reserveBarrierT=0;
  }
  D.armor  = unburd ? 0 : b.calc('armor', 0) + (amu('golem') ? 50 : 0) + (dancer ? Math.min(60, G.lvl) : 0);
  // Две отдельные ветки защиты от рангов врагов. Это множители после общей
  // защиты: −25% означает, что от соответствующего врага проходит 75% урона.
  D.normalDr = clamp(b.sum('normalDr'), 0, 25);
  D.majorDr  = clamp(b.sum('majorDr'), 0, 25);
  // Процентная магазинная броня остаётся самостоятельным множителем после
  // обычной брони: так её потолок не создаёт неуязвимость.
  D.drShop = shopLvl('sarmor');
  D.drFlat = b.flat('drFlat');
  D.dodge  = clamp(b.flat('dodge') * (acro ? 2 : 1), 0, 70);
  D.thorns = w.type === 'melee' ? clamp(b.flat('thorns'), 0, 40) : 0; // только Воин; на потолке открывается отражение
  D.reflect= w.type === 'melee' ? b.flat('reflect') : 0;
  D.steelCrowd = w.type === 'melee' ? clamp(b.flat('steelCrowd'), 0, 10) : 0;
  D.holdLine = w.type === 'melee' && b.has('holdLine');
  // Клык вампира прибавляется ПОСЛЕ потолка: иначе амулет не делал бы ничего
  // тому, кто уже упёрся в 25%, а это ровно тот билд, который его и ищет
  D.leechBase   = clamp(b.flat('leech'), 0, 25) + (amu('fang') ? 4 : 0);
  D.leech       = D.leechBase;
  /* УЖАСАЮЩИЙ ВАМПИР перекрывает обычный вампиризм и лечение одним флагом.
     Его собственное восстановление идёт отдельным потоком через dreadRecover():
     так новый источник обычного лечения не сможет случайно обойти кейстоун. */
  D.dread       = b.has('kDread') && !w.minions; // старый кейстоун недоступен и не действует у Некроманта
  if (D.dread) D.leech = 0.5;
  if (G.player) G.player.dreadShield = D.dread ? Math.min(G.player.dreadShield||0, D.life*0.15) : 0;
  D.leechInstant= b.has('leechInstant');
  D.onKill = b.flat('onKill'); D.onHit = b.flat('onHit'); D.onCrit = b.flat('onCrit');

  // --- Урон: база оружия + стихии, всё по формуле каталога ---
  D.incAll = (b.s.dmg ? b.s.dmg.inc : 0) + (w.type==='melee'? b.sum('dmgMelee') : 0)
           + (w.type!=='melee'? b.sum('dmgProj') : 0) + (w.type==='orb'? b.sum('dmgAoe') : 0);
  // Берсерк усиливает только прямой взмах Воина. В общий D.incAll бонус не
  // входит, иначе заодно разгонит самостоятельные взрывы, следы и DoT.
  D.warriorMeleeInc = berserker ? G.lvl : 0;
  D.moreAll = (b.s.dmg ? b.s.dmg.more : 1) * (glass?1.6:1) * (noCrit?1.5:1) * (heavy?4:1) * (flurry?0.5:1);

  const phys = w.dmg[0] + G.lvl*0.45 + b.flat('dmg');
  const physMax = w.dmg[1] + G.lvl*0.7 + b.flat('dmg');
  D.baseMin = phys;  D.baseMax = physMax;
  // «Надёжный удар» поднимает только нижнюю границу к верхней. Максимум не
  // уменьшается, поэтому карточка действительно повышает средний урон.
  if (b.has('armorDmg')){ D.baseMin += D.armor*0.12; D.baseMax += D.armor*0.12; }  // conv.armor_damage
  D.narrow = clamp(b.sum('narrow'),0,50);
  D.baseMin += (D.baseMax-D.baseMin)*(D.narrow/100);

  // Книги — отдельный источник флэт-урона: сумка их не хранит, чтобы тир можно было поднимать
  const bk = k => (G.items && G.items[k]) ? G.items[k].val : 0;
  // Амулеты стихий кладутся в тот же процент, что и карточки: «+35% к огню»
  // с амулета и с карточки обязаны быть неотличимы, иначе появится вторая формула
  // Корона пепла бьёт по всем четырём стихиям сразу, поэтому кладётся в каждую
  const aAll  = amu('crown') ? 50 : 0;
  const aFire = (amu('ash') ? 35 : 0) + aAll, aCold = (amu('ice') ? 35 : 0) + aAll,
        aPoi  = (amu('plague') ? 35 : 0) + aAll, aLit = aAll;
  const subElement = elementalist ? G.lvl : 0;
  D.elem = {                                          // каждая стихия считается отдельно
    fire: (b.flat('dFire') + bk('fire')) * (1 + (b.sum('iFire')+aFire+subElement)/100),
    cold: (b.flat('dCold') + bk('cold')) * (1 + (b.sum('iCold')+aCold+subElement)/100),
    lit:   b.flat('dLit')               * (1 + (b.sum('iLit') +aLit +subElement)/100),
    poi:   b.flat('dPoi')               * (1 + (b.sum('iPoi') +aPoi +subElement)/100),
  };

  // --- Криты ---
  D.noCrit = noCrit;
  D.critCh  = noCrit ? 0 : clamp(b.calc('critCh', 5), 0, 100);
  D.criticalMass = b.has('criticalMass');
  D.superCh = clamp(b.flat('superCh'), 0, 100);
  D.critMul = 150 + b.flat('critMul');

  // --- Скорости ---
  /* Два талисмана разгона. Считаются здесь, вместе с прочими множителями
     скорости, а не отдельной поправкой в бою: свита наследует обе скорости
     хозяина целиком, и это единственный способ разогнать её заодно,
     не дублируя одно и то же правило в трёх местах. */
  const P = G.player;
  const rush = (amu('swift') && P && P.swiftT > 0 ? 1.20 : 1)
             * (amu('survive') && P && P.hp/Math.max(1, D.life) < 0.30 ? 1.20 : 1);
  /* Разгон движения: считается ЗДЕСЬ, а не множителем в кадре. Раньше три
     источника (карточка после убийства, «Последний рывок», «Талисман бегуна»)
     умножались прямо в шаге игрока, а свита берёт долю от скорости хозяина —
     то есть от значения ДО них, и не разгонялась вообще. Теперь всё в одном месте,
     и приспешники едут вместе с хозяином без отдельного правила. */
  const dash = (P && P.spdKill > 0 ? 1.25 : 1)
             * (P && P.sprintT > 0 ? 1.40 : 1)
             * (P && P.cheatSpeedT > 0 ? 1.50 : 1)
             * (amu('runner') && P && P.moving ? 1.20 : 1);
  D.counterTempoPerHit = w.type === 'melee' ? clamp(b.sum('counterTempo'),0,50) : 0;
  D.aspd  = b.calc('aspd', 1) * (heavy?0.5:1) * (flurry?2:1) * (unburd?1.25:1)
          * (amu('clock') ? 1.10 : 1) * (amu('claws') ? 1.20 : 1) * (amu('brute') ? 0.90 : 1)
          * rush * (hunter ? 1 + G.lvl/100 : 1) * (berserker && P && P.berserkLow ? 1.20 : 1)
          * (1 + (P && P.counterTempoT > 0 ? P.counterTempoPct||0 : 0)/100)
          * (1 + (P && P.overheatedT > 0 ? P.overheatedPct||0 : 0)/100);
  D.mspd  = b.calc('mspd', 235) * (acro?1.15:1) * (unburd?1.35:1) * rush * dash
          * thiefMove * graveMove;

  // --- Геометрия ---
  /* Все подклассы Мага получают общий +1 снаряд за каждые 15 уровней.
     Мультипликация больше не добавляет гарантированные шары от уровня: каждый
     обычный шар отдельно бросает 35% шанс на мини-копию с 20% урона и 60% AoE.
     Карточка projN оставлена только Лучнику: для Мага она слишком сильно
     умножала урон сферы поверх уже встроенного классового роста. */
  const mageProjectiles = w.id === 'wpn.wand' ? Math.floor(G.lvl/15) : 0;
  D.projN   = 1 + Math.round(b.flat('projN')) + mageProjectiles;
  D.multiplierMiniChance = multiplier ? 0.35 : 0;
  D.multiplierMiniDamage = 0.20;
  D.multiplierMiniArea = 0.60;
  D.multiplierMiniDelay = 0.10;
  D.pierce  = Math.round(b.flat('pierce'));
  D.chain   = Math.round(b.flat('chain')) + (amu('ricochet') ? 1 : 0);
  D.ricochet= clamp(Math.round(b.flat('ricochet')), 0, RICOCHET_SHARD_CAP);
  D.featherSpeed = w.id === 'wpn.bow' ? b.sum('featherSpeed') : 0;
  D.featherHoming = w.id === 'wpn.bow' ? G.picks.filter(x=>x.id==='archer.fletching').reduce((sum,x)=>{
    const v=Number.isFinite(x.v)?x.v:7; return sum+Math.round(3+(v-7)*0.4);
  },0) : 0;
  D.homing  = (b.sum('homing')+D.featherHoming)/100;
  D.projSpd = (1 + (b.sum('projSpd')+D.featherSpeed)/100) * (amu('arrow') ? 1.5 : 1);
  D.arrowFlight = w.id === 'wpn.bow' ? 1+b.sum('arrowFlight')/100 : 1;
  D.acceleratedArrow = w.id === 'wpn.bow' ? b.sum('acceleratedArrow') : 0;
  D.swiftArrows = w.id === 'wpn.bow' && b.has('swiftArrows');
  D.cleanTrajectory = w.id === 'wpn.bow' ? b.sum('cleanTrajectory') : 0;
  D.elementalPierce = w.id === 'wpn.bow' && b.has('elementalPierce');
  D.projSize= 1 + b.sum('projSize')/100;
  D.overpressure = b.has('overpressure');
  D.arcanePull = clamp(b.sum('arcanePull'), 0, 100);
  D.blastHeart = w.type === 'orb' ? b.sum('blastHeart') : 0;
  D.elementalExplosion = w.type === 'orb' && b.has('elementalExplosion');
  D.residualArcana = w.type === 'orb' ? b.sum('residualArcana') : 0;
  D.overheatedPerExplosion = w.type === 'orb' ? b.sum('overheatedOrb') : 0;
  D.remoteBlast = w.type === 'orb' ? b.sum('remoteBlast') : 0;
  D.aoeR    = (1 + b.sum('aoeR')/100) * (destroyer ? 1 + G.lvl/100 : 1);
  if (b.has('aoeToDmg')) D.incAll += (D.aoeR-1)*60;      // conv.aoe_to_damage
  // Площадные радиусы: считаются здесь один раз на смену билда, а не в кадре
  D.shockR     = SHOCK_RANGE    * D.aoeR;   // разлёт молний при шоке
  D.chillAuraR = CHILL_AURA_R   * D.aoeR;   // вязкость вокруг охлаждённого
  D.slowAuraR  = SLOW_AURA_BASE * D.aoeR;   // аура замедления врагов
  D.infernoR   = INFERNO_BASE   * D.aoeR;   // перекидывание поджога
  D.arc     = 1 + b.sum('arc')/100;
  D.longBlade = w.type === 'melee' ? clamp(b.sum('longBlade'),0,60) : 0;
  D.longBladeRange = 1 + D.longBlade/100;
  D.deadlyRadius = w.type === 'melee' && b.has('deadlyRadius');
  D.openWound = w.type === 'melee' ? b.sum('openWound') : 0;
  D.berserker = berserker; D.guardian = guardian; D.swordmaster = swordmaster;
  D.warriorWaveRadius = swordmaster ? 1 + Math.min(60, G.lvl)/100 : 1;
  D.warriorWaveKnock  = swordmaster ? 1 + Math.min(90, G.lvl*1.5)/100 : 1;
  D.orbitN      = clamp(Math.round(b.flat('orbit')), 0, 10);   // круговые орбы, потолок 10
  D.novaKillBase = clamp(b.flat('novaKill'), 0, 50);
  D.novaKillStrong = b.has('novaKillStrong');
  D.novaKillChance = D.novaKillStrong ? 65 : D.novaKillBase;
  D.novaKillDamage = D.novaKillStrong ? 1.25 : 1;
  D.explodeBase = clamp(b.flat('explode'), 0, 25);
  D.explode     = b.has('kVolat') ? 100 : D.explodeBase;
  D.explodeMega = clamp(b.flat('explodeMega'), 0, 100);
  D.plagueRadius= b.has('kVolat') ? 0.65 : 1;
  D.dblHit   = clamp(b.flat('dblHit'), 0, 25);
  D.attackEcho = b.has('attackEcho');
  D.deadlyHit= b.has('deadlyHit');
  D.shotgun = b.has('shotgun'); D.chainKeep = b.has('chainKeep'); D.pierceBonus = b.has('pierceBonus');

  // --- Прочее ---
  // Радиус больше не раздаётся карточкой: остаются только фиксированная база
  // и отдельный предмет «Охотник за лутом». Магазин усиливает готовое значение ниже.
  D.pickup  = 70 * (amu('looter') ? 5 : 1);
  D.lootVacuum = 1 + shopLvl('vacuum') * 0.20;
  D.lootPickup = D.pickup * D.lootVacuum;
  D.lootPull   = 340 * D.lootVacuum;
  D.xpGain  = 1 + b.sum('xpGain')/100;
  D.goldFind= 1 + b.sum('goldFind')/100;
  // ВОР перемножает уже готовую награду, поэтому усиливает магазин, карточки,
  // книги, предметы и созвездия, а не растворяется с ними в одном общем проценте.
  D.goldGainMult = thief ? 1 + G.lvl*0.02 : 1;
  // Книга крови: N% от автоатаки в секунду. avgHit уже содержит все проценты,
  // поэтому отдельно домножать не нужно — иначе получится двойной скейл.
  D.bookBleedDps = 0;                                  // считается ниже, после avgHit
  D.monsterMore  = (1 + ((G.items && G.items.monster) ? G.items.monster.val : 0)/100)
                 * (amu('candle') ? 1.20 : 1)
                 * (1 + shopLvl('smon')/100);
  if (G.items && G.items.xp) D.xpGain += G.items.xp.val/100;
  if (amu('candle')) D.xpGain += 0.15;
  D.dashMax = clamp(1 + Math.round(b.flat('dashN')) + (dancer ? 1 : 0), 1, 3);
  D.dashDmg = b.has('dashDmg'); D.phasing = b.has('phasing');
  D.dashRecovery = b.sum('dashRecharge');
  D.dashLength = b.sum('dashLength');
  D.dashCd  = DASH_COOLDOWN / (1 + D.dashRecovery/100);
  D.dashSpeedMul = DASH_SPEED_MULT * (1 + D.dashLength/100);
  D.iframe  = 0.22 * (1 + b.sum('iframe')/100);
  // Четыре универсальные стихийные ветки ограничены 25%: ранний забег больше
  // нельзя превратить в гарантированную цепочку статусов несколькими картами.
  D.igniteCh = clamp(b.flat('igniteCh'), 0, 25);
  D.chillCh  = clamp(b.flat('chillCh'),  0, 25);
  D.shockCh  = clamp(b.flat('shockCh'),  0, 25);
  D.poiCh    = clamp(b.flat('poiCh'),    0, 25);
  D.knock    = clamp(b.flat('knock') + (amu('brute') ? 50 : 0), 0, 100);
  D.stun     = clamp(b.flat('stun'), 0, 50);
  D.knockPow = amu('brute') ? 1.5 : 1;                 // сила толчка отдельно от шанса
  D.inferno  = b.has('inferno'); D.freeze = b.has('freeze');
  D.tesla    = b.has('tesla'); D.radiation= b.has('radiation'); D.dizzy = b.has('dizzy');
  D.slowAura = b.has('slowAura'); D.coldShatter = b.has('coldShatter');
  D.ailEff  = 1 + b.sum('ailEff')/100;
  D.ailDur  = 1 + b.sum('ailDur')/100;
  D.freezeDur = amu('ice') ? 1.4 : 1;        // ледяной кристалл продлевает только заморозку
  // Яд из книги обязан оставаться актуальным на любом этаже, поэтому скейлится полностью.
  // Стоит ИМЕННО ЗДЕСЬ, а не выше среди прочего: D — объект живучий, и расчёт,
  // стоявший до присвоения D.ailEff, брал значение с прошлого пересчёта. «+100% к силе
  // эффектов» с книгой яда давало 12 урона в секунду вместо 24, и выправлялось только
  // следующей взятой карточкой. Любую новую строку с D.ailEff/D.ailDur держать ниже этой.
  D.bookPoiDps = (G.items && G.items.poison)
    ? G.items.poison.val * 4 * (1 + (b.sum('iPoi')+aPoi+subElement)/100) * (1 + D.incAll/100) * D.moreAll * D.ailEff
    : 0;
  D.atkCd   = w.cd / D.aspd;

  // --- Свита: считается по той же формуле, наследование берёт % от ваших статов ---
  D.hasMin    = !!w.minions;
  D.minInherit= b.flat('minInherit')/100;
  D.minTier   = b.has('minTier');
  D.maxSkel   = D.hasMin ? clamp(3 + Math.round(b.flat('minCount')) + (animator ? Math.floor(G.lvl/20) : 0), 0, 20) : 0;
  D.maxHunt   = D.hasMin ? clamp(Math.round(b.flat('minHunt')), 0, 6) : 0;
  D.maxWarl   = D.hasMin ? clamp(Math.round(b.flat('minWarl')), 0, 6) : 0;
  D.golemB    = D.hasMin ? clamp(Math.round(b.flat('golemBlood')), 0, 10) : 0;
  D.golemN    = D.hasMin ? clamp(Math.round(b.flat('golemBone')),  0, 10) : 0;
  D.minMax    = D.maxSkel + D.maxHunt + D.maxWarl + (D.golemB?1:0) + (D.golemN?1:0);
  D.minDmgMul = 0.42 * (1 + b.sum('minDmg')/100) * (1 + D.minInherit) * (b.has('kBond') ? 1.5 : 1)
                * (D.minTier ? 1.45 : 1);
  /* ГОЛЕМ КРОВИ. На первом уровне бьёт вдвое реже скелета и втрое сильнее,
     дальше растёт урон и понемногу темп. Считается от D.minDmgMul, поэтому
     вбирает все карточки урона свиты, наследование и «Кровные узы».
     Раньше урон был 0.08 * уровень от avgHit() мимо множителя свиты — на
     десятом уровне это давало 0.92 от одного скелета, то есть десять карточек
     были слабее одного бесплатного приспешника. */
  D.golemBMul = D.golemB ? 3 * D.minDmgMul * (1 + 0.35*(D.golemB-1)) : 0;
  D.golemBCd  = D.golemB ? 1.0 / (1 + 0.05*(D.golemB-1)) : 1.0;
  D.minLifeRaw = b.sum('minLife');            // порог для «Вампиров хозяина»
  D.minDmgRaw  = b.sum('minDmg');             // порог для «Буйства демонов»
  D.boneField  = D.hasMin ? b.sum('boneField') : 0;
  D.minFrenzy  = b.has('minFrenzy');
  D.minSpdRaw  = b.sum('minSpd');             // порог для карточек переноса
  D.minAspdRaw = b.sum('minAspd');            // порог для карточек когтей
  D.minClaws   = b.has('minClaws');
  D.minWhirl   = b.has('minWhirl');
  /* Перенос свиты. Астральный набег ЗАМЕНЯЕТ внезапный взрыв, а не складывается
     с ним: два независимых таймера означали бы, что приспешник телепортируется
     дважды подряд и половина переносов уходит впустую. Поэтому одна механика
     с тремя числами, которые задаёт старшая из взятых карточек. */
  D.minBlink   = b.has('minRaid') ? {cd:4,  mul:0.50, r:100}
               : b.has('minBlink') ? {cd:10, mul:0.30, r:60}
               : null;
  D.minBath    = b.has('minBath');
  D.venomancer = sub === 'venomancer';
  D.minBoil    = b.has('minBoil');
  D.minVamp   = b.has('minVamp') ? 25 : 0;    // % урона свиты, уходящий ей же в здоровье
  /* Здоровье свиты растёт по этажу тем же множителем, что и у врагов.
     Замер до правки: на 5 этаже жило 5.7 приспешника из 6, на 10-м — 0.1,
     дальше ноль. Линейный рост (30 + уровень*2.6) против здоровья врагов
     на 14% за этаж означал, что армия перестаёт существовать между пятым
     и десятым этажом, и весь класс держался на одном хозяине. */
  D.minLife   = (30 + G.lvl*2.6) * hpScale(G.floor) * (1 + b.sum('minLife')/100) * (D.minTier ? 1.6 : 1)
                + D.life * D.minInherit * 0.25;
  /* База скорости свиты. Бег: было 305 против 235 у игрока — приспешник еле
     обгонял хозяина и в бою плёлся сзади, не успевая добежать до цели и вернуться.
     Скорость атаки — чистый множитель к откатам ниже, а сами откаты приведены
     к тому, что скелет бьёт ровно дважды в секунду на старте. Множитель 1.5,
     которым это делалось раньше, убран: числа в цикле теперь честные секунды,
     и «0.5» читается как полсекунды, а не как «0.78, делённое на полтора». */
  /* Свита наследует скорости хозяина ЦЕЛИКОМ и без всяких условий: если игрок
     разогнался, армия разгоняется вместе с ним. Карточка «Свита наследует %
     ваших статов» тут ни при чём — она про урон, здоровье и крит.
     Обрати внимание: сюда заходит и D.aspd целиком, то есть кейстоуны тоже.
     «Тяжёлый удар» (вдвое медленнее) замедлит и свиту, «Шквал» — ускорит. */
  D.minAspd   = (1 + b.sum('minAspd')/100) * D.aspd;
  D.skelAspd  = amu('warskel') ? 1.25 : 1;      // БОЕВЫЕ СКЕЛЕТЫ: только рядовые скелеты
  D.minSpd    = 610 * (1 + b.sum('minSpd')/100) * (D.mspd/235) / thiefMove;
  /* Шанс крита свиты. Раньше твой собственный шанс доходил до приспешников
     только через карточку наследования, то есть обе критовые ветки при её
     отсутствии не давали свите ровно ничего — а у некроманта свита и есть
     основной урон. Теперь твой шанс наследуется ЦЕЛИКОМ, как обе скорости,
     а карточка наследования сверх этого добавляет свою долю. */
  D.minCrit   = clamp(b.sum('minCrit') + D.critCh * (1 + D.minInherit), 0, 100);
  /* Воскрешение фиксированное для всех: скелетов, охотников, колдунов, големов.
     Раньше было 5 секунд с карточкой на ускорение, и карточка почти не работала:
     подъём из трупа шёл за 0.4 сек мимо неё, а «пустой» подъём нужен ровно тогда,
     когда убивать некого. Замер показывал разницу только на пятом этаже,
     дальше свиту выкашивали быстрее, чем она вставала при любой скорости. */
  D.minRevive = 0.25;
  D.minBoom   = b.has('minBoom');
  D.boneChallenge = D.hasMin && b.has('kBoneChallenge');
  D.deathLord = D.hasMin && b.has('kDeathLord');
  /* Ветка перехвата качается до 50% — своим потолком, отдельно от кейстоуна.
     Раньше был общий потолок 75 без своего: из-за диапазона 20-35 за карточку
     ветка закрывалась двумя-тремя взятиями и никакой прокачки не получалось.
     Теперь шаг 8-14, то есть на 50% уходит четыре-пять карточек. */
  D.minBondRaw = clamp(b.flat('minBond'), 0, 50);
  D.minBond   = clamp(D.minBondRaw + (b.has('kBond') ? 40 : 0), 0, 75);
  D.bloodTies = b.has('bloodTies');

  if (G.player) G.player.hp = Math.min(G.player.hp, D.life);
}

/* Урон кровотечения из книги. Отдельной функцией, потому что зависит от avgHit(),
   а тот сам читает D — прямой расчёт внутри recalc дал бы циклическую ссылку. */
function bookBleedDps(){
  return (G.items && G.items.bleed) ? avgHit() * (G.items.bleed.val/100) * D.ailEff : 0;
}

/* Оценка среднего урона за удар — для строки ДПС в интерфейсе */
function avgHit(){
  const base = (D.baseMin+D.baseMax)/2;
  const el = D.elem.fire+D.elem.cold+D.elem.lit+D.elem.poi;
  const raw = (base+el) * (1 + D.incAll/100) * D.moreAll;
  const crit = 1 + (D.critCh/100) * (D.critMul/100 - 1);
  return raw * crit;
}
// Только интерфейс: реальный бонус Берсерка применяется в damage(), чтобы не
// усиливать эффекты, которые лишь используют avgHit() как расчётную базу.
function attackAvgHit(){ return avgHit() * (1 + (D.warriorMeleeInc||0)/100); }

/* Все предупреждения говорят цветом только о последствии, а не о владельце.
   Заполнение всегда занимает последние 0.8 секунды любого замаха. */
const TELEGRAPH_FILL_TIME=0.8, TELEGRAPH_EDGE_FLASH=0.05, TELEGRAPH_TRACE_TIME=0.13;
const TELEGRAPH_TYPES=Object.freeze({
  warning:'#f6c344', damage:'#ff3b45', control:'#b56cff',
});
function telegraphFill(remaining){ return clamp((TELEGRAPH_FILL_TIME-remaining)/TELEGRAPH_FILL_TIME,0,1); }
function telegraphPath(spec){
  ctx.beginPath();
  if (spec.shape==='corridor'){
    const dx=spec.x2-spec.x,dy=spec.y2-spec.y,len=Math.hypot(dx,dy)||1;
    const nx=-dy/len*(spec.width||24)/2,ny=dx/len*(spec.width||24)/2;
    ctx.moveTo(spec.x+nx,spec.y+ny); ctx.lineTo(spec.x2+nx,spec.y2+ny);
    ctx.lineTo(spec.x2-nx,spec.y2-ny); ctx.lineTo(spec.x-nx,spec.y-ny); ctx.closePath();
  } else if (spec.shape==='rift'){
    const r=spec.r;
    ctx.moveTo(spec.x-r,spec.y+r*0.20); ctx.lineTo(spec.x-r*0.62,spec.y-r*0.72);
    ctx.lineTo(spec.x-r*0.24,spec.y+r*0.15); ctx.lineTo(spec.x+r*0.18,spec.y-r*0.88);
    ctx.lineTo(spec.x+r*0.48,spec.y+r*0.06); ctx.lineTo(spec.x+r,spec.y-r*0.18);
    ctx.lineTo(spec.x+r*0.68,spec.y+r*0.74); ctx.lineTo(spec.x-r*0.40,spec.y+r*0.82); ctx.closePath();
  } else {
    ctx.arc(spec.x,spec.y,spec.r,0,Math.PI*2);
  }
}
function drawTelegraphTargetMarks(spec,alpha,col,width){
  if (spec.shape!=='target') return;
  const r=spec.r,cut=r*0.52;
  ctx.globalAlpha=alpha; ctx.strokeStyle=col; ctx.lineWidth=width; ctx.beginPath();
  ctx.moveTo(spec.x-r,spec.y);ctx.lineTo(spec.x-cut,spec.y);ctx.moveTo(spec.x+cut,spec.y);ctx.lineTo(spec.x+r,spec.y);
  ctx.moveTo(spec.x,spec.y-r);ctx.lineTo(spec.x,spec.y-cut);ctx.moveTo(spec.x,spec.y+cut);ctx.lineTo(spec.x,spec.y+r);
  ctx.stroke();
}
function drawTelegraph(spec){
  const col=TELEGRAPH_TYPES[spec.kind]||TELEGRAPH_TYPES.warning;
  const fill=telegraphFill(spec.remaining), edge=spec.remaining<=TELEGRAPH_EDGE_FLASH;
  ctx.save(); telegraphPath(spec);
  if (fill>0){ ctx.globalAlpha=0.05+fill*0.22; ctx.fillStyle=col; ctx.fill(); }
  ctx.globalAlpha=0.72+fill*0.20; ctx.strokeStyle=edge?'#ffffff':col; ctx.lineWidth=edge?4:2; ctx.stroke();
  drawTelegraphTargetMarks(spec,ctx.globalAlpha,ctx.strokeStyle,ctx.lineWidth);
  ctx.restore();
}
function pushTelegraphTrace(spec){
  G.fx.push(Object.assign({t:'telegraphTrace',life:TELEGRAPH_TRACE_TIME,max:TELEGRAPH_TRACE_TIME},spec));
}
function pushTimedTelegraph(spec,life){
  G.fx.push(Object.assign({t:'telegraph',life,max:life},spec));
}
function drawTelegraphTrace(spec){
  const k=clamp(spec.life/(spec.max||TELEGRAPH_TRACE_TIME),0,1), col=TELEGRAPH_TYPES[spec.kind]||TELEGRAPH_TYPES.warning;
  ctx.save(); telegraphPath(spec); ctx.globalAlpha=k*0.18; ctx.fillStyle=col; ctx.fill();
  ctx.globalAlpha=k*0.85; ctx.strokeStyle=col; ctx.lineWidth=3; ctx.stroke();
  drawTelegraphTargetMarks(spec,k*0.85,col,3); ctx.restore();
}

const BOSS_KEYS = Object.keys(BOSS_TYPES);
function rollBossType(exclude=[]){
  const pool = BOSS_KEYS.filter(k => !exclude.includes(k));
  const available = pool.length ? pool : BOSS_KEYS;
  let roll = Math.random() * available.reduce((sum,k) => sum + BOSS_TYPES[k].weight, 0);
  for (const key of available){
    roll -= BOSS_TYPES[key].weight;
    if (roll < 0) return key;
  }
  return available[available.length-1];
}
function bossType(e){ return BOSS_TYPES[e && e.bossId] || null; }

/* Один источник истины для бесконечной прогрессии боссовых этажей.
   X3/X6/X9 добавляют 1/2/3 боссов к обычной комнате, X0 создаёт ровно четыре
   босса и запрещает только системные волны. Призывы самих боссов и аффиксов
   остаются частью их механики. */
const MAX_BOSS_AFFIXES = 8;
function bossFloorPlan(floor){
  const f = Math.max(1, Math.floor(Number(floor) || 1));
  const digit = f % 10;
  const count = digit === 3 ? 1 : digit === 6 ? 2 : digit === 9 ? 3 : digit === 0 ? 4 : 0;
  if (!count) return {floor:f,isBossFloor:false,bossCount:0,affixCount:0,suppressRegularEnemies:false};
  const decade = Math.floor(f / 10);
  const major = digit === 0;
  // На X0 после 20-го этажа есть намеренный скачок: 30→4, 40→5 ... 70→8.
  const rawAffixes = major ? (decade >= 3 ? decade + 1 : decade) : decade + 1;
  return {floor:f,isBossFloor:true,bossCount:count,
    affixCount:Math.min(MAX_BOSS_AFFIXES,BOSS_AFFIXES.length,rawAffixes),
    suppressRegularEnemies:major};
}
function currentBossFloorPlan(){
  if (G && G.bossFloorPlan && G.bossFloorPlan.floor === G.floor) return G.bossFloorPlan;
  return bossFloorPlan(G ? G.floor : 1);
}
function regularEnemySpawnsSuppressed(){ return currentBossFloorPlan().suppressRegularEnemies; }
function floorCombatComplete(){
  const plan=currentBossFloorPlan();
  if (G.spawnQueue !== 0) return false;
  if (!plan.suppressRegularEnemies) return G.enemies.length === 0;
  // На X0 портал зависит от четырёх боссов. Их призванные миньоны разрешены,
  // но не превращаются в обязательную уборку после завершённой битвы.
  for (let i=0;i<G.enemies.length;i++)
    if (G.enemies[i].kind === 'boss' && !G.enemies[i].dead) return false;
  return true;
}
function affixCount(f){ return bossFloorPlan(f).affixCount; }
function bossCount(f){ return bossFloorPlan(f).bossCount; }

function applyAffixes(e, f, requestedCount){
  const pool = BOSS_AFFIXES.slice();
  // Прямой debug-спавн на обычном этаже по-прежнему получает хотя бы один
  // аффикс; buildFloor всегда передаёт точное значение из bossFloorPlan().
  const planned = requestedCount === undefined ? Math.max(1,affixCount(f)) : requestedCount;
  const n = Math.min(MAX_BOSS_AFFIXES,Math.max(0,planned),pool.length);
  for (let i = 0; i < n; i++){
    const a = pool.splice(Math.floor(Math.random()*pool.length), 1)[0];
    e.aff.push(a);
    if (a.init) a.init(e);
  }
  // Имя собирается из меток, а не из прилагательных: «оберег огня» согласовать
  // с «Глыбой» по роду невозможно, а список меток читается одинаково для всех.
  const EL = {fire:'огня', cold:'льда', lit:'молний', poi:'яда'};
  e.affNm = e.aff.map(a => a.id === 'ward' ? 'оберег ' + EL[e.ward] : a.nm).join(' · ');
}

function minotaurEdgeDistance(e, a){
  const dx=Math.cos(a), dy=Math.sin(a), edge=ARENA-e.r;
  let d=Infinity;
  if (dx > 0.0001) d=Math.min(d,(edge-e.x)/dx);
  else if (dx < -0.0001) d=Math.min(d,(-edge-e.x)/dx);
  if (dy > 0.0001) d=Math.min(d,(edge-e.y)/dy);
  else if (dy < -0.0001) d=Math.min(d,(-edge-e.y)/dy);
  return Math.max(0,d);
}

function applyTyrantBurn(cause){
  const p = G.player, fresh = !(p.bossBurnT > 0);
  p.bossBurnT = 3;
  p.bossBurnCause = cause || 'ГОРЕНИЕ РОГАТОГО ТИРАНА';
  if (fresh) p.bossBurnTick = 1;
  G.fx.push({t:'txt', x:p.x, y:p.y-28, s:'ГОРИТ', life:0.65, col:'#ff5a28'});
}

function leaveTyrantFire(e){
  if (G.bossTrails.length >= 48) G.bossTrails.shift();
  G.bossTrails.push({x:e.x, y:e.y, r:34, life:3.4, max:3.4});
}

function throwExecutionerAxe(e){
  const p = G.player, dx=p.x-e.x, dy=p.y-e.y, d=Math.max(1,Math.hypot(dx,dy)), speed=360;
  G.eshots.push({x:e.x, y:e.y, vx:dx/d*speed, vy:dy/d*speed,
    r:30, life:12, maxHpPct:0.35, sourceKind:'boss', shotType:'axe', col:'#b74735',
    cause:enemyCause(e, 'вращающийся топор'), owner:e, targetX:p.x, targetY:p.y,
    outLeft:d, axeSpeed:speed, returning:false, spin:0, hitDone:false});
  pushTimedTelegraph({shape:'target',kind:'damage',x:p.x,y:p.y,r:34},0.55);
}

function dropPlagueBossAcid(e){
  if (G.bossPools.length >= 8) G.bossPools.shift();
  G.bossPools.push({x:e.x, y:e.y, r:135, life:10, max:10, tick:1, maxHpPct:0.10});
  G.fx.push({t:'ring', x:e.x, y:e.y, r:12, max:135, life:0.65, col:'#9ddc38'});
}

function tickBossSkill(e, dt){
  const def = bossType(e);
  if (!def) return false;
  const T = e.bossT || (e.bossT = {}), p = G.player;
  if (T.vulnerable > 0) T.vulnerable=Math.max(0,T.vulnerable-dt);
  if (T.crash > 0){ T.crash=Math.max(0,T.crash-dt); return true; }
  if (e.ail.stun > 0 || e.ail.freeze > 0)
    return (e.bossId === 'goat' && T.slamWarn > 0) ||
      (e.bossId === 'behemoth' && (T.jumpWarn > 0 || T.jumpT > 0));

  if (e.bossId === 'lich'){
    T.cast = (T.cast === undefined ? 2 : T.cast) - dt;
    if (T.cast <= 0){
      T.cast += 2;
      fireBossProjectile(e, {speed:240, radius:p.r, pct:0.15, life:6,
        shotType:'lich', col:def.col, cause:'изумрудная сфера'});
      G.fx.push({t:'ring', x:e.x, y:e.y, r:8, max:42, life:0.3, col:def.col});
    }
    return false;
  }

  if (e.bossId === 'goat'){
    if (T.slamWarn > 0){
      T.slamWarn -= dt;
      if (T.slamWarn <= 0){
        T.slamWarn = 0; T.slamCd = 3 - BOSS_GOAT_WARN;
        if (dist(e,p) < BOSS_GOAT_AOE + p.r)
          hurt(D.life*0.25, false, false, enemyCause(e, 'удар по земле'), 'boss');
        pushTelegraphTrace({shape:'circle',kind:'damage',x:e.x,y:e.y,r:BOSS_GOAT_AOE});
        burst(e.x, e.y, 24, def.col, 260, 5, 0.65);
      }
      return true;
    }
    T.slamCd = (T.slamCd === undefined ? 3 - BOSS_GOAT_WARN : T.slamCd) - dt;
    if (T.slamCd <= 0){ T.slamWarn = BOSS_GOAT_WARN; return true; }
    return false;
  }

  if (e.bossId === 'plague'){
    T.spit = (T.spit === undefined ? 1 : T.spit) - dt;
    if (T.spit <= 0){
      T.spit += 1;
      fireBossProjectile(e, {speed:260, radius:8, pct:0.075, life:5,
        shotType:'slime', col:def.col, cause:'сгусток слизи'});
    }
    return false;
  }

  if (e.bossId === 'greed'){
    T.summon = (T.summon === undefined ? 1 : T.summon) - dt;
    if (T.summon <= 0){ T.summon += 1; summonGreedRunner(e); }
    T.spear = (T.spear === undefined ? 5 : T.spear) - dt;
    if (T.spear <= 0){
      T.spear += 5;
      fireBossProjectile(e, {speed:D.mspd*0.5, radius:15, pct:0.50, life:12,
        shotType:'spear', col:def.col, cause:'копьё жадности'});
    }
    return false;
  }

  if (e.bossId === 'executioner'){
    T.axe = (T.axe === undefined ? BOSS_EXECUTIONER_CD : T.axe) - dt;
    if (T.axe <= 0){ T.axe += BOSS_EXECUTIONER_CD; throwExecutionerAxe(e); }
    return false;
  }

  if (e.bossId === 'tyrant'){
    T.trail = (T.trail === undefined ? 0 : T.trail) - dt;
    if (T.trail <= 0){ T.trail += 0.34; leaveTyrantFire(e); }
    T.slash = (T.slash === undefined ? 1 : T.slash) - dt;
    if (T.slash <= 0){
      T.slash += 1;
      const a = Math.atan2(p.y-e.y, p.x-e.x);
      T.faceA = a;
      const pa = Math.atan2(p.y-e.y, p.x-e.x);
      const da = Math.abs(Math.atan2(Math.sin(pa-a), Math.cos(pa-a)));
      if (dist(e,p) <= BOSS_TYRANT_REACH + p.r && da <= BOSS_TYRANT_ARC/2){
        hurt(D.life*0.10, false, false, enemyCause(e, 'взмах меча'), 'boss');
        applyTyrantBurn(enemyCause(e, 'ГОРЕНИЕ РОГАТОГО ТИРАНА'));
      }
      G.fx.push({t:'arc', x:e.x, y:e.y, r:BOSS_TYRANT_REACH, a, arc:BOSS_TYRANT_ARC,
        life:0.28, col:'#ff5a28'});
    }
    return false;
  }

  if (e.bossId === 'grave'){
    T.summon = (T.summon === undefined ? 1 : T.summon) - dt;
    if (T.summon <= 0){ T.summon += 1; summonGraveCore(e); }
    return false;
  }

  if (e.bossId === 'behemoth'){
    if (T.jumpT > 0){
      T.jumpT = Math.max(0, T.jumpT-dt);
      const u = 1 - T.jumpT/BOSS_BEHEMOTH_FLIGHT;
      const ease = u < 0.5 ? 2*u*u : 1-Math.pow(-2*u+2,2)/2;
      e.x = T.jumpSX + (T.jumpX-T.jumpSX)*ease;
      e.y = T.jumpSY + (T.jumpY-T.jumpSY)*ease;
      if (T.jumpT <= 0){
        T.jumpCd = 3 - BOSS_BEHEMOTH_WARN - BOSS_BEHEMOTH_FLIGHT;
        pushTelegraphTrace({shape:'target',kind:'warning',x:e.x,y:e.y,r:e.r+20});
        burst(e.x, e.y, 18, def.col, 220, 5, 0.55);
      }
      return true;
    }
    if (T.jumpWarn > 0){
      T.jumpWarn = Math.max(0, T.jumpWarn-dt);
      if (T.jumpWarn <= 0){
        T.jumpSX=e.x; T.jumpSY=e.y; T.jumpT=BOSS_BEHEMOTH_FLIGHT;
        e.spriteFace = T.jumpX < e.x ? -1 : 1;
      }
      return true;
    }
    T.jumpCd = (T.jumpCd === undefined ? 3-BOSS_BEHEMOTH_WARN-BOSS_BEHEMOTH_FLIGHT : T.jumpCd) - dt;
    if (T.jumpCd <= 0){
      T.jumpWarn=BOSS_BEHEMOTH_WARN;
      T.jumpX=clamp(p.x,-ARENA+40,ARENA-40); T.jumpY=clamp(p.y,-ARENA+40,ARENA-40);
      return true;
    }
  }

  if (e.bossId === 'vampire'){
    if (T.markWarn > 0){
      T.markWarn=Math.max(0,T.markWarn-dt);
      if (T.markWarn <= 0){
        e.x=T.markX; e.y=T.markY;
        const dx=Math.abs(p.x-T.markX), dy=Math.abs(p.y-T.markY);
        if ((dx <= 105 && dy <= 22) || (dy <= 105 && dx <= 22)){
          hurt(D.life*0.30,false,false,enemyCause(e,'вампирический рывок'),'boss');
          e.hp=Math.min(e.maxHp,e.hp+e.maxHp*0.50);
          G.fx.push({t:'txt',x:e.x,y:e.y-e.r-18,s:'+50% HP',life:0.8,col:'#ef476f'});
        }
        pushTelegraphTrace({shape:'corridor',kind:'damage',x:T.markX-105,y:T.markY,x2:T.markX+105,y2:T.markY,width:44});
        pushTelegraphTrace({shape:'corridor',kind:'damage',x:T.markX,y:T.markY-105,x2:T.markX,y2:T.markY+105,width:44});
        T.markCd=BOSS_VAMPIRE_COOLDOWN;
      }
      return true;
    }
    T.markCd=(T.markCd === undefined ? BOSS_VAMPIRE_COOLDOWN : T.markCd)-dt;
    if (T.markCd <= 0){
      T.markWarn=BOSS_VAMPIRE_WARN;
      T.markX=clamp(p.x,-ARENA+e.r,ARENA-e.r); T.markY=clamp(p.y,-ARENA+e.r,ARENA-e.r);
      return true;
    }
    return false;
  }

  if (e.bossId === 'voidwrath'){
    if (T.rifts){
      for (const r of T.rifts) r.warn=Math.max(0,r.warn-dt);
      if (T.rifts[0].warn <= 0){
        let hit=false;
        for (const r of T.rifts){
          if (dist(r,p) <= r.r+p.r) hit=true;
          pushTelegraphTrace({shape:'rift',kind:'control',x:r.x,y:r.y,r:r.r});
        }
        if (hit){
          hurt(D.life*0.40,false,false,enemyCause(e,'взрыв разлома пустоты'),'boss');
          applyBossSlow(0.40,1);
        }
        T.rifts=null; T.riftCd=5;
      }
      return false;
    }
    T.riftCd=(T.riftCd === undefined ? 3 : T.riftCd)-dt;
    if (T.riftCd <= 0){
      const count=Math.floor(rnd(3,6)); T.rifts=[];
      for (let i=0;i<count;i++){
        const a=rnd(0,Math.PI*2), d=i ? rnd(55,210) : 0;
        T.rifts.push({x:clamp(p.x+Math.cos(a)*d,-ARENA+55,ARENA-55),
          y:clamp(p.y+Math.sin(a)*d,-ARENA+55,ARENA-55),r:52,warn:BOSS_VOID_WARN});
      }
    }
    return false;
  }

  if (e.bossId === 'minotaur'){
    if (T.chargeLeft > 0){
      const step=Math.min(T.chargeLeft,BOSS_MINOTAUR_CHARGE_SPEED*dt);
      e.x+=Math.cos(T.chargeA)*step; e.y+=Math.sin(T.chargeA)*step; T.chargeLeft-=step;
      if (!T.chargeHit && dist(e,p) < e.r+p.r+8){
        T.chargeHit=true;
        hurt(D.life*0.35,false,false,enemyCause(e,'неостановимый натиск'),'boss');
      }
      if (T.chargeLeft <= 0){
        e.x=clamp(e.x,-ARENA+e.r,ARENA-e.r); e.y=clamp(e.y,-ARENA+e.r,ARENA-e.r);
        T.vulnerable=BOSS_MINOTAUR_VULNERABLE; T.crash=BOSS_MINOTAUR_VULNERABLE;
        T.spearsPending=true;
        G.fx.push({t:'txt',x:e.x,y:e.y-e.r-18,s:'УЯЗВИМ',life:BOSS_MINOTAUR_VULNERABLE,col:'#ffd08a'});
      }
      return true;
    }
    if (T.chargeWarn > 0){
      T.chargeWarn=Math.max(0,T.chargeWarn-dt);
      if (T.chargeWarn <= 0){
        T.chargeLeft=minotaurEdgeDistance(e,T.chargeA); T.chargeHit=false;
        pushTelegraphTrace({shape:'corridor',kind:'damage',x:e.x,y:e.y,
          x2:e.x+Math.cos(T.chargeA)*T.chargeLeft,y2:e.y+Math.sin(T.chargeA)*T.chargeLeft,width:e.r*2+16});
      }
      return true;
    }
    if (T.spearsPending){
      T.spearsPending=false; fireMinotaurSpears(e); T.chargeCd=BOSS_MINOTAUR_RECHARGE;
      return true;
    }
    T.chargeCd=(T.chargeCd === undefined ? BOSS_MINOTAUR_RECHARGE : T.chargeCd)-dt;
    if (T.chargeCd <= 0){ T.chargeWarn=BOSS_MINOTAUR_WARN; T.chargeA=Math.atan2(p.y-e.y,p.x-e.x); return true; }
    return false;
  }

  if (e.bossId === 'seraph'){
    if (T.judgeWarn > 0){
      T.judgeWarn=Math.max(0,T.judgeWarn-dt);
      if (T.judgeWarn <= 0){
        if (Math.hypot(p.x-T.judgeX,p.y-T.judgeY) <= 68+p.r)
          hurt(D.life*0.20,false,false,enemyCause(e,'суд падшего'),'boss');
        pushTelegraphTrace({shape:'target',kind:'damage',x:T.judgeX,y:T.judgeY,r:68});
        G.fx.push({t:'judgment',x:T.judgeX,y:T.judgeY,r:68,life:0.38,col:TELEGRAPH_TYPES.damage});
        T.judgeLeft--;
        if (T.judgeLeft > 0){ T.judgeX=clamp(p.x,-ARENA+68,ARENA-68); T.judgeY=clamp(p.y,-ARENA+68,ARENA-68); T.judgeWarn=BOSS_SERAPH_WARN; }
        else T.judgeCd=3;
      }
      return false;
    }
    T.judgeCd=(T.judgeCd === undefined ? 3 : T.judgeCd)-dt;
    if (T.judgeCd <= 0){
      T.judgeLeft=3; T.judgeX=clamp(p.x,-ARENA+68,ARENA-68); T.judgeY=clamp(p.y,-ARENA+68,ARENA-68); T.judgeWarn=BOSS_SERAPH_WARN;
    }
    return false;
  }

  if (e.bossId === 'matriarch'){
    T.spawn=(T.spawn === undefined ? 1 : T.spawn)-dt;
    if (T.spawn <= 0){
      T.spawn+=1;
      summonMatriarchRunner(e);
      summonMatriarchRunner(e);
    }
    return false;
  }

  if (e.bossId === 'demonqueen'){
    if (T.leapWarn > 0){
      T.leapWarn=Math.max(0,T.leapWarn-dt);
      if (T.leapWarn <= 0){
        e.x=T.leapX; e.y=T.leapY; T.hidden=false;
        if (dist(e,p) <= 115+p.r){ hurt(D.life*0.35,false,false,enemyCause(e,'демонический прыжок'),'boss'); applyBossSlow(0.50,2); }
        pushTelegraphTrace({shape:'target',kind:'control',x:e.x,y:e.y,r:115});
        burst(e.x,e.y,20,def.col,240,5,0.6); T.leapCd=5;
      }
      return true;
    }
    T.leapCd=(T.leapCd === undefined ? 5 : T.leapCd)-dt;
    if (T.leapCd <= 0){
      T.leapX=clamp(p.x,-ARENA+115,ARENA-115); T.leapY=clamp(p.y,-ARENA+115,ARENA-115);
      T.leapWarn=BOSS_QUEEN_WARN; T.hidden=true; return true;
    }
    return false;
  }
  return false;
}

/* Общее снижение входящего урона у врага: обычная броня плюс панцирь.
   Вынесено отдельно, потому что путей урона два — игрок и свита. */
function mitigate(e, total, minionShare=0, skipConstellation=false){
  total *= 1 - e.armor/(e.armor + 60);
  const eliteDef=eliteVariantDef(e);
  if (eliteDef && eliteDef.playerTaken && !minionShare) total*=eliteDef.playerTaken;
  if (e.kind === 'boss' && e.bossId === 'minotaur')
    total *= e.bossT && e.bossT.vulnerable > 0 ? 1.40 : 0.20;
  if (e.bulwark) total *= total / (total + e.bulwark);
  if (e.pack) total = packTaken(e, total, minionShare, skipConstellation); // броня пачки, связь, кровная связь
  return total;
}

/* Прогон аффиксов в кадре. true означает, что движение врага забрал аффикс. */
function tickAffixes(e, dt, tgt, edmg){
  let lock = false;
  for (const a of e.aff) if (a.tick && a.tick(e, dt, tgt, edmg)) lock = true;
  return lock;
}

/* ---------- 5c. ПАЧКИ ЭЛИТЫ ----------
   Пачка — это группа элитных монстров, которые появляются вместе и делят
   между собой набор аффиксов. Отличие от мини-босса принципиальное: у босса
   аффикс меняет поведение одной крупной цели, у пачки — задаёт порядок,
   в котором цели надо убивать. Отсюда роли: маяк, матка, командир, авангард —
   всё это ответ на вопрос «кого первым», а не «куда встать».

   Формат записи (все поля кроме id/nm/col/nt необязательны):
     role       — аффикс требует одного носителя; движок сам выберет монстра
     initRole   — разовая правка носителя роли
     init       — разовая правка каждого монстра пачки
     tick       — поведение монстра в кадре; true забирает движение себе
     packTick   — поведение пачки целиком, один раз за кадр
     spd/dmg/aspd — множители в кадре, функция (монстр, пачка)
     taken      — правка входящего урона, функция (монстр, урон) -> урон
     dealt      — урон прошёл по игроку, функция (пачка, величина)
     onDeath    — монстр пачки погиб
*/
const healEnemy = (e, v) => { if (!e.dead) e.hp = Math.min(e.maxHp, e.hp + v); };

/* Потолок на суммарное лечение пачки, доля здоровья в секунду.
   Замер на этаже 51 (10 аффиксов): три лечащих аффикса складывались в 6%/сек
   при том, что урон, растекающийся по пятерым, доходит до одного монстра
   примерно как 3%/сек — пачка становилась буквально неубиваемой (прогон
   упирался в потолок 300 сек, не сняв и половины). Со всеми аффиксами, кроме
   лечащих, тот же прогон давал ×3.8 запаса, то есть тяжело, но конечно.
   Поэтому источники складываются, а итог режется одним числом. */
const PACK_REGEN_CAP = 0.025;
/* Аффиксы не лечат напрямую, а копят проценты за кадр — иначе потолок
   пришлось бы знать каждому из них по отдельности. */
const packRegen = (e, pct) => { e.regPct = (e.regPct || 0) + pct; };
const packRole  = (pk, role) => { const m = pk.role[role]; return (m && !m.dead) ? m : null; };
const packLive  = pk => pk.members.filter(m => !m.dead);

const PACK_AFFIXES = [

  { id:'berserk', nm:'берсеркеры', col:'#ff7a2f',
    nt:'чем меньше здоровья осталось, тем быстрее и сильнее бьют',
    // Множитель растёт линейно до +60% на нуле здоровья. Больше нельзя:
    // добивание раненого и так самая опасная фаза, а пачка бьёт вчетвером.
    spd:e => 1 + (1 - e.hp/e.maxHp)*0.6,
    dmg:e => 1 + (1 - e.hp/e.maxHp)*0.6 },

  { id:'armored', nm:'бронированные', col:'#9aa7b4',
    nt:'−50% получаемого урона, пока выше половины здоровья',
    taken:(e, t) => e.hp/e.maxHp > 0.5 ? t*0.5 : t },

  { id:'regen', nm:'регенераторы', col:'#6fd98f',
    nt:'2.5% здоровья в секунду, пока по ним не попадают',
    tick(e, dt){ if (e.noDmgT > 1.5) packRegen(e, 0.025); } },

  { id:'vamp', nm:'вампиры', col:'#e0405a',
    nt:'урон, прошедший по игроку, лечит всю пачку — доля делится на всех',
    // 0.6 на каждого означало, что впятером они возвращают 300% удара за раз:
    // пачка в контакте с игроком лечилась быстрее, чем её успевали убивать.
    dealt(pk, v){
      const live = packLive(pk);
      for (const m of live) healEnemy(m, v*0.35/live.length);
    } },

  { id:'avenger', nm:'мстители', col:'#ffd24a',
    nt:'смерть одного разгоняет соседей: +30% скорости и урона на 6 сек',
    onDeath(e){
      for (const o of G.enemies) if (o !== e && dist(o, e) < 260) o.rage = 6;
      G.fx.push({t:'ring', x:e.x, y:e.y, r:10, max:260, life:0.5, col:'#ffd24a'});
    } },

  { id:'jumper', nm:'прыгуны', col:'#c08cff',
    nt:'раз в 3.5 сек один прыгает игроку под ноги',
    packTick(pk, dt){
      pk.jumpT = (pk.jumpT || 0) - dt;
      if (pk.jumpT > 0) return;
      pk.jumpT = 3.5;
      const live = packLive(pk).filter(m => !m.jumpTo);
      if (!live.length) return;
      const m = pick(live), p = G.player;
      m.jumpTo = {x:p.x, y:p.y}; m.jumpT = 0.5;              // замах: игрок успевает отойти
    },
    tick(e, dt){
      if (!e.jumpTo) return false;
      if (e.jumpT > 0){
        e.jumpT -= dt;
        if (Math.random() < 0.4) burst(e.x,e.y,2,'#c08cff',70,3,0.3);
        if (e.jumpT <= 0) pushTelegraphTrace({shape:'target',kind:'warning',x:e.jumpTo.x,y:e.jumpTo.y,r:54});
        return true;
      }
      const dx = e.jumpTo.x - e.x, dy = e.jumpTo.y - e.y, d = Math.hypot(dx,dy) || 1;
      const stp = 900*dt;
      if (d <= stp){ e.x = e.jumpTo.x; e.y = e.jumpTo.y; e.jumpTo = null; burst(e.x,e.y,8,'#c08cff',180,3,0.4); }
      else { e.x += dx/d*stp; e.y += dy/d*stp; }
      return true;
    } },

  { id:'hunter', nm:'охотники', col:'#ff5a4e', role:'hunter', mark:'\u25B2',

    onDeath(e){

      for (let i = 0; i < 2; i++) packClone(e, {hp:0.3, r:0.6, dmg:0.6});
    } },

  { id:'hive', nm:'улей', col:'#d95ec2', role:'queen', mark:'\u2739',
    nt:'пока матка жива, вся пачка восстанавливает 1.2% здоровья в секунду',
    tick(e, dt, tgt, edmg, pk){ if (packRole(pk,'queen')) packRegen(e, 0.012); } },

  { id:'linked', nm:'связанные', col:'#5ec2e0',
    nt:'−30% получаемого урона, пока рядом стоит свой',
    taken(e, t){
      for (const m of e.pack.members) if (m !== e && !m.dead && dist(m,e) < 150) return t*0.7;
      return t;
    } },

  { id:'bloodbond', nm:'кровная связь', col:'#e0405a',
    nt:'80% урона по одному растекается на остальных — общий урон тот же, но убить кого-то одного нельзя',
    taken(e, t, minionShare, skipConstellation){
      const others = e.pack.members.filter(m => m !== e && !m.dead && m.hp > 0);
      if (!others.length) return t;                            // последний в пачке получает всё сам

  { id:'beacon', nm:'маяк', col:'#ffe14a', role:'beacon', mark:'\u25C8',

      const p = G.player, a = Math.atan2(p.y-e.y, p.x-e.x);

    nt:'каждые 2 сек заново бросают кости: скорость, размер, урон, курс и способ атаки',
    tick(e, dt){
      e.madT = (e.madT || 0) - dt;
      if (e.madT > 0) return false;
      e.madT = 2;
      e.madSpd = rnd(0.6, 1.7); e.madDmg = rnd(0.6, 1.7);

      e.madRanged = Math.random() < 0.3;                       // «тип атаки»
      e.madA = Math.random() < 0.4 ? rnd(-1.3, 1.3) : 0;       // «направление движения»: идёт криво

/* Сколько аффиксов у пачки: по одному на каждые пять этажей. */
function packAffixCount(f){
  // Маска босса добавляет аффикс всем последующим пачкам — предмет находится
  // посреди партии, а пачка собирается на входе в этаж, значит действует со следующего
  const bonus = (G && G.amu && G.amu.bmask) ? 1 : 0;
  return Math.min(Math.floor(f/5) + bonus, PACK_AFFIXES.length);
}

const PACK_COLS = ['#d95ec2','#5ec2e0','#8be04e','#ffb340','#c08cff','#ff5a4e'];

function spawnPack(f){
  const n = 4 + (f >= 20 ? 1 : 0) + (f >= 40 ? 1 : 0);
  const pk = {aff:[], has:{}, role:{}, members:[], nm:'', col:pick(PACK_COLS)};
  // Пачка выходит кучей из одной точки: в этом весь смысл ролей — если бы
  // монстры расползлись по арене, маяк и командир не встретились бы со своими.
  const ang = rnd(0, Math.PI*2), rad = rnd(520, 700), p = G.player;
  const cx = clamp(p.x + Math.cos(ang)*rad, -ARENA+80, ARENA-80);
  const cy = clamp(p.y + Math.sin(ang)*rad, -ARENA+80, ARENA-80);
  for (let i = 0; i < n; i++){
    const e = spawnEnemy('pack');
    e.x = clamp(cx + rnd(-46,46), -ARENA+40, ARENA-40);
    e.y = clamp(cy + rnd(-46,46), -ARENA+40, ARENA-40);
    e.pack = pk; pk.members.push(e);
  }
  applyPackAffixes(pk, f);
  G.packs.push(pk);
  return pk;
}

function applyPackAffixes(pk, f){
  const pool = PACK_AFFIXES.slice();
  const n = packAffixCount(f);
  for (let i = 0; i < n && pool.length; i++)
    pk.aff.push(pool.splice(Math.floor(Math.random()*pool.length), 1)[0]);
  for (const a of pk.aff) pk.has[a.id] = true;
  // Роли раздаём тому, у кого их меньше. Если ролей больше, чем монстров,
  // один тащит несколько — это честнее, чем молча потерять аффикс.
  for (const a of pk.aff){
    if (!a.role) continue;
    const m = pk.members.slice().sort((x,y)=> x.roles.length - y.roles.length)[0];
    if (!m) continue;
    m.roles.push(a.role); pk.role[a.role] = m;
    if (a.initRole) a.initRole(m, pk);
  }
  for (const a of pk.aff) if (a.init) for (const m of pk.members) a.init(m, pk);
  pk.nm = pk.aff.map(a => a.nm).join(' \u00B7 ');
}

/* Множители кадра. Все аффиксы собираются в одну функцию: иначе каждый лез бы
   в цикл врагов отдельной строчкой и цикл стало бы невозможно читать. */
function packMods(e){
  const pk = e.pack, m = {spd:1, dmg:1, aspd:1};
  for (const a of pk.aff){
    if (a.spd)  m.spd  *= a.spd(e, pk);
    if (a.dmg)  m.dmg  *= a.dmg(e, pk);
    if (a.aspd) m.aspd *= a.aspd(e, pk);
  }
  return m;
}

function packTick(e, dt, tgt, edmg){
  let lock = false;
  e.regPct = 0;
  for (const a of e.pack.aff) if (a.tick && a.tick(e, dt, tgt, edmg, e.pack)) lock = true;
  if (e.regPct) healEnemy(e, e.maxHp * Math.min(e.regPct, PACK_REGEN_CAP) * dt);
  return lock;
}

/* Правка входящего урона. Зовётся из mitigate(), то есть покрывает и удары
   игрока, и удары свиты — оба пути урона идут через неё. */
function packTaken(e, total, minionShare=0, skipConstellation=false){
  for (const a of e.pack.aff) if (a.taken) total = a.taken(e, total, minionShare, skipConstellation);
  return total;
}

/* Урон прошёл по игроку — сообщаем пачке (вампиры). */
function packDealt(pk, v){ if (pk) for (const a of pk.aff) if (a.dealt) a.dealt(pk, v); }

/* АВАНГАРД: часть попаданий по пачке уходит в передового вместо цели. */
function packRedirect(e){
  if (!e.pack || !e.pack.has.vanguard) return e;
  const v = packRole(e.pack, 'vanguard');
  if (!v || v === e || Math.random() > 0.35) return e;
  G.fx.push({t:'ring', x:v.x, y:v.y, r:v.r, max:v.r+9, life:0.16, col:'#9aa7b4'});
  return v;
}

/* Копия монстра: размножение и разделение. Поля со ссылками копируем вручную —
   Object.assign отдал бы детям те же объекты статусов, что и родителю. */
function packClone(src, {hp, r, dmg}){
  const c = Object.assign({}, src);
  c.ail = {chill:0, shock:0, stun:0, freeze:0, dizzy:0};
  c.dots = {fire:{dps:0,minionDps:0,n:0,dur:3}, poison:{dps:0,minionDps:0,n:0,dur:4}, bleed:{dps:0,minionDps:0,n:0,dur:6}};
  c.dotAcc = {fire:0, poison:0, bleed:0};
  c.plague = null;
  c.kb = {x:0, y:0}; c.roles = []; c.aff = [];
  c.dead = false; c.jumpTo = null; c.noBreed = true; c.didSplit = true;
  c.maxHp = Math.max(1, Math.round(src.maxHp*hp)); c.hp = c.maxHp;
  c.r = src.r*r; c.r0 = c.r; c.dmg = src.dmg*dmg;
  // Копии считаются рядовыми: иначе «размножение» превращалось бы в станок
  // по золоту — четыре элиты рожают восемь элитных выплат из воздуха.
  c.kind = 'norm'; c.xp = Math.max(1, Math.round(src.xp*0.3)); c.armor = 0;
  c.eliteVariant = null; c.t=ETYPES[c.typeKey]||c.t; // рядовая копия не наследует особый вид и контакт
  c.x = clamp(src.x + rnd(-26,26), -ARENA+40, ARENA-40);
  c.y = clamp(src.y + rnd(-26,26), -ARENA+40, ARENA-40);
  G.enemies.push(c);
  if (c.pack) c.pack.members.push(c);
  return c;
}

/* РАЗДЕЛЯЮЩИЕСЯ: на половине здоровья один жирный превращается в двух тощих. */
function packSplit(e){
  e.didSplit = true;
  const half = packClone(e, {hp:0.4, r:0.78, dmg:0.75});
  half.didSplit = true;
  e.maxHp = Math.max(1, Math.round(e.maxHp*0.4)); e.hp = e.maxHp;
  e.r *= 0.78; e.r0 = e.r; e.dmg *= 0.75;
  burst(e.x, e.y, 12, '#7fd6ff', 220, 3, 0.5);
}

/* Смерть монстра пачки: снимаем с учёта и запускаем предсмертные аффиксы. */
function packDeath(e){
  e.dead = true;
  const pk = e.pack;
  const i = pk.members.indexOf(e); if (i >= 0) pk.members.splice(i,1);
  for (const a of pk.aff) if (a.onDeath) a.onDeath(e, pk);
}

/* Группа размещается совместно: сначала максимизируем дистанцию до игрока,
   затем — свободный зазор между уже поставленными боссами. Так крупные модели
   не склеиваются после clamp() у стены арены. */
function placeBossFloorGroup(bosses){
  const p=G.player, placed=[];
  for (let i=0;i<bosses.length;i++){
    const e=bosses[i]; let bestX=e.x,bestY=e.y,bestScore=-Infinity;
    for (let k=0;k<72;k++){
      const ring=540+(k%3)*120;
      const a=Math.PI*2*((k/72)+(i/Math.max(1,bosses.length)));
      const margin=Math.max(40,e.r+8);
      const x=clamp(p.x+Math.cos(a)*ring,-ARENA+margin,ARENA-margin);
      const y=clamp(p.y+Math.sin(a)*ring,-ARENA+margin,ARENA-margin);
      let score=Math.hypot(x-p.x,y-p.y)-p.r-e.r;
      for (let j=0;j<placed.length;j++){
        const o=placed[j];
        score=Math.min(score,Math.hypot(x-o.x,y-o.y)-e.r-o.r);
      }
      if (score>bestScore){ bestScore=score; bestX=x; bestY=y; }
    }
    e.x=bestX; e.y=bestY; e.spriteFace=e.x<p.x?1:-1; placed.push(e);
  }
  return bosses;
}

function buildFloor(){
  /* Пересчёт на входе в этаж. Раньше recalc() звался только при взятии карточки
     или книги, и этого хватало: от этажа не зависело ничего. Теперь от него
     зависит здоровье свиты, и без этой строки приспешники получали бы запас
     того этажа, на котором игрок последний раз брал уровень. */
  recalc();
  const f = G.floor, plan = bossFloorPlan(f);
  G.bossFloorPlan = plan;
  G.enemies.length = 0; G.eshots.length = 0; G.portal = null;
  G.pools.length = 0;                                // лужи смолы не переносятся между этажами
  G.trails.length = 0;
  G.boils.length = 0;
  G.acidPools.length = 0;
  G.eliteAcidPools.length = 0;
  G.bossPools.length = 0;
  G.bossTrails.length = 0;
  G.arcaneTraces.length = 0;
  G.packs.length = 0;
  G.banner = false;
  // Врагов на этаже: было 7 + этаж*2.4. Подняли до 4.0 — этаж стал длиннее,
  // а опыта, золота и находок с него больше. Это и есть замена силе удара.
  G.spawnQueue = plan.suppressRegularEnemies ? 0 :
    Math.round((7 + Math.floor(f*4.0)) * D.monsterMore);   // книга монстров густит волны
  if (plan.isBossFloor && !plan.suppressRegularEnemies) G.spawnQueue += 4;
  G.spawnT = 0;
  if (plan.isBossFloor){
    const usedBossTypes = [], bosses=[];
    for (let i = 0; i < plan.bossCount; i++){
      const key = rollBossType(usedBossTypes); usedBossTypes.push(key);
      bosses.push(spawnEnemy('boss',key,null,plan.affixCount));
    }
    placeBossFloorGroup(bosses);
    // Имя, HP, редкость и короткие особенности уже постоянно видны в Boss HUD.
    // При появлении босса остаётся только обычное компактное уведомление этажа.
    toast('ЭТАЖ ' + f);
  } else if (packAffixCount(f) > 0){
    // Пачка выходит на этажах без босса: два таких события в одной комнате
    // не читаются — игрок не поймёт, кто именно его убил.
    const pk = spawnPack(f);
    G.spawnQueue = Math.max(4, G.spawnQueue - pk.members.length);   // общее население этажа держим прежним
    toast('ЭТАЖ ' + f + '  ·  ПАЧКА  ·  ' + pk.nm);
  } else toast('ЭТАЖ ' + f);
}

/* Масштабирование сложности: бесконечное, но плавное.
   HP растёт на 16%, урон — на 15% за этаж: здоровье чуть сильнее увеличивает
   длительность боя, а урон формирует целевую стену около двадцатого этажа
   для нового игрока без магазина. Обе цифры возводятся в степень этажа,
   поэтому после каждой правки обязательны замеры глубины и ваншотов. */
const hpScale  = f => Math.pow(1.16, f-1);
const dmgScale = f => Math.pow(1.15, f-1);

function spawnEnemy(kind, requestedBossType, requestedEliteVariant, requestedBossAffixCount){
  const f = G.floor;
  let t, typeKey = 'tank', elite = false, boss = false, bossId = null, bossDef = null;
  if (kind === 'boss'){
    boss = true; bossId = requestedBossType && BOSS_TYPES[requestedBossType] ? requestedBossType : rollBossType();
    bossDef = BOSS_TYPES[bossId];
    t = Object.assign({}, ETYPES.tank, {nm:bossDef.nm});
  }
  else if (kind==='pack' && requestedEliteVariant && ELITE_VARIANTS[requestedEliteVariant]){
    elite=true; typeKey=ELITE_VARIANTS[requestedEliteVariant].base; t=ETYPES[typeKey];
  }
  else if (kind && ETYPES[kind]){ typeKey = kind; t = ETYPES[typeKey]; }
  else {
    const pool = ['blob','blob','runner'];
    if (f >= 2) pool.push('shooter');
    if (f >= 3) pool.push('tank','runner');
    typeKey = pick(pool); t = ETYPES[typeKey];
    elite = kind === 'pack' || (f >= 3 && Math.random() < 0.10 + f*0.008);
  }
  const p = G.player;
  /* Точка появления. Было rnd(420,700) — на широком мониторе половина ширины
     экрана это 640, то есть враги проступали прямо на виду у игрока.
     Стало 650..950: на краю экрана и чуть за ним — видно, как подходят,
     но на голову не сваливаются. Проверенные 900..1250 давали десять секунд
     ходу и делали стрелковые классы вдвое живучее: половину волны успевали
     снять на подходе.

     Угол выбираем не случайно один раз, а лучшим из восьми: арена всего
     3000x3000, и у стены clamp() сплющивал бы все точки в край рядом с игроком.
     Берём тот из вариантов, который дальше всего от него. */
  let bx = 0, by = 0, bd = -1;
  for (let k = 0; k < 8; k++){
    const ang = rnd(0, Math.PI*2), rad = rnd(650, 950);
    const x = clamp(p.x + Math.cos(ang)*rad, -ARENA+40, ARENA-40);
    const y = clamp(p.y + Math.sin(ang)*rad, -ARENA+40, ARENA-40);
    const d = Math.hypot(x - p.x, y - p.y);
    if (d > bd){ bd = d; bx = x; by = y; }
    if (d > 620) break;                       // достаточно далеко — не перебираем дальше
  }
  /* Страховка на угол арены. Если игрок вжат в угол, все восемь бросков могут
     уйти в ту же четверть и склеиться clamp() у него под ногами: замер ловил
     появление в 57 единицах. Тогда отправляем врага в сторону центра арены —
     это направление всегда свободно, потому что игрок стоит у края. */
  if (bd < 520){
    const a2 = Math.atan2(-p.y, -p.x) + rnd(-0.7, 0.7);
    bx = clamp(p.x + Math.cos(a2)*760, -ARENA+40, ARENA-40);
    by = clamp(p.y + Math.sin(a2)*760, -ARENA+40, ARENA-40);
  }
  const e = {
    t, typeKey, kind: boss?'boss':(elite?'elite':'norm'), bossId, bossT:{},
    x: bx, y: by,
    r: t.r * (boss?2.6:elite?1.45:1),
    hp:0, maxHp:0, spd:0, dmg:0, xp:0,
    cd: rnd(0.5,2), rot: rnd(0,6.28), hit:0, kb:{x:0,y:0},
    spriteFace: bx < p.x ? 1 : -1, animT:rnd(0,4),
    ail:{chill:0, shock:0, stun:0, freeze:0, dizzy:0}, armor:0, infT:0,
    dots:{fire:{dps:0,minionDps:0,n:0,dur:3}, poison:{dps:0,minionDps:0,n:0,dur:4}, bleed:{dps:0,minionDps:0,n:0,dur:6}},
    dotAcc:{fire:0, poison:0, bleed:0}, dotT:0, orbCd:0,
    plague:null,                              // отдельный процентный DoT от чумного взрыва
    aff:[], affT:{}, affNm:'', ward:null, wardCol:null, bulwark:0,   // аффиксы мини-босса
    pack:null, roles:[], dead:false, rage:0, noDmgT:0, r0:0, tauntMinion:null, // пачка / цель провокации
    jumpTo:null, jumpT:0, didSplit:false, noBreed:false, madT:0, madA:0,
  };
  const mul = boss ? 14 : elite ? 3.2 : 1;
  e.maxHp = e.hp = Math.round(t.hp * mul * hpScale(f));
  // Boss HUD хранит прошлое здоровье в самом экземпляре: при двух боссах
  // светлые delayed-полосы обновляются независимо и не требуют DOM-состояния.
  if (boss){ e.hudHpLag=1; e.hudHpFrom=1; e.hudHpLast=1; e.hudHpTimer=0; }
  // spd в ETYPES — итоговая скорость в единицах/сек, без скрытого общего множителя.
  // Элита на 10% медленнее, а каждый ранее убитый босс добавляет всем следующим 2%.
  const bossBaseSpeed = bossDef && bossDef.spd === 'player' ? D.mspd : bossDef ? bossDef.spd : BOSS_SPEED;
  e.spd = (boss ? bossBaseSpeed : t.spd * (elite?0.9:1)) * (1 + G.bossKills*0.02);
  e.dmg = t.dmg * (boss?1.9:elite?1.3:1) * dmgScale(f);
  if (elite) applyEliteVariant(e,requestedEliteVariant);
  e.xp  = Math.round(t.xp * (boss?18:elite?4:1) * (1 + f*0.12));
  e.armor = elite||boss ? 8 + f*1.5 : 0;
  e.r0 = e.r;                            // исходный радиус: «безумные» его крутят
  if (boss) applyAffixes(e,f,requestedBossAffixCount); // панцирь режет уже готовое hp
  G.enemies.push(e);
  return e;
}

/* ---------- 6. НАНЕСЕНИЕ УРОНА ---------- */
/* Собирает все условные модификаторы в один процент и применяет формулу */
function momentumDamageInc(p=G && G.player){
  return p && amu('momentum') ? Math.min(40,Math.floor(p.moveT/2)*4) : 0;
}
/* src — кто бьёт. Условия про состояние хозяина (движение, здоровье, недавнее
   убийство) остаются про хозяина: это его состояние, свита им пользуется.
   Число врагов рядом считается вокруг непосредственного источника удара. */
function conditionalInc(e, src){
  const b = G.bag, p = G.player, from = (src && src.minion) || p; let inc = 0;
  if (e.hp / e.maxHp <= INJURED_HP_THRESHOLD) inc += b.sum('vsLow');
  if (e.hp >= e.maxHp)       inc += b.sum('vsFull');
  if (e.kind !== 'norm')     inc += b.sum('vsBoss');
  if (isEnemySlowed(e))      inc += b.sum('vsSlowed');
  if (p.moving)              inc += b.sum('whMove');
  if (p.stillT > 0.6)        inc += b.sum('whStill');
  if (amu('runner') && p.stillT > 1) inc += 20;         // талисман бегуна: награда за остановку
  // КОГТИ БЕРСЕРКА: по одному проценту за каждые полные 10% потерянного здоровья
  if (amu('claws')) inc += Math.floor((1 - p.hp/D.life) * 10);
  // КОЛЬЦО ДОБИВАНИЯ
  if (amu('exec') && e.hp/e.maxHp < 0.20) inc += 50;
  /* ТОТЕМЫ. Стоят здесь, а не в D.incAll, ровно потому, что процент условный:
     он смотрит на состояние цели. Заодно это значит, что тотемы работают
     и на удары свиты — conditionalInc общий для всех источников урона. */
  if (G.totems){
    if (e.dots.fire.dps   > 0) inc += totemVal('fire');
    if (e.ail.freeze      > 0) inc += totemVal('freeze');
    if (e.dots.poison.dps > 0) inc += totemVal('poison');
    if (e.dots.bleed.dps  > 0) inc += totemVal('blood');
  }
  // РАЗГОН: считаем полные двухсекундные отрезки непрерывного бега
  inc += momentumDamageInc(p);
  // ОСАДНЫЙ ОГОНЬ: платой за +70% идёт половина скорости, см. движение игрока
  if (amu('siege') && p.stillT > 1.5) inc += 70;
  // ГЛАЗ ХИЩНИКА
  if (amu('predator') && p.predT > 0) inc += 20;
  // ОСКОЛОК БОССА: потолок в десять элит поставлен мной — без него комната
  // с элитной пачкой давала бы +100% и больше на ровном месте
  if (amu('shard')){
    let el = 0;
    for (const o of G.enemies) if (o.kind !== 'norm' && dist(o,p) < 250 && ++el >= 10) break;
    inc += el*5;
  }
  if (p.killT > 0)           inc += b.sum('afterKill');
  const near = b.sum('perNear');
  if (near) inc += near * nearbyDamageEnemyCount(from);
  const ramp = b.sum('ramp');
  if (ramp) inc += Math.min(40, ramp * p.combatT);
  return inc;
}

/* Сопротивление именно обычному отбрасыванию от навыка. Шанс срабатывания
   не режется — уменьшается сила импульса. Более высокий класс врага важнее
   геометрии: элитный Бегун получает элитные 50%, а не обычные 70%. */
function knockbackScale(e){
  if (e.kind === 'boss') return 0.10;
  if (e.kind === 'elite') return 0.50;
  if (e.typeKey === 'runner') return 0.70;
  return 1;
}

/* КОСТЯНОЙ ВЫЗОВ: бросок делается на каждый фактический прямой удар свиты.
   Цель запоминает именно ударившего бойца и держит агро, пока тот остаётся жив.
   Снаряд погибшего приспешника не может создать уже недостижимую цель. */
function rollBoneChallenge(e, m){
  if (!D.boneChallenge || !e || e.dead || !m || m.hp <= 0 || G.minions.indexOf(m) < 0)
    return false;
  if (Math.random() >= 0.01) return false;
  e.tauntMinion = m;
  statusText(e, 'ВЫЗОВ', '#ff9b32');
  G.fx.push({t:'ring', x:m.x, y:m.y, r:m.r, max:m.r+24, life:0.3, col:'#ff9b32'});
  return true;
}

/* ПОЛЕ КОСТЕЙ: условный процент считается от позиции хозяина, а не каждого
   приспешника. Так весь отряд получает один понятный бонус, совпадающий с HUD.
   Труп на самой границе радиуса учитывается; после пятнадцатого счёт прекращается. */
function nearbyBoneFieldCorpseCount(from=G && G.player){
  if (!G || !from || !G.corpses) return 0;
  let n=0;
  for (const c of G.corpses) if (dist(c,from)<=400 && ++n>=15) return 15;
  return n;
}
function boneFieldDamageInc(from=G && G.player){
  return D && D.boneField>0 ? D.boneField*nearbyBoneFieldCorpseCount(from) : 0;
}
function boneFieldDamageMul(from=G && G.player){ return 1+boneFieldDamageInc(from)/100; }

function queueAttackEcho(e, src){
  const echoSrc=Object.assign({},src,{
    direct:true, noEcho:true, noDouble:true,
    echoMul:(src.echoMul===undefined?1:src.echoMul)*0.30,
  });
  G.attackEchoes.push({fireAt:G.time+0.18,target:e,src:echoSrc});
}

function damage(e, src){
  const b = G.bag, p = G.player;
  e = packRedirect(e);            // авангард может принять удар на себя вместо своего
  if (src.direct && D.attackEcho && !src.noEcho){
    p.attackEchoN=(p.attackEchoN||0)+1;
    if (p.attackEchoN%4===0) queueAttackEcho(e,src);
  }
  let base = rnd(D.baseMin, D.baseMax) * (src.mul || 1);
  if (b.has('lucky')) base = Math.max(base, rnd(D.baseMin, D.baseMax) * (src.mul||1));

  const el = D.elem;
  // ОБЕРЕГ: одна стихия срезается на 60% до всех умножений — то есть бьёт
  // ровно по флэту, который в этой системе и есть главный источник урона стихией
  const wd = e.ward ? 0.4 : 1;
  let total = (base
    + el.fire * (e.ward==='fire'?wd:1) + el.cold * (e.ward==='cold'?wd:1)
    + el.lit  * (e.ward==='lit' ?wd:1) + el.poi  * (e.ward==='poi' ?wd:1));
  // attackMul масштабирует всю автоатаку целиком, включая плоские стихии.
  // Обычный mul исторически относится только к базе и оставлен для других эффектов.
  if (src.attackMul !== undefined) total *= src.attackMul;
  if (src.echoMul !== undefined) total *= src.echoMul;
  let woundInc=0;
  if (src.directMelee && D.openWound > 0){
    const active=(e.openWoundUntil||0)>G.time;
    e.openWoundStacks=active?Math.min(5,(e.openWoundStacks||0)+1):0;
    e.openWoundUntil=G.time+1;
    woundInc=e.openWoundStacks*D.openWound;
  }
  total *= (1 + (D.incAll + conditionalInc(e, src) + (src.warriorMelee ? D.warriorMeleeInc : 0) + woundInc +
    (src.rangedInc||0) + (src.minion ? boneFieldDamageInc() : 0))/100) * D.moreAll;
  if (src.minion) total *= MINION_DAMAGE_MULT;       // режет весь удар, включая унаследованные стихии

  // Крит: два ролла при crit.lucky, сверхкрит сверху.
  // У свиты свой шанс (D.minCrit), в который уже вложена доля наследования
  const massDirect=D.criticalMass && !D.noCrit && src.direct;
  const critCh = Math.min(100,(src.minion ? D.minCrit : D.critCh)+(massDirect?(p.criticalMass||0):0));
  let isCrit = false;
  if (critCh > 0){
    isCrit = Math.random()*100 < critCh;
    if (!isCrit && b.has('critLucky')) isCrit = Math.random()*100 < critCh;
  }
  // КРИТИЧЕСКИЙ ПРИЦЕЛ и ЦЕПЬ КРИТОВ добавляют шанс поверх собранного
  let critBonus = 0;
  if (amu('critaim') && p.stillT > 1) critBonus += 25;
  if (amu('critchain')) critBonus += 10 * (p.critChain || 0);
  if (critBonus && !isCrit) isCrit = Math.random()*100 < critBonus;
  // ТРИЕДИНСТВО: три стихии на одной цели — крит без броска
  if (amu('trinity') && e.dots.fire.dps > 0 && e.ail.chill > 0 && e.dots.poison.dps > 0){
    isCrit = true; statusText(e, 'ТРИАДА', '#c08cff');
  }
  // Счётчик ударов один на всех: три предмета считают «каждый N-й», и если бы
  // каждый вёл свой счёт, их периоды зависели бы от того, в каком порядке найдены
  p.hitN = (p.hitN || 0) + 1;
  if (amu('bone') && p.hitN % 20 === 0){ isCrit = true; statusText(e, 'x20', '#ffd24a'); }
  if (massDirect) p.criticalMass=isCrit?0:(p.criticalMass||0)+1;
  if (isCrit){
    G.stats.crits++;
    total *= D.critMul/100;
    if (Math.random()*100 < D.superCh){                          // СВЕРХКРИТ
      total *= 2;
      addBleed(e, total*0.03*D.ailEff, src.minion ? 1 : 0);      // 3% от удара в секунду, стакается
      burst(e.x, e.y, 8, '#e0405a', 200, 3, 0.5);
    }
    if (D.onCrit) heal(D.onCrit);
    // КРИТИЧЕСКАЯ МАССА
    if (amu('critmass')) nova(e.x, e.y, 55*D.aoeR, total*0.5, '#ff9a2f', {minionShare:src.minion?1:0});
    if (amu('critchain')) p.critChain = Math.min(3, (p.critChain||0) + 1);
  } else if (amu('critchain')) p.critChain = 0;   // цепь рвётся на первом же некрите
  // Урон в размере % от максимального HP цели — против «жирных»
  if (b.flat('pctHp')) total += e.maxHp * b.flat('pctHp')/100;
  // Стихийный контроль оставляет небольшие отдельные множители. Полная заморозка
  // добавляет свой x1.10 поверх x1.10 охлаждения, пока оба статуса активны.
  if (e.ail.shock > 0) total *= SHOCK_TAKEN;
  if (e.ail.chill > 0) total *= CHILL_TAKEN;
  if (e.ail.freeze > 0) total *= FREEZE_TAKEN;
  // РУКА ПАЛАЧА: множитель поверх формулы, иначе удвоение растворилось бы
  if (amu('headsman') && e.hp/e.maxHp < 0.15) total *= 2;
  // КОНТРУДАР: заряд тратится на первый же удар игрока, свите не достаётся
  if (amu('riposte') && p.riposte && !src.minion){
    p.riposte = false; total *= 2.5;
    statusText(e, 'КОНТРУДАР', '#e0405a');
  }
  // КОЛЬЦО ДУЭЛИ: множитель именно more — он идёт поверх всей формулы,
  // иначе «x1.75» растворилось бы среди сотен процентов у собранного билда
  if (amu('duel')){
    let near = 0;
    for (const o of G.enemies) if (dist(o, p) < 300 && ++near > 1) break;
    if (near === 1) total *= 1.75;
  }
  // Броня и панцирь: единый путь снижения для игрока и свиты
  total = mitigate(e, total, src.minion ? 1 : 0);
  // КОЛЬЦО СМЕРТИ: заряд копится убийствами и тратится на первую же цель
  if (amu('reaper') && p.reaper){
    p.reaper = false;
    statusText(e, 'СМЕРТЬ', '#9aa7b4');
    G.fx.push({t:'ring', x:e.x, y:e.y, r:e.r, max:e.r*3.4, life:0.45, col:'#9aa7b4'});
    total += e.hp;
  }

  let dealt = applyDamage(e, total, isCrit, false, src.minion ? 1 : 0);
  /* Ударная волна берёт ровно 20% фактически снятого критом HP: переполнение
     урона не раздувает её. Основная цель исключается, а каждый сосед повторно
     проходит свою входящую защиту. Исходящие множители не накладываются второй
     раз, потому что они уже учтены в dealt. */
  if (isCrit && b.has('critWave') && dealt > 0)
    nova(e.x, e.y, 90*D.aoeR, dealt*0.20, '#ffb340', {
      minionShare:src.minion?1:0, mitigate:true, exclude:e, skipConstellation:true,
    });
  if (src.minion && !e.dead) rollBoneChallenge(e, src.minion);

  /* СМЕРТОНОСНОЕ ПОПАДАНИЕ: бросок делает каждый фактический удар damage().
     Процент считается после обычного урона от оставшегося HP и идёт напрямую,
     без брони и повторного запуска эффектов. applyDamage() напрямую не бросает шанс,
     поэтому DoT, лужи и чума его не размножают. */
  if (D.deadlyHit && e.hp > 0 && Math.random() < 0.01){
    const deadly = applyDamage(e, e.hp*0.25, false, false, src.minion ? 1 : 0);
    dealt += deadly;
    statusText(e, 'DEADLY HIT', '#e0405a');
    G.fx.push({t:'ring', x:e.x, y:e.y, r:e.r, max:e.r*2.8, life:0.35, col:'#e0405a'});
  }

  // Вампиризм и здоровье за попадание
  if (D.leech && !src.minion){                                   // обычный вампиризм — только от атак героя
    const lv = dealt * D.leech/100;
    if (D.dread) queueDreadLeech(lv);
    else if (D.leechInstant) heal(lv);
    else p.leechPool = (p.leechPool||0) + lv;
  }
  if (D.onHit) heal(D.onHit);
  // ВАМПИРЫ ХОЗЯИНА: приспешник лечит сам себя и только себя
  if (src.minion && D.minVamp){
    const mm = src.minion;
    mm.hp = Math.min(mm.max, mm.hp + dealt*D.minVamp/100);
  }

  applyBookAilments(e, total,
    src.minion ? MINION_AILMENT_CHANCE_MULT : 1,
    src.minion ? MINION_DAMAGE_MULT*boneFieldDamageMul() : 1,
    src.minion ? 1 : 0);

  // Наложение негативных эффектов
  const ailmentChanceMul = (src.minion ? MINION_AILMENT_CHANCE_MULT : 1) * (src.elementChanceMul||1);
  const roll = v => Math.random()*100 < v * ailmentChanceMul;
  if (roll(D.igniteCh)){
    addDot(e, 'fire', total*IGNITE_DPS_SHARE*D.ailEff, 3*D.ailDur, src.minion ? 1 : 0);
    // ПЕРЕГРУЗКА: огонь по шокированному замыкает разряд
    if (amu('overload') && e.ail.shock > 0){
      shockBurst(e, total, src.minion ? 1 : 0);
      G.fx.push({t:'ring', x:e.x, y:e.y, r:6, max:120*D.aoeR, life:0.3, col:'#ffe14a'});
    }
  }
  if (roll(D.chillCh)){
    if (e.ail.chill <= 0) statusText(e, 'SLOWED', '#ffe14a');
    e.ail.chill = Math.max(e.ail.chill, CHILL_DURATION*D.ailDur);
    // Охлаждение наносит отдельные 10% уже рассчитанного удара; это эффект,
    // поэтому «Сила всех негативных эффектов» продолжает его усиливать.
    applyDamage(e, total*CHILL_DAMAGE_SHARE*D.ailEff, false, false, src.minion ? 1 : 0);
    if (D.freeze && Math.random() < FREEZE_CHANCE){                       // ЗАМОРОЗКА
      if (e.ail.freeze <= 0) statusText(e, 'FROZEN', '#7fd6ff');
      e.ail.freeze = Math.max(e.ail.freeze, FREEZE_DURATION*D.ailDur*D.freezeDur);
    }
  }
  if (roll(D.shockCh)){
    e.ail.shock = Math.max(e.ail.shock, SHOCK_DURATION*D.ailDur);
    shockBurst(e, total, src.minion ? 1 : 0); // базовый разряд 5×15%, ТЕСЛА 20×25%
  }
  if (roll(D.poiCh))                                                      // РАДИАЦИЯ: двойной урон тика
    addDot(e, 'poison', total*POISON_DPS_SHARE*D.ailEff*(D.radiation?2:1), 4*D.ailDur, src.minion ? 1 : 0);
  if (roll(D.stun)) e.ail.stun = STUN_DURATION * D.ailDur;
  // ТАРАННАЯ ПЕРЧАТКА: свой толчок мимо шанса отбрасывания, каждый восьмой удар
  if (amu('shove') && p.hitN % 8 === 0){
    const from = src.minion || p;
    const a = Math.atan2(e.y-from.y, e.x-from.x);
    e.kb.x += Math.cos(a)*780; e.kb.y += Math.sin(a)*780;
    burst(e.x, e.y, 6, '#c08a3a', 220, 3, 0.4);
  }
  if (roll(D.knock)){
    const from = src.minion || p;               // толкает тот, кто ударил
    const a = Math.atan2(e.y-from.y, e.x-from.x);
    const force = 260 * D.knockPow * knockbackScale(e);
    e.kb.x += Math.cos(a)*force; e.kb.y += Math.sin(a)*force;
    if (D.dizzy){                                                         // ГОЛОВОКРУЖЕНИЕ
      if (e.ail.dizzy <= 0) statusText(e, 'SLOWED', '#ffe14a');
      e.ail.dizzy = 2*D.ailDur;
    }
  }
  // ДОБИВАНИЕ: один фиолетовый флаг, фиксированный включительный порог 10%.
  if (b.has('execute') && e.kind==='norm' && e.hp > 0 && e.hp/e.maxHp <= EXECUTE_HP_THRESHOLD)
    applyDamage(e, e.hp, false, false, src.minion ? 1 : 0);
  // ПЕРЧАТКИ ГРОМА: свой период, но общий счётчик ударов
  if (amu('thunder') && p.hitN % 12 === 0){
    e.ail.shock = Math.max(e.ail.shock, SHOCK_DURATION*D.ailDur);
    shockBurst(e, total, src.minion ? 1 : 0);
    G.fx.push({t:'bolt', x:p.x, y:p.y, x2:e.x, y2:e.y, life:0.18, col:'#ffe14a'});
  }
  // КОЛЬЦО ИМПУЛЬСА
  if (amu('pulse') && p.hitN % 8 === 0)
    nova(e.x, e.y, 130*D.aoeR, avgHit()*0.9, '#4fd1c5', {minionShare:src.minion?1:0});
  // Двойное попадание
  if (!src.noDouble){
    // Метку приспешника обязательно тащим в добавочные удары: иначе двойной
    // удар свиты считался бы по криту игрока и лечил бы не того
    if (Math.random()*100 < D.dblHit){
      // Для доли полной автоатаки 60% режут тот же полный удар, а не только базу.
      const again = src.attackMul === undefined
        ? {mul:(src.mul||1)*0.6}
        : {mul:src.mul, attackMul:src.attackMul*0.6};
      // Второй удар — 60% того же попадания, поэтому сохраняет уже вычисленные
      // условные бонусы стрелы и её множитель стихийных шансов. Без этих полей
      // дальняя/первая стрела усиливала только основную часть двойного попадания.
      damage(e, Object.assign(again,{noDouble:true, minion:src.minion,
        direct:src.direct, directMelee:src.directMelee, warriorMelee:src.warriorMelee, rangedInc:src.rangedInc,
        elementChanceMul:src.elementChanceMul}));
    }
  }
}

function grantReserveBarrier(overkill){
  if (!D.durabilityReserve || overkill<=0) return 0;
  const p=G.player, before=p.reserveBarrier||0, cap=D.life*0.12;
  p.reserveBarrier=Math.min(cap,before+overkill*0.20);
  p.reserveBarrierT=4;
  if (p.reserveBarrier>before){
    G.fx.push({t:'ring',x:p.x,y:p.y,r:p.r+7,max:p.r+24,life:0.3,col:'#6fb3ff'});
    G.fx.push({t:'txt',x:p.x,y:p.y-30,s:'ЗАПАС ПРОЧНОСТИ',life:0.8,col:'#6fb3ff'});
  }
  return p.reserveBarrier-before;
}

function applyDamage(e, amount, crit, silent, minionShare=0, skipConstellation=false){
  /* Созвездие — отдельный множитель по типу цели. Так заявленные +5% остаются
     настоящими пятью процентами даже у билда, уже собравшего сотни inc-процентов.
     Точка общая для ударов, стихий, DoT и свиты, поэтому бонус ничего не обходит. */
  if (!skipConstellation) amount *= constellationMultiplier(e);
  if (D.durabilityReserve && e.hp>0 && amount>e.hp) grantReserveBarrier(amount-e.hp);
  const dealt = Math.max(0, Math.min(amount, e.hp));
  G.stats.damage += dealt;
  G.stats.maxHit = Math.max(G.stats.maxHit, dealt);
  e.hp -= amount; if (!silent) e.hit = 0.12;
  e.noDmgT = 0;                   // регенераторы считают время с последнего попадания
  if (minionShare > 0 && D.deathLord) heal(dealt * minionShare * 0.001);
  if (!silent){
    G.fx.push({t:'num', x:e.x, y:e.y-e.r-6, v:Math.round(amount), life:0.65, crit});
    burst(e.x, e.y, crit ? 9 : 3, crit ? '#ffd24a' : e.t.col, crit ? 220 : 110, 3, 0.35);
  }
  return dealt;
}

/* Одна проверка на случайную находку, затем выбор категории. До нерфа база
   была 0,4% с рядового, ×5 с элиты и ×40 с босса. Теперь общий шанс умножен
   на FIND_RATE_SCALE, составленный из отдельных нерфов трёх категорий. */
function tryDropBook(e){
  const mult = e.kind === 'boss' ? 40 : e.kind === 'elite' ? 5 : 1;
  const pools = findDropPools(), balance = findDropBalance(pools);
  // Нерф применяется и к «Искателю реликвий», иначе на высоком ранге предметы
  // стали бы выпадать даже чаще прежнего из-за изменившихся долей категорий.
  const chance = Math.min(100, (0.4 * mult + shopLvl('itemDrop')) * balance.rate);
  if (Math.random()*100 >= chance) return;
  dropItem(e, pools, balance);
}

function findDropPools(){
  const pool = [];
  for (const k of AMU_KEYS){
    if (G.amu[k]) continue;
    if (AMULETS[k].minOnly && !G.weapon.minions) continue;
    const w = [16, 10, 5, 2][AMULETS[k].rar];
    for (let i = 0; i < w; i++) pool.push(k);
  }
  const tot = TOTEM_KEYS.filter(k => totemTier(k) < 4 && G.items && G.items[TOTEMS[k].book]);
  return {pool, tot};
}

/* Сначала воспроизводим старый fallback отсутствующих категорий, затем режем
   фактическую долю каждой оставшейся категории. Поэтому после сбора всех
   предметов их бывшая доля не превращается в лишние книги или тотемы. */
function findDropBalance(pools){
  const hasItems = pools.pool.length > 0, hasTotems = pools.tot.length > 0;
  const itemBase = hasItems ? AMU_SHARE : 0;
  const totemBase = hasTotems ? TOTEM_SHARE + (hasItems ? 0 : AMU_SHARE) : 0;
  const bookBase = 1 - itemBase - totemBase;
  const itemWeight = itemBase * ITEM_DROP_SCALE;
  const totemWeight = totemBase * TOTEM_DROP_SCALE;
  const bookWeight = bookBase * BOOK_DROP_SCALE;
  const rate = itemWeight + totemWeight + bookWeight;
  return {rate, itemShare:itemWeight/rate, totemShare:totemWeight/rate};
}

/* Выбор категории находки. Отдельной функцией, потому что «Маска босса»
   вызывает её мимо ролла на шанс. */
function dropItem(e, preparedPools, preparedBalance){
  const pools = preparedPools || findDropPools();
  const balance = preparedBalance || findDropBalance(pools);
  const pool = pools.pool, tot = pools.tot;
  const r = Math.random();
  if (pool.length && r < balance.itemShare)
    G.orbs.push({x:e.x, y:e.y, r:9, amu:pick(pool)});
  else if (tot.length && r < balance.itemShare + balance.totemShare)
    G.orbs.push({x:e.x, y:e.y, r:9, totem:pick(tot)});
  else
    G.orbs.push({x:e.x, y:e.y, r:9, book:pick(BOOK_KEYS)});
}

    if (cur) val = Math.max(val, cur.val + 2);      // повышение обязано читаться
  } else {                                          // дальше растём шагом от достигнутого

function killEnemy(e, i){
  const b = G.bag, p = G.player;
  const coldShatter = D.coldShatter && isEnemySlowed(e);
  e.dead = true;                   // свита держит цель между кадрами и должна знать, что она мертва
  enemyDeathSfx(e);
  if (e.kind === 'boss'){
    G.bossKills++; G.stats.bosses++;
    if (e.bossId === 'plague') dropPlagueBossAcid(e);
  }
  else if (e.kind === 'elite'){
    G.stats.elites++;
    if (e.eliteVariant==='plagueOgre') dropEliteAcid(e.x,e.y,88,true);
  }
  else G.stats.normals++;
  // Элита и боссы имеют собственные созвездия и не продвигают созвездие формы.
  const constId = e.kind === 'boss' ? 'boss' : e.kind === 'elite' ? 'elite' : e.typeKey;
  const cs = constellationState();
  if (CONST_IDS.includes(constId)) cs.kills[constId]++;
  if (e.pack) packDeath(e);        // до всего прочего: аффиксы пачки могут поднять новых врагов
  if (e.bossId === 'greed' || e.bossId === 'tyrant' || e.bossId === 'minotaur'){
    // Редкие боссы заменяют обычный шанс гарантированными находками:
    // Алчный Громила даёт две, Рогатый Тиран — одну.
    const guaranteed = e.bossId === 'tyrant' ? 1 : 2;
    for (let n = 0; n < guaranteed; n++){
      const before = G.orbs.length; dropItem(e);
      if (G.orbs.length > before) G.orbs[G.orbs.length-1].x += n ? 14 : -14;
    }
  } else if (!e.noLoot) tryDropBook(e);
  // МЕШОК ОПЫТА: надбавка только за элиту и боссов
  const constMul = constellationMultiplier(e);
  const xpv = e.xp * constMul * (amu('xpbag') && e.kind !== 'norm' ? 1.5 : 1);
  if (xpv > 0) G.orbs.push({x:e.x, y:e.y, v:xpv, r:4});           // сфера опыта
  // Золото: монеты падают отдельно от опыта, крупные враги роняют горстью
  /* Золото за врага. Коэффициент при этаже срезан с 0.9 до 0.3, база поднята
     с 2 до 5. Причина: после смены скейлов игрок доходит до 60 этажа вместо 10,
