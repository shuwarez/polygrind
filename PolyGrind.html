     а населения на этаже вчетверо больше — доход за партию вырос с ~4 000 до
     700 000, и магазин на 322 млн выкупался за 400 партий вместо тысяч.
     Срезать один коэффициент было мало: он же кормит и ранние этажи, где
     игрок как раз и умирает. Поднятая база держит первые десять этажей почти
     на прежнем уровне (4 438 против 3 900), а глубина падает вдвое. */
  const gv = (5 + G.floor*0.3) * (e.kind === 'boss' ? 22 : e.kind === 'elite' ? 4.5 : 1) * D.goldFind * D.goldGainMult * constMul
           * (amu('goldbag') && e.kind !== 'norm' ? 1.5 : 1);   // МЕШОК ЗОЛОТА: только крупные
  const coins = e.kind === 'boss' ? 6 : e.kind === 'elite' ? 2 : 1;
  if (!e.noLoot) for (let ci = 0; ci < coins; ci++)
    G.orbs.push({x:e.x + rnd(-12,12), y:e.y + rnd(-12,12), v:Math.max(1, Math.round(gv/coins*rnd(0.75,1.3))), r:4, gold:true});
  if (D.hasMin){
    G.corpses.push({x:e.x, y:e.y, life:14, big:e.kind !== 'norm'}); // труп — ресурс для призыва
  }
  // Счётчик убийств: на нём висят кольцо смерти и чаша крови
  p.kills = (p.kills || 0) + 1;
  if (amu('reaper') && p.kills % 100 === 0){
    p.reaper = true;
    G.fx.push({t:'txt', x:p.x, y:p.y-32, s:'КОЛЬЦО СМЕРТИ ГОТОВО', life:1.4, col:'#9aa7b4'});
  }
  if (amu('chalice') && p.kills % 50 === 0){
    heal(D.life);
    G.fx.push({t:'ring', x:p.x, y:p.y, r:10, max:150, life:0.6, col:'#e0405a'});
    G.fx.push({t:'txt', x:p.x, y:p.y-32, s:'ЧАША ПОЛНА', life:1.2, col:'#e0405a'});
  }
  // МАСКА БОССА: последний боец пачки роняет находку гарантированно.
  // Сундуков в игре нет, поэтому «дополнительный chest» — это принудительный дроп
  // из того же пула, что и обычные находки.
  if (amu('bmask') && e.pack && e.pack.members.length === 0) dropItem(e);
  if (D.onKill){
    heal(D.onKill);
    /* Свита лечится ТОЙ ЖЕ ДОЛЕЙ своего запаса, а не теми же очками.
       Плоские 5 хп для игрока с запасом 460 — это 1.1%, а для приспешника
       с 3544 — 0.14%, то есть карточка формально работала бы, а по факту
       не значила бы ничего. Доля переносит смысл карточки, а не её число. */
    const share = D.onKill / D.life;
    for (const mn of G.minions) mn.hp = Math.min(mn.max, mn.hp + mn.max*share);
  }
  // КЛЫК ВАМПИРА: крупная цель окупает подход вплотную
  if (amu('fang') && e.kind !== 'norm') heal(D.life*0.15);
  // ПЕПЕЛЬНОЕ СЕРДЦЕ: платит только за горящих, то есть за собранный билд огня
  if (amu('ash') && e.dots.fire.dps > 0) heal(D.life*0.01);
  // ЧУМНОЙ ЗУБ: яд не пропадает с трупом, а перепрыгивает на соседа
  if (amu('plague') && e.dots.poison.dps > 0 && Math.random() < 0.10){
    let best = null, bd = 260;
    for (const o of G.enemies){ if (o === e) continue; const d = dist(o,e); if (d < bd){ bd = d; best = o; } }
    if (best){
      addDot(best, 'poison', e.dots.poison.dps, e.dots.poison.dur + 2,
        e.dots.poison.dps > 0 ? e.dots.poison.minionDps/e.dots.poison.dps : 0);
      G.fx.push({t:'ring', x:best.x, y:best.y, r:6, max:34, life:0.35, col:'#8be04e'});
    }
  }
  // Карточка и «Последний рывок» имеют разные силу и длительность, поэтому
  // держат отдельные таймеры. recalc() нужен именно при включении: без него
  // бонус впервые проявлялся только после закрытия следующего level-up.
  let speedChanged = false;
  if (b.has('spdKill')){
    if (!(p.spdKill > 0)) speedChanged = true;
    p.spdKill = 0.8;
  }
  if (amu('sprint')){
    if (!(p.sprintT > 0)) speedChanged = true;
    p.sprintT = 2;
  }
  if (speedChanged) recalc();
  if (amu('predator')) p.predT = 2;              // ГЛАЗ ХИЩНИКА, продлевается каждым убийством
  // ТАЛИСМАН СКОРОСТИ: платит только за крупную цель
  if (amu('swift') && e.kind !== 'norm'){
    p.swiftT = 5; recalc();
    G.fx.push({t:'ring', x:p.x, y:p.y, r:p.r, max:64, life:0.4, col:'#4fd1c5'});
  }
  // ВАКУУМ: короткий подсос соседей к месту смерти
  if (amu('vacuum')){
    G.fx.push({t:'ring', x:e.x, y:e.y, r:110*D.aoeR, max:8, life:0.3, col:'#5ec2e0'});
    for (const o of G.enemies){
      const d = dist(o, e);
      if (d > 110*D.aoeR || d < 1) continue;
      const a = Math.atan2(e.y-o.y, e.x-o.x);
      o.kb.x += Math.cos(a)*190; o.kb.y += Math.sin(a)*190;
    }
  }
  p.killT = RECENT_KILL_DAMAGE_DURATION;
  if (coldShatter) coldShatterBurst(e);
  /* Вспышка бросает шанс на каждое убийство, включая убийства другой вспышкой.
     Урон основан на среднем ударе, но проходит через полноценную защиту каждой
     цели. Красное развитие поднимает шанс/урон и добавляет небольшой импульс. */
  if (D.novaKillChance > 0 && Math.random()*100 < D.novaKillChance)
    nova(e.x, e.y, 110*D.aoeR, avgHit()*D.novaKillDamage,
      D.novaKillStrong ? '#ff5a4e' : '#ffb340',
      {mitigate:true, skipDead:true, knock:D.novaKillStrong ? 120 : 0, overpressure:true});
  if (Math.random()*100 < D.explode){
    // Мега-чума — отдельный ролл поверх сработавшего обычного взрыва: меняет
    // только охват, не силу и не длительность болезни.
    const mega = D.explodeMega > 0 && Math.random()*100 < D.explodeMega;
    const rad  = PLAGUE_RADIUS * D.aoeR * D.plagueRadius * (mega ? 2 : 1);
    plagueBurst(e.x, e.y, rad);
    if (mega){                                                  // отдельная подача: гуще и ярче
      G.fx.push({t:'ring', x:e.x, y:e.y, r:8, max:rad*0.6, life:0.4, col:'#ffd24a'});
      burst(e.x, e.y, 30, '#9dca4a', 340, 5, 0.9);
      burst(e.x, e.y, 12, '#ffd24a', 260, 4, 0.7);
      G.fx.push({t:'shake', life:0.12});
    }
  }
  G.fx.push({t:'ring', x:e.x, y:e.y, r:e.r, max:e.r*2.4, life:0.3, col:e.t.col});
  // Смерть: тем крупнее враг — тем гуще брызги
  const grade = e.kind === 'boss' ? 3 : e.kind === 'elite' ? 1.7 : 1;
  burst(e.x, e.y, Math.round(14*grade), e.t.col, 190*grade, 4, 0.75);
  burst(e.x, e.y, Math.round(5*grade),  '#e8eef5', 120*grade, 3, 0.5);
  if (e.dots.fire.dps > 0) burst(e.x, e.y, 10, '#ff7a2f', 160, 3, 0.6);
  if (e.ail.chill  > 0) burst(e.x, e.y, 10, '#7fd6ff', 160, 3, 0.6);
  G.enemies.splice(i,1);
}

/* ---------- ЧАСТИЦЫ ----------
   Декоративный поток намеренно прорежен вдвое и ограничен 300 объектами:
   качество эффектов уступает стабильному кадру в большой толпе. */
function burst(x, y, n, col, spd, size, life){
  n = Math.max(1, Math.ceil(n*0.5));
  if (G.parts.length > 300) n = Math.min(n, 2);
  for (let i = 0; i < n; i++){
    const a = rnd(0, 6.283), v = rnd(spd*0.2, spd);
    G.parts.push({
      x: x + rnd(-3,3), y: y + rnd(-3,3),
      vx: Math.cos(a)*v, vy: Math.sin(a)*v,
      life: rnd(life*0.45, life), max: life,
      sz: rndi(2, size), col,
    });
  }
}

/* Базовый разряд намеренно мал; ТЕСЛА возвращает большой цепной удар только
   после развития шанса до потолка 25%. Радиус остаётся общим для обеих версий. */
const SHOCK_BASE_TARGETS = 5, SHOCK_TESLA_TARGETS = 20, SHOCK_RANGE = 400;
const SHOCK_BASE_SHARE = 0.15, SHOCK_TESLA_SHARE = 0.25, SHOCK_DURATION = 1;
/* Базы площадных радиусов игрока. Все они умножаются на D.aoeR в recalc():
   правило простое — если область принадлежит игроку, «Радиус области действия»
   её растит. Раньше через aoeR ходило только то, что зовёт nova(), а шок,
   обе ауры и инферно считали дистанцию своим циклом и мимо стата прошли. */
const SLOW_AURA_BASE = 260, INFERNO_BASE = 110;
/* Охлаждение — короткий ослабленный удар контроля: 15% прямого замедления,
   5% соседям, x1.10 входящего урона и 10% дополнительного урона от атаки. */
const CHILL_AURA_R = 96, CHILL_SLOW = 0.15, CHILL_AURA_SLOW = 0.05, CHILL_TAKEN = 1.10;
const CHILL_DURATION = 0.5, CHILL_DAMAGE_SHARE = 0.10;
const COLD_SHATTER_RADIUS = 180, COLD_SHATTER_DURATION = 0.7;
const SHOCK_TAKEN = 1.10, FREEZE_TAKEN = 1.10;
const FREEZE_CHANCE = 0.01, FREEZE_DURATION = 1;
const IGNITE_DPS_SHARE = 0.20, POISON_DPS_SHARE = 0.15;
const OVERPRESSURE_BONUS = 0.05, OVERPRESSURE_EXTRA_CAP = 5;
const shockTargets = () => D.tesla ? SHOCK_TESLA_TARGETS : SHOCK_BASE_TARGETS;
const shockShare = () => D.tesla ? SHOCK_TESLA_SHARE : SHOCK_BASE_SHARE;
/* Карточка не должна быть пустой: Маг начинает со взрыва сферы, остальные классы
   увидят её только после получения хотя бы одного настоящего уронного взрыва. */
function hasDamageExplosionSource(){
  if (!G || !G.weapon || !G.bag) return false;
  return G.weapon.type === 'orb' || D.novaKillChance > 0 || G.bag.has('retal') ||
    D.minBoom || D.minFrenzy || !!D.minBlink || amu('gravity');
}
function overpressureMultiplier(targetCount){
  if (!D.overpressure) return 1;
  return 1 + Math.min(OVERPRESSURE_EXTRA_CAP, Math.max(0, targetCount - 1)) * OVERPRESSURE_BONUS;
}
/* Источник открывает обе новые карточки, но сам бонус урона смотрит на фактическое
   состояние конкретной цели. Колдун считается источником, потому что его случайное
   заклинание холода накладывает то же Охлаждение, что и игрок или Книга льда. */
function hasSlowSource(){
  if (!G || !G.bag) return false;
  return D.chillCh > 0 || !!(G.items && G.items.cold) || amu('frost') ||
    D.maxWarl > 0 || D.dizzy || D.slowAura;
}
function isEnemySlowed(e){
  if (!e) return false;
  if (e.ail.chill > 0 || e.ail.dizzy > 0) return true;
  if (D.slowAura && dist(e,G.player) < D.slowAuraR) return true;
  for (const src of G.enemies){
    if (src === e || src.dead || src.ail.chill <= 0) continue;
    if (dist(src,e) <= D.chillAuraR + e.r) return true;
  }
  return false;
}
function coldShatterBurst(src){
  const radius=COLD_SHATTER_RADIUS*D.aoeR, duration=COLD_SHATTER_DURATION*D.ailDur;
  G.fx.push({t:'ring',x:src.x,y:src.y,r:8,max:radius,life:0.32,col:'#7fd6ff'});
  for (const e of G.enemies){
    if (e === src || e.dead || dist(e,src) >= radius + e.r) continue;
    if (e.ail.chill <= 0) statusText(e,'SLOWED','#7fd6ff');
    e.ail.chill=Math.max(e.ail.chill,duration);
  }
  burst(src.x,src.y,10,'#7fd6ff',180,3,0.5);
}
function shockBurst(src, hitDamage, minionShare=0){
  const list = [];
  for (const x of G.enemies){
    if (x === src) continue;
    const d = dist(x, src);
    if (d < D.shockR) list.push([d, x]);
  }
  list.sort((a,b) => a[0]-b[0]);
  for (let i = 0; i < Math.min(shockTargets(), list.length); i++){
    const t = list[i][1];
    applyDamage(t, hitDamage*shockShare()*D.ailEff, false, false, minionShare);
    G.fx.push({t:'bolt', x:src.x, y:src.y, x2:t.x, y2:t.y, life:0.2});
    burst(t.x, t.y, 3, '#ffe14a', 130, 3, 0.3);
  }
}

/* На полной силе Арканная иллюзия сдвигает обычную цель примерно на 30 px.
   Это контроль построения толпы, а не жёсткая стяжка уровня колодца. */
const ARCANE_PULL_FORCE = 250;

/* Волна урона по площади вокруг точки */
function nova(x, y, r, dmg, col, opt){
  G.fx.push({t:'ring', x, y, r:8, max:r, life:0.28, col});
  const targets = G.enemies.filter(e => e !== (opt && opt.exclude) &&
    !((opt && opt.skipDead) && e.dead) && dist(e,{x,y}) < r + e.r);
  const blastDamage = dmg * (opt && opt.overpressure ? overpressureMultiplier(targets.length) : 1);
  for (const e of targets){
    const minionShare = opt && opt.minionShare || 0;
    const skipConstellation = !!(opt && opt.skipConstellation);
    const targetDamage = blastDamage * (opt && opt.damageMul ? opt.damageMul(e) : 1);
    const dealt = opt && opt.mitigate ? mitigate(e, targetDamage, minionShare, skipConstellation) : targetDamage;
    applyDamage(e, dealt, false, false, minionShare, skipConstellation);
    if (opt && opt.onTarget) opt.onTarget(e, dealt);
    if (opt && opt.knock){
      const dx=e.x-x, dy=e.y-y, d=Math.hypot(dx,dy);
      if (d > 0){
        const force=opt.knock*knockbackScale(e);
        e.kb.x += dx/d*force; e.kb.y += dy/d*force;
      }
    }
    if (opt && opt.pull && !e.dead){
      const dx=e.x-x, dy=e.y-y, d=Math.hypot(dx,dy);
      if (d > 0){
        const force=opt.pull*knockbackScale(e);
        e.kb.x -= dx/d*force; e.kb.y -= dy/d*force;
      }
    }
    if (opt && opt.ignite) addDot(e, 'fire', opt.ignite, 3*D.ailDur, minionShare); // мега-взрыв поджигает задетых
  }
  return targets;
}

/* Красная ветка Мага относится именно к взрыву: прямой контакт сферы уже прошёл
   через damage() и сюда не попадает. Шансы берутся из текущих карточек игрока;
   книги остаются отдельными источниками и не удваиваются второй раз. */
function applyOrbExplosionAilments(e, total){
  if (!D.elementalExplosion) return;
  const roll = v => Math.random()*100 < v*2;
  if (roll(D.igniteCh))
    addDot(e, 'fire', total*IGNITE_DPS_SHARE*D.ailEff, 3*D.ailDur);
  if (roll(D.chillCh)){
    if (e.ail.chill <= 0) statusText(e, 'SLOWED', '#ffe14a');
    e.ail.chill = Math.max(e.ail.chill, CHILL_DURATION*D.ailDur);
    applyDamage(e, total*CHILL_DAMAGE_SHARE*D.ailEff, false, false);
    if (D.freeze && Math.random() < FREEZE_CHANCE){
      if (e.ail.freeze <= 0) statusText(e, 'FROZEN', '#7fd6ff');
      e.ail.freeze = Math.max(e.ail.freeze, FREEZE_DURATION*D.ailDur*D.freezeDur);
    }
  }
  if (roll(D.shockCh)){
    e.ail.shock = Math.max(e.ail.shock, SHOCK_DURATION*D.ailDur);
    shockBurst(e, total, 0);
  }
  if (roll(D.poiCh))
    addDot(e, 'poison', total*POISON_DPS_SHARE*D.ailEff*(D.radiation?2:1), 4*D.ailDur);
}

function hitArcaneTrace(trace){
  for (const e of G.enemies){
    if (e.hp <= 0 || trace.hitSet.includes(e) || dist(e,trace) >= trace.r + e.r) continue;
    trace.hitSet.push(e);
    applyDamage(e, trace.dmg, false, false);
  }
}
function spawnArcaneTrace(x, y, r, dmg){
  const trace={x,y,r,life:0.5,max:0.5,dmg,hitSet:[]};
  G.arcaneTraces.push(trace);
  hitArcaneTrace(trace);                 // уже стоящие в области получают свой единственный тик сразу
}
function tickArcaneTraces(dt){
  for (let i=G.arcaneTraces.length-1; i>=0; i--){
    const trace=G.arcaneTraces[i];
    hitArcaneTrace(trace);
    trace.life-=dt;
    if (trace.life <= 0) G.arcaneTraces.splice(i,1);
  }
}
function triggerOverheatedOrb(){
  const p=G.player;
  p.overheatedPct=Math.min(300,(p.overheatedPct||0)+D.overheatedPerExplosion);
  p.overheatedT=1.5;                       // обновляется, но не прибавляется к остатку
  recalc();
}
function remoteOrbActive(s){ return !!(D.remoteBlast>0 && s && s.orb && (s.travel||0)>250); }
function explodePlayerOrb(s){
  const aoeScale=s.aoeScale || 1, attackMul=s.attackMul === undefined ? 1 : s.attackMul;
  const radius=G.weapon.aoe*D.aoeR*aoeScale, sphereDamage=avgHit()*attackMul;
  const remote=remoteOrbActive(s), point={x:s.x,y:s.y};
  const targets=nova(s.x, s.y, radius, sphereDamage*0.55, remote?'#b56cff':'#c08cff', {
    overpressure:true,
    pull:ARCANE_PULL_FORCE*D.arcanePull/100,
    damageMul:e=>1 + (remote?D.remoteBlast:0)/100 + (dist(e,point)<=radius*0.5?D.blastHeart:0)/100,
    onTarget:(e,total)=>applyOrbExplosionAilments(e,total),
  });
  if (D.residualArcana>0)
    spawnArcaneTrace(s.x,s.y,radius,sphereDamage*D.residualArcana/100);
  if (targets.length>=3 && D.overheatedPerExplosion>0) triggerOverheatedOrb();
}

const DREAD_LEECH_TIME = 3;
const DREAD_RECOVERY_CAP = 0.08;
const DREAD_SHIELD_CAP = 0.15;

/* Лечение использует тот же крупный combat text, что и входящий урон.
   Показываем только реально восстановленное целое HP: переполнение и дробные
   тики регенерации не создают визуальный шум. */
function playerHealFeedback(restored){
  if (restored < 1) return;
  const p=G.player;
  G.fx.push({t:'healNum',x:p.x+rnd(-7,7),y:p.y-p.r-15,
             v:'+'+Math.max(1,Math.round(restored)),life:0.4,max:0.4});
}

/* Каждый удар создаёт отдельный трёхсекундный поток. Когда суммарный поток
   превышает 8% максимального HP в секунду, лишнее не теряется, а остаётся
   в очереди дольше — поэтому потолок мягкий, а не обрезающий. */
function queueDreadLeech(v){
  if (!(v > 0)) return;
  const p = G.player;
  p.leechFlows.push({left:v, rate:v/DREAD_LEECH_TIME});
  p.leechPool += v;
}

/* Разрешённый канал Ужасающего вампира: сначала заполняет здоровье, затем
   превращает остаток в отдельный красный щит до 15% максимального HP. */
function dreadRecover(v){
  const p = G.player;
  const restored = Math.max(0, Math.min(v, D.life - p.hp));
  G.stats.healing += restored;
  p.hp += restored;
  playerHealFeedback(restored);
  const overflow = Math.max(0, v - restored);
  if (overflow > 0) p.dreadShield = Math.min(D.life*DREAD_SHIELD_CAP, p.dreadShield + overflow);
}

function tickDreadLeech(dt){
  const p = G.player, flows = p.leechFlows;
  if (!flows.length){ p.leechPool = 0; return; }
  let wanted = 0;
  for (const f of flows) wanted += Math.min(f.left, f.rate*dt);
  const granted = Math.min(wanted, D.life*DREAD_RECOVERY_CAP*dt);
  const share = wanted > 0 ? granted/wanted : 0;
  for (const f of flows) f.left -= Math.min(f.left, f.rate*dt)*share;
  for (let i=flows.length-1; i>=0; i--) if (flows[i].left < 1e-7) flows.splice(i,1);
  p.leechPool = Math.max(0, p.leechPool - granted);
  dreadRecover(granted);
}

/* Единственная дверь для обычного восстановления здоровья в игре.
   УЖАСАЮЩИЙ ВАМПИР закрывает её целиком; его собственный поток проходит
   через dreadRecover(), поэтому другие источники лечения сюда не пролезают. */
function heal(v){
  const p = G.player;
  if (D.dread) return;
  const restored = Math.max(0, Math.min(v, D.life - p.hp));
  G.stats.healing += restored;
  p.hp += restored;
  playerHealFeedback(restored);
}

/* Всплывающее слово над врагом — статус должен читаться мгновенно */
function statusText(e, txt, col){
  G.fx.push({t:'txt', x:e.x, y:e.y - e.r - 14, s:txt, life:0.55, col});
}

/* Эффекты книг. Вызывается и из атак игрока, и из ударов свиты —
   книги работают на всех, как и задумано. */
function applyBookAilments(e, total, chanceMul=1, fixedDamageMul=1, minionShare=0){
  const it = G.items; if (!it) return;
  const proc = k => it[k] && Math.random()*100 < bookChance(k) * chanceMul;
  if (proc('fire'))  addDot(e, 'fire', total * IGNITE_DPS_SHARE * D.ailEff, 3 * D.ailDur, minionShare);
  if (proc('poison')) addDot(e, 'poison', D.bookPoiDps * fixedDamageMul, 3 * D.ailDur, minionShare);
  if (proc('bleed'))  addDot(e, 'bleed', bookBleedDps() * fixedDamageMul, 4 * D.ailDur, minionShare);
  if (proc('cold')){
    if (e.ail.chill <= 0) statusText(e, 'SLOWED', '#ffe14a');
    e.ail.chill = Math.max(e.ail.chill, CHILL_DURATION * D.ailDur);
    applyDamage(e, total * CHILL_DAMAGE_SHARE * D.ailEff, false, false, minionShare);
    if (D.freeze && Math.random() < FREEZE_CHANCE){
      if (e.ail.freeze <= 0) statusText(e, 'FROZEN', '#7fd6ff');
      e.ail.freeze = Math.max(e.ail.freeze, FREEZE_DURATION * D.ailDur * D.freezeDur);
    }
  }
}

/* ---------- УРОН СО ВРЕМЕНЕМ: СТАКИ ----------
   Каждое срабатывание добавляет свой урон в общий котёл, а котёл непрерывно
   утекает со скоростью dps/длительность. Математически это тождественно тому,
   как если бы каждый стак жил отдельным таймером и истекал сам, но стоит O(1)
   памяти вместо списка из сотен объектов.
   Установившийся уровень = частота проков x урон за прок x длительность. */
function addDot(e, type, dps, dur, minionShare=0){
  // Оберег гасит и урон со временем своей стихии, иначе поджог обходил бы защиту
  if (e.ward && ((e.ward === 'fire' && type === 'fire') || (e.ward === 'poi' && type === 'poison')))
    dps *= 0.4;
  const d = e.dots[type];
  // Длительность у котла одна на все источники. Раньше здесь стояло d.dur = dur,
  // поэтому последний прок мог обрезать уже накопленный котёл.
  // Берём средневзвешенную по урону. Это не приближение: суммарный урон котла равен
  // dps × dur, и при таком слиянии он в точности равен сумме вкладов обоих проков.
  const tot = d.dps + dps;
  d.dur = tot > 0 ? (d.dps*d.dur + dps*dur) / tot : dur;
  d.dps = tot; d.minionDps = (d.minionDps || 0) + dps*minionShare; d.n += 1;
}
/* Совместимость: кровотечение теперь просто один из типов DoT */
function addBleed(e, dps, minionShare=0){ addDot(e, 'bleed', dps, 6 * D.ailDur, minionShare); }

/* Чумной взрыв не наносит мгновенный урон. Он заражает всех выживших в малом
   радиусе; чума всегда делает три тика: на 1-й, 2-й и 3-й секунде. Каждый тик
   берёт 15% от ТЕКУЩЕГО, а не максимального HP цели, поэтому не может убить
   одним срабатыванием и естественно слабеет на раненых врагах. */
const PLAGUE_RADIUS = 82, PLAGUE_LIFE = 3, PLAGUE_PCT = 0.15;
function infectWithPlague(e){
  e.plague = {life:PLAGUE_LIFE, tick:1, hits:0};  // обновляет чуму, а не складывает бесконечно
  statusText(e, 'ЧУМА', '#b6df55');
  G.fx.push({t:'ring', x:e.x, y:e.y, r:e.r+3, max:e.r+15, life:0.22, col:'#b6df55'});
}
function plagueBurst(x, y, radius){
  G.fx.push({t:'ring', x, y, r:8, max:radius, life:0.34, col:'#9dca4a'});
  burst(x, y, 18, '#9dca4a', 240, 4, 0.65);
  for (const e of G.enemies){
    if (e.dead || dist(e, {x,y}) >= radius + e.r) continue;
    infectWithPlague(e);
  }
}

/* Виды приспешников. mode задаёт поведение, остальное — внешний вид. */
const MKIND = {
  skeleton:{nm:'Скелет',          sides:3, col:'#8fd4b0', mode:'melee'},
  hunter:  {nm:'Охотник',         sides:4, col:'#d4c98f', mode:'ranged'},
  warlock: {nm:'Колдун',          sides:5, col:'#b98fd4', mode:'caster'},
  golemB:  {nm:'Голем крови',     sides:6, col:'#d4506a', mode:'golemB'},
  golemN:  {nm:'Костяной голем',  sides:5, col:'#e6e2d6', mode:'golemN'},
};
const mCount = k => G.minions.reduce((n,m)=> n + (m.kind === k ? 1 : 0), 0);

/* Здоровье и размер зависят от вида: големы считаются от статов игрока напрямую */
function minionHp(kind){
  /* Запас голема считается от запаса свиты, а не от вашего. Ваше здоровье
     растёт линейно по уровню, а свита — по этажу через hpScale: привязка
     к игроку делала танка тем бесполезнее, чем глубже забег. Замер до правки
     на 35 этаже: голем десятого уровня имел 2% от запаса обычного скелета. */
  if (kind === 'golemB') return D.minLife * 0.35 * D.golemB;   // 10 уровней → 3.5 скелета
  /* Та же правка, что и у голема крови: запас считается от свиты, а не от вас.
     Замер до неё на 35 этаже — 1.1% от запаса обычного скелета, при том что
     костяной по своей роли лезет в самую гущу и стягивает удары.
     Доля вдвое ниже, чем у голема крови (0.35): этот не танк, а бегун. */
  if (kind === 'golemN') return D.minLife * 0.20 * D.golemN;   // 10 уровней → 2 скелета
  if (kind === 'hunter') return D.minLife * 0.8;
  if (kind === 'warlock') return D.minLife * 0.7;
  return D.minLife;
}
function minionR(kind){
  return kind === 'golemB' ? 22 : kind === 'golemN' ? 17
       : kind === 'hunter' ? 10 : kind === 'warlock' ? 11 : (D.minTier ? 13 : 10);
}
/* Кого поднимать следующим. Големы идут первыми: каждый стоит до десяти карт,
   и держать их в конце очереди за восемнадцатью рядовыми — значит обесценить вложение. */
function needKind(){
  if (D.golemB > 0 && !mCount('golemB')) return 'golemB';
  if (D.golemN > 0 && !mCount('golemN')) return 'golemN';
  if (mCount('skeleton') < D.maxSkel) return 'skeleton';
  if (mCount('hunter')   < D.maxHunt) return 'hunter';
  if (mCount('warlock')  < D.maxWarl) return 'warlock';
  return null;
}

/* ---------- 6b. ПРИСПЕШНИКИ ----------
   Скелет — самостоятельная сущность: ищет ближайшего врага в радиусе,
   добегает и бьёт. Его урон считается от вашего среднего удара,
   поэтому вся прокачка урона косвенно усиливает и свиту.            */
const MINION_LIFE_MIN = 10, MINION_LIFE_MAX = 15;
function spawnMinion(x, y, kind){
  kind = kind || needKind();
  if (!kind) return false;
  const hp = minionHp(kind), px = x !== undefined ? x : G.player.x, py = y !== undefined ? y : G.player.y;
  G.minions.push({
    kind, x: px + rnd(-20,20), y: py + rnd(-20,20),
    r: minionR(kind), hp, max: hp,
    cd: rnd(0, 0.4), rot: rnd(0,6.28), hit:0, born:0, tgt:null, blinkT:undefined, hitN:0,
    deathT: rnd(MINION_LIFE_MIN, MINION_LIFE_MAX), // независимая естественная смерть запускает общие посмертные эффекты
  });
  G.fx.push({t:'ring', x:px, y:py, r:4, max:26, life:0.25, col:MKIND[kind].col});
  return true;
}

/* Урон приспешника: отдельный, более простой путь — без условных бонусов,
   но с учётом брони цели, шока и крита свиты. */
/* Удар приспешника идёт по ТОМУ ЖЕ пути, что и удар игрока: damage() с меткой
   src.minion. Раньше здесь была своя укороченная копия формулы, и мимо свиты
   проходило почти всё — поджог, охлаждение, шок с разрядом, яд, оглушение,
   отбрасывание, добивание, сверхкриты, кольца, перчатки, счётчики «каждый N-й»
   и двойные удары. Некромант получал половину каталога вхолостую.
   Отличия свиты отмечены через src.minion: свой шанс крита и вампиризм,
   отбрасывание от позиции бойца, а также ×0.25 к шансам негативных эффектов.
   Общий урон всех типов свиты отдельно уменьшен вдвое. */
const FRENZY_R = 70;               // база радиуса взрыва «Буйства демонов»
const WHIRL_R  = 55;               // база радиуса «Вихря когтей»
/* КИПЯЩАЯ КРОВЬ. Лужа бьёт долей ТЕКУЩЕГО здоровья, поэтому урон не растёт
   с этажом и не убивает сам по себе: три тика по 5% снимают около 14% запаса
   у кого угодно. Ценность в том, что доля не зависит ни от брони, ни от
   множителей врага — это ответ на жирные цели, а не источник дпс.
   Потолок на число луж стоит от спама: свита получает удары десятками в секунду. */
const BOIL_R = 60, BOIL_LIFE = 3, BOIL_PCT = 0.05, BOIL_MAX = 24;
function boilRoll(m){
  if (!D.minBoil || Math.random() >= 0.05) return;
  if (G.boils.length >= BOIL_MAX) G.boils.shift();
  G.boils.push({x:m.x, y:m.y, r:BOIL_R*D.aoeR, life:BOIL_LIFE, t:1});
  G.fx.push({t:'ring', x:m.x, y:m.y, r:6, max:BOIL_R*D.aoeR, life:0.3, col:'#e0405a'});
}
function tickBoils(dt){
  for (let i = G.boils.length-1; i >= 0; i--){
    const b2 = G.boils[i];
    b2.life -= dt; b2.t -= dt;
    if (b2.life <= 0){ G.boils.splice(i,1); continue; }
    if (b2.t > 0) continue;
    b2.t = 1;                                        // тик раз в секунду, а не каждый кадр
    for (const e of G.enemies){
      if (dist(e, b2) > b2.r + e.r) continue;
      applyDamage(e, e.hp*BOIL_PCT, false, true, 1);
      burst(e.x, e.y, 2, '#e0405a', 90, 2, 0.3);
    }
  }
}
/* ВЕНОМАНСЕР: смерть любого приспешника оставляет кислоту. Три тика по 15%
   текущего здоровья идут сразу, затем через одну и две секунды. */
const ACID_R = 58, ACID_LIFE = 3, ACID_PCT = 0.15, ACID_MAX = 30;
function dropAcidPool(m){
  if (G.acidPools.length >= ACID_MAX) G.acidPools.shift();
  G.acidPools.push({x:m.x, y:m.y, r:ACID_R*D.aoeR, life:ACID_LIFE, max:ACID_LIFE, t:0});
  G.fx.push({t:'ring', x:m.x, y:m.y, r:6, max:ACID_R*D.aoeR, life:0.3, col:'#8be04e'});
}
function tickAcidPools(dt){
  for (let i = G.acidPools.length-1; i >= 0; i--){
    const a = G.acidPools[i];
    a.life -= dt; a.t -= dt;
    if (a.life <= 0){ G.acidPools.splice(i,1); continue; }
    if (a.t > 0) continue;
    a.t = 1;
    for (const e of G.enemies){
      if (e.dead || dist(e, a) > a.r + e.r) continue;
      applyDamage(e, e.hp*ACID_PCT, false, true, 1);
      burst(e.x, e.y, 3, '#8be04e', 100, 3, 0.35);
    }
  }
}
/* Поводок свиты: дальше этого от ХОЗЯИНА цели не берутся вовсе. Раньше каждый
   приспешник искал ближайшего к себе, и стая всем составом уносилась за одним
   убегающим врагом через всю комнату, оставляя игрока голым. */
const MINION_LEASH = 640;
/* Штраф за занятую цель, в единицах расстояния. 500 означает «занятый враг
   считается на 500 дальше»: свита разбирает толпу параллельно, но если врагов
   меньше, чем бойцов, они всё равно добивают вместе, а не стоят без дела. */
const MINION_CLAIM_PENALTY = 500;

/* Перенос приспешника к цели со взрывом. Взрыв идёт через damage() с меткой
   приспешника, то есть по тому же пути, что и обычный удар: книги, статусы,
   кольца, счётчики «каждый N-й» — всё срабатывает.
   Единственное, чего он НЕ вызывает, — «Буйство демонов» и «Кровавую баню»:
   они висят на minionHit, и цепочка «взрыв рождает взрыв» была бы лавиной. */
function minionBlink(m, e, dt){
  const B = D.minBlink;
  m.blinkT = (m.blinkT === undefined ? rnd(0, B.cd) : m.blinkT) - dt;
  if (m.blinkT > 0) return false;
  m.blinkT = B.cd;
  const a = rnd(0, Math.PI*2), off = e.r + m.r + 4;
  G.fx.push({t:'ring', x:m.x, y:m.y, r:m.r, max:4, life:0.25, col:'#c08cff'});
  m.x = clamp(e.x + Math.cos(a)*off, -ARENA, ARENA);
  m.y = clamp(e.y + Math.sin(a)*off, -ARENA, ARENA);
  const R = B.r * D.aoeR;
  G.fx.push({t:'ring', x:m.x, y:m.y, r:6, max:R, life:0.3, col:'#c08cff'});
  burst(m.x, m.y, 10, '#c08cff', 220, 3, 0.45);
  const mul = D.minDmgMul * B.mul * (G.bloodT > 0 ? 2 : 1);
  const targets = G.enemies.filter(o => !o.dead && dist(o, m) <= R + o.r);
  const blastMul = mul * overpressureMultiplier(targets.length);
  for (const o of targets) damage(o, {mul:blastMul, minion:m, noDouble:true});
  return true;
}

function minionHit(e, m){
  // Голем крови масштабируется от вас напрямую, остальные — через множитель свиты
  const rage = G.bloodT > 0 ? 2 : 1;                 // КРОВНЫЕ УЗЫ: ярость от вашей крови
  const mul = (m.kind === 'golemB' ? D.golemBMul : D.minDmgMul) * rage;
  damage(e, {mul, minion:m, direct:true});

  /* КОГТИ. Счётчик у каждого приспешника свой: общий на всю свиту означал бы,
     что десять бойцов выбивают «каждый пятый» пять раз в секунду на всех вместе,
     и период перестал бы что-либо значить для отдельного скелета.
     Добавочные удары идут с noDouble: иначе двойное попадание игрока плодило бы
     их дальше, и один взмах разрастался бы в очередь. */
  if (D.minClaws || D.minWhirl){
    m.hitN = (m.hitN || 0) + 1;
    if (D.minClaws && m.hitN % 5 === 0){
      damage(e, {mul:mul*0.30, minion:m, noDouble:true});
      burst(e.x, e.y, 4, '#e6e2d6', 160, 2, 0.3);
    }
    if (D.minWhirl && m.hitN % 10 === 0){
      const R = WHIRL_R * D.aoeR;
      G.fx.push({t:'ring', x:m.x, y:m.y, r:8, max:R, life:0.24, col:'#e6e2d6'});
      for (const o of G.enemies){
        if (o.dead || dist(o, m) > R + o.r) continue;
        damage(o, {mul:mul*0.20, minion:m, noDouble:true});
      }
    }
  }
  /* БУЙСТВО ДЕМОНОВ: взрыв вокруг цели тем же ударом и по тому же пути,
     то есть со всеми эффектами игрока — книгами, статусами, кольцами.
     Цель исключена: по ней удар уже прошёл, иначе получилось бы двойное
     попадание в упор. Рекурсии нет — взрыв зовёт damage() напрямую, а не
     minionHit(), поэтому сам себя не порождает. */
  /* КРОВАВАЯ БАНЯ. Сила стака берётся с книги крови, если она найдена, иначе
     считается по базовой доле в 15% от удара — той же, что у книги первого ранга.
     Так карточка работает и в связке с книгой, и сама по себе, а стаки при этом
     сливаются в один эффект по общему правилу усреднения кровотечения. */
  if (D.minBath && Math.random() < 0.10 * MINION_AILMENT_CHANCE_MULT){
    addBleed(e, (bookBleedDps()*MINION_DAMAGE_MULT || avgHit()*0.15*D.ailEff*MINION_DAMAGE_MULT)*boneFieldDamageMul(), 1);
    statusText(e, 'КРОВЬ', '#e0405a');
  }
  if (D.minFrenzy){
    const R = FRENZY_R * D.aoeR;
    G.fx.push({t:'ring', x:e.x, y:e.y, r:8, max:R, life:0.28, col:'#ff5a4e'});
    const targets = G.enemies.filter(o => o !== e && !o.dead && dist(o, e) <= R + o.r);
    const blastMul = mul * overpressureMultiplier(targets.length);
    for (const o of targets) damage(o, {mul:blastMul, minion:m, noDouble:true});
  }
  if (m.kind === 'golemB' && Math.random() < MINION_AILMENT_CHANCE_MULT){ // врождённое отбрасывание: 100% → 25%
    const a = Math.atan2(e.y-m.y, e.x-m.x);
    e.kb.x += Math.cos(a)*200; e.kb.y += Math.sin(a)*200;
    burst(e.x, e.y, 8, '#d4506a', 200, 4, 0.5);
  }
}

/* Костяной голем: прямого урона нет вовсе — только кровотечение,
   после чего он сразу уходит к следующей цели. Добить никого не может. */
function boneGolemHit(e, m){
  rollBoneChallenge(e, m);
  if (Math.random() >= MINION_AILMENT_CHANCE_MULT) return;
  addBleed(e, avgHit() * 0.03 * D.golemN * D.ailEff * MINION_DAMAGE_MULT * boneFieldDamageMul(), 1);
  burst(e.x, e.y, 7, '#e0405a', 170, 3, 0.5);
}

/* Выстрел приспешника: тот же снаряд, что у игрока, но с урезанным множителем */
function minionShot(m, e, spell){
  const a = Math.atan2(e.y-m.y, e.x-m.x);
  // Снаряды охотников и колдунов наследуют вашу скорость и размер снаряда.
  // Дальность держим постоянной: скорость умножается, а время жизни делится,
  // иначе +100% к скорости вдвое удлиняли бы и выстрел, а это уже другая карточка.
  G.shots.push({
    x:m.x, y:m.y, a,
    vx:Math.cos(a)*470*D.projSpd, vy:Math.sin(a)*470*D.projSpd,
    r: (spell ? 7 : 4) * D.projSize, life:1.1/D.projSpd,
    pierce:D.pierce, chain:D.chain, ric:0, hitSet:[], orb:false,
    mul:0.20, pierced:0, spell, minion:m, spriteType:spell ? 'mage' : 'arrow',
  });
}

/* Собственная стихия колдуна раньше срабатывала гарантированно поверх общего
   удара. Теперь это тоже эффект удара свиты: шанс 25%, а урон эффекта ×0.5. */
function applyMinionSpell(e, spell){
  if (!spell || Math.random() >= MINION_AILMENT_CHANCE_MULT) return false;
  const base = avgHit() * 0.20 * MINION_DAMAGE_MULT * boneFieldDamageMul();
  if (spell === 'fire'){
    addDot(e, 'fire', base*IGNITE_DPS_SHARE*D.ailEff, 3*D.ailDur, 1);
    burst(e.x,e.y,5,'#ff7a2f',120,3,0.4);
  }
  if (spell === 'cold'){
    if (e.ail.chill<=0) statusText(e,'SLOWED','#ffe14a');
    e.ail.chill = CHILL_DURATION*D.ailDur;
    applyDamage(e, base*CHILL_DAMAGE_SHARE*D.ailEff, false, false, 1);
    if (D.freeze && Math.random() < FREEZE_CHANCE){
      if(e.ail.freeze<=0) statusText(e,'FROZEN','#7fd6ff');
      e.ail.freeze = Math.max(e.ail.freeze, FREEZE_DURATION*D.ailDur*D.freezeDur);
    }
    burst(e.x,e.y,5,'#7fd6ff',120,3,0.4);
  }
  if (spell === 'poison'){
    addDot(e, 'poison', base*POISON_DPS_SHARE*D.ailEff*(D.radiation?2:1), 4*D.ailDur, 1);
    burst(e.x,e.y,5,'#8be04e',120,3,0.4);
  }
  return true;
}

function killMinion(i){
  if (i < 0 || i >= G.minions.length) return;   // защита от индекса -1 у уже убитого
  const m = G.minions[i];
  if (D.venomancer) dropAcidPool(m);
  if (D.minBoom) nova(m.x, m.y, 95*D.aoeR, avgHit()*D.minDmgMul*MINION_DAMAGE_MULT*boneFieldDamageMul()*1.2*(G.bloodT>0?2:1), MKIND[m.kind].col, {minionShare:1, overpressure:true});
  G.fx.push({t:'ring', x:m.x, y:m.y, r:m.r, max:m.r*2.2, life:0.25, col:MKIND[m.kind].col});
  burst(m.x, m.y, m.kind.startsWith('golem') ? 26 : 12, MKIND[m.kind].col, 190, 4, 0.7);
  G.minions.splice(i,1);
}

function enemyCause(e, attack){
  const rank = e.kind === 'boss' ? 'БОСС' : e.kind === 'elite' ? 'ЭЛИТА' : 'ВРАГ';
  return rank + ' · ' + e.t.nm + (e.affNm ? ' · ' + e.affNm : '') + ' · ' + attack;
}

/* Единая визуальная реакция на фактически потерянное здоровье. Интенсивность
   считается после всей защиты и щитов: заблокированный удар не должен трясти
   экран, а способность босса на долю max HP обязана ощущаться тяжелее контакта. */
const PLAYER_HP_LAG_TIME=0.4;
function playerDamageFeedback(damage, hpBefore){
  if (!(damage > 0)) return;
  const p=G.player, ratio=damage/Math.max(1,D.life);
  const tier=ratio < 0.05 ? 0 : ratio < 0.15 ? 1 : ratio < 0.30 ? 2 : 3;
  const shakeAmp=[2.5,3,5.5,7.5][tier], shakeLife=[0.08,0.10,0.135,0.15][tier];
  p.hitFlash=Math.max(p.hitFlash,0.06+tier*0.013);
  p.hpFlash=Math.max(p.hpFlash,0.15);
  const before=clamp(hpBefore/D.life,0,1);
  p.hpLag=Math.max(Number.isFinite(p.hpLag)?p.hpLag:before,before);
  p.hpLagFrom=p.hpLag; p.hpLagTimer=PLAYER_HP_LAG_TIME;
  G.hurtVignette=Math.max(G.hurtVignette,0.10+tier*0.025);
  G.hurtVignetteMax=G.hurtVignette;
  G.hurtVignetteOpacity=Math.max(G.hurtVignetteOpacity,0.12+0.48*clamp(ratio/0.30,0,1));
  G.fx.push({t:'shake',life:shakeLife,amp:shakeAmp});
  G.fx.push({t:'hurtNum',x:p.x+rnd(-7,7),y:p.y-p.r-15,v:'-'+Math.max(1,Math.round(damage)),life:0.4,max:0.4});
  const partN=[4,5,6,6][tier];
  for (let i=0;i<partN;i++){
    const a=rnd(0,Math.PI*2), speed=rnd(45,135+tier*22), life=rnd(0.10,0.20);
    G.parts.push({x:p.x+rnd(-2,2),y:p.y+rnd(-2,2),vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,
                  life,max:life,sz:rndi(2,3),col:'#ff304f'});
  }
  if (ratio >= 0.15) G.hitStop=Math.max(G.hitStop,tier === 3 ? 0.04 : 0.03);
}

/* Эти таймеры идут по реальному кадру, даже пока игровой action заморожен
   hit-stop'ом. Иначе 30 мс паузы искусственно растягивали бы flash и виньетку. */
function tickPlayerDamageFeedback(dt){
  if (!G) return;
  const p=G.player;
  p.hitFlash=Math.max(0,(p.hitFlash||0)-dt);
  p.hpFlash=Math.max(0,(p.hpFlash||0)-dt);
  G.hurtVignette=Math.max(0,(G.hurtVignette||0)-dt);
  if (G.hurtVignette <= 0){ G.hurtVignetteMax=0; G.hurtVignetteOpacity=0; }
  const hpNow=clamp(p.hp/D.life,0,1);
  if (hpNow>=p.hpLag){
    // Лечение, поднявшее настоящий HP выше хвоста, синхронизирует его сразу.
    p.hpLag=p.hpLagFrom=hpNow; p.hpLagTimer=0;
  } else if (p.hpLagTimer>0){
    p.hpLagTimer=Math.max(0,p.hpLagTimer-dt);
    const t=1-p.hpLagTimer/PLAYER_HP_LAG_TIME;
    p.hpLag=p.hpLagFrom+(hpNow-p.hpLagFrom)*t;
  } else p.hpLag=hpNow;
}
function hurt(v, ignoreDefense, selfBlast, cause, sourceKind){
  const p = G.player, b = G.bag;
  // Старые вызовы передают только подпись причины, поэтому ранг берём и из неё.
  // Новые опасности (лужи) передают sourceKind явно, не теряя владельца эффекта.
  const enemyRank = sourceKind || (cause && cause.startsWith('ВРАГ') ? 'norm' :
    cause && (cause.startsWith('ЭЛИТА') || cause.startsWith('БОСС') || cause.includes('БОСС')) ? 'elite' : '');
  if (p.inv > 0) return;                                          // i-frames рывка
  // СЕРДЦЕ ГОЛЕМА: заряд копится сам, тратится на первый же удар после готовности
  if (amu('golem') && G.amuT.golem <= 0 && !selfBlast){
    G.amuT.golem = 10;
    G.fx.push({t:'txt', x:p.x, y:p.y-30, s:'ЗАБЛОКИРОВАНО', life:0.9, col:'#9aa7b4'});
    G.fx.push({t:'ring', x:p.x, y:p.y, r:p.r, max:44, life:0.3, col:'#9aa7b4'});
    return;
  }
  if (!ignoreDefense){
    if (Math.random()*100 < D.dodge){ G.fx.push({t:'txt',x:p.x,y:p.y-24,s:'уворот',life:.5,col:'#8be04e'}); return; }
    const closeEnemies=nearbyWarriorEnemyCount();
    const crowdArmor=D.steelCrowd*Math.min(6,closeEnemies);
    const armor=D.armor+crowdArmor;
    v *= 1 - armor/(armor + 90);
    v = Math.max(1, v - D.drFlat);
    if (D.drShop) v *= 1 - D.drShop/100;      // магазинная броня поверх, отдельным множителем
    if (enemyRank === 'norm') v *= 1 - D.normalDr/100;
    if (enemyRank === 'elite' || enemyRank === 'boss') v *= 1 - D.majorDr/100;
    if (D.holdLine) v *= 1-Math.min(5,closeEnemies)*0.02;
  }
  // ПАНЦИРЬ ЦЕЛОГО и ПОСЛЕДНЯЯ БРОНЯ: два взаимоисключающих порога
  if (amu('fullplate') && p.hp >= D.life) v *= 0.65;
  if (amu('lastplate') && p.hp/D.life < 0.20) v *= 0.60;
  // СТАЛЬНАЯ ВОЛЯ: потолок на один удар, не чаще раза в 10 сек
  if (amu('steel') && G.amuT.steel <= 0 && v > D.life*0.8){
    v = D.life*0.8; G.amuT.steel = 10;
    G.fx.push({t:'txt', x:p.x, y:p.y-30, s:'СТАЛЬНАЯ ВОЛЯ', life:1.1, col:'#6fb3ff'});
  }
  // Временный «Запас прочности» расходуется раньше постоянных барьеров:
  // у него есть срок жизни, поэтому держать его за бессрочным щитом было бы
  // скрытым штрафом. Полностью поглощённый удар не сбивает «Передышку».
  if (p.reserveBarrier > 0){
    const eaten=Math.min(p.reserveBarrier,v);
    p.reserveBarrier-=eaten; v-=eaten;
    G.fx.push({t:'ring',x:p.x,y:p.y,r:p.r+9,max:p.r+18,life:0.2,col:'#6fb3ff'});
    if (p.reserveBarrier<=0){ p.reserveBarrier=0; p.reserveBarrierT=0; }
    if (v<=0) return;
  }
  // ТАЛИСМАН ПОКОЯ: барьер съедает урон раньше здоровья
  if (p.barrier > 0){
    const eaten = Math.min(p.barrier, v);
    p.barrier -= eaten; v -= eaten;
    G.fx.push({t:'ring', x:p.x, y:p.y, r:p.r+6, max:p.r+16, life:0.2, col:'#5ec2e0'});
    if (p.barrier <= 0) G.amuT.calm = 5;              // откат считается от момента расхода
    if (v <= 0) return;
  }
  // Красный щит УЖАСАЮЩЕГО ВАМПИРА — запас здоровья поверх основного HP.
  if (p.dreadShield > 0){
    const eaten = Math.min(p.dreadShield, v);
    p.dreadShield -= eaten; v -= eaten;
    G.fx.push({t:'ring', x:p.x, y:p.y, r:p.r+11, max:p.r+21, life:0.22, col:'#cf2135'});
    if (v <= 0) return;
  }
  // ПОСЛЕДНИЙ ВЗДОХ: оставляет единицу здоровья и две секунды неуязвимости
  if (p.hp - v <= 0 && amu('breath') && G.amuT.breath <= 0){
    const hpBefore=p.hp;
    G.amuT.breath = 120; p.hp = 1; p.inv = 2;
    playerDamageFeedback(Math.max(0,hpBefore-p.hp),hpBefore);
    G.fx.push({t:'txt', x:p.x, y:p.y-30, s:'ПОСЛЕДНИЙ ВЗДОХ', life:1.6, col:'#ff5a4e'});
    G.fx.push({t:'ring', x:p.x, y:p.y, r:8, max:170, life:0.7, col:'#ff5a4e'});
    return;
  }
  // КУКЛА СМЕРТИ: один заряд на этаж, гасит удар целиком
  if (p.hp - v <= 0 && amu('doll') && G.amuT.doll > 0){
    G.amuT.doll = 0; p.inv = 1.5;
    G.fx.push({t:'txt', x:p.x, y:p.y-30, s:'КУКЛА РАССЫПАЛАСЬ', life:1.4, col:'#ff5a4e'});
    G.fx.push({t:'ring', x:p.x, y:p.y, r:8, max:150, life:0.6, col:'#ff5a4e'});
    burst(p.x, p.y, 40, '#ff5a4e', 280, 4, 0.9);
    return;
  }
  // ОБМАН СМЕРТИ: гарантированное спасение без скрытого лечения. Единый hurt()
  // охватывает контакт, снаряды, лужи, боссов и собственный опасный взрыв.
  if (p.hp - v <= 0 && b.has('cheat') && p.cheatCd <= 0){
    const hpBefore=p.hp;
    p.cheatCd = 60; p.hp = 1; p.inv = 1; p.cheatSpeedT = 1; recalc();
    playerDamageFeedback(Math.max(0,hpBefore-p.hp),hpBefore);
    G.fx.push({t:'txt', x:p.x, y:p.y-30, s:'ОБМАН СМЕРТИ', life:1.2, col:'#ff8a3d'});
    G.fx.push({t:'ring', x:p.x, y:p.y, r:8, max:160, life:0.65, col:'#ff8a3d'});
    burst(p.x,p.y,24,'#ff8a3d',250,4,0.7); return;
  }
  // min.bond / кейстоун «Некромантская связь»: часть урона принимает свита.
  // Свой же взрыв трупа сюда не попадает: перекладывать его на скелетов значит
  // убивать собственную армию за то, что билд работает как задумано.
  // КРОВНЫЕ УЗЫ: отсчёт идёт от ЛЮБОГО попадания по игроку, даже если перехват
  // съел его целиком — свиту злит сам факт удара, а не остаток урона
  if (D.bloodTies && !selfBlast){
    G.bloodT = 3;
    G.fx.push({t:'ring', x:p.x, y:p.y, r:p.r, max:70, life:0.35, col:'#ff2a2a'});
  }
  if (D.minBond && G.minions.length && !selfBlast){
    const share = v * D.minBond/100; v -= share;
    const m = pick(G.minions); m.hp -= share; m.hit = 0.12;
    boilRoll(m);                                       // перехваченный удар тоже считается ударом
    if (m.hp <= 0) killMinion(G.minions.indexOf(m));   // индекс проверяется внутри killMinion
  }
  const hpBefore=p.hp;
  G.stats.taken += v;
  if (v>0){ p.respiteT=0; p.respiteHealT=3; }
  p.hp -= v; p.combatT = Math.max(p.combatT, 0);
  if (v > 0 && D.counterTempoPerHit > 0 && cause && cause.includes('контакт')){
    p.counterTempoPct=Math.min(200,(p.counterTempoPct||0)+D.counterTempoPerHit);
    p.counterTempoT=(p.counterTempoT||0)+2;
    recalc();
  }
  playerDamageFeedback(v,hpBefore);
  if (v > 0) p.deathLog = {cause:cause || (selfBlast ? 'СОБСТВЕННЫЙ ВЗРЫВ' : 'НЕИЗВЕСТНЫЙ УРОН'), dmg:Math.ceil(v)};
  if (b.has('retal')) nova(p.x, p.y, 130*D.aoeR, avgHit()*0.5, '#e0405a', {overpressure:true});
  if (amu('riposte')) p.riposte = true;          // КОНТРУДАР заряжается от любого попадания
  // ЧЁРНОЕ ЗЕРКАЛО: копия встаёт от удара, а не по таймеру — это реакция, не аура
  if (amu('mirror') && G.amuT.mirror <= 0 && !selfBlast){
    G.amuT.mirror = 10;
    G.clone = {x:p.x + rnd(-40,40), y:p.y + rnd(-40,40), aim:p.aim, cd:0, life:3};
    G.fx.push({t:'ring', x:G.clone.x, y:G.clone.y, r:8, max:60, life:0.4, col:'#c08cff'});
  }
  if (p.hp <= 0) gameOver();
}

/* ---------- 6c. КРУГОВЫЕ ОРБЫ ----------
   Орбы висят на общем кольце вокруг игрока и равномерно расставлены по нему.
   Урон идёт через обычный damage(), поэтому криты, стихии, книги и статусы
   работают на них так же, как на автоатаке. */
const ORBIT_R = 74, ORBIT_SIZE = 7, ORBIT_SPD = 1.7;

function orbitPos(i){
  const a = G.orbitA + i * Math.PI*2 / D.orbitN;
  const r = ORBIT_R * D.aoeR;                       // радиус кольца растёт от модификаторов области
  return {x: G.player.x + Math.cos(a)*r, y: G.player.y + Math.sin(a)*r};
}

function updateOrbits(dt){
  if (!D.orbitN) return;
  // Кольцо крутится тем быстрее, чем выше скорость атаки: орб — это оружие,
  // и логично, что «быстрее бьёшь» означает «быстрее обходишь цели».
  // Учти, что на большом числе орбов прибавка съедается откатом e.orbCd:
  // при десяти орбах цель и так задевается каждые 0.37 сек против отката 0.45.
  G.orbitA += ORBIT_SPD * D.aspd * dt;
  const size = ORBIT_SIZE * D.projSize;
  for (const e of G.enemies){
    e.orbCd -= dt;
    if (e.orbCd > 0) continue;                      // откат на цель, иначе орб бьёт 60 раз в секунду
    for (let i = 0; i < D.orbitN; i++){
      const o = orbitPos(i);
      if (dist(o, e) > e.r + size) continue;
      damage(e, {attackMul:0.25, warriorMelee:true});// 25% всей воинской автоатаки: модификаторы и шансы общие
      burst(o.x, o.y, 3, '#6fb3ff', 120, 3, 0.3);
      e.orbCd = 0.45;
      break;
    }
  }
}

/* ---------- 7. АТАКА ИГРОКА (автоматическая) ----------
   Игрок не целится и не жмёт кнопку: персонаж сам выбирает ближайшего врага
   в пределах дальности оружия и бьёт по готовности отката.
   Остаётся только позиционирование — то есть решение «куда встать», а не «куда кликнуть». */

/* Дальность автозахвата: ближний бой ограничен длиной дуги, дальний — полётом снаряда */
function attackRange(){
  const w = G.weapon;
  // Автозахват обязан видеть ровно ту же дальность, до которой достаёт обычный
  // сектор. Иначе «Длинное лезвие» расширяет уже начатый взмах, но не даёт ему
  // начаться по цели между базовым и увеличенным радиусом.
  if (w.type === 'melee') return w.reach * D.arc * D.longBladeRange;
  if (w.id === 'wpn.bow') return w.speed*D.projSpd*w.life*D.arrowFlight+60;
  return w.type === 'orb' ? 430 : 520;
}

/* Ближайшая цель в радиусе. Расстояние меряем до края врага,
   иначе крупные боссы «не достаются» вплотную. */
function findTarget(range){
  const p = G.player;
  let best = null, bd = Infinity;
  for (const e of G.enemies){
    const d = dist(e,p) - e.r;
    if (d < range && d < bd){ bd = d; best = e; }
  }
  return best;
}

/* Один канонический путь для обычной и мини-сферы Мультипликации. Мини-сфера
   меньше только визуально и по AoE; скорость, дальность и модификаторы те же. */
const ACCELERATED_ARROW_TIME = 0.35;
const ACCELERATED_ARROW_TRAIL_LENGTH = 22;

function acceleratedArrowTrailActive(s){
  return !!(s && s.playerArrow && D.acceleratedArrow > 0 && s.age >= ACCELERATED_ARROW_TIME);
}

/* Синий хвост — только индикатор уже активного бонуса «Разогнанных стрел».
   Он рисуется непосредственно за текущей стрелой и не создаёт частицы в G.fx,
   поэтому сотни стрел не раздувают список эффектов. */
function drawAcceleratedArrowTrail(s){
  if (!acceleratedArrowTrailActive(s)) return false;
  const speed=Math.hypot(s.vx,s.vy);
  if (speed <= 0) return false;
  const dx=s.vx/speed, dy=s.vy/speed;
  const x1=s.x-dx*5, y1=s.y-dy*5;
  const x2=s.x-dx*ACCELERATED_ARROW_TRAIL_LENGTH, y2=s.y-dy*ACCELERATED_ARROW_TRAIL_LENGTH;
  ctx.save(); ctx.lineCap='round';
  ctx.strokeStyle='#2f8dff'; ctx.globalAlpha=0.20; ctx.lineWidth=Math.max(4,s.r*0.8);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.strokeStyle='#8bd8ff'; ctx.globalAlpha=0.72; ctx.lineWidth=Math.max(1.5,s.r*0.3);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2+dx*5,y2+dy*5); ctx.stroke();
  ctx.restore();
  return true;
}

function spawnPlayerShot(o, a, w, miniOrb=false){
  const orb = w.type === 'orb', scale = miniOrb ? D.multiplierMiniArea : 1;
  const playerArrow=w.id==='wpn.bow';
  G.shots.push({
    x:o.x, y:o.y, a,
    vx:Math.cos(a)*w.speed*D.projSpd, vy:Math.sin(a)*w.speed*D.projSpd,
    r:(orb?9:5) * D.projSize * scale, life:w.life*(playerArrow?D.arrowFlight:1), age:0, travel:0,
    pierce:D.pierce, chain:D.chain, hitSet:[], orb,
    mul:1, attackMul:miniOrb ? D.multiplierMiniDamage : undefined,
    aoeScale:scale, miniOrb, pierced:0, ricochetReleased:false,
    spriteType:orb ? 'mage' : 'arrow', playerArrow,
  });
}

/* Proc фиксируется вместе с основной сферой, но сам дочерний выстрел живёт на
   игровом времени. Поэтому пауза честно замораживает 100 мс, а setTimeout не
   может выпустить сферу поверх меню. Направление родителя сохраняется; точка
   старта берётся у Мага в момент второго выстрела, чтобы сфера выходила из него. */
function queueMultiplierMiniShot(a){
  G.delayedShots.push({fireAt:G.time + D.multiplierMiniDelay, a});
}
function tickDelayedPlayerShots(){
  for (let i=G.delayedShots.length-1; i>=0; i--){
    const shot=G.delayedShots[i];
    if (shot.fireAt > G.time + 1e-9) continue;
    G.delayedShots.splice(i,1);
    if (G.weapon.type === 'orb') spawnPlayerShot(G.player,shot.a,G.weapon,true);
  }
}

function tickAttackEchoes(){
  for (let i=G.attackEchoes.length-1;i>=0;i--){
    const echo=G.attackEchoes[i];
    if (echo.fireAt>G.time+1e-9) continue;
    G.attackEchoes.splice(i,1);
    const e=echo.target;
    if (!e || e.dead || e.hp<=0) continue;
    damage(e,echo.src);
    G.fx.push({t:'ring',x:e.x,y:e.y,r:e.r,max:e.r+24,life:0.22,col:'#6fb3ff'});
    statusText(e,'ЭХО','#6fb3ff');
  }
}

/* src — откуда бьём. Пусто значит сам игрок; копия «Чёрного зеркала» подставляет
   себя и стреляет тем же оружием с теми же характеристиками. */
function attack(src){
  const p = G.player, w = G.weapon;
  const o = src || p;
  const ang = o.aim;                                              // направление задаёт автозахват
  if (!src) p.atkCd = D.atkCd;

  if (w.type === 'melee'){
    const baseReach = w.reach * D.arc, reach = baseReach * D.longBladeRange, arc = w.arc * D.arc;
    const bladeWave = !src && w.id === 'wpn.sword' && ++p.bladeN % 3 === 0;
    if (bladeWave){
      /* Воин проигрывал не по урону: контрольная комната показывала нормальный
         DPS, но бот стабильно погибал на 1–3 этажах из-за невозможности разорвать
         контакт. Поэтому каждый третий взмах заменяет сектор круговой волной —
         урон не удваивается, зато вокруг героя снова появляется пространство. */
      const waveR = baseReach * 1.45 * D.warriorWaveRadius * (D.deadlyRadius?1.8:1);
      let waveHits = 0;
      G.fx.push({t:'ring', x:o.x, y:o.y, r:18, max:waveR, life:0.22, col:'#ffd24a'});
      for (const e of G.enemies){
        if (dist(e,o) > waveR + e.r) continue;
        waveHits++; damage(e, {warriorMelee:true,directMelee:true,direct:true});
        const a = Math.atan2(e.y-o.y, e.x-o.x), force = 520 * D.warriorWaveKnock * knockbackScale(e);
        e.kb.x += Math.cos(a)*force; e.kb.y += Math.sin(a)*force;
        e.ail.dizzy = Math.max(e.ail.dizzy, 0.75*D.ailDur);
        if (D.swordmaster && G.lvl >= 30 && e.kind === 'norm')
          e.ail.stun = Math.max(e.ail.stun, 0.35*D.ailDur);
      }
      if (D.guardian && waveHits >= 3 && p.guardianCd <= 0){
        p.barrier = Math.max(p.barrier, D.life*0.06); p.guardianCd = 4;
        G.fx.push({t:'ring', x:p.x, y:p.y, r:p.r, max:p.r+24, life:0.45, col:'#5ec2e0'});
        G.fx.push({t:'txt', x:p.x, y:p.y-30, s:'БАРЬЕР СТРАЖА', life:0.9, col:'#5ec2e0'});
      }
    } else {
      G.fx.push({t:'arc', x:o.x, y:o.y, a:ang, arc, r:reach, life:0.16});
      for (const e of G.enemies){
        if (dist(e,o) > reach + e.r) continue;
        let da = Math.atan2(e.y-o.y, e.x-o.x) - ang;
        da = Math.atan2(Math.sin(da), Math.cos(da));               // нормализуем угол
        if (Math.abs(da) < arc/2) damage(e, {warriorMelee:true,directMelee:true,direct:true});
      }
    }
  } else {
    const n = D.projN, spread = D.shotgun ? 0.035 : 0.16;   // дробовик стягивает залп в пучок
    for (let i = 0; i < n; i++){
      const a = ang + (i - (n-1)/2) * spread;
      spawnPlayerShot(o,a,w,false);
      // Только основные сферы игрока бросают proc; копии и сами мини-сферы не
      // создают рекурсию. Успех ставит отдельный выстрел через 100 мс игрового
      // времени — мини-сфера летит следом, а не появляется в том же кадре.
      if (!src && w.type === 'orb' && D.multiplierMiniChance > 0 && Math.random() < D.multiplierMiniChance)
        queueMultiplierMiniShot(a);
    }
  }
}

/* Осколочный рикошет срабатывает один раз на исходный снаряд. Он намеренно
   создаёт отдельные короткоживущие снаряды, а не перенаправляет основной:
   обычные отскоки остаются последовательной механикой, рикошет — ветвлением.
   hitSet наследуется, а chain, pierce и повторный рикошет обнулены, поэтому
   число дополнительных снарядов всегда ограничено потолком карточки. */
function releaseRicochetShards(s, sourceMul, sourceAttackMul){
  if (!s || s.minion || s.ricochetShard || s.ricochetReleased || D.ricochet <= 0) return 0;
  s.ricochetReleased = true;
  const targets = G.enemies
    .filter(e => e.hp > 0 && !s.hitSet.includes(e) && dist(e,s) <= RICOCHET_SHARD_RANGE)
    .sort((a,b)=>dist(a,s)-dist(b,s));
  const count = Math.min(D.ricochet, targets.length);
  const speed = Math.max(1, Math.hypot(s.vx,s.vy));
  for (let i=0; i<count; i++){
    const target=targets[i], d=dist(target,s), a=Math.atan2(target.y-s.y,target.x-s.x);
    G.shots.push({
      x:s.x, y:s.y, a,
      vx:Math.cos(a)*speed, vy:Math.sin(a)*speed,
      r:Math.max(2,s.r*0.72), life:Math.min(1.75,d/speed+0.20),
      pierce:0, chain:0, hitSet:s.hitSet.slice(), orb:false,
      mul:sourceMul*RICOCHET_SHARD_DAMAGE, attackMul:sourceAttackMul, pierced:0,
      ricochetShard:true, ricochetReleased:true, shardTarget:target,
      spriteType:s.spriteType,
    });
  }
  if (count) burst(s.x,s.y,4,'#6fb3ff',130,3,0.28);
  return count;
}

/* ---------- 8. ГЛАВНЫЙ ЦИКЛ ---------- */
let last = performance.now();
function loop(now){
  /* Некоторые WebView после тяжёлой загрузки большого автономного HTML один раз
     присылают RAF-метку чуть меньше performance.now(). Отрицательный dt разворачивал
     анимацию кольца призыва внутрь и Canvas отвергал отрицательный радиус. */
  const dt = Math.max(0, Math.min(0.05, (now - last)/1000)); last = now;
  if (G){
    tickPlayerDamageFeedback(dt);
    if (G.hitStop > 0) G.hitStop=Math.max(0,G.hitStop-dt);
    else if (!G.paused && !G.over && !G.pending) update(dt);
  }
  if (G) render();
  if (menuMode) menuTick(dt);
  requestAnimationFrame(loop);
}

function update(dt){
  const p = G.player, b = G.bag, k = G.keys;
  G.time += dt;
  tickDelayedPlayerShots();
  tickAttackEchoes();

  /* --- Движение игрока: две схемы управления --- */
  let mx = 0, my = 0;
  if (G.control === 'mouse'){
    // Персонаж всё время бежит к курсору. Мёртвая зона вокруг него нужна,
    // чтобы можно было осознанно стоять на месте — иначе «стойка» недостижима,
    // а от неё зависит cond.while_still и прицельная стрельба.
    const dx = G.mouse.x - W/2, dy = G.mouse.y - H/2;
    const d = Math.hypot(dx, dy);
    if (d > MOUSE_DEADZONE){ mx = dx/d; my = dy/d; }
  } else {
    mx = (k['d']||k['arrowright']?1:0) - (k['a']||k['arrowleft']?1:0);
    my = (k['s']||k['arrowdown'] ?1:0) - (k['w']||k['arrowup']  ?1:0);
    const len = Math.hypot(mx,my) || 1; mx/=len; my/=len;
  }
  p.moving = (mx || my) !== 0;
  if (p.moving){
    p.faceX = mx; p.faceY = my;                         // запоминаем направление для рывка
    if (mx) p.spriteFace = mx < 0 ? -1 : 1;             // спрайт только зеркалится, не кувыркается за целью
  }
  p.stillT = p.moving ? 0 : p.stillT + dt;
  p.moveT  = p.moving ? p.moveT + dt : 0;            // РАЗГОН и МАРАФОНЕЦ считают непрерывный бег
  p.combatT = G.enemies.length ? p.combatT + dt : 0;
  p.killT = Math.max(0, p.killT - dt);
  p.cheatCd = Math.max(0, p.cheatCd - dt);
  p.healCd  = Math.max(0, p.healCd  - dt);
  p.guardianCd = Math.max(0, p.guardianCd - dt);
  if (p.reserveBarrierT>0){
    p.reserveBarrierT=Math.max(0,p.reserveBarrierT-dt);
    if (p.reserveBarrierT===0) p.reserveBarrier=0;
  }
  p.bossSlowT = Math.max(0, (p.bossSlowT||0) - dt);
  if (p.bossSlowT <= 0) p.bossSlowMul=1;
  p.bossTrailCd = Math.max(0, (p.bossTrailCd||0) - dt);
  if (p.bossBurnT > 0){
    const burnBefore = p.bossBurnT;
    p.bossBurnT = Math.max(0, p.bossBurnT - dt);
    p.bossBurnTick -= dt;
    while (p.bossBurnTick <= 0 && burnBefore > 0){
      p.bossBurnTick += 1;
      hurt(D.life*0.05, false, false, p.bossBurnCause || 'ГОРЕНИЕ РОГАТОГО ТИРАНА', 'boss');
    }
  }
  tickElitePlayerEffects(dt);
  /* Всё, что разгоняет по условию, живёт в D.mspd и D.aspd, а условия меняются
     в кадре. Пересчёт зовём только на ПЕРЕКЛЮЧЕНИИ, а не каждый кадр: recalc()
     тяжёлый, и гонять его шестьдесят раз в секунду ради пары множителей незачем. */
  const wasKill = p.spdKill > 0, wasSprint = p.sprintT > 0, wasCheatSpeed = p.cheatSpeedT > 0, wasMove = p.dashMoving,
        wasSwift = p.swiftT > 0, wasLow = p.lowHp, wasBerserkLow = p.berserkLow;
  p.spdKill = Math.max(0, (p.spdKill||0) - dt);
  p.sprintT = Math.max(0, (p.sprintT||0) - dt);
  p.cheatSpeedT = Math.max(0, (p.cheatSpeedT||0) - dt);
  p.swiftT  = Math.max(0, (p.swiftT||0)  - dt);
  p.dashMoving = p.moving;
  p.lowHp   = p.hp/D.life < 0.30;
  p.berserkLow = p.hp/D.life < 0.40;
  if ((p.spdKill > 0) !== wasKill || (p.sprintT > 0) !== wasSprint || (p.cheatSpeedT > 0) !== wasCheatSpeed || (amu('runner') && p.moving !== wasMove) ||
      (p.swiftT > 0) !== wasSwift || p.lowHp !== wasLow || p.berserkLow !== wasBerserkLow) recalc();
  p.predT   = Math.max(0, (p.predT||0)   - dt);      // ГЛАЗ ХИЩНИКА

  let sp = D.mspd;                                   // разгон уже внутри, см. recalc()
  if (p.bossSlowT > 0) sp *= p.bossSlowMul || 0.30;
  if (p.eliteGuardSlowT > 0) sp *= Math.max(0.10,1-0.10*(p.eliteGuardSlowStacks||0));
  if (amu('marathon')) sp *= 1 + Math.min(0.30, Math.floor(p.moveT/3)*0.03);
  if (amu('panic') && p.hp/D.life < 0.30) sp *= 1.60;
  if (amu('siege') && p.stillT > 1.5) sp *= 0.5;     // цена осадного огня
  if (p.dash > 0){
    sp *= D.dashSpeedMul; p.dash -= dt;
    if (!p.moving){ mx = p.faceX; my = p.faceY; }     // рывок с места — в последнюю сторону                                       // рывок = кратковременный разгон
    if (D.dashDmg) for (const e of G.enemies){                     // ТАРАННЫЙ РЫВОК
      if (p.dashHits.includes(e) || dist(e,p) > p.r + e.r + 12) continue;
      p.dashHits.push(e); damage(e, {mul:1.2}); e.ail.dizzy = 2*D.ailDur;
      burst(e.x, e.y, 6, '#ffb340', 200, 3, 0.4);
    }
  }
  p.inv = Math.max(0, p.inv - dt);
  if (p.counterTempoT > 0){
    p.counterTempoT=Math.max(0,p.counterTempoT-dt);
    if (p.counterTempoT===0){ p.counterTempoPct=0; recalc(); }
  }
  if (p.overheatedT > 0){
    p.overheatedT=Math.max(0,p.overheatedT-dt);
    if (p.overheatedT===0){ p.overheatedPct=0; recalc(); }
  }
  if (p.dashN < D.dashMax){
    p.dashCd = Math.max(0, p.dashCd - dt);
    if (p.dashCd <= 0){
      p.dashN++;
      p.dashCd = p.dashN < D.dashMax ? D.dashCd : 0;
    }
  } else p.dashCd = 0;

  const oldX = p.x, oldY = p.y;
  p.x = clamp(p.x + (mx*sp+(p.vx||0))*dt, -ARENA, ARENA);
  p.y = clamp(p.y + (my*sp+(p.vy||0))*dt, -ARENA, ARENA);
  const playerKbDecay=Math.pow(0.015,dt);
  p.vx=(p.vx||0)*playerKbDecay; p.vy=(p.vy||0)*playerKbDecay;
  if (Math.abs(p.vx)<0.5) p.vx=0; if (Math.abs(p.vy)<0.5) p.vy=0;
  const heroMoved = Math.hypot(p.x-oldX, p.y-oldY);
  G.stats.distance += heroMoved;
  // 36 единиц пути на кадр: походка читается спокойно и не дёргается.
  if (heroMoved > 0.01) p.heroWalkT = ((p.heroWalkT||0) + heroMoved/36) % 4;

  /* --- Восстановление --- */
  // Магазинное «Быстрое лечение» вытягивает героя из опасной зоны, но не
  // восстанавливает его выше половины здоровья. Последний тик обрезается точно
  // по границе, поэтому высокая прокачка не может перескочить потолок.
  const fastHealLimit = D.life * 0.5;
  if (D.regen && p.hp < fastHealLimit) heal(Math.min(D.regen * dt, fastHealLimit - p.hp));
  if (D.respite && !G.portal){
    const wasActive=p.respiteT>=4;
    p.respiteT=Math.min(4,(p.respiteT||0)+dt);
    if (p.respiteT>=4){
      if (!wasActive) p.respiteHealT=3;
      else {
        p.respiteHealT-=dt;
        while (p.respiteHealT<=0){ heal(D.life*0.05); p.respiteHealT+=3; }
      }
    }
  } else {
    p.respiteT=0; p.respiteHealT=3;
  }
  if (G.bloodT > 0) G.bloodT = Math.max(0, G.bloodT - dt);         // КРОВНЫЕ УЗЫ
  if (D.dread) tickDreadLeech(dt);
  else if (p.leechPool > 0){                                       // обычное вытягивание течёт ~2 сек
    const v = Math.min(p.leechPool, Math.max(6, p.leechPool*1.2) * dt);
    heal(v);
    p.leechPool -= v;
  }
  if (b.has('autoHeal') && p.hp/D.life < 0.3 && p.healCd <= 0){
    heal(D.life*0.25); p.healCd = 20;
    G.fx.push({t:'txt', x:p.x, y:p.y-30, s:'автолечение', life:1, col:'#4fd1c5'});
  }

  updateOrbits(dt);
  if (G.arcaneTraces.length) tickArcaneTraces(dt);

  /* --- Атака --- */
  p.atkCd -= dt;
  G.target = findTarget(attackRange());                            // цель обновляем каждый кадр
  if (G.target){
    p.aim = Math.atan2(G.target.y - p.y, G.target.x - p.x);        // корпус доворачивается к цели
    p.spriteFace = Math.cos(p.aim) < 0 ? -1 : 1;
    if (p.atkCd <= 0 && !G.weapon.noAttack) attack();
  }

  /* --- Амулеты: всё, что живёт на таймере --- */
  if (Object.keys(G.amu).length) tickAmulets(dt);
  if (amu('lava') || amu('frost')) tickTrail(dt);
  if (G.boils.length) tickBoils(dt);
  if (G.acidPools.length) tickAcidPools(dt);
  if (G.eliteAcidPools.length) tickEliteAcidPools(dt);

  /* --- Появление врагов волнами --- */
  G.spawnT -= dt;
  // Потолок одновременно живых: 500. Раньше было 64, и он упирался начиная
  // примерно с 15 этажа — комната на 60-м выглядела так же, как на 20-м,
  // а вся глубина уходила в продолжительность, а не в давление.
  // Порог проверяется ДО подсыпки пачки, поэтому фактический пик чуть выше.
  // Пачку подняли до 6-14: набирать пятьсот по шесть штук игрок не дождётся.
  if (!regularEnemySpawnsSuppressed() && G.spawnQueue > 0 && G.spawnT <= 0 && G.enemies.length < 500){
    // Пачка поменьше при вчетверо более частых волнах: 8-16 за раз вываливали
    // весь этаж за полторы секунды, и «поток» превращался в один хлопок.
    const batch = Math.min(G.spawnQueue, rndi(4,9));
    for (let i = 0; i < batch; i++) spawnEnemy();
    G.spawnQueue -= batch;
    // Пауза между волнами: было max(0.35, 2.0 - этаж*0.05), то есть на первых
    // этажах почти две секунды простоя. Стало вчетверо плотнее — этаж больше
    // не «подаётся порциями», а идёт сплошным потоком. Дальняя точка появления
    // это компенсирует: враги успевают дойти, а не сваливаются на голову.
    G.spawnT = Math.max(0.15, 0.55 - G.floor*0.015);
  }

  /* --- Логика врагов --- */
  const slowAura = D.slowAura;
  // Источники ауры охлаждения собираем один раз за кадр: перебирать всех врагов
  // на каждом враге — это n^2 по всей комнате, а охлаждённых обычно единицы
  const chillSrc = G.enemies.filter(x => x.ail.chill > 0);
  // ЗНАМЯ читаем один раз за кадр, а не на каждом враге
  G.banner = false;
  for (const x of G.enemies)
    if (x.kind === 'boss' && x.aff.length && x.aff.some(a => a.id === 'banner')){ G.banner = true; break; }
  // Пачки: аффиксы, которые распоряжаются группой целиком (прыжок одного из своих)
  for (const pk of G.packs) if (pk.members.length)
    for (const a of pk.aff) if (a.packTick) a.packTick(pk, dt);
  for (let i = G.enemies.length-1; i >= 0; i--){
    const e = G.enemies[i];
    e.hit = Math.max(0, e.hit - dt); e.rot += dt*0.8;
    e.noDmgT += dt; e.rage = Math.max(0, e.rage - dt);

    // Тики негативных эффектов
    for (const key in e.ail) if (e.ail[key] > 0) e.ail[key] -= dt;
    // ЧУМА: три дискретных тика через 1, 2 и 3 секунды. Урон вычисляется из
    // текущего HP непосредственно перед каждым тиком, а не из запаса на момент
    // заражения: 1000 → 850 → 722,5 → 614,1 при трёх успешных тиках.
    if (e.plague){
      const pl = e.plague;
      pl.life -= dt; pl.tick -= dt;
      while (pl.tick <= 0 && pl.hits < 3){
        pl.tick += 1; pl.hits++;
        const pv = e.hp * PLAGUE_PCT;
        applyDamage(e, pv, false, true);
        G.fx.push({t:'num', x:e.x, y:e.y-e.r-16, v:Math.round(pv), life:0.7, col:'#b6df55'});
      }
      if (pl.hits >= 3 || pl.life <= 0) e.plague = null;
    }
    // Все три типа урона со временем тикают и утекают по одной формуле
    for (const type in e.dots){
      const d = e.dots[type];
      if (d.dps <= 0) continue;
      const v = d.dps * dt;
      const minionShare = d.dps > 0 ? clamp((d.minionDps || 0)/d.dps, 0, 1) : 0;
      applyDamage(e, v, false, true, minionShare);
      e.dotAcc[type] += v;
      const k = Math.min(1, dt / d.dur);            // утечка стаков
      d.dps -= d.dps * k; d.minionDps = Math.max(0, (d.minionDps || 0) * (1-k)); d.n -= d.n * k;
      if (d.dps < 0.02){ d.dps = 0; d.minionDps = 0; d.n = 0; }
    }
    // Урон со временем копится и всплывает раз в 0.4 сек своим цветом:
    // огонь красным, яд зелёным, кровотечение багровым
    e.dotT -= dt;
    if (e.dotT <= 0){
      e.dotT = 0.4;
      const emit = (v, col, dx) => { if (v >= 1)
        G.fx.push({t:'num', x:e.x+dx, y:e.y-e.r-4, v:Math.round(v), life:0.7, col}); };
      emit(e.dotAcc.fire,  '#ff4a2f', -14);
      emit(e.dotAcc.poison,'#8be04e',  14);
      emit(e.dotAcc.bleed, '#e0405a',   0);
      e.dotAcc.fire = e.dotAcc.poison = e.dotAcc.bleed = 0;
    }
    // ИНФЕРНО: горящий враг раз в полсекунды поджигает соседей
    if (D.inferno && e.dots.fire.dps > 0){
      e.infT -= dt;
      if (e.infT <= 0){
        e.infT = 0.5;
        for (const o2 of G.enemies){
          if (o2 === e || o2.dots.fire.dps > 0) continue;
          if (dist(o2,e) > D.infernoR + o2.r) continue;
          addDot(o2, 'fire', e.dots.fire.dps*0.5, 3*D.ailDur,
            e.dots.fire.dps > 0 ? e.dots.fire.minionDps/e.dots.fire.dps : 0);
          burst(o2.x, o2.y, 4, '#ff7a2f', 90, 3, 0.4);
        }
      }
    }

    if (e.hp <= 0){ killEnemy(e, i); continue; }
    // РАЗДЕЛЯЮЩИЕСЯ: порог половины здоровья проверяем тут же, до всего остального
    if (e.pack && e.pack.has.split && !e.didSplit && e.hp <= e.maxHp*0.5) packSplit(e);

    // Скорость с учётом охлаждения, ауры замедления и оглушения
    let spd = e.spd;
    if (e.kind === 'boss' && e.bossId === 'goat') spd = D.mspd;
    // Под знаменем вся комната быстрее и злее — это и есть повод убивать босса первым
    const flag = G.banner && e.kind !== 'boss';
    if (flag) spd *= 1.30;
    let edmg = e.dmg * (flag ? 1.20 : 1);
    let aspdMul = 1;
    if (e.pack){ const pm = packMods(e); spd *= pm.spd; edmg *= pm.dmg; aspdMul *= pm.aspd; }
    if (e.rage > 0){ spd *= 1.3; edmg *= 1.3; }        // след мстителей: чужая смерть разогнала
    if (e.ail.chill > 0) spd *= 1 - CHILL_SLOW;
    // АУРА ОХЛАЖДЕНИЯ: соседи охлаждённого тоже вязнут.
    // Аура только замедляет и сам статус не накладывает. Если бы накладывала,
    // один прок расползся бы по всей комнате цепочкой (A морозит B, B морозит C),
    // и каждый враг получил бы +10% к принимаемому урону бесплатно и навсегда.
    e.frost = false;
    if (e.ail.chill <= 0 && chillSrc.length){
      for (const cs of chillSrc){
        if (cs === e || dist(cs, e) > D.chillAuraR + e.r) continue;
        e.frost = true; break;
      }
      if (e.frost) spd *= 1 - CHILL_AURA_SLOW;
    }
    if (slowAura && dist(e,p) < D.slowAuraR) spd *= 0.75;
    if (e.ail.dizzy > 0) spd *= 0.5;                     // головокружение после отбрасывания
    if (e.ail.stun > 0 || e.ail.freeze > 0) spd = 0;      // оглушение и заморозка держат на месте

    // КОСТЯНОЙ ВЫЗОВ удерживает конкретного монстра на ударившем приспешнике,
    // пока тот жив. После его смерти враг немедленно возвращается к обычному выбору.
    let tgt = p, forcedMinion = e.tauntMinion;
    if (forcedMinion && (forcedMinion.hp <= 0 || G.minions.indexOf(forcedMinion) < 0)){
      e.tauntMinion = null; forcedMinion = null;
    }
    if (forcedMinion) tgt = forcedMinion;
    else if (G.minions.length){
      let best = null, bs = Infinity;
      for (const m of G.minions){
        const golem = m.kind === 'golemB';                    // у голема крови своя провокация
        const range = golem ? 430 : 120;
        const d = dist(m,e); if (d > range) continue;
        const score = d - (golem ? 250 : 0);                  // голем перетягивает на себя первым
        if (score < bs){ bs = score; best = m; }
      }
      if (best) tgt = best;
    }
    // ОХОТНИК игнорирует обычное перехватывание, но легендарная провокация сильнее.
    if (!forcedMinion && e.roles.length && e.roles.indexOf('hunter') >= 0) tgt = p;

    // Аффиксы работают до обычного шага: таран забирает движение себе
    const moveX0 = e.x, moveY0 = e.y;
    const bossLock = e.kind === 'boss' ? tickBossSkill(e, dt) : false;
    const eliteLock = e.kind === 'elite' ? tickEliteAbility(e,dt,tgt) : false;
    // Во время замаха Демона его уникальная остановка важнее тарана или другого
    // двигательного аффикса; таймер аффикса продолжится после удара.
    let affLock = bossLock || eliteLock ? true : (e.aff.length ? tickAffixes(e, dt, tgt, edmg) : false);
    if (e.pack && packTick(e, dt, tgt, edmg)) affLock = true;   // прыжок тоже забирает движение

    let a = Math.atan2(tgt.y-e.y, tgt.x-e.x);
    if (e.madA) a += e.madA;                       // безумный идёт криво, а не по прямой
    const ranged = e.t.ranged || !!e.madRanged;
    if (affLock){ /* движением распоряжается аффикс */ }
    else if (ranged){
      // Призма держит дистанцию 260 и стреляет
      const d = dist(e,tgt);
      const dir = d > 300 ? 1 : d < 220 ? -1 : 0;
      e.x += Math.cos(a)*spd*dir*dt; e.y += Math.sin(a)*spd*dir*dt;
      e.cd -= dt;
      if (e.cd <= 0 && d < 460 && e.ail.stun <= 0){
        e.cd = 2.2 / aspdMul;
        if (e.kind==='elite' && e.eliteVariant) fireEliteRanged(e,a,edmg);
        else G.eshots.push({x:e.x, y:e.y, vx:Math.cos(a)*230, vy:Math.sin(a)*230,
          r:6, life:2.6, dmg:edmg*0.8, pk:e.pack, shotType:'shooter', cause:enemyCause(e, 'снаряд')});
      }
    } else {
      e.x += Math.cos(a)*spd*dt; e.y += Math.sin(a)*spd*dt;
    }
    // Отбрасывание затухает
    e.x += e.kb.x*dt; e.y += e.kb.y*dt;
    e.kb.x *= 0.86; e.kb.y *= 0.86;
    // Анимация зависит от реально пройденного пути: оглушённый враг замирает,
    // быстрый Бегун перебирает кадры чаще Ядра. Разворот только по горизонтали.
    const movedX=e.x-moveX0, movedY=e.y-moveY0, moved=Math.hypot(movedX,movedY);
    if (moved > 0.001){
      const spriteMeta=enemySpriteMeta(e);
      e.animT = (e.animT||0) + moved / (spriteMeta ? spriteMeta.stride : 18);
      if (Math.abs(movedX) > 0.01) e.spriteFace = movedX < 0 ? -1 : 1;
    }

    // Контактный урон по текущей цели
    if (!(e.bossId === 'demonqueen' && e.bossT && e.bossT.hidden) && dist(e,tgt) < e.r + tgt.r){
      e.cd2 = (e.cd2||0) - dt;
      if (e.cd2 <= 0){
        e.cd2 = 0.5 / aspdMul;
        if (tgt === p){
          if (!(D.phasing && p.moving)){
            hurt(edmg, false, false, enemyCause(e, 'контакт'));
            packDealt(e.pack, edmg);
            applyEliteContact(e);
          }
          if (D.reflect) applyDamage(e, edmg * D.reflect/100, false);
        }
        else {
          // Големы каменные: 60% входящего гасится. Иначе провокация их же и убивает.
          const mit = tgt.kind.startsWith('golem') ? 0.4 : 1;
          tgt.hp -= edmg * mit; tgt.hit = 0.12;
          boilRoll(tgt);                                   // КИПЯЩАЯ КРОВЬ
          if (tgt.hp <= 0) killMinion(G.minions.indexOf(tgt));
        }
        if (D.thorns) applyDamage(e, D.thorns, false);
      }
    }
  }

  /* --- Свита: трупы, подъём и бой --- */
  if (D.hasMin){
    for (let i = G.corpses.length-1; i >= 0; i--){
      G.corpses[i].life -= dt;
      if (G.corpses[i].life <= 0) G.corpses.splice(i,1);
    }
    // Пока свита неполная — поднимаем из ближайшего трупа, а без трупов ждём таймер
    if (needKind()){
      G.raiseT += dt;
      // Оба пути подъёма идут за одно и то же время: из трупа поднимается на месте
      // трупа, без трупа — рядом с хозяином. Разного ожидания больше нет.
      if (G.raiseT >= D.minRevive){
        if (G.corpses.length){ const c = G.corpses.shift(); spawnMinion(c.x, c.y); }
        else spawnMinion(undefined, undefined, needKind());
        G.raiseT = 0;
      }
    } else G.raiseT = 0;

    /* Список целей на кадр: только те, кто угрожает игроку. Считаем расстояние
       до хозяина один раз здесь, а не заново на каждом приспешнике — при 500
       врагах и десяти бойцах это разница между 5000 и 500 вычислений. */
    const cand = [];
    for (const e of G.enemies){
      const dp = dist(e, p);
      if (dp <= MINION_LEASH) cand.push({e, dp});
    }
    /* Кто кем уже занят. Свита должна разбирать толпу по одному, а не наваливаться
       вдесятером на одного: занятая цель штрафуется так, будто она дальше. */
    const claims = new Map();
    const claim = e => claims.set(e, (claims.get(e) || 0) + 1);
    for (const mm of G.minions){
      if (mm.tgt && !mm.tgt.dead && dist(mm.tgt, p) <= MINION_LEASH) claim(mm.tgt);
      else mm.tgt = null;
    }

    for (let i = G.minions.length-1; i >= 0; i--){
      const m = G.minions[i];
      m.deathT = (m.deathT === undefined ? rnd(MINION_LIFE_MIN, MINION_LIFE_MAX) : m.deathT) - dt;
      if (m.deathT <= 0){ killMinion(i); continue; }
      m.hit = Math.max(0, m.hit - dt); m.rot += dt*2.4; m.cd -= dt; m.born += dt;
      const mode = MKIND[m.kind].mode;

      /* Цель держится между кадрами, пока жива и не убежала от хозяина: без этой
         липкости приспешник перевыбирал бы цель каждый кадр и дёргался на месте
         вместо того, чтобы добежать. */
      let best = m.tgt && !m.tgt.dead ? m.tgt : null;
      if (best && dist(best, p) > MINION_LEASH) best = null;
      if (!best){
        let bs = Infinity;
        for (const c of cand){
          const e = c.e;
          /* Порядок слагаемых и есть вся логика:
             1) кто ближе к ИГРОКУ — того и бьём, свита защищает хозяина;
             2) занятые цели отодвигаются, чтобы толпа разбиралась параллельно;
             3) расстояние до самого приспешника входит с малым весом — только
                чтобы из двух равных он выбрал того, до кого ближе бежать. */
          let score = c.dp + (claims.get(e) || 0) * MINION_CLAIM_PENALTY + dist(e, m)*0.3;
          // Костяной голем поверх этого избегает тех, на ком стаки крови уже висят
          if (mode === 'golemN') score += e.dots.bleed.n * 500;
          if (score < bs){ bs = score; best = e; }
        }
        if (best){ m.tgt = best; claim(best); }
      }
      const bd = best ? dist(best, m) : Infinity;

      if (best && mode === 'ranged'){                        // ОХОТНИК: держит дистанцию и стреляет
        const want = 250, spd2 = D.minSpd;
        const a2 = Math.atan2(best.y-m.y, best.x-m.x);
        const dir = bd > want+40 ? 1 : bd < want-60 ? -1 : 0;
        m.x += Math.cos(a2)*spd2*dir*dt; m.y += Math.sin(a2)*spd2*dir*dt;
        if (D.minBlink && bd > 520) minionBlink(m, best, dt);     // отставший стрелок догоняет переносом
        if (m.cd <= 0 && bd < 460){ m.cd = 0.64 / D.minAspd; minionShot(m, best, null); }
      } else if (best && mode === 'caster'){                 // КОЛДУН: бьёт заклинанием со статусом
        const want = 290;
        const a2 = Math.atan2(best.y-m.y, best.x-m.x);
        const dir = bd > want+40 ? 1 : bd < want-60 ? -1 : 0;
        m.x += Math.cos(a2)*D.minSpd*dir*dt; m.y += Math.sin(a2)*D.minSpd*dir*dt;
        if (D.minBlink && bd > 560) minionBlink(m, best, dt);     // и у колдуна
        if (m.cd <= 0 && bd < 500){
          m.cd = 0.96 / D.minAspd;
          minionShot(m, best, pick(['fire','cold','poison']));
        }
      } else if (best){                                      // ближний бой: скелеты и големы
        const reach = m.r + best.r + 3;
        if (D.minBlink && bd > reach) minionBlink(m, best, dt);   // перенос вместо долгой беготни
        const slow = m.kind === 'golemB' ? 0.65 : m.kind === 'golemN' ? 1.25 : 1;
        if (bd > reach){
          const a2 = Math.atan2(best.y-m.y, best.x-m.x);
          m.x += Math.cos(a2)*D.minSpd*slow*dt; m.y += Math.sin(a2)*D.minSpd*slow*dt;
        } else if (m.cd <= 0){
          if (m.kind === 'golemB'){ m.cd = D.golemBCd / D.minAspd; minionHit(best, m); }
          else if (m.kind === 'golemN'){ m.cd = 0.35 / D.minAspd; boneGolemHit(best, m); }
          else { m.cd = 0.50 / (D.minAspd*D.skelAspd); minionHit(best, m); }   // скелет: два удара в секунду
        }
      } else {                                               // без врагов держатся у хозяина
        m.tgt = null;
        const d = dist(m,p);
        if (d > 74){
          const a2 = Math.atan2(p.y-m.y, p.x-m.x);
          m.x += Math.cos(a2)*D.minSpd*dt; m.y += Math.sin(a2)*D.minSpd*dt;
        }
      }
      if (m.hp <= 0) killMinion(i);
    }
  }

  /* --- Снаряды игрока --- */
  for (let i = G.shots.length-1; i >= 0; i--){
    const s = G.shots[i];
    s.life -= dt; s.age=(s.age||0)+dt;
    // Самонаведение подкручивает вектор к ближайшей цели
    if (D.homing > 0){
      let best = null, bd = 400;
      for (const e of G.enemies){ const d = dist(e,s); if (d < bd){ bd = d; best = e; } }
      if (best){
        const ta = Math.atan2(best.y-s.y, best.x-s.x);
        const cur = Math.atan2(s.vy, s.vx);
        let da = Math.atan2(Math.sin(ta-cur), Math.cos(ta-cur));
        const na = cur + da * Math.min(1, D.homing*dt*4);
        const sp2 = Math.hypot(s.vx, s.vy);
        s.vx = Math.cos(na)*sp2; s.vy = Math.sin(na)*sp2; s.a = na;
      }
    }
    const stepX=s.vx*dt, stepY=s.vy*dt;
    s.x += stepX; s.y += stepY;
    s.travel=(s.travel||0)+Math.hypot(stepX,stepY);
    let dead = s.life <= 0 || Math.abs(s.x) > ARENA+50 || Math.abs(s.y) > ARENA+50;

    if (!dead) for (const e of G.enemies){
      if (s.hitSet.includes(e)) continue;
      if (dist(e,s) > e.r + s.r) continue;
      const firstArrow=s.playerArrow && !s.ricochetShard && s.hitSet.length===0;
      const rangedInc=(s.playerArrow && s.age>=ACCELERATED_ARROW_TIME?D.acceleratedArrow:0)
                    +(s.playerArrow && s.age>=0.40 && D.swiftArrows?20:0)
                    +(firstArrow?D.cleanTrajectory:0);
      const hitMul=s.mul * (D.pierceBonus ? 1 + 0.2*s.pierced : 1);
      damage(e, {mul:hitMul, attackMul:s.attackMul, minion:s.minion, direct:true, rangedInc,
        elementChanceMul:firstArrow&&D.elementalPierce?2:1});
      if (s.playerArrow && s.age>=0.40 && D.swiftArrows){
        const a=Math.atan2(e.y-s.y,e.x-s.x), force=260*D.knockPow*knockbackScale(e);
        e.kb.x+=Math.cos(a)*force; e.kb.y+=Math.sin(a)*force;
      }
      s.hitSet.push(e);
      applyMinionSpell(e, s.spell);
      releaseRicochetShards(s,hitMul,s.attackMul);
      if (s.orb){
        explodePlayerOrb(s);
        dead = true; break;
      }
      if (s.chain > 0){                                            // отскок на новую цель
        s.chain--;
        // Перчатки рикошета переворачивают знак: отскок не гасит снаряд, а разгоняет
        if (amu('ricochet')) s.mul *= 1.10;
        else if (!D.chainKeep) s.mul *= 0.75;                      // без эко-отскоков урон затухает
        const next = G.enemies.filter(x => !s.hitSet.includes(x)).sort((a2,b2)=>dist(a2,s)-dist(b2,s))[0];
        if (next){ const na = Math.atan2(next.y-s.y, next.x-s.x), sp2 = Math.hypot(s.vx,s.vy);
                   s.vx = Math.cos(na)*sp2; s.vy = Math.sin(na)*sp2; s.a=na; s.life = Math.max(s.life,0.5); }
        else dead = true;
      } else if (s.pierce > 0){ s.pierce--; s.pierced++; }
      else dead = true;
      break;
    }
    if (dead) G.shots.splice(i,1);
  }

  /* --- Снаряды врагов --- */
  for (let i = G.eshots.length-1; i >= 0; i--){
    const s = G.eshots[i];
    s.life -= dt;
    let returned = false;
    if (s.shotType === 'axe'){
      s.spin = (s.spin||0) + dt*13;
      if (s.owner && s.owner.dead){
        returned = true;
      } else if (!s.returning){
        const step = Math.min(s.outLeft, s.axeSpeed*dt);
        s.x += s.vx/s.axeSpeed*step; s.y += s.vy/s.axeSpeed*step; s.outLeft -= step;
        if (s.outLeft <= 0.001){
          s.x=s.targetX; s.y=s.targetY; s.returning=true;
        }
      } else {
        const owner=s.owner, dx=owner.x-s.x, dy=owner.y-s.y, d=Math.hypot(dx,dy);
        if (d <= s.axeSpeed*dt + owner.r*0.35) returned=true;
