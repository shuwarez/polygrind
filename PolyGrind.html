        else { s.vx=dx/d*s.axeSpeed; s.vy=dy/d*s.axeSpeed; s.x+=s.vx*dt; s.y+=s.vy*dt; }
      }
    } else {
      s.x += s.vx*dt; s.y += s.vy*dt;
    }
    if (returned){ G.eshots.splice(i,1); continue; }
    // ЗЕРКАЛЬНЫЙ ОСКОЛОК: снаряд не гасится, а разворачивается и летит уже как ваш
    if (s.shotType !== 'axe' && dist(s,p) < s.r + p.r && amu('shard') && Math.random() < 0.10){
      const sp2 = Math.hypot(s.vx, s.vy) * 1.4;
      const a2 = Math.atan2(-s.vy, -s.vx);
      G.shots.push({x:p.x + Math.cos(a2)*(p.r+8), y:p.y + Math.sin(a2)*(p.r+8), a:a2,
        vx:Math.cos(a2)*sp2, vy:Math.sin(a2)*sp2, r:6*D.projSize, life:2.2,
        pierce:D.pierce, chain:0, ric:0, hitSet:[], orb:false, mul:1, pierced:0});
      G.fx.push({t:'txt', x:p.x, y:p.y-24, s:'отбито', life:0.5, col:'#6fb3ff'});
      G.eshots.splice(i,1); continue;
    }
    if (dist(s,p) < s.r + p.r){
      const shotDamage = s.maxHpPct ? D.life*s.maxHpPct : s.dmg;
      if (s.shotType === 'axe'){
        if (!s.hitDone){
          hurt(shotDamage, false, false, s.cause || 'ВРАЖЕСКИЙ СНАРЯД', s.sourceKind);
          s.hitDone=true; applyBossSlow(0.30,1.5);
        }
      } else {
        hurt(shotDamage, false, false, s.cause || 'ВРАЖЕСКИЙ СНАРЯД', s.sourceKind);
        applyEliteProjectileHit(s);
        packDealt(s.pk, shotDamage); G.eshots.splice(i,1); continue;
      }
    }
    if (s.life <= 0) G.eshots.splice(i,1);
  }

  /* --- Сферы опыта --- */
  for (let i = G.orbs.length-1; i >= 0; i--){
    const o = G.orbs[i], d = dist(o,p);
    const a = Math.atan2(p.y-o.y, p.x-o.x);
    // Внутри радиуса подбора сфера летит к игроку, снаружи — медленно дрейфует,
    // иначе опыт от дальних убийств (особенно свитой) просто оставался бы лежать.
    const loot = o.gold || o.v !== undefined;
    const pull = loot && d < D.lootPickup ? D.lootPull : d < D.pickup ? 340 : 75;
    o.x += Math.cos(a)*pull*dt; o.y += Math.sin(a)*pull*dt;
    if (d < p.r + ((o.book || o.amu || o.totem) ? 14 : 6)){
      if (o.amu) takeAmulet(o.amu);
      else if (o.totem) takeTotem(o.totem);
      else if (o.book) takeBook(o.book);
      else if (o.gold) G.gold += o.v;
      else gainXp(o.v);
      G.orbs.splice(i,1);
    }
  }

  /* --- Частицы: разлёт с трением --- */
  const friction = Math.pow(0.12, dt);
  for (let i = G.parts.length-1; i >= 0; i--){
    const q = G.parts[i];
    q.life -= dt;
    q.x += q.vx*dt; q.y += q.vy*dt;
    q.vx *= friction; q.vy *= friction;
    if (q.life <= 0) G.parts.splice(i,1);
  }

  /* --- Лужи смолы --- */
  // Урон тикает раз в полсекунды общим таймером, а не каждый кадр и не на каждую
  // лужу: иначе hurt() съедал бы шанс уворота шестьдесят раз в секунду.
  let poolDmg = 0, poolKind = '';
  for (let i = G.pools.length-1; i >= 0; i--){
    const pl = G.pools[i]; pl.life -= dt;
    if (pl.life <= 0){ G.pools.splice(i,1); continue; }
    if (pl.arm > 0){ pl.arm -= dt; continue; }                   // лужа ещё растекается
    if (dist(pl, p) < pl.r + p.r && pl.dmg >= poolDmg){ poolDmg = pl.dmg; poolKind = pl.sourceKind || ''; }
  }
  p.poolCd = Math.max(0, (p.poolCd||0) - dt);
  if (poolDmg > 0 && p.poolCd <= 0){ p.poolCd = 0.5; hurt(poolDmg*0.5, false, false, 'ЛУЖА СМОЛЫ', poolKind); }

  /* --- Кислота Чумной Мерзости --- */
  for (let i = G.bossPools.length-1; i >= 0; i--){
    const pl = G.bossPools[i]; pl.life -= dt; pl.tick -= dt;
    if (pl.life <= 0){ G.bossPools.splice(i,1); continue; }
    if (pl.tick <= 0){
      pl.tick += 1;
      if (dist(pl,p) < pl.r + p.r)
        hurt(D.life*pl.maxHpPct, false, false, 'КИСЛОТА ЧУМНОЙ МЕРЗОСТИ', 'boss');
    }
  }

  /* --- Огненный след Рогатого Тирана --- */
  let inTyrantFire = false;
  for (let i = G.bossTrails.length-1; i >= 0; i--){
    const tr = G.bossTrails[i]; tr.life -= dt;
    if (tr.life <= 0){ G.bossTrails.splice(i,1); continue; }
    if (dist(tr,p) < tr.r + p.r) inTyrantFire = true;
  }
  if (inTyrantFire && p.bossTrailCd <= 0){
    p.bossTrailCd = 0.4;
    applyTyrantBurn('ОГОНЬ РОГАТОГО ТИРАНА');
  }

  /* --- Эффекты --- */
  for (let i = G.fx.length-1; i >= 0; i--){
    const f = G.fx[i]; f.life -= dt;
    if (f.t === 'num') f.y -= 26*dt;
    if (f.t === 'hurtNum' || f.t === 'healNum') f.y -= 50*dt;
    if (f.t === 'txt') f.y -= 34*dt;                    // статусы всплывают быстрее цифр
    if (f.t === 'ring') f.r += (f.max - f.r) * Math.min(1, dt*14);
    if (f.t === 'wave'){
      // Фронт волны бьёт один раз, когда проходит через игрока: значит уцелеть
      // можно либо оставшись вплотную к боссу, либо убежав за её край
      f.r += f.spd*dt;
      if (!f.hit && Math.abs(dist(f, p) - f.r) < 26 + p.r){ f.hit = true; hurt(f.dmg, false, false, 'УДАРНАЯ ВОЛНА БОССА'); }
    }
    if (f.life <= 0){
      if (f.t === 'telegraph'){
        const {t,life,max,...spec}=f; pushTelegraphTrace(spec);
      }
      G.fx.splice(i,1);
    }
  }

  /* --- Портал на следующий этаж --- */
  if (!G.portal && floorCombatComplete()){
    collectFloorLoot();
    const pa = rnd(0, Math.PI*2);
    G.portal = {x:clamp(p.x+Math.cos(pa)*300,-ARENA+60,ARENA-60),
                y:clamp(p.y+Math.sin(pa)*300,-ARENA+60,ARENA-60), r:34, t:0};
    toast('ПОРТАЛ ОТКРЫТ · ЛУТ СОБРАН');
  }
  if (G.portal){
    G.portal.t += dt;
    if (dist(G.portal, p) < G.portal.r + p.r && G.portal.t > 0.6){
      G.gold += Math.round((12 + G.floor*6) * D.goldFind * D.goldGainMult); // премия за зачистку
      G.floor++;
      // Новый заряд только на рубежах: при «за этаж» к 20-му этажу копился 21 переброс
      // и раздача превращалась в поиск идеальной карточки вместо выбора из предложенных.
      if (G.floor % 5 === 0) G.rerolls++;
      heal(D.life*0.10);
      G.amuT.doll = 1;                                             // кукла смерти чинится на новом этаже
      p.x = 0; p.y = 0; p.dash = 0;                               // каждый новый этаж начинается из центра
      buildFloor();
    }
  }
  tickBossHudHealth(dt);
}

/* Всё, что амулеты делают сами по себе: таймеры, копия, барьер.
   Отдельной функцией, потому что в update() это был бы ещё один экран кода
   посреди и без того длинного кадра. */
function tickAmulets(dt){
  const p = G.player;
  for (const k in G.amuT) if (k !== 'doll') G.amuT[k] = Math.max(0, G.amuT[k] - dt);

  // ЧЁРНОЕ ЗЕРКАЛО: копия стоит на месте и лупит по своей цели
  if (G.clone){
    const c = G.clone;
    c.life -= dt; c.cd -= dt;
    const t = findTargetFrom(c, attackRange());
    if (t){
      c.aim = Math.atan2(t.y - c.y, t.x - c.x);
      if (c.cd <= 0 && !G.weapon.noAttack){ c.cd = D.atkCd; attack(c); }
    }
    if (Math.random() < 0.3) burst(c.x, c.y, 1, '#c08cff', 40, 2, 0.3);
    if (c.life <= 0) G.clone = null;
  }

  // СЕРДЦЕ БУРИ
  if (amu('storm') && G.amuT.storm <= 0){
    const t = findTargetFrom(p, 700);
    if (t){
      G.amuT.storm = 8;
      G.fx.push({t:'bolt', x:p.x, y:p.y, x2:t.x, y2:t.y, life:0.22, col:'#ffe14a'});
      damage(t, {mul:3});
      t.ail.shock = Math.max(t.ail.shock, SHOCK_DURATION*D.ailDur);
      burst(t.x, t.y, 14, '#ffe14a', 220, 3, 0.5);
    }
  }

  // ЧАСОВОЙ МЕХАНИЗМ: радиус считается через «Радиус области действия», как всё площадное
  if (amu('clock') && G.amuT.clock <= 0){
    G.amuT.clock = 30;
    const R = 240 * D.aoeR;
    G.fx.push({t:'ring', x:p.x, y:p.y, r:10, max:R, life:0.6, col:'#4fd1c5'});
    for (const e of G.enemies){
      if (dist(e,p) > R) continue;
      if (e.ail.freeze <= 0) statusText(e, 'FROZEN', '#7fd6ff');
      e.ail.freeze = Math.max(e.ail.freeze, 1.0*D.freezeDur);
    }
  }

  // ПУЛЬС ЖИЗНИ
  if (amu('pulse') && G.amuT.pulse <= 0){
    G.amuT.pulse = 15; heal(D.life*0.05);
    G.fx.push({t:'ring', x:p.x, y:p.y, r:p.r, max:60, life:0.5, col:'#e0405a'});
  }
  // ГРАВИТАЦИОННЫЙ КОЛОДЕЦ: секунду тянет, потом взрывается
  if (amu('gravity') && G.amuT.gravity <= 0 && G.enemies.length){
    G.amuT.gravity = 12;
    const t = findTargetFrom(p, 520) || p;
    G.well = {x:t.x, y:t.y, t:1, r:170*D.aoeR};
    G.fx.push({t:'ring', x:G.well.x, y:G.well.y, r:G.well.r, max:12, life:1, col:'#c08cff'});
  }
  if (G.well){
    G.well.t -= dt;
    for (const o of G.enemies){
      const d = dist(o, G.well);
      if (d > G.well.r || d < 1) continue;
      const a = Math.atan2(G.well.y-o.y, G.well.x-o.x);
      o.kb.x += Math.cos(a)*260*dt*6; o.kb.y += Math.sin(a)*260*dt*6;
    }
    if (G.well.t <= 0){
      nova(G.well.x, G.well.y, G.well.r, avgHit()*1.6, '#c08cff', {overpressure:true});
      G.well = null;
    }
  }
  // ТАЛИСМАН ПОКОЯ
  if (amu('calm') && p.stillT > 2 && p.barrier <= 0 && G.amuT.calm <= 0){
    p.barrier = D.life*0.10;
    G.fx.push({t:'ring', x:p.x, y:p.y, r:p.r, max:p.r+22, life:0.5, col:'#5ec2e0'});
  }
}

/* След от ботинок. Узлы кладутся по времени, а не по кадрам: иначе на 240 Гц
   след был бы вчетверо гуще, чем на 60, и урон зависел бы от монитора. */
const TRAIL_STEP = 0.11, TRAIL_LIFE = 2.6, TRAIL_R = 30;
function tickTrail(dt){
  const p = G.player;
  p.trailT = (p.trailT || 0) - dt;
  if (p.moving && p.trailT <= 0){
    p.trailT = TRAIL_STEP;
    // Огонь и лёд кладутся одним узлом с двумя флагами: два отдельных следа
    // друг друга перекрывали бы и считались бы дважды на одном враге
    G.trails.push({x:p.x, y:p.y, r:TRAIL_R*D.aoeR, life:TRAIL_LIFE,
                   fire:amu('lava'), cold:amu('frost')});
    if (G.trails.length > 40) G.trails.shift();       // потолок держит кадр
  }
  // Урон следа растёт от скорости бега: медленный игрок оставляет тлеющий след,
  // быстрый — сплошную полосу огня. Отсчёт от базовых 235.
  const dps = avgHit() * 0.5 * (D.mspd/235) * D.ailEff;
  for (let i = G.trails.length-1; i >= 0; i--){
    G.trails[i].life -= dt;
    if (G.trails[i].life <= 0) G.trails.splice(i,1);
  }
  // Считаем по врагу, а не по узлу: узлы лежат внахлёст, и урон «за каждый узел»
  // работал ровно наоборот замыслу — стоящий на месте игрок наваливал их горкой
  // и жёг втрое сильнее бегущего. Замер до правки: 254 урона при скорости 235
  // и 208 при 470, то есть быстрые ботинки жгли ХУЖЕ медленных.
  for (const e of G.enemies){
    let f = false, cd = false;
    for (const tr of G.trails){
      if (dist(e, tr) > tr.r + e.r) continue;
      if (tr.fire) f = true;
      if (tr.cold) cd = true;
      if (f && cd) break;
    }
    if (f) applyDamage(e, dps*dt, false, true);
    if (cd){
      if (e.ail.chill <= 0) statusText(e, 'SLOWED', '#ffe14a');
      e.ail.chill = Math.max(e.ail.chill, CHILL_DURATION*D.ailDur);
    }
  }
}

/* Ближайшая цель от произвольной точки — нужна копии и молнии.
   findTarget() считает только от игрока и остаётся как есть. */
function findTargetFrom(o, range){
  let best = null, bd = Infinity;
  for (const e of G.enemies){
    const d = dist(e,o) - e.r;
    if (d < range && d < bd){ bd = d; best = e; }
  }
  return best;
}

/* Опыт и повышение уровня */
function gainXp(v){
  G.xp += v * D.xpGain;
  while (G.xp >= G.xpNext){
    G.xp -= G.xpNext; G.lvl++;
    G.xpNext = Math.round(14 * Math.pow(1.17, G.lvl-1));
    G.pending++;
    levelUpSfx();
  }
  if (G.pending) showLevelUp();
}

/* Автосбор начисляет находки сразу, но уведомления нельзя рисовать поверх
   level-up: оба экрана используют #ov. Поэтому складываем снимки результатов
   и показываем одну сводку после всех ожидающих выборов карточек. */
function showFloorFindSummary(){
  if (G.floorFindSummaryOpen) return true;
  if (!G.floorFinds.length) return false;
  hideSkillTip();
  const shown = G.floorFinds.slice();
  G.floorFindSummaryOpen = true; G.paused = true;
  $('#ov').style.display = 'flex';
  $('#ov').innerHTML =
    '<h1 style="color:var(--amber)">ДОБЫЧА ЭТАЖА</h1>' +
    '<h2>Все находки автоматически доставлены. Наведите на находку, чтобы прочитать её описание.</h2>' +
    '<div class="k" style="font-size:14px">ПОЛУЧЕНО НАХОДОК: ' + shown.length + '</div>' +
    '<div class="floor-find-list">' + shown.map((f,i) =>
      '<div class="floor-find-row" data-floor-find="' + i + '" tabindex="0" aria-describedby="skilltip" style="--fc:' + f.col + '">' +
        '<div class="floor-find-icon">' + f.ico + '</div><div><b>' + f.name + '</b><span>' + f.detail + '</span></div>' +
      '</div>').join('') + '</div><button id="findok">ПРОДОЛЖИТЬ</button>';
  document.querySelectorAll('[data-floor-find]').forEach(el => {
    const f = shown[+el.dataset.floorFind];
    el.onmouseenter = ev => showFloorFindTip(ev, f, el);
    el.onmousemove = ev => showFloorFindTip(ev, f, el);
    el.onmouseleave = hideSkillTip;
    el.onfocus = () => showFloorFindTip(null, f, el);
    el.onblur = hideSkillTip;
  });
  $('#findok').onclick = () => {
    G.floorFinds.splice(0, shown.length); G.floorFindSummaryOpen = false; G.paused = false;
    $('#ov').style.display = 'none'; $('#ov').innerHTML = ''; last = performance.now();
    if (G.pending) showLevelUp();
  };
  return true;
}

/* Завершение комнаты — жёсткая граница для лута. Как только бой закончен,
   портал забирает всё, что осталось на арене: опыт, золото и находки. Обычный
   ручной подбор по-прежнему показывает каждое окно отдельно. */
function collectFloorLoot(){
  if (!G.orbs.length) return {xp:0, gold:0, finds:0};
  const drops = G.orbs.splice(0);
  let xp = 0, gold = 0, finds = 0;
  for (const o of drops){
    if (o.amu){
      const A = AMULETS[o.amu]; takeAmulet(o.amu, true); finds++;
      G.floorFinds.push({ico:A.ico, col:A.col, name:A.nm,
        detail:SLOTS[A.slot].toUpperCase() + ' · ' + ['ОБЫЧНЫЙ','РЕДКИЙ','ЭПИЧЕСКИЙ','ЛЕГЕНДАРНЫЙ'][A.rar], tip:A.nt});
    }
    else if (o.totem){
      const T = TOTEMS[o.totem]; takeTotem(o.totem, true); finds++;
      const tier = totemTier(o.totem);
      G.floorFinds.push({ico:T.ico, col:T.col, name:TOTEM_RANKS[tier-1] + ' ' + T.nm,
        detail:'ТОТЕМ · ранг ' + tier + ' из 4 · +' + TOTEM_VALS[tier-1] + '% урона по ' + T.st,
        tip:'Весь ваш урон по ' + T.st + ' целям увеличен на <b>+' + TOTEM_VALS[tier-1] + '%</b>. Действует и на удары свиты.' +
          (tier < 4 ? '<br>Следующая находка повысит тотем до <b>+' + TOTEM_VALS[tier] + '%</b>.' : '<br>Достигнут максимальный ранг.')});
    }
    else if (o.book){
      const B = BOOKS[o.book], before = G.items[o.book] ? G.items[o.book].val : 0;
      takeBook(o.book, true); finds++;
      const it = G.items[o.book], unit = (B.pct || o.book === 'monster' || o.book === 'xp') ? '%' : '';
      G.floorFinds.push({ico:B.ico, col:B.col, name:B.nm,
        detail:'КНИГА · тир ' + it.tier + ' · +' + it.val + unit + (before ? ' · было +' + before + unit : ''),
        tip:B.desc.replace(/N/g, it.val + unit) + (B.proc ? '<br>Текущий шанс срабатывания: <b>' + bookChance(o.book) + '%</b>.' : '')});
    }
    else if (o.gold) gold += o.v || 0;
    else xp += o.v || 0;
  }
  if (gold) G.gold += gold;
  if (xp) gainXp(xp);
  if (!G.pending) showFloorFindSummary();
  return {xp, gold, finds};
}

/* ---------- 9. ОТРИСОВКА ---------- */
function drawPoly(x, y, r, sides, rot){
  ctx.beginPath();
  for (let i = 0; i < sides; i++){
    const a = rot + i*Math.PI*2/sides;
    const px = x + Math.cos(a)*r, py = y + Math.sin(a)*r;
    i ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
  }
  ctx.closePath();
}
function drawShape(sh, x, y, r, rot){
  if (sh === 'circle'){ ctx.beginPath(); ctx.arc(x,y,r,0,6.29); }
  else if (sh === 'triangle') drawPoly(x,y,r,3,rot);
  else if (sh === 'square')   drawPoly(x,y,r,4,rot+0.785);
  else if (sh === 'diamond')  drawPoly(x,y,r,4,rot);
  else drawPoly(x,y,r,6,rot);
}

function enemySpriteReady(e){
  if (e.bossId==='demonqueen' && e.bossT && e.bossT.hidden) return true;
  const sf=enemySpriteFrame(e), sprite=sf && enemySpriteImage(e);
  return !!(sf && sprite && sprite.complete && sprite.naturalWidth);
}
function drawEnemySprite(e){
  if (e.bossId === 'demonqueen' && e.bossT && e.bossT.hidden) return true;
  const sf=enemySpriteFrame(e), sprite=sf && enemySpriteImage(e);
  if (!sf || !sprite || !sprite.complete || !sprite.naturalWidth) return false;
  const f=sf.frame, k=e.r*sf.meta.scale/f.h;
  ctx.save(); ctx.translate(e.x,e.y); ctx.scale(e.spriteFace < 0 ? -1 : 1,1);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(sprite,f.x,f.y,f.w,f.h,-f.ax*k,-f.ay*k,f.w*k,f.h*k);
  ctx.restore(); return true;
}
function drawEnemyProjectileSprite(s, frameIndex){
  if (s.shotType !== 'shooter' || !SHOOTER_PROJECTILE || !SHOOTER_PROJECTILE.complete || !SHOOTER_PROJECTILE.naturalWidth) return false;
  const f=SHOOTER_PROJECTILE_FRAMES[frameIndex];
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(SHOOTER_PROJECTILE,f.x,f.y,f.w,f.h,-f.draw/2,-f.draw/2,f.draw,f.draw);
  return true;
}
function drawPlayerProjectileSprite(s, mageFrameIndex){
  const sprite=PLAYER_PROJECTILES[s.spriteType];
  if (!sprite || !sprite.complete || !sprite.naturalWidth) return false;
  const f=s.spriteType === 'mage' ? PLAYER_MAGE_FRAMES[mageFrameIndex] : PLAYER_ARROW_FRAME;
  ctx.imageSmoothingEnabled=false;
  if (s.spriteType === 'mage'){
    const size=s.r*2;
    ctx.save();
    if (remoteOrbActive(s)) ctx.filter='hue-rotate(65deg) saturate(1.45) brightness(1.08)';
    ctx.drawImage(sprite,f.x,f.y,f.w,f.h,s.x-size/2,s.y-size/2,size,size);
    ctx.restore();
  } else {
    const scale=s.r/5, width=12*scale, height=6*scale;
    ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(s.a);
    ctx.drawImage(sprite,0,0,12,6,-width/2,-height/2,width,height);
    ctx.restore();
  }
  return true;
}
function enemyVisualTop(e){
  const sf=enemySpriteFrame(e);
  return sf ? sf.frame.ay * (e.r*sf.meta.scale/sf.frame.h) : e.r;
}
function enemySpriteMarks(e){
  const marks=[], add=col => { if (col && marks.indexOf(col)<0) marks.push(col); };
  if (e.hit > 0) add('#ffffff');
  if (e.kind === 'elite') add('#ffd24a');
  if (e.dots.fire.dps > 0) add('#ff7a2f');
  if (e.plague) add('#b6df55');
  if (e.ail.chill > 0 || e.frost) add('#7fd6ff');
  if (e.ail.shock > 0) add('#ffe14a');
  if (e.ail.freeze > 0) add('#ffffff');
  if (e.pack) add(e.pack.col);
  if (e.rage > 0) add('#ffd24a');
  return marks;
}
function drawEnemySpriteMarks(e){
  const marks=enemySpriteMarks(e).slice(0,6), gap=8;
  for (let i=0;i<marks.length;i++){
    ctx.fillStyle=marks[i];
    drawPoly(e.x + (i-(marks.length-1)/2)*gap, e.y-e.r-8, 3.2, 4, 0.785); ctx.fill();
  }
}
function enemyTargetMarkerKind(e){ return enemySpriteFrame(e) ? 'chevron' : 'arcs'; }
function drawEnemyTargetMarker(e){
  ctx.strokeStyle='#ffb340cc'; ctx.lineWidth=2;
  if (enemyTargetMarkerKind(e) === 'chevron'){
    const y=e.y-e.r-13;
    ctx.beginPath();
    ctx.moveTo(e.x-7,y-4); ctx.lineTo(e.x,y+2); ctx.lineTo(e.x+7,y-4);
    ctx.moveTo(e.x-5,y-9); ctx.lineTo(e.x,y-5); ctx.lineTo(e.x+5,y-9);
    ctx.stroke(); return;
  }
  const rr=e.r+7;
  for (let q=0;q<4;q++){
    const a0=q*Math.PI/2+0.35;
    ctx.beginPath(); ctx.arc(e.x,e.y,rr,a0,a0+0.55); ctx.stroke();
  }
}

/* Герой смотрит вправо в локальных координатах, затем весь силуэт поворачивается
   к текущей цели. Хитбокс остаётся кругом p.r: выразительность не должна менять
   дистанцию, с которой враг достаёт класс. */
function drawHero(p){
  const w = G.weapon, outline = p.inv > 0 ? '#ffffff' :
    w.id === 'wpn.wand' ? '#c08cff' : w.id === 'wpn.scythe' ? '#8be04e' : '#ffb340';
  const spriteKey = w.id === 'wpn.bow' ? 'archer' : w.id === 'wpn.wand' ? 'mage' :
                    w.id === 'wpn.scythe' ? 'necromancer' : w.id === 'wpn.sword' ? 'warrior' : null;
  const sprite = spriteKey && HERO_SPRITES[spriteKey];
  if (sprite && sprite.complete && sprite.naturalWidth){
    ctx.save(); ctx.translate(p.x, p.y); ctx.scale(p.spriteFace < 0 ? -1 : 1, 1);
    ctx.imageSmoothingEnabled = false;
    const meta = HERO_SPRITE_META[spriteKey];
    if (meta){
      const frame = p.moving ? Math.floor(p.heroWalkT||0)%4 : 0;
      ctx.drawImage(sprite, frame*meta.frameW, 0, meta.frameW, meta.frameH,
        -meta.drawW/2, -meta.drawH/2, meta.drawW, meta.drawH);
      if (p.hitFlash > 0){
        ctx.globalAlpha=0.82; ctx.filter='brightness(0) saturate(100%) invert(20%) sepia(99%) saturate(6500%) hue-rotate(348deg) brightness(120%) contrast(120%)';
        ctx.drawImage(sprite, frame*meta.frameW, 0, meta.frameW, meta.frameH,
          -meta.drawW/2, -meta.drawH/2, meta.drawW, meta.drawH);
      }
    } else ctx.drawImage(sprite, -24, -24, 48, 48);
    ctx.restore();
    return;
  }
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.aim);
  ctx.lineWidth = 2.5; ctx.strokeStyle = outline;

  if (w.id === 'wpn.bow'){
    // Лучник: колчан сзади, короткий плащ и настоящий лук впереди силуэта.
    ctx.fillStyle = '#704326'; ctx.fillRect(-12,-8,5,15); ctx.strokeRect(-12,-8,5,15);
    ctx.fillStyle = '#ffb34033'; ctx.beginPath();
    ctx.moveTo(-8,10); ctx.lineTo(-7,-6); ctx.lineTo(2,-11); ctx.lineTo(9,5); ctx.lineTo(4,11); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffe4b0'; ctx.beginPath(); ctx.arc(3,-7,4,0,6.29); ctx.fill();
    ctx.strokeStyle = '#ffe4b0'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(8,-13); ctx.quadraticCurveTo(20,0,8,13); ctx.moveTo(8,-13); ctx.lineTo(8,13); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(3,0); ctx.lineTo(20,0); ctx.lineTo(16,-3); ctx.moveTo(20,0); ctx.lineTo(16,3); ctx.stroke();
  } else if (w.id === 'wpn.wand'){
    // Маг: широкая мантия, посох и кристалл впереди — силуэт читается даже в толпе.
    ctx.fillStyle = '#c08cff33'; ctx.beginPath();
    ctx.moveTo(-10,11); ctx.lineTo(-5,-6); ctx.lineTo(4,-11); ctx.lineTo(10,11); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#241534'; ctx.beginPath(); ctx.arc(1,-7,5,0,6.29); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#a876d8'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-5,12); ctx.lineTo(8,-14); ctx.stroke();
    ctx.fillStyle = '#e4c5ff'; ctx.beginPath(); ctx.arc(9,-16,4,0,6.29); ctx.fill();
    ctx.strokeStyle = '#e4c5ff88'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(9,-16,8,0,6.29); ctx.stroke();
  } else if (w.id === 'wpn.scythe'){
    // Некромант: капюшон, рваная мантия и коса; зелёный круг отличает его от свиты.
    ctx.strokeStyle = '#8be04e44'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(0,0,p.r+6,0,6.29); ctx.stroke();
    ctx.strokeStyle = outline; ctx.lineWidth = 2.5; ctx.fillStyle = '#18301d'; ctx.beginPath();
    ctx.moveTo(-11,11); ctx.lineTo(-6,-5); ctx.lineTo(1,-12); ctx.lineTo(9,11); ctx.lineTo(3,8); ctx.lineTo(-2,12); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#0b1410'; ctx.beginPath(); ctx.arc(0,-7,5,0,6.29); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#9aa7b4'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-8,13); ctx.lineTo(13,-15); ctx.stroke();
    ctx.strokeStyle = '#d8f7c5'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(14,-10,9,1.9,4.55); ctx.stroke();
  } else {
    // Запасной силуэт Воина используется только если встроенный PNG не загрузился.
    ctx.fillStyle = '#ffb34033'; ctx.lineWidth = 3; drawPoly(0,0,p.r,4,0.785); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(p.r+11,0); ctx.stroke();
  }
  ctx.restore();
}

/* Компактный мировой HP-бар остаётся привязан к ногам героя. Белая подложка
   повторяет короткий «хвост» верхнего HUD, поэтому потерю здоровья видно даже
   в толпе, не переводя взгляд к краю экрана. */
function drawPlayerHealthBar(p){
  const w=34,h=4,x=Math.round(p.x-w/2),y=Math.round(p.y+28);
  const hp=clamp(p.hp/D.life,0,1), lag=Math.max(hp,clamp(p.hpLag||0,0,1));
  const barrier=clamp(totalPlayerBarrier(p)/D.life,0,1);
  ctx.fillStyle='#05070ddd'; ctx.fillRect(x-2,y-2,w+4,h+4);
  ctx.fillStyle='#ffffffaa'; ctx.fillRect(x,y,w*lag,h);
  ctx.fillStyle=p.hpFlash>0?'#ff1938':'#e0405a'; ctx.fillRect(x,y,w*hp,h);
  // Голубая двухпиксельная полоса имеет ту же шкалу max HP и не закрывает
  // красное здоровье целиком: 6% барьера занимают ровно 6% ширины.
  if (barrier>0){ ctx.fillStyle='#5ec2e0'; ctx.fillRect(x,y+h-2,w*barrier,2); }
  ctx.strokeStyle='#e8eef588'; ctx.lineWidth=1; ctx.strokeRect(x-0.5,y-0.5,w+1,h+1);
}

/* Компактный Boss HUD живёт в Canvas и использует фиксированный массив на
   четыре ссылки. Список и DOM не пересобираются каждый кадр. */
const BOSS_HUD_MARKERS=[
  {col:'#f6c344',shape:'diamond'}, {col:'#5ec2e0',shape:'square'},
  {col:'#b56cff',shape:'triangle'}, {col:'#78d66b',shape:'circle'}
];
const BOSS_HUD_HP_LAG_TIME=0.4;
const BOSS_HUD_TARGETS=[null,null,null,null];
let BOSS_HUD_COUNT=0;
function tickBossHudHealth(dt){
  for (let i=0;i<G.enemies.length;i++){
    const e=G.enemies[i];
    if (e.kind!=='boss' || e.dead) continue;
    const hp=clamp(e.hp/Math.max(1,e.maxHp),0,1);
    if (!Number.isFinite(e.hudHpLag)) e.hudHpLag=hp;
    if (!Number.isFinite(e.hudHpLast)) e.hudHpLast=hp;
    let hit=false;
    if (hp<e.hudHpLast){
      e.hudHpLag=Math.max(e.hudHpLag,e.hudHpLast);
      e.hudHpFrom=e.hudHpLag;
      e.hudHpTimer=BOSS_HUD_HP_LAG_TIME;
      hit=true;
    } else if (hp>e.hudHpLast){
      // Лечение не должно оставлять светлую полосу позади настоящего HP.
      e.hudHpLag=e.hudHpFrom=hp; e.hudHpTimer=0;
    }
    e.hudHpLast=hp;
    if (!hit && e.hudHpTimer>0){
      e.hudHpTimer=Math.max(0,e.hudHpTimer-dt);
      const t=1-e.hudHpTimer/BOSS_HUD_HP_LAG_TIME;
      e.hudHpLag=e.hudHpFrom+(hp-e.hudHpFrom)*t;
    } else if (!hit && e.hudHpLag<hp){
      e.hudHpLag=hp;
    }
  }
}
function collectBossHudTargets(){
  BOSS_HUD_COUNT=0;
  for (let i=0;i<BOSS_HUD_TARGETS.length;i++) BOSS_HUD_TARGETS[i]=null;
  for (let i=0;i<G.enemies.length;i++){
    const e=G.enemies[i];
    if (e.kind!=='boss' || e.dead) continue;
    BOSS_HUD_TARGETS[BOSS_HUD_COUNT++]=e;
    if (BOSS_HUD_COUNT===BOSS_HUD_TARGETS.length) break;
  }
  return BOSS_HUD_COUNT;
}
function bossHudTargetSlot(e){
  for (let i=0;i<BOSS_HUD_COUNT;i++) if (BOSS_HUD_TARGETS[i]===e) return i;
  return -1;
}
function bossHudInfo(e){
  const def=bossType(e); let info='',n=0;
  if (def && def.rare){ info=tr('РЕДКИЙ'); n=1; }
  if (def && def.hud && n<2){ info+=(info?' · ':'')+tr(def.hud).toUpperCase(); n++; }
  if (n<2 && e.aff && e.aff.length){ info+=(info?' · ':'')+tr(e.aff[0].nm).toUpperCase(); }
  return info;
}
function drawBossHudMarker(x,y,slot,size=5){
  const m=BOSS_HUD_MARKERS[slot]||BOSS_HUD_MARKERS[0];
  ctx.save(); ctx.fillStyle=m.col; ctx.strokeStyle='#020408'; ctx.lineWidth=2; ctx.beginPath();
  if (m.shape==='diamond'){
    ctx.moveTo(x,y-size);ctx.lineTo(x+size,y);ctx.lineTo(x,y+size);ctx.lineTo(x-size,y);ctx.closePath();
  } else if (m.shape==='triangle'){
    ctx.moveTo(x,y-size);ctx.lineTo(x+size,y+size);ctx.lineTo(x-size,y+size);ctx.closePath();
  } else if (m.shape==='circle') ctx.arc(x,y,size,0,Math.PI*2);
  else ctx.rect(x-size,y-size,size*2,size*2);
  ctx.fill(); ctx.stroke(); ctx.restore();
}
function drawBossHudEntry(e,cx,width,slot,two,y){
  const def=bossType(e),rare=!!(def&&def.rare),name=tr(e.t.nm).toUpperCase();
  const hp=clamp(e.hp/Math.max(1,e.maxHp),0,1);
  const hpLag=Math.max(hp,clamp(Number.isFinite(e.hudHpLag)?e.hudHpLag:hp,0,1));
  const left=Math.round(cx-width/2),barY=y+17;
  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.font='bold '+(name.length>22?11:12)+'px ui-monospace,monospace';
  ctx.lineWidth=3; ctx.strokeStyle='#020408'; ctx.strokeText(name,cx,y+11);
  ctx.fillStyle=rare?'#f6c344':'#eef3f8'; ctx.fillText(name,cx,y+11);
  if (two){
    const tm=ctx.measureText(name),nameW=tm&&Number.isFinite(tm.width)?tm.width:name.length*7;
    drawBossHudMarker(cx-nameW/2-10,y+6,slot,4);
  }
  ctx.fillStyle='#03060bdd'; ctx.fillRect(left,barY,width,8);
  ctx.fillStyle='#f2e8dcbb'; ctx.fillRect(left+1,barY+1,Math.round((width-2)*hpLag),6);
  ctx.fillStyle='#ff3b45'; ctx.fillRect(left+1,barY+1,Math.round((width-2)*hp),6);
  ctx.strokeStyle=rare?'#f6c344':'#7d3540'; ctx.lineWidth=1; ctx.strokeRect(left-0.5,barY-0.5,width+1,9);
  ctx.font='bold 10px ui-monospace,monospace'; ctx.fillStyle=rare?'#d9bc69':'#aebbc8';
  ctx.fillText(bossHudInfo(e),cx,y+39); ctx.restore();
}
function drawBossHud(){
  if (!BOSS_HUD_COUNT) return 0;
  if (BOSS_HUD_COUNT===1){
    drawBossHudEntry(BOSS_HUD_TARGETS[0],W/2,Math.min(440,Math.max(240,W*0.48)),0,false,9);
    return 1;
  }
  const width=Math.min(340,Math.max(180,W*0.28)),y=W<1180?76:9;
  if (BOSS_HUD_COUNT===2){
    drawBossHudEntry(BOSS_HUD_TARGETS[0],W*0.36,width,0,true,y);
    drawBossHudEntry(BOSS_HUD_TARGETS[1],W*0.64,width,1,true,y);
    return 2;
  }
  const gridWidth=Math.min(300,Math.max(160,W*0.25));
  for (let i=0;i<BOSS_HUD_COUNT;i++){
    const row=Math.floor(i/2), lone=i===BOSS_HUD_COUNT-1 && BOSS_HUD_COUNT%2===1;
    const cx=lone?W/2:(i%2?W*0.66:W*0.34);
    drawBossHudEntry(BOSS_HUD_TARGETS[i],cx,gridWidth,i,true,y+row*48);
  }
  return BOSS_HUD_COUNT;
}

const CANVAS_RENDER_PASSES=['ground','telegraphs','floorEffects','itemsProjectiles',
                            'entities','impactEffects','worldHud','combatText','bossHud'];

function render(){
  const p = G.player;
  collectBossHudTargets();
  let sx = 0, sy = 0;
  const shakes=G.fx.filter(f=>f.t==='shake');
  const shake=shakes.length ? shakes.reduce((a,f)=>(f.amp||5)>(a.amp||5)?f:a) : null;
  if (shake){ const amp=shake.amp||5; sx=rnd(-amp,amp); sy=rnd(-amp,amp); }

  for (const pass of CANVAS_RENDER_PASSES) renderCanvasPass(pass,p,sx,sy);

  // Экранная реакция всегда композится после всех мировых слоёв.
  if (G.hurtVignette > 0){
    const fade=clamp(G.hurtVignette/Math.max(0.001,G.hurtVignetteMax),0,1);
    const r0=Math.min(W,H)*0.20, r1=Math.hypot(W,H)*0.58;
    const vg=ctx.createRadialGradient(W/2,H/2,r0,W/2,H/2,r1);
    vg.addColorStop(0,'rgba(70,0,8,0)');
    vg.addColorStop(0.62,'rgba(90,0,10,'+(G.hurtVignetteOpacity*fade*0.18)+')');
    vg.addColorStop(1,'rgba(95,0,12,'+(G.hurtVignetteOpacity*fade)+')');
    ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  }
  updateHud();                                               // DOM HUD — последний проход
}

function renderCanvasPass(pass,p,sx,sy){

  if (pass==='bossHud'){
    ctx.save(); drawBossHud(); ctx.restore(); return;
  }

  // Видимые границы в координатах мира. Внутри арены непрозрачный пол сам очищает кадр,
  // поэтому отдельная полноэкранная заливка нужна только у края или до загрузки тайла.
  const viewLeft = p.x - W/2 - sx, viewTop = p.y - H/2 - sy;
  const viewRight = viewLeft + W, viewBottom = viewTop + H;
  const floorLeft = Math.max(-ARENA, viewLeft), floorTop = Math.max(-ARENA, viewTop);
  const floorRight = Math.min(ARENA, viewRight), floorBottom = Math.min(ARENA, viewBottom);
  const floorCoversView = floorPattern && floorLeft <= viewLeft && floorTop <= viewTop &&
                          floorRight >= viewRight && floorBottom >= viewBottom;
  if (pass==='ground' && !floorCoversView){ ctx.fillStyle='#0d1014'; ctx.fillRect(0,0,W,H); }
  ctx.save();
  ctx.translate(W/2 - p.x + sx, H/2 - p.y + sy);                   // камера следует за игроком

  if (pass==='ground' && floorPattern){
    // Рисуем только видимый фрагмент: размер операции теперь W×H, а не 3000×3000.
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = floorPattern;
    if (floorRight > floorLeft && floorBottom > floorTop){
      ctx.fillRect(floorLeft, floorTop, floorRight-floorLeft, floorBottom-floorTop);
    }
  } else if (pass==='ground'){
    // Без Image (в том числе в Node-харнессе) остаётся прежняя лёгкая сетка.
    const step = 80;
    ctx.strokeStyle = '#171d24'; ctx.lineWidth = 1;
    const x0 = Math.floor((p.x - W/2)/step)*step, y0 = Math.floor((p.y - H/2)/step)*step;
    ctx.beginPath();
    for (let x = x0; x < p.x + W/2 + step; x += step){ ctx.moveTo(x, y0); ctx.lineTo(x, y0 + H + step*2); }
    for (let y = y0; y < p.y + H/2 + step; y += step){ ctx.moveTo(x0, y); ctx.lineTo(x0 + W + step*2, y); }
    ctx.stroke();
  }

  if (pass==='ground'){
    // Граница арены
    ctx.strokeStyle='#2c3742'; ctx.lineWidth=3;
    ctx.strokeRect(-ARENA,-ARENA,ARENA*2,ARENA*2);
  }

  // Аура замедления
  if (pass==='worldHud' && G.bag.has('slowAura')){
    ctx.strokeStyle = '#5ec2e022'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, D.slowAuraR, 0, 6.29); ctx.stroke();
  }

  // Портал
  if (pass==='itemsProjectiles' && G.portal){
    const t = G.portal.t;
    ctx.strokeStyle = '#4fd1c5'; ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++){
      const rr = G.portal.r * (0.5 + i*0.28) + Math.sin(t*3 + i)*4;
      drawPoly(G.portal.x, G.portal.y, rr, 6, t*(i%2?1:-1)); ctx.stroke();
    }
  }

  // Трупы — ресурс некроманта
  if (pass==='itemsProjectiles'){
    ctx.strokeStyle='#4a5560'; ctx.lineWidth=2;
  for (const c of G.corpses){
    const k = clamp(c.life/3,0,1), r = c.big ? 9 : 6;
    ctx.globalAlpha = 0.35 + k*0.5;
    ctx.beginPath();
    ctx.moveTo(c.x-r,c.y-r); ctx.lineTo(c.x+r,c.y+r);
    ctx.moveTo(c.x+r,c.y-r); ctx.lineTo(c.x-r,c.y+r);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  }

  // Сферы опыта (бирюзовые круги) и золото (янтарные ромбы)
  if (pass==='itemsProjectiles'){
  for (const o of G.orbs){
    if (o.book){
      // Книга — важнейшая находка, поэтому подсвечена нарочито громко:
      // радужный ореол, пульсирующие кольца и искры.
      const B = BOOKS[o.book];
      const puls = 1 + Math.sin(G.time*4)*0.18;
      const R = 62 * puls;
      const hue = (G.time*150) % 360;

      const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, R);
      g.addColorStop(0,    'hsla(' + hue + ',100%,72%,0.55)');
      g.addColorStop(0.45, 'hsla(' + ((hue+80)%360) + ',100%,62%,0.22)');
      g.addColorStop(1,    'hsla(' + ((hue+160)%360) + ',100%,60%,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(o.x, o.y, R, 0, 6.29); ctx.fill();

      ctx.lineWidth = 2;                                  // три кольца, крутятся в разные стороны
      for (let ri = 0; ri < 3; ri++){
        ctx.strokeStyle = 'hsla(' + ((hue + ri*120) % 360) + ',100%,68%,' + (0.75 - ri*0.18) + ')';
        drawPoly(o.x, o.y, (18 + ri*11) * puls, 6, G.time*(ri%2 ? 1.6 : -1.2) + ri);
        ctx.stroke();
      }
      ctx.strokeStyle = 'hsl(' + hue + ',100%,80%)'; ctx.lineWidth = 3;
      ctx.fillStyle = B.col + '66';
      drawPoly(o.x, o.y, 13*puls, 4, 0.785); ctx.fill(); ctx.stroke();

      ctx.fillStyle = '#ffffff';                          // иконка стихии в центре
      ctx.font = 'bold 15px ui-monospace,monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(B.ico, o.x, o.y);
      ctx.textBaseline = 'alphabetic';

      if (Math.random() < 0.30)                           // непрерывный сноп искр
        burst(o.x, o.y, 1, 'hsl(' + ((hue+rnd(0,360))%360) + ',100%,70%)', 90, 3, 0.7);
    }
    else if (o.amu){                                   // амулет на земле: пульсирующий ромб
      const A = AMULETS[o.amu], pu = 0.65 + 0.35*Math.sin(G.time*5);
      ctx.globalAlpha = pu; ctx.fillStyle = A.col;
      drawPoly(o.x, o.y, 11, 4, G.time*1.4); ctx.fill();
      ctx.globalAlpha = 1; ctx.strokeStyle = A.col; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(o.x, o.y, 17 + 4*pu, 0, 6.29); ctx.stroke();
      ctx.font = 'bold 12px ui-monospace,monospace'; ctx.textAlign = 'center';
      ctx.fillStyle = A.col; ctx.fillText(A.ico, o.x, o.y + 4);
    }
    else if (o.totem){                                 // тотем: столбик с меткой стихии
      const T = TOTEMS[o.totem], pu = 0.7 + 0.3*Math.sin(G.time*4);
      ctx.globalAlpha = pu; ctx.fillStyle = T.col;
      drawPoly(o.x, o.y, 10, 3, -Math.PI/2); ctx.fill();
      ctx.globalAlpha = 1; ctx.strokeStyle = T.col; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(o.x, o.y, 16 + 3*pu, 0, 6.29); ctx.stroke();
    }
    else if (o.gold){ ctx.fillStyle = '#f0c040'; drawPoly(o.x, o.y, 4.5, 4, G.time*2); ctx.fill(); }
    else { ctx.fillStyle = '#4fd1c5'; ctx.beginPath(); ctx.arc(o.x,o.y,4,0,6.29); ctx.fill(); }
  }
  }

  if (pass==='floorEffects'){
  // Воронка гравитационного колодца — под всеми
  if (G.well){
    ctx.globalAlpha = 0.18 + 0.12*Math.sin(G.time*10);
    ctx.fillStyle = '#c08cff';
    ctx.beginPath(); ctx.arc(G.well.x, G.well.y, G.well.r*(0.4 + 0.6*G.well.t), 0, 6.29); ctx.fill();
    ctx.globalAlpha = 0.5; ctx.strokeStyle = '#c08cff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(G.well.x, G.well.y, G.well.r, 0, 6.29); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // Кипящая кровь — под всеми, это часть пола
  for (const b2 of G.boils){
    const k = clamp(b2.life/BOIL_LIFE, 0, 1);
    ctx.globalAlpha = 0.22*k + 0.10*Math.abs(Math.sin(G.time*6));
    ctx.fillStyle = '#e0405a';
    ctx.beginPath(); ctx.arc(b2.x, b2.y, b2.r, 0, 6.29); ctx.fill();
    ctx.globalAlpha = 0.5*k; ctx.strokeStyle = '#e0405a'; ctx.lineWidth = 2; ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // След от ботинок — под всеми, это часть пола
  for (const tr of G.trails){
    const k = clamp(tr.life/TRAIL_LIFE, 0, 1);
    ctx.globalAlpha = 0.30*k;
    ctx.fillStyle = tr.fire ? '#ff7a2f' : '#7fd6ff';
    ctx.beginPath(); ctx.arc(tr.x, tr.y, tr.r*(0.55 + 0.45*k), 0, 6.29); ctx.fill();
    if (tr.fire && tr.cold){                      // оба следа сразу: ледяная кайма поверх
      ctx.globalAlpha = 0.22*k; ctx.strokeStyle = '#7fd6ff'; ctx.lineWidth = 2; ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  // Лужи смолы — под всеми, это часть пола
  for (const pl of G.pools){
    const k = clamp(pl.life/pl.max, 0, 1);
    const arming = pl.arm > 0;
    if (arming) continue;                                       // замах уже нарисован общим красным телеграфом
    ctx.globalAlpha = 0.22 + 0.18*k;
    ctx.fillStyle = '#6b4a12'; ctx.beginPath(); ctx.arc(pl.x, pl.y, pl.r, 0, 6.29); ctx.fill();
    ctx.globalAlpha = 0.5 + 0.4*k;
    ctx.strokeStyle = '#c08a3a'; ctx.lineWidth = 2; ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // Кислота Чумоносного огра: обычная лужа компактна, предсмертная — заметно больше.
  for (const pl of G.eliteAcidPools){
    const k=clamp(pl.life/pl.max,0,1),pulse=0.72+0.28*Math.sin(G.time*12+pl.x*0.01);
    ctx.globalAlpha=(0.25+0.20*k)*pulse;
    ctx.fillStyle=pl.deathPool?'#668f16':'#527914';
    ctx.beginPath(); ctx.arc(pl.x,pl.y,pl.r,0,6.29); ctx.fill();
    ctx.globalAlpha=0.58+0.24*k; ctx.strokeStyle='#b8ee42';
    ctx.lineWidth=pl.deathPool?4:2; ctx.stroke(); ctx.globalAlpha=1;
  }
  // Предсмертная кислота Чумной Мерзости — крупнее смолы и тикает ровно раз в секунду.
  for (const pl of G.bossPools){
    const k = clamp(pl.life/pl.max, 0, 1), pulse = 0.75 + 0.25*Math.sin(G.time*7);
    ctx.globalAlpha = (0.24 + 0.18*k) * pulse;
    ctx.fillStyle = '#638f19'; ctx.beginPath(); ctx.arc(pl.x, pl.y, pl.r, 0, 6.29); ctx.fill();
    ctx.globalAlpha = 0.55 + 0.30*k;
    ctx.strokeStyle = '#b8ee42'; ctx.lineWidth = 4; ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // След Тирана короткий и ограничен 48 пятнами: заметен, но не превращается
  // в сотни полупрозрачных кругов, которые снова уронят FPS.
  for (const tr of G.bossTrails){
    const k=clamp(tr.life/tr.max,0,1), pulse=0.72+0.28*Math.sin(G.time*15+tr.x*0.02);
    ctx.globalAlpha=(0.20+0.22*k)*pulse; ctx.fillStyle='#d52d18';
    ctx.beginPath(); ctx.arc(tr.x,tr.y,tr.r*(0.75+0.25*k),0,6.29); ctx.fill();
    ctx.globalAlpha=0.55*k; ctx.strokeStyle='#ff8a32'; ctx.lineWidth=2; ctx.stroke();
    ctx.globalAlpha=1;
  }
  }

  if (pass==='telegraphs'){
  // Короткоживущие маркеры снарядов используют ту же временную шкалу.
  for (const f of G.fx) if (f.t==='telegraph') drawTelegraph(Object.assign({},f,{remaining:f.life}));
  // Все активные замахи проходят через одну геометрию, палитру и временную шкалу.
  for (const e of G.enemies){
    if (e.kind !== 'boss' || !e.bossT) continue;
    const T=e.bossT;
    if (e.bossId === 'behemoth' && T.jumpWarn > 0)
      drawTelegraph({shape:'target',kind:'warning',x:T.jumpX,y:T.jumpY,r:e.r+20,remaining:T.jumpWarn,total:BOSS_BEHEMOTH_WARN});
    if (e.bossId === 'vampire' && T.markWarn > 0){
      drawTelegraph({shape:'corridor',kind:'damage',x:T.markX-105,y:T.markY,x2:T.markX+105,y2:T.markY,
        width:44,remaining:T.markWarn,total:BOSS_VAMPIRE_WARN});
      drawTelegraph({shape:'corridor',kind:'damage',x:T.markX,y:T.markY-105,x2:T.markX,y2:T.markY+105,
        width:44,remaining:T.markWarn,total:BOSS_VAMPIRE_WARN});
    }
    if (e.bossId === 'voidwrath' && T.rifts){
      for (const r of T.rifts)
        drawTelegraph({shape:'rift',kind:'control',x:r.x,y:r.y,r:r.r,remaining:r.warn,total:BOSS_VOID_WARN});
    }
    if (e.bossId === 'minotaur' && T.chargeWarn > 0){
      const len=minotaurEdgeDistance(e,T.chargeA), ex=e.x+Math.cos(T.chargeA)*len, ey=e.y+Math.sin(T.chargeA)*len;
      drawTelegraph({shape:'corridor',kind:'damage',x:e.x,y:e.y,x2:ex,y2:ey,width:e.r*2+16,
        remaining:T.chargeWarn,total:BOSS_MINOTAUR_WARN});
    }
    if (e.bossId === 'seraph' && T.judgeWarn > 0)
      drawTelegraph({shape:'target',kind:'damage',x:T.judgeX,y:T.judgeY,r:68,remaining:T.judgeWarn,total:BOSS_SERAPH_WARN});
    if (e.bossId === 'demonqueen' && T.leapWarn > 0)
      drawTelegraph({shape:'target',kind:'control',x:T.leapX,y:T.leapY,r:115,remaining:T.leapWarn,total:BOSS_QUEEN_WARN});
    if (e.bossId === 'goat' && T.slamWarn > 0)
      drawTelegraph({shape:'circle',kind:'damage',x:e.x,y:e.y,r:BOSS_GOAT_AOE,remaining:T.slamWarn,total:BOSS_GOAT_WARN});
  }
  }

  if (pass==='floorEffects'){
  // Кислота веномансера: зелёная лужа остаётся там, где погиб приспешник.
  for (const a of G.acidPools){
    const k = clamp(a.life/a.max, 0, 1);
    ctx.globalAlpha = 0.22 + 0.20*k;
    ctx.fillStyle = '#466f28'; ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, 6.29); ctx.fill();
    ctx.globalAlpha = 0.60*k;
    ctx.strokeStyle = '#a9e85a'; ctx.lineWidth = 2; ctx.stroke();
    ctx.globalAlpha = 1;
  }
  }

  // Враги
  if (pass==='entities' || pass==='worldHud' || pass==='telegraphs'){
  for (const e of G.enemies){
    const spriteDrawn=enemySpriteReady(e);
    if (pass==='entities'){
      ctx.lineWidth=e.kind==='norm'?2:3;
      ctx.strokeStyle=e.hit>0?'#ffffff':(e.kind==='boss'?'#ff5a4e':e.kind==='elite'?'#ffd24a':e.t.col);
      ctx.fillStyle=e.hit>0?'#ffffff44':e.t.col+'22';
      if (!drawEnemySprite(e)){ drawShape(e.t.shape,e.x,e.y,e.r,e.rot); ctx.fill(); ctx.stroke(); }
    }
    // У PNG-врагов старый геометрический контур не рисуется даже для элиты и
    // попаданий: эти состояния показываются компактными ромбами над спрайтом.

    if (pass==='worldHud'){
    // Индикаторы состояний
    if (e.dots.fire.dps > 0 && !spriteDrawn){ ctx.strokeStyle = '#ff7a2f'; drawShape(e.t.shape,e.x,e.y,e.r+4,-e.rot); ctx.stroke(); }
    if (e.plague && !spriteDrawn){ ctx.strokeStyle = '#b6df55'; ctx.lineWidth = 2; drawShape(e.t.shape,e.x,e.y,e.r+9,e.rot); ctx.stroke(); }
    if (e.ail.chill  > 0){
      ctx.strokeStyle = '#7fd6ff';
      if (!spriteDrawn){ drawShape(e.t.shape,e.x,e.y,e.r+7,e.rot*0.5); ctx.stroke(); }
      // Радиус ауры виден, иначе игрок не поймёт, почему соседи вязнут
      ctx.globalAlpha = 0.13 + 0.07*Math.sin(G.time*3);
      ctx.beginPath(); ctx.arc(e.x, e.y, D.chillAuraR, 0, 6.29); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (e.frost){                                   // задетый аурой: бледная метка
      if (!spriteDrawn){ ctx.strokeStyle = '#7fd6ff'; ctx.globalAlpha = 0.4;
        drawShape(e.t.shape, e.x, e.y,e.r+5,-e.rot*0.5); ctx.stroke(); ctx.globalAlpha = 1; }
    }
    if (e.ail.shock  > 0 && !spriteDrawn){ ctx.strokeStyle = '#ffe14a'; ctx.beginPath(); ctx.arc(e.x,e.y,e.r+10,0,6.29); ctx.stroke(); }
    if (e.ail.freeze > 0 && !spriteDrawn){ ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; drawPoly(e.x,e.y,e.r+5,6,0.4); ctx.stroke(); }
    // Счётчики стаков: огонь, яд, кровь
    const st = [];
    if (e.dots.fire.n   >= 0.5) st.push(['\u25C6' + Math.round(e.dots.fire.n),   '#ff7a2f']);
    if (e.dots.poison.n >= 0.5) st.push(['\u2620' + Math.round(e.dots.poison.n), '#8be04e']);
    if (e.dots.bleed.n  >= 0.5) st.push(['\u2716' + Math.round(e.dots.bleed.n),  '#e0405a']);
    if (st.length){
      ctx.font = 'bold 13px ui-monospace,monospace'; ctx.textAlign = 'center';
      st.forEach(([txt,col], si) => {
        ctx.fillStyle = col;
        ctx.fillText(txt, e.x + (si - (st.length-1)/2)*22, e.y + e.r + 13);
      });
    }
    }

    // Пачка: кольцо в цвет группы и метки ролей. Кольцами каждый аффикс
    // не показать — их бывает десять, поэтому список висит на панели внизу.
    if (e.pack){
      if (pass==='worldHud' && !spriteDrawn){ ctx.strokeStyle = e.pack.col; ctx.lineWidth = 2;
        ctx.globalAlpha = 0.75; ctx.beginPath(); ctx.arc(e.x, e.y, e.r+6, 0, 6.29); ctx.stroke();
        ctx.globalAlpha = 1; }
      if (e.roles.length){
        // Круги ролей рисуем по земле: игроку нужно видеть их границы, а не догадываться
        const bc = e.roles.indexOf('beacon')  >= 0 ? 180 : 0;
        const sc = e.roles.indexOf('circle')  >= 0 ? 150 : 0;
        if (pass==='telegraphs'){
          ctx.globalAlpha=0.10+0.05*Math.sin(G.time*3);
          if (bc){ ctx.strokeStyle='#ffe14a'; ctx.beginPath(); ctx.arc(e.x,e.y,bc,0,6.29); ctx.stroke(); }
          if (sc){ ctx.strokeStyle='#6fd98f'; ctx.beginPath(); ctx.arc(e.x,e.y,sc,0,6.29); ctx.stroke(); }
          ctx.globalAlpha=1;
        }
        if (pass==='worldHud'){
          const marks=e.roles.map(rl=>{ const a=PACK_AFFIXES.find(x=>x.role===rl); return a?[a.mark,a.col]:null; }).filter(Boolean);
          ctx.font='bold 15px ui-monospace,monospace'; ctx.textAlign='center';
          marks.forEach(([mk,col],mi)=>{ ctx.fillStyle=col; ctx.fillText(mk,e.x+(mi-(marks.length-1)/2)*16,e.y-e.r-13); });
        }
      }
      if (pass==='telegraphs' && e.jumpTo && e.jumpT > 0){ // замах прыжка: видно, что сейчас прыгнет
        drawTelegraph({shape:'target',kind:'warning',x:e.jumpTo.x,y:e.jumpTo.y,r:54,remaining:e.jumpT,total:0.5});
      }
    }
    if (pass==='worldHud' && e.rage > 0){             // разогнан мстителями
      if (!spriteDrawn){ ctx.strokeStyle = '#ffd24a'; ctx.globalAlpha = 0.5;
        drawShape(e.t.shape, e.x, e.y,e.r+3,-e.rot); ctx.stroke(); ctx.globalAlpha = 1; }
    }
    if (pass==='worldHud' && spriteDrawn) drawEnemySpriteMarks(e);

    // Аффиксы мини-босса: по кольцу на каждый, плюс телеграф тарана
    if (e.aff.length){
      const puls = 0.6 + 0.4*Math.sin(G.time*4);
      if (pass==='worldHud') e.aff.forEach((a, ai) => {
        ctx.strokeStyle = a.id === 'ward' ? e.wardCol : a.col;
        ctx.globalAlpha = puls; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 11 + ai*6, 0, 6.29); ctx.stroke();
        ctx.globalAlpha = 1;
      });
      if (pass==='telegraphs' && e.affT.warn > 0){ // замах тарана: линия по будущей траектории
        drawTelegraph({shape:'corridor',kind:'damage',x:e.x,y:e.y,
          x2:e.x+Math.cos(e.affT.ca)*430,y2:e.y+Math.sin(e.affT.ca)*430,width:e.r*2+12,
          remaining:e.affT.warn,total:0.7});
      }
    }

    // Боссовое здоровье живёт только в верхнем Boss HUD; рядовым оставляем мини-бар.
    if (pass==='worldHud' && e.kind !== 'boss' && e.hp < e.maxHp){
      const w = e.r*2, hpw = w * clamp(e.hp/e.maxHp,0,1), top = enemyVisualTop(e);
      ctx.fillStyle = '#000a'; ctx.fillRect(e.x-w/2, e.y-top-9, w, 3);
      ctx.fillStyle = '#e0405a'; ctx.fillRect(e.x-w/2, e.y-top-9, hpw, 3);
    }
    // При нескольких боссах фигура связывает модель с её верхним HP-баром.
    const bossHudSlot=pass==='worldHud' && BOSS_HUD_COUNT>1 ? bossHudTargetSlot(e) : -1;
    if (bossHudSlot>=0){
      const top = enemyVisualTop(e);
      drawBossHudMarker(e.x,e.y-top-18,bossHudSlot,6);
    }
  }
  }

  // Снаряды врагов: уникальные атаки боссов читаются по форме и цвету.
  if (pass==='itemsProjectiles'){
  const shooterProjectileFrame = Math.floor(G.time*10) % 4;
  for (const s of G.eshots){
    ctx.save(); ctx.translate(s.x,s.y);
    if (drawEnemyProjectileSprite(s, shooterProjectileFrame)){
      // Один drawImage 8×8→12×12 заменяет процедурный розовый круг Призмы.
    } else if (s.shotType === 'axe'){
      ctx.rotate(s.spin||0); ctx.fillStyle='#9f3529'; ctx.strokeStyle='#ffd0b8'; ctx.lineWidth=2;
      ctx.beginPath();
      for (let k=0;k<8;k++){
        const a=k*Math.PI/4, rr=k%2?11:27;
        const x=Math.cos(a)*rr,y=Math.sin(a)*rr;
        if (!k) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#3d2924'; ctx.fillRect(-5,-18,10,36);
    } else if (s.shotType === 'eliteFireball'){
      const pulse=0.82+0.18*Math.sin(G.time*24);
      ctx.globalAlpha=0.35; ctx.fillStyle='#ff2e12'; ctx.beginPath(); ctx.arc(0,0,10*pulse,0,6.29); ctx.fill();
      ctx.globalAlpha=1; ctx.fillStyle='#ff7a1f'; ctx.beginPath(); ctx.arc(0,0,6*pulse,0,6.29); ctx.fill();
      ctx.fillStyle='#fff1a8'; ctx.beginPath(); ctx.arc(-1,-1,2.4,0,6.29); ctx.fill();
    } else if (s.shotType === 'eliteBolt'){
      ctx.rotate(Math.atan2(s.vy,s.vx)); ctx.fillStyle='#c9b080'; ctx.strokeStyle='#fff2cf'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(12,0); ctx.lineTo(3,-3); ctx.lineTo(-10,-2); ctx.lineTo(-10,2); ctx.lineTo(3,3); ctx.closePath(); ctx.fill(); ctx.stroke();
    } else if (s.shotType === 'spear'){
      ctx.rotate(Math.atan2(s.vy,s.vx)); ctx.fillStyle = s.col || '#e6a52d'; ctx.strokeStyle = '#fff1a8'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(30,0); ctx.lineTo(8,-8); ctx.lineTo(-25,-5); ctx.lineTo(-25,5); ctx.lineTo(8,8); ctx.closePath(); ctx.fill(); ctx.stroke();
    } else if (s.shotType === 'minotaurSpear'){
      ctx.rotate(Math.atan2(s.vy,s.vx)); ctx.fillStyle='#8b4d2c'; ctx.strokeStyle='#e8a65d'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(24,0); ctx.lineTo(6,-11); ctx.lineTo(-20,-5); ctx.lineTo(-12,0); ctx.lineTo(-20,5); ctx.lineTo(6,11); ctx.closePath(); ctx.fill(); ctx.stroke();
    } else {
      ctx.fillStyle = s.col || '#d95ec2'; ctx.strokeStyle = s.shotType === 'lich' ? '#bffff8' : '#d8ff76'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0,0,s.r,0,6.29); ctx.fill();
      if (s.shotType) ctx.stroke();
    }
    ctx.restore();
  }

  // Снаряды игрока: общий кадр сферы вычисляется один раз на весь render-pass.
  const mageProjectileFrame = Math.floor(G.time*10)%4;
  for (const s of G.shots){
    drawAcceleratedArrowTrail(s);
    if (!drawPlayerProjectileSprite(s,mageProjectileFrame)){
      ctx.fillStyle = s.orb ? (remoteOrbActive(s)?'#b56cff':'#5ec2e0') : '#ffb340';
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.29); ctx.fill();
    }
  }
  }

  // Эффекты
  if (pass==='impactEffects'){
  for (const trace of G.arcaneTraces){
    const fade=clamp(trace.life/trace.max,0,1);
    ctx.globalAlpha=0.10+fade*0.16; ctx.fillStyle='#b56cff';
    ctx.beginPath(); ctx.arc(trace.x,trace.y,trace.r,0,6.29); ctx.fill();
    ctx.globalAlpha=0.25+fade*0.45; ctx.strokeStyle='#d7a7ff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(trace.x,trace.y,trace.r,0,6.29); ctx.stroke();
    ctx.globalAlpha=1;
  }
  for (const f of G.fx){
    if (f.t === 'telegraphTrace'){
      drawTelegraphTrace(f);
    } else if (f.t === 'bolt'){
      ctx.strokeStyle = '#ffe14a'; ctx.globalAlpha = clamp(f.life*5,0,1); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(f.x, f.y);
      const seg = 5;                                       // ломаем линию, чтобы читалась как разряд
      for (let k = 1; k <= seg; k++){
        const t2 = k/seg, jitter = k === seg ? 0 : 12;
        ctx.lineTo(f.x + (f.x2-f.x)*t2 + rnd(-jitter,jitter),
                   f.y + (f.y2-f.y)*t2 + rnd(-jitter,jitter));
      }
      ctx.stroke(); ctx.globalAlpha = 1;
    } else if (f.t === 'wave'){
      ctx.strokeStyle = f.col; ctx.globalAlpha = clamp(f.life*0.8, 0, 0.9); ctx.lineWidth = 9;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.29); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (f.t === 'ring'){
      ctx.strokeStyle = f.col; ctx.globalAlpha = clamp(f.life*3,0,1); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,6.29); ctx.stroke(); ctx.globalAlpha = 1;
    } else if (f.t === 'arc'){
      ctx.strokeStyle = f.col || '#ffb340'; ctx.globalAlpha = clamp(f.life*7,0,1); ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(f.x,f.y,f.r,f.a-f.arc/2,f.a+f.arc/2); ctx.stroke(); ctx.globalAlpha = 1;
    } else if (f.t === 'cross'){
      ctx.strokeStyle=f.col; ctx.globalAlpha=clamp(f.life*4,0,1); ctx.lineWidth=12;
      ctx.beginPath(); ctx.moveTo(f.x-f.r,f.y); ctx.lineTo(f.x+f.r,f.y);
      ctx.moveTo(f.x,f.y-f.r); ctx.lineTo(f.x,f.y+f.r); ctx.stroke(); ctx.globalAlpha=1;
    } else if (f.t === 'judgment'){
      ctx.fillStyle=f.col; ctx.globalAlpha=clamp(f.life*3,0,0.75);
      ctx.fillRect(f.x-18,f.y-280,36,280); ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,6.29); ctx.fill(); ctx.globalAlpha=1;
    }
  }
  }

  if (pass==='combatText'){
  for (const f of G.fx){
    if (f.t === 'hurtNum' || f.t === 'healNum'){
      ctx.globalAlpha=clamp(f.life/(f.max||0.4)*1.5,0,1);
      ctx.font='bold 23px ui-monospace,monospace'; ctx.textAlign='center';
      const healing=f.t==='healNum';
      ctx.lineWidth=4; ctx.strokeStyle=healing?'#06260d':'#250108'; ctx.strokeText(f.v,f.x,f.y);
      ctx.fillStyle=healing?'#53e36f':'#ff304f'; ctx.fillText(f.v,f.x,f.y); ctx.globalAlpha=1;
    } else if (f.t === 'num'){
      ctx.globalAlpha = clamp(f.life*2,0,1);
      ctx.fillStyle = f.col || (f.crit ? '#ffd24a' : '#e8eef5');
      ctx.font = (f.crit ? 'bold 19px ' : 'bold 15px ') + 'ui-monospace,monospace';
      ctx.textAlign = 'center'; ctx.fillText(f.v, f.x, f.y); ctx.globalAlpha = 1;
    } else if (f.t === 'txt'){
      ctx.globalAlpha = clamp(f.life*2.5,0,1); ctx.fillStyle = f.col;
      ctx.font = 'bold 17px ui-monospace,monospace'; ctx.textAlign = 'center';
      ctx.fillText(f.s, f.x, f.y); ctx.globalAlpha = 1;
    }
  }
  }

  // Частицы: рисуем квадратами по целым координатам — отсюда «пиксельность»
  if (pass==='impactEffects'){
  for (const q of G.parts){
    ctx.globalAlpha = clamp(q.life/q.max, 0, 1);
    ctx.fillStyle = q.col;
    ctx.fillRect(Math.round(q.x), Math.round(q.y), q.sz, q.sz);
  }
  ctx.globalAlpha = 1;
  }

  // Круговые орбы
  if (pass==='itemsProjectiles' && D.orbitN){
    const size = ORBIT_SIZE * D.projSize;
    ctx.strokeStyle = '#6fb3ff22'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(p.x, p.y, ORBIT_R*D.aoeR, 0, 6.29); ctx.stroke();
    for (let i = 0; i < D.orbitN; i++){
      const o = orbitPos(i);
      ctx.fillStyle = '#6fb3ff44'; ctx.strokeStyle = '#6fb3ff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(o.x, o.y, size, 0, 6.29); ctx.fill(); ctx.stroke();
    }
  }

  // Свита: костяные треугольники с ниткой к хозяину
  if (pass==='entities' || pass==='worldHud'){
  for (const m of G.minions){
    const K = MKIND[m.kind], golem = m.kind.startsWith('golem');
    // Хитбокс механики остаётся m.r, но обычный приспешник рисуется 12×12.
    const visualR = golem ? (m.kind === 'golemB' ? 12 : 9) : 6;
    if (pass==='entities'){
    ctx.strokeStyle = K.col + '22'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(m.x,m.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    ctx.lineWidth = golem ? 3 : 2;
    ctx.strokeStyle = m.hit > 0 ? '#ffffff' : K.col;
    ctx.fillStyle = K.col + (golem ? '33' : '22');
    drawPoly(m.x, m.y, visualR, K.sides, m.rot); ctx.fill(); ctx.stroke();
    }
    if (pass==='worldHud'){
    // КРОВНЫЕ УЗЫ: пока идёт ярость, свита в красном ореоле — игрок должен
    // видеть окно удвоенного урона, а не считать секунды в уме
    if (G.bloodT > 0){
      ctx.strokeStyle = '#ff2a2a';
      ctx.globalAlpha = 0.35 + 0.35*Math.min(1, G.bloodT/3) * (0.6 + 0.4*Math.sin(G.time*11));
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(m.x, m.y, visualR + 4, 0, 6.29); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (m.kind === 'golemB'){                       // метка провокации
      ctx.strokeStyle = K.col + '44'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(m.x, m.y, 34, 0, 6.29); ctx.stroke();
    }
    if (m.hp < m.max){
      const w = visualR*2;
      ctx.fillStyle = '#000a'; ctx.fillRect(m.x-w/2, m.y-visualR-7, w, 2);
      ctx.fillStyle = K.col;   ctx.fillRect(m.x-w/2, m.y-visualR-7, w*clamp(m.hp/m.max,0,1), 2);
    }
    }
  }
  }

  // Отметка текущей цели — чтобы было видно, куда бьёт автоатака
  if (pass==='worldHud' && G.target){
    drawEnemyTargetMarker(G.target);
  }

  // Управление мышью: кольцо покоя вокруг игрока и метка курсора
  if (pass==='worldHud' && G.control === 'mouse'){
    const mwx = p.x + G.mouse.x - W/2, mwy = p.y + G.mouse.y - H/2;
    const inZone = Math.hypot(G.mouse.x - W/2, G.mouse.y - H/2) <= MOUSE_DEADZONE;
    ctx.strokeStyle = inZone ? '#ffb34066' : '#ffb34022'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(p.x, p.y, MOUSE_DEADZONE, 0, 6.29); ctx.stroke();
    ctx.strokeStyle = '#ffb340aa'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(mwx-7, mwy); ctx.lineTo(mwx+7, mwy);
    ctx.moveTo(mwx, mwy-7); ctx.lineTo(mwx, mwy+7); ctx.stroke();
  }

  // Копия от «Чёрного зеркала»: тот же силуэт, но полупрозрачный и фиолетовый
  if (pass==='entities' && G.clone){
    const c = G.clone;
    ctx.globalAlpha = 0.35 + 0.25*Math.sin(G.time*9);
    ctx.strokeStyle = '#c08cff'; ctx.fillStyle = '#c08cff22'; ctx.lineWidth = 3;
    drawPoly(c.x, c.y, p.r, 4, 0.785); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(c.x, c.y);
    ctx.lineTo(c.x + Math.cos(c.aim)*(p.r+11), c.y + Math.sin(c.aim)*(p.r+11)); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // Барьер «Талисмана покоя»: толщина кольца показывает остаток
  if (pass==='worldHud' && totalPlayerBarrier(p) > 0){
    ctx.strokeStyle = '#5ec2e0'; ctx.globalAlpha = 0.75;
    ctx.lineWidth = 2 + 4*clamp(totalPlayerBarrier(p)/(D.life*0.12), 0, 1);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r+9, 0, 6.29); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // Щит УЖАСАЮЩЕГО ВАМПИРА: красное кольцо становится толще по мере наполнения.
  if (pass==='worldHud' && p.dreadShield > 0){
    ctx.strokeStyle = '#cf2135'; ctx.globalAlpha = 0.82;
    ctx.lineWidth = 2 + 5*clamp(p.dreadShield/(D.life*DREAD_SHIELD_CAP), 0, 1);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r+16, 0, 6.29); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // Заряд «Сердца голема» готов — тусклое серое кольцо
  if (pass==='worldHud' && amu('golem') && G.amuT.golem <= 0){
    ctx.strokeStyle = '#9aa7b4'; ctx.globalAlpha = 0.5; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r+14, 0, 6.29); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  if (pass==='worldHud' && p.bossSlowT > 0){
    ctx.strokeStyle='#c56a52'; ctx.globalAlpha=0.7; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r+12+2*Math.sin(G.time*10),0,6.29); ctx.stroke(); ctx.globalAlpha=1;
  }
  if (pass==='worldHud' && p.bossBurnT > 0){
    ctx.strokeStyle='#ff5a28'; ctx.globalAlpha=0.65+0.25*Math.sin(G.time*16); ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r+7,0,6.29); ctx.stroke(); ctx.globalAlpha=1;
  }
  if (pass==='worldHud' && p.elitePoisonT > 0){
    ctx.strokeStyle='#8bd346'; ctx.globalAlpha=0.72; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r+18,0,Math.PI*2*clamp(p.elitePoisonT/4,0,1)); ctx.stroke();
    ctx.globalAlpha=1; ctx.fillStyle='#b9ee72'; ctx.font='bold 9px ui-monospace,monospace';
    ctx.textAlign='center'; ctx.fillText('×'+p.elitePoisonStacks,p.x,p.y+p.r+23);
  }
  if (pass==='worldHud' && p.eliteCutT > 0){
    ctx.strokeStyle='#ef5b62'; ctx.globalAlpha=0.78; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r+14,-Math.PI/2,-Math.PI/2+Math.PI*2*clamp(p.eliteCutT/4,0,1)); ctx.stroke();
    ctx.globalAlpha=1;
  }
  if (pass==='worldHud' && p.elitePyroBurnT > 0){
    ctx.strokeStyle='#ff8a32'; ctx.globalAlpha=0.72+0.20*Math.sin(G.time*18); ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r+10,-Math.PI/2,-Math.PI/2+Math.PI*2*clamp(p.elitePyroBurnT/4,0,1)); ctx.stroke(); ctx.globalAlpha=1;
  }
  if (pass==='worldHud' && p.eliteAbyssBurnT > 0){
    ctx.strokeStyle='#ff3b20'; ctx.globalAlpha=0.78; ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r+7,-Math.PI/2,-Math.PI/2+Math.PI*2*clamp(p.eliteAbyssBurnT,0,1)); ctx.stroke(); ctx.globalAlpha=1;
  }
  if (pass==='worldHud' && p.eliteGuardSlowT > 0){
    ctx.strokeStyle='#9aa7b4'; ctx.globalAlpha=0.76; ctx.lineWidth=2+p.eliteGuardSlowStacks*0.25;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r+22,-Math.PI/2,-Math.PI/2+Math.PI*2*clamp(p.eliteGuardSlowT/6,0,1)); ctx.stroke();
    ctx.globalAlpha=1; ctx.fillStyle='#c4ccd4'; ctx.font='bold 9px ui-monospace,monospace'; ctx.textAlign='center';
    ctx.fillText('×'+p.eliteGuardSlowStacks,p.x,p.y+p.r+30);
  }

  if (pass==='entities') drawHero(p);
  if (pass==='worldHud') drawPlayerHealthBar(p);

  ctx.restore();
}

const $ = s => document.querySelector(s);
function totalPlayerBarrier(p){ return Math.max(0,p.barrier||0)+Math.max(0,p.reserveBarrier||0); }
function playerHealthText(p){
  const barrier=Math.ceil(totalPlayerBarrier(p));
  const shield=Math.ceil(Math.max(0,p.dreadShield||0));
  return Math.ceil(Math.max(0,p.hp))+' / '+Math.round(D.life)+
    (barrier?' +'+barrier+(LANGUAGE==='en'?' barrier':' барьер'):'')+
    (shield?' (+'+shield+(LANGUAGE==='en'?' shield)':' щита)'):'');
}
function nearbyWarriorEnemyCount(){
  if (!G || !G.player || !G.enemies) return 0;
  let n=0;
  for (const e of G.enemies) if (!e.dead && dist(e,G.player)<=300) n++;
  return n;
}
function nearbyDamageEnemyCount(from=G && G.player){
  if (!G || !from || !G.enemies) return 0;
  let n=0;
  for (const e of G.enemies) if (!e.dead && dist(e,from)<220 && ++n>=8) return 8;
  return n;
}
function activeCombatBuffs(p, nearby=nearbyWarriorEnemyCount(), damageNearby=nearbyDamageEnemyCount(p)){
  const buffs=[], bag=G && G.bag, stillPct=bag ? bag.sum('whStill') : 0,
    movingPct=bag ? bag.sum('whMove') : 0, perNear=bag ? bag.sum('perNear') : 0,
    recentKillPct=bag ? bag.sum('afterKill') : 0, rampPct=bag ? bag.sum('ramp') : 0;
  if (stillPct>0 && p.stillT>0.6) buffs.push(tr('Стоит на месте')+' - +'+stillPct+'% '+tr('урона'));
  if (movingPct>0 && p.moving) buffs.push(tr('В движении')+' - '+tr('урон')+' +'+movingPct+'%');
  if (perNear>0 && damageNearby>0) buffs.push(tr('Враги рядом')+' +'+Math.round(perNear*damageNearby)+'% '+tr('урона'));
  if (recentKillPct>0 && p.killT>0) buffs.push(tr('Недавнее убийство')+' - '+tr('урон')+' +'+recentKillPct+'% · '+impactNumber(Math.max(0,p.killT))+' '+tr('с осталось'));
  if (p.spdKill>0) buffs.push(tr('Недавнее убийство')+' +25% '+tr('скорости')+' - '+p.spdKill.toFixed(1)+' '+tr('секунд'));
  const momentumPct=momentumDamageInc(p);
  if (momentumPct>0) buffs.push(tr('Разгон')+' +'+momentumPct+'% '+tr('урона'));
  if (rampPct>0 && p.combatT>0) buffs.push(tr('Идёт бой')+' - '+tr('урон')+' +'+impactNumber(Math.min(40,rampPct*p.combatT))+'%');
  if (amu('critaim') && p.stillT>1) buffs.push(tr('Критический прицел')+' - +25% '+tr('к шансу критического удара'));
  if (D.steelCrowd>0) buffs.push(tr('Стальная толпа')+' +'+(D.steelCrowd*Math.min(6,nearby))+' '+tr('брони'));
  if (D.holdLine) buffs.push(tr('Глухая оборона')+' · '+tr('урон уменьшен на')+' '+(Math.min(5,nearby)*2)+'%');
  if (p.counterTempoT>0) buffs.push(tr('Ответный темп')+' +'+Math.round(p.counterTempoPct)+'% '+tr('скорости атаки')+' · '+p.counterTempoT.toFixed(1)+' '+tr('с осталось'));
  if (p.overheatedT>0) buffs.push(tr('Перегретая сфера')+' +'+Math.round(p.overheatedPct)+'% '+tr('скорости атаки')+' · '+p.overheatedT.toFixed(1)+' '+tr('секунд'));
  if (D.boneField>0) buffs.push(tr('Поле костей')+' +'+impactNumber(boneFieldDamageInc(p))+'% '+tr('урона свиты'));
  if (D.respite && !G.portal && p.respiteT>=4)
    buffs.push(tr('Передышка')+' - '+tr('восстановление 5% HP через')+' '+Math.max(0,p.respiteHealT).toFixed(1)+' '+tr('секунд'));
  if (D.criticalMass && !D.noCrit)
    buffs.push(tr('Критическая масса')+' - +'+Math.round(p.criticalMass||0)+'% '+tr('шанса критического удара'));
  if (p.reserveBarrier>0 && p.reserveBarrierT>0)
    buffs.push(tr('Запас прочности')+' - '+tr('барьер на')+' '+Math.ceil(p.reserveBarrier)+' HP - '+p.reserveBarrierT.toFixed(1)+' '+tr('секунд'));
  return buffs;
}

/* Статы, чей бонус доходит до свиты. Держать этот список руками приходится
   потому, что «доходит» означает разные вещи: одни статы входят в avgHit(),
   другие срабатывают внутри damage() на ударе приспешника, третьи (скорости)
   не меняют силу удара, а меняют их количество. Автоматически такое не выведешь.
   Каждая строка проверена замером удара приспешника — см. minallunit.js.
   ЧЕГО ЗДЕСЬ НЕТ И ПОЧЕМУ: вся защита (броня, уклонение, блок, реген,
   вампиризм) — свита считает живучесть только от D.minLife; геометрия снарядов
   (число, пробитие, отскок, дробовик) — у приспешников свои выстрелы; лут и
   опыт — это про хозяина. */
const MINION_STATS = new Set([
  // Урон и его проценты: удар свиты считается от avgHit(), туда входит всё это
  'dmg','dmgAoe','dmgProj','dmgMelee','lucky','pctHp','execute',
  'dFire','iFire','dCold','iCold','dLit','iLit','dPoi','iPoi',
  'dblHit','deadlyHit',
  // Статусы и эффекты — накладываются внутри damage() на ударе приспешника
  'igniteCh','chillCh','freeze','shockCh','tesla','poiCh','radiation','ailEff','ailDur',
  'knock','dizzy','stun','inferno',
  // Условные проценты; ближайшие враги считаются вокруг самого приспешника
  'vsLow','vsFull','vsBoss','vsSlowed','whMove','whStill','perNear','afterKill','ramp',
  // Криты: шанс наследуется целиком, множитель и надстройки общие
  'critCh','critMul','superCh','critWave','critLucky',
  // Скорости наследуются целиком
  'aspd','mspd',
  // Площадь: радиус взрыва приспешника при смерти и «Буйства демонов»
  'aoeR',
  // Снаряды охотников и колдунов: скорость, размер, пробитие и отскок — ваши
  'projSpd','pierce','chain',
  // Срабатывает на убийстве — неважно, чьём
  'explode','explodeMega','novaKill','novaKillStrong','overpressure','coldShatter','onKill',
  // Сужение разброса и «Радиус в урон» правят базу и D.incAll, а их свита читает
  'narrow','aoeToDmg',
  // Кейстоуны, идущие через общий множитель урона или через скорости
  'kGlass','kNoCrit','kHeavy','kFlurry','kAcro','kUnburd','kBond',
]);
/* Что уже накоплено по этому стату — чтобы игрок видел, к чему прибавляет.
   Читаем сумку напрямую: она и есть источник правды, никаких вторых счётчиков.
   Флаги пропускаем: у них нет «текущего значения», они либо взяты, либо нет,
   а взятые из раздачи и так вырезаны. */
function currentOf(m){
  if (m.kind === 'flag') return null;
  const e = G.bag.s[m.stat];
  if (!e) return m.kind === 'more' ? '×1.00' : '0';
  if (m.kind === 'more')   return '×' + e.more.toFixed(2);
  if (m.kind === 'inc')    return (e.inc ? '+' : '') + Math.round(e.inc) + '%';
  if (m.kind === 'chance') return Math.round(m.cap === undefined ? e.flat : Math.min(e.flat, m.cap)) + '%';
  return (e.flat ? '+' : '') + (e.flat < 10 ? +e.flat.toFixed(1) : Math.round(e.flat));
}

/* Числовой прогноз карточки для текущего билда. Это не второй калькулятор:
   на время создаём ровно тот же модификатор в сумке, запускаем канонический
   recalc(), снимаем показатели и полностью возвращаем прежнее состояние.
   Благодаря этому подсказка автоматически учитывает класс, уровень, магазин,
   книги, предметы, кейстоуны и уже выбранные карточки. */
function skillImpactSnapshot(m){
  const hit = attackAvgHit(), aps = 1/Math.max(0.0001,D.atkCd);
  const minionHit = avgHit() * (D.minDmgMul||0) * MINION_DAMAGE_MULT;
  const minionCount = Math.max(1, G.minions ? G.minions.length : 0);
  const stored = G.bag.s[m.stat];
  return {
    hit, aps, dps:hit*aps,
    projN:D.projN, volley:hit*D.projN, volleyDps:hit*aps*D.projN,
    minionHit, minionDps:minionHit*((D.minAspd||0)/0.5)*minionCount,
    life:D.life, regen:D.regen, armor:D.armor, dodge:D.dodge,
    leech:D.leechBase, critCh:D.critCh, critMul:D.critMul, mspd:D.mspd,
    pierce:D.pierce, chain:D.chain, ricochet:D.ricochet,
    projSpd:D.projSpd, projSize:(D.projSize-1)*100, arcanePull:D.arcanePull, aoeR:(D.aoeR-1)*100,
    arc:(D.arc-1)*100, orbitN:D.orbitN, orbitTouch:hit*0.25*D.orbitN,
    explode:D.explodeBase, dblHit:D.dblHit,
    igniteCh:D.igniteCh, chillCh:D.chillCh, shockCh:D.shockCh, poiCh:D.poiCh,
    knock:D.knock, stun:D.stun, superCh:D.superCh,
    xpGain:(D.xpGain-1)*100, goldFind:(D.goldFind-1)*100,
    minCount:D.minMax, minAspd:D.minAspd, minSpd:D.minSpd,
    pctHp:(stored && m.stat==='pctHp') ? stored.flat : G.bag.flat('pctHp'),
  };
}

function projectedSkillImpact(m, v){
  const b=G.bag, p=G.player, had=Object.prototype.hasOwnProperty.call(b.s,m.stat);
  const old=had ? {flat:b.s[m.stat].flat,inc:b.s[m.stat].inc,more:b.s[m.stat].more} : null;
  const playerState=p ? {hp:p.hp,dreadShield:p.dreadShield} : null;
  const before=skillImpactSnapshot(m); let after=before;
  try{
    b.add(m.stat,m.kind,v); recalc(); after=skillImpactSnapshot(m);
  } finally {
    if (had) b.s[m.stat]=old; else delete b.s[m.stat];
    recalc();
    if (p && playerState){ p.hp=playerState.hp; p.dreadShield=playerState.dreadShield; }
  }
  return {before,after};
}

const impactText=(ru,en)=>LANGUAGE==='en'?en:ru;
function impactRow(rows,key,ru,en,before,after,unit='',points=false){
  if (!Number.isFinite(before) || !Number.isFinite(after) || Math.abs(after-before)<1e-8) return;
  rows.push({key,label:impactText(ru,en),before,after,unit,points});
}

/* Структурированные строки вынесены отдельно от HTML: тесты проверяют сами
   числа, а не ищут удачную подстроку в разметке. */
function cardImpactData(m, card){
  const v=Number(card && card.v !== undefined ? card.v : 0), rows=[], notes=[];
  if (!Number.isFinite(v)) return {rows,notes};
  const conditional={
    vsLow:['conditionalHit','Средний удар по раненой цели','Average hit vs an Injured target',1],
    vsFull:['conditionalHit','Первый средний удар по полной цели','First average hit vs a Full-HP target',1],
    vsBoss:['conditionalHit','Средний удар по элите или боссу','Average hit vs an elite or boss',1],
    whMove:['conditionalHit','Средний удар в движении','Average hit while moving',1],
    whStill:['conditionalHit','Средний удар без движения','Average hit while stationary',1],
    afterKill:['conditionalHit','Средний удар в течение 1 сек после убийства','Average hit for 1 sec after a kill',1],
    perNear:['conditionalHit','Средний удар при 8 врагах рядом','Average hit with 8 nearby enemies',8],
    ramp:['conditionalHit','Средний удар через 10 сек боя','Average hit after 10 sec in combat',10],
  }[m.stat];
  if (conditional){
    const snap=skillImpactSnapshot(m), current=G.bag.sum(m.stat);
    let oldBonus=current*conditional[3], newBonus=(current+v)*conditional[3];
    if (m.stat==='ramp'){ oldBonus=Math.min(40,oldBonus); newBonus=Math.min(40,newBonus); }
    const normal=G.weapon.noAttack?snap.minionHit:snap.hit;
    const denom=1+D.incAll/100, raw=Math.abs(denom)>1e-8?normal/denom:normal;
    const oldHit=raw*(1+(D.incAll+oldBonus)/100), newHit=raw*(1+(D.incAll+newBonus)/100);
    impactRow(rows,conditional[0],conditional[1],conditional[2],oldHit,newHit,impactText(' урона',' damage'));
    notes.push(impactText('Показано при выполнении указанного условия; другие временные условия не добавлены.',
      'Shown while this condition is met; other temporary conditions are not included.'));
    notes.push(impactText('Это урон до брони и особых сопротивлений конкретного врага.',
      'This is damage before the specific enemy\'s Armor and special resistances.'));
    return {rows,notes};
  }

  const {before:a,after:z}=projectedSkillImpact(m,v);
  if (!G.weapon.noAttack){
    impactRow(rows,'hit','Средний урон одного попадания','Average damage per hit',a.hit,z.hit,impactText(' урона',' damage'));
    impactRow(rows,'dps','Ориентир урона/сек по одной цели','Single-target damage/sec estimate',a.dps,z.dps,impactText(' урона/с',' damage/sec'));
  }
  if (G.weapon.minions && (G.weapon.noAttack || m.req==='min' || affectsMinions(m))){
    impactRow(rows,'minionHit','Средний удар базового приспешника','Average basic minion hit',a.minionHit,z.minionHit,impactText(' урона',' damage'));
    impactRow(rows,'minionDps','Ориентир DPS текущей свиты','Current army DPS estimate',a.minionDps,z.minionDps,impactText(' урона/с',' damage/sec'));
  }
  if (m.stat==='projN'){
    impactRow(rows,'projectiles','Снарядов за атаку','Projectiles per attack',a.projN,z.projN);
    impactRow(rows,'volley','Максимальный урон залпа','Maximum volley damage',a.volley,z.volley,impactText(' урона',' damage'));
    notes.push(impactText('Урон залпа — максимум, если все снаряды попадут в одну цель.',
      'Volley damage is the maximum if every projectile hits one target.'));
  }
  if (m.stat==='dblHit'){
    const ad=a.dps*(1+0.6*a.dblHit/100), zd=z.dps*(1+0.6*z.dblHit/100);
    impactRow(rows,'doubleChance','Шанс второго попадания','Second-hit chance',a.dblHit,z.dblHit,'%',true);
    impactRow(rows,'doubleDps','Средний DPS с учётом второго удара','Average DPS including the second hit',ad,zd,impactText(' урона/с',' damage/sec'));
  }
  if (m.stat==='pctHp')
    impactRow(rows,'enemyHpBonus','Добавка за удар по врагу с 1000 max HP','Bonus per hit vs an enemy with 1,000 max HP',a.pctHp*10,z.pctHp*10,impactText(' урона',' damage'));
  if (m.stat==='orbit'){
    impactRow(rows,'orbits','Круговых орбов','Orbiting orbs',a.orbitN,z.orbitN);
    impactRow(rows,'orbitTouch','Суммарный урон касания всех орбов','Combined touch damage from all orbs',a.orbitTouch,z.orbitTouch,impactText(' урона',' damage'));
  }

  const stats={
    life:['life','Максимальное здоровье','Maximum Health',' HP',false],
    regen:['regen','Быстрое лечение','Quick Healing',impactText(' HP/с',' HP/sec'),false],
    armor:['armor','Броня','Armor','',false], dodge:['dodge','Шанс уклонения','Evasion Chance','%',true],
    leech:['leech','Вампиризм','Life Steal','%',true], critCh:['critCh','Шанс крита','Critical Hit Chance','%',true],
    critMul:['critMul','Урон критического удара','Critical Hit Damage','%',true],
    aspd:['aps','Атак в секунду','Attacks per second',impactText(' /с',' /sec'),false],
    mspd:['mspd','Скорость передвижения','Movement Speed','',false],
    pierce:['pierce','Целей пробивается насквозь','Targets pierced','',false],
    chain:['chain','Переходов на новую цель','Chains to another target','',false],
    ricochet:['ricochet','Осколков рикошета','Ricochet shards','',false],
    projSpd:['projSpd','Множитель скорости снаряда','Projectile Speed multiplier','×',false],
    arcanePull:['arcanePull','Сила арканного притяжения','Arcane Pull Strength','%',true],
    projSize:['projSize','Размер снаряда','Projectile Size','%',true], aoeR:['aoeR','Радиус области','Area Radius','%',true],
    arc:['arc','Ширина дуги удара','Cleave Arc width','%',true],
    explode:['explode','Шанс чумного взрыва','Corpse Plague Explosion chance','%',true],
    igniteCh:['igniteCh','Шанс поджога','Ignite Chance','%',true], chillCh:['chillCh','Шанс охлаждения','Chill Chance','%',true],
    shockCh:['shockCh','Шанс разряда','Lightning Discharge Chance','%',true], poiCh:['poiCh','Шанс отравления','Poison Chance','%',true],
    knock:['knock','Шанс отбрасывания','Knockback Chance','%',true], stun:['stun','Шанс оглушения','Stun Chance','%',true],
    superCh:['superCh','Шанс сверхкрита','Super-Crit Chance','%',true],
    xpGain:['xpGain','Бонус получаемого опыта','Experience Gain bonus','%',true], goldFind:['goldFind','Бонус находимого золота','Gold Find bonus','%',true],
    minCount:['minCount','Максимум приспешников','Maximum minions','',false], minSpd:['minSpd','Скорость свиты','Minion Movement Speed','',false],
  };
  const spec=stats[m.stat];
  if (spec) impactRow(rows,'stat:'+m.stat,spec[1],spec[2],a[spec[0]],z[spec[0]],spec[3],spec[4]);
  if (rows.length) notes.push(impactText(
    'Расчёт использует текущий билд и средний крит. Броня врага, промахи и особые сопротивления не учтены.',
    'Uses the current build and average Critical Hits. Enemy Armor, misses, and special resistances are not included.'));
  return {rows:rows.slice(0,5),notes:[...new Set(notes)]};
}

function impactNumber(v){
  const n=Math.abs(v)>=100?Math.round(v):Math.round(v*10)/10;
  return n.toLocaleString(LANGUAGE==='en'?'en-US':'ru-RU',{maximumFractionDigits:1});
}
function cardImpactPreview(m,card){
  const data=cardImpactData(m,card); if (!data.rows.length) return '';
  const rows=data.rows.map(r=>{
    const diff=r.after-r.before, sign=diff>0?'+':'', rel=Math.abs(r.before)>1e-8?diff/r.before*100:null;
    const delta=r.points
      ? sign+impactNumber(diff)+impactText(' п.п.',' pp')
      : sign+impactNumber(diff)+(rel===null?'':' ('+sign+impactNumber(rel)+'%)');
    return '<div class="tt-impact-row'+(diff<0?' loss':'')+'"><span>'+r.label+'</span><b>'+impactNumber(r.before)+r.unit+' → '+impactNumber(r.after)+r.unit+'</b><em>'+delta+'</em></div>';
  }).join('');
  return '<div class="tt-impact"><div class="tt-impact-head">'+impactText('ЕСЛИ ВЫБРАТЬ СЕЙЧАС','IF YOU PICK THIS NOW')+'</div>'+rows+
    data.notes.map(x=>'<div class="tt-impact-note">'+x+'</div>').join('')+'</div>';
}

/* Для процентного шанса крита одной подписи «+N%» недостаточно: игроку
   нужен итоговый фактический шанс прямо на карточке, без открытия тултипа. */
function cardInlineExample(m,card){
  if (!m || m.id!=='crit.chance_inc') return '';
  const chance=cardImpactData(m,card).rows.find(r=>r.key==='stat:critCh');
  if (!chance) return '';
  return '<div class="card-example"><b>'+impactText('ПРИМЕР','EXAMPLE')+'</b>'+
    impactNumber(chance.before)+'% '+impactText('крита','Crit')+' +'+Math.round(card.v)+'% = '+
    impactNumber(chance.after)+'% '+impactText('крита','Crit')+'</div>';
}

const affectsMinions = m => {
  if (!G.weapon.minions || m.req === 'min') return false;
  return MINION_STATS.has(m.stat);
};

  'shape.explode_mega':'<b>Требование:</b> открывается при 25% обычных чумных взрывов.<br><b>Когда срабатывает:</b> один из чумных взрывов становится мега-версией.<br><b>Эффект:</b> радиус заражения вдвое больше; сама чума остаётся прежней — 15% текущего HP в секунду в течение 3 секунд.',
  'shape.double_hit':'<b>Когда срабатывает:</b> при вашем успешном попадании.<br><b>Эффект:</b> с указанным шансом создаётся второе попадание по той же цели с силой 60% исходного.<br><b>Диапазон:</b> каждая карточка даёт случайно 5–15%.<br><b>Предел:</b> 25%; последняя карточка обрезается до остатка.',
  'shape.deadly_hit':'<b>Требование:</b> достигнуть предела 25% шанса двойного попадания.<br><b>Когда срабатывает:</b> при каждом фактическом ударе героя или свиты с шансом 1%.<br><b>Эффект:</b> отдельно снимает 25% от текущего HP цели после обычного урона.<br><b>Не срабатывает:</b> от DoT, чумы и луж.',
  'shape.shotgun':'<b>Требование:</b> не менее 5 дополнительных снарядов.<br><b>Эффект:</b> весь залп летит плотным пучком, а не широким веером.<br><b>Практически:</b> гораздо сильнее по одной крупной цели, но хуже покрывает толпу.',

function detailedSkillTip(m, card){

  if (/^dt\.(fire|cold|lightning|poison)\.flat$/.test(m.id)) return '<b>Условие появления:</b> сначала нужно взять хотя бы 1% шанса соответствующего статуса.<br><b>Что меняет:</b> добавляет <b>' + shown + '</b> плоского урона стихии к каждому подходящему попаданию.<br><b>Важно:</b> открытие только добавляет редкую синюю карточку в случайный пул и не гарантирует её в следующей раздаче.';
  if (/^dt\.(fire|cold|lightning|poison)\.inc$/.test(m.id)) return '<b>Условие появления:</b> сначала нужно взять хотя бы 1% шанса соответствующего статуса.<br><b>Что меняет:</b> усиливает весь урон этой стихии на <b>' + shown + '</b>.<br><b>Важно:</b> обычная карточка лишь открывается в случайном пуле и не выдаётся гарантированно.';
  if (m.id === 'ail.ignite.chance') return '<b>Когда проверяется:</b> при каждом подходящем попадании.<br><b>Эффект:</b> поджог наносит 20% полного удара в секунду в течение 3 секунд.<br><b>Предел:</b> одна карточка даёт 1–5 процентных пунктов; суммарный шанс не превышает 25%.';
