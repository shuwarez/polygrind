      // Не замахиваемся впустую по цели, до которой не дотянемся
      if (T.chg <= 0 && dist(e, tgt) < 540){ T.chg = 3.0; T.warn = 0.7; T.ca = Math.atan2(tgt.y-e.y, tgt.x-e.x); return true; }   // было 6.0
      if (T.chg <= 0) T.chg = 1.0;                          // цель далеко — пробуем снова через секунду
      return false;
    } },

  { id:'summon', nm:'зов', col:'#8be04e',
    nt:'раз в 6 сек поднимает свежих врагов вокруг себя',
    tick(e, dt, tgt, edmg){
      const T = e.affT;
      T.sum = (T.sum === undefined ? 4.0 : T.sum) - dt;
      if (T.sum > 0) return false;
      T.sum = 6.0;
      if (G.enemies.length > 30) return false;      // не заваливаем экран
      for (let i = 0; i < 3; i++){
        spawnEnemy();                               // добавляется в конец — обратный цикл его не заденет
        const n = G.enemies[G.enemies.length-1];
        const a = rnd(0, Math.PI*2);
        n.x = clamp(e.x + Math.cos(a)*rnd(50,90), -ARENA+40, ARENA-40);
        n.y = clamp(e.y + Math.sin(a)*rnd(50,90), -ARENA+40, ARENA-40);
        G.fx.push({t:'ring', x:n.x, y:n.y, r:4, max:34, life:0.3, col:'#8be04e'});
      }
      return false;
    } },

  { id:'banner', nm:'знамя', col:'#ffd24a',
    nt:'пока жив, вся комната на 30% быстрее и на 20% злее',
    /* Сам по себе ничего не делает — эффект читается один раз за кадр
       через G.banner в цикле врагов. Иначе пришлось бы искать босса на каждом. */
  },
];

/* Сколько аффиксов вешать: один с пятого этажа, два с пятнадцатого, три с тридцатого */
function affixCount(f){ return f >= 30 ? 3 : f >= 15 ? 2 : 1; }

function applyAffixes(e, f){
  const pool = BOSS_AFFIXES.slice();
  const n = Math.min(affixCount(f), pool.length);
  for (let i = 0; i < n; i++){
    const a = pool.splice(Math.floor(Math.random()*pool.length), 1)[0];
    e.aff.push(a);
    if (a.init) a.init(e);
  }
  // Имя собирается из меток, а не из прилагательных: «оберег огня» согласовать
  // с «Глыбой» по роду невозможно, а список меток читается одинаково для всех.
  const EL = {fire:'огня', cold:'льда', lit:'молний', poi:'яда'};
  e.affNm = e.aff.map(a => a.id === 'ward' ? 'оберег ' + EL[e.ward] : a.nm).join(' · ');
}

/* Общее снижение входящего урона у врага: обычная броня плюс панцирь.
   Вынесено отдельно, потому что путей урона два — игрок и свита. */
function mitigate(e, total){
  total *= 1 - e.armor/(e.armor + 60);
  if (e.bulwark) total *= total / (total + e.bulwark);
  return total;
}

/* Прогон аффиксов в кадре. true означает, что движение врага забрал аффикс. */
function tickAffixes(e, dt, tgt, edmg){
  let lock = false;
  for (const a of e.aff) if (a.tick && a.tick(e, dt, tgt, edmg)) lock = true;
  return lock;
}

function buildFloor(){
  const f = G.floor;
  G.enemies.length = 0; G.eshots.length = 0; G.portal = null;
  G.pools.length = 0;                                // лужи смолы не переносятся между этажами
  G.banner = false;
  G.spawnQueue = Math.round((7 + Math.floor(f*2.4)) * D.monsterMore);   // книга монстров густит волны
  if (f % 5 === 0) G.spawnQueue += 4;                // на «боссовых» этажах гуще
  G.spawnT = 0;
  if (f % 5 === 0){
    const b = spawnEnemy('boss');                    // босс появляется сразу
    // Игрок обязан узнать про аффиксы до того, как получит ими по лицу
    toast('ЭТАЖ ' + f + '  ·  БОСС  ·  ' + b.affNm);
  } else toast('ЭТАЖ ' + f);
}

/* Масштабирование сложности: бесконечное, но плавное */
const hpScale  = f => Math.pow(1.185, f-1);
const dmgScale = f => Math.pow(1.115, f-1);

function spawnEnemy(kind){
  const f = G.floor;
  let t, elite = false, boss = false;
  if (kind === 'boss'){ t = ETYPES.tank; boss = true; }
  else {
    const pool = ['blob','blob','runner'];
    if (f >= 2) pool.push('shooter');
    if (f >= 3) pool.push('tank','runner');
    t = ETYPES[pick(pool)];
    elite = f >= 3 && Math.random() < 0.10 + f*0.008;
  }
  // Спавн за краем экрана, но внутри арены
  const ang = rnd(0, Math.PI*2), rad = rnd(420, 700);
  const p = G.player;
  const e = {
    t, kind: boss?'boss':(elite?'elite':'norm'),
    x: clamp(p.x + Math.cos(ang)*rad, -ARENA+40, ARENA-40),
    y: clamp(p.y + Math.sin(ang)*rad, -ARENA+40, ARENA-40),
    r: t.r * (boss?2.6:elite?1.45:1),
    hp:0, maxHp:0, spd:0, dmg:0, xp:0,
    cd: rnd(0.5,2), rot: rnd(0,6.28), hit:0, kb:{x:0,y:0},
    ail:{chill:0, shock:0, stun:0, freeze:0, dizzy:0}, armor:0, infT:0,
    dots:{fire:{dps:0,n:0,dur:3}, poison:{dps:0,n:0,dur:4}, bleed:{dps:0,n:0,dur:6}},
    dotAcc:{fire:0, poison:0, bleed:0}, dotT:0, orbCd:0,
    aff:[], affT:{}, affNm:'', ward:null, wardCol:null, bulwark:0,   // аффиксы мини-босса
  };
  const mul = boss ? 14 : elite ? 3.2 : 1;
  e.maxHp = e.hp = Math.round(t.hp * mul * hpScale(f));
  e.spd = t.spd * (boss?1.15:elite?0.9:1);   // 0.55 давало 26 ед/сек против 235 у игрока — босс не догонял вообще
  e.dmg = t.dmg * (boss?1.9:elite?1.3:1) * dmgScale(f);
  e.xp  = Math.round(t.xp * (boss?18:elite?4:1) * (1 + f*0.12));
  e.armor = elite||boss ? 8 + f*1.5 : 0;
  if (boss) applyAffixes(e, f);          // аффиксы навешиваются после базовых чисел: панцирь режет уже готовое hp
  G.enemies.push(e);
  return e;
}

/* ---------- 6. НАНЕСЕНИЕ УРОНА ---------- */
/* Собирает все условные модификаторы в один процент и применяет формулу */
function conditionalInc(e){
  const b = G.bag, p = G.player; let inc = 0;
  if (e.hp / e.maxHp < 0.35) inc += b.sum('vsLow');
  if (e.hp >= e.maxHp)       inc += b.sum('vsFull');
  if (e.kind !== 'norm')     inc += b.sum('vsBoss');
  if (p.moving)              inc += b.sum('whMove');
  if (p.stillT > 0.6)        inc += b.sum('whStill');
  if (p.hp / D.life < 0.35)  inc += b.sum('whLow');
  if (p.killT > 0)           inc += b.sum('afterKill');
  const d = dist(p, e);
  if (d < 160) inc += b.sum('close');
  if (d > 330) inc += b.sum('far');
  const near = b.sum('perNear');
  if (near) inc += near * Math.min(8, G.enemies.filter(x => dist(x,p) < 220).length);
  const ramp = b.sum('ramp');
  if (ramp) inc += Math.min(40, ramp * p.combatT);
  return inc;
}

function damage(e, src){
  const b = G.bag, p = G.player;
  let base = rnd(D.baseMin, D.baseMax) * (src.mul || 1);
  if (b.has('lucky')) base = Math.max(base, rnd(D.baseMin, D.baseMax) * (src.mul||1));

  const el = D.elem;
  // ОБЕРЕГ: одна стихия срезается на 60% до всех умножений — то есть бьёт
  // ровно по флэту, который в этой системе и есть главный источник урона стихией
  const wd = e.ward ? 0.4 : 1;
  let total = (base
    + el.fire * (e.ward==='fire'?wd:1) + el.cold * (e.ward==='cold'?wd:1)
    + el.lit  * (e.ward==='lit' ?wd:1) + el.poi  * (e.ward==='poi' ?wd:1));
  total *= (1 + (D.incAll + conditionalInc(e))/100) * D.moreAll;

  // Крит: два ролла при crit.lucky, сверхкрит сверху
  let isCrit = false;
  if (D.critCh > 0){
    isCrit = Math.random()*100 < D.critCh;
    if (!isCrit && b.has('critLucky')) isCrit = Math.random()*100 < D.critCh;
  }
  if (isCrit){
    total *= D.critMul/100;
    if (Math.random()*100 < D.superCh){                          // СВЕРХКРИТ
      total *= 2;
      addBleed(e, total*0.03*D.ailEff);                          // 3% от удара в секунду, стакается
      burst(e.x, e.y, 8, '#e0405a', 200, 3, 0.5);
    }
    if (b.has('critWave')) nova(e.x, e.y, 90*D.aoeR, total*0.5, '#ffb340');
    if (D.onCrit) heal(D.onCrit);
  }
  // Урон в размере % от максимального HP цели — против «жирных»
  if (b.flat('pctHp')) total += e.maxHp * b.flat('pctHp')/100;
  // Шок увеличивает получаемый целью урон
  if (e.ail.shock > 0) total *= 1.30;
  // Охлаждение делает то же самое: раньше оно только замедляло, и вся ветка холода
  // была чистой утилитой при том, что заморозка открывается лишь на 100% охлаждения
  if (e.ail.chill > 0) total *= CHILL_TAKEN;
  // Броня и панцирь: единый путь снижения для игрока и свиты
  total = mitigate(e, total);

  applyDamage(e, total, isCrit);

  // Вампиризм и здоровье за попадание
  if (D.leech){                                                  // вампиризм: мгновенно или в пул
    const lv = total * D.leech/100;
    if (D.leechInstant) heal(lv); else p.leechPool = (p.leechPool||0) + lv;
  }
  if (D.onHit) heal(D.onHit);

  applyBookAilments(e, total);                                   // книги действуют на каждом ударе

  // Наложение негативных эффектов
  const roll = v => Math.random()*100 < v;
  if (roll(D.igniteCh)) addDot(e, 'fire', total*0.25*D.ailEff, 3*D.ailDur);
  if (roll(D.chillCh)){
    if (e.ail.chill <= 0) statusText(e, 'SLOWED', '#ffe14a');
    e.ail.chill = Math.max(e.ail.chill, 2.5*D.ailDur);
    if (D.freeze){                                                        // ЗАМОРОЗКА
      if (e.ail.freeze <= 0) statusText(e, 'FROZEN', '#7fd6ff');
      e.ail.freeze = Math.max(e.ail.freeze, 1.4*D.ailDur);
    }
  }
  if (roll(b.flat('shockCh'))){
    e.ail.shock = Math.max(e.ail.shock, 3*D.ailDur);
    shockBurst(e, total * SHOCK_SHARE * D.ailEff);        // разряд по округе
  }
  if (roll(D.poiCh))                                                      // РАДИАЦИЯ: двойной стак
    addDot(e, 'poison', total*0.15*D.ailEff*(D.radiation?2:1), 4*D.ailDur);
  if (roll(b.flat('stun')))  e.ail.stun = 0.7 * D.ailDur;   // единственный статус, ходивший мимо длительности
  if (roll(D.knock)){
    const a = Math.atan2(e.y-p.y, e.x-p.x); e.kb.x += Math.cos(a)*260; e.kb.y += Math.sin(a)*260;
    if (D.dizzy){                                                         // ГОЛОВОКРУЖЕНИЕ
      if (e.ail.dizzy <= 0) statusText(e, 'SLOWED', '#ffe14a');
      e.ail.dizzy = 2*D.ailDur;
    }
  }
  // Добивание: мгновенная смерть под порогом
  if (b.flat('execute') && e.kind==='norm' && e.hp/e.maxHp < b.flat('execute')/100) applyDamage(e, e.hp, false);
  // Двойное и тройное попадание
  if (!src.noDouble){
    if (Math.random()*100 < D.dblHit) damage(e, {mul:(src.mul||1)*0.6, noDouble:true});
    if (Math.random()*100 < D.triHit) damage(e, {mul:(src.mul||1)*0.4, noDouble:true});
  }
}

function applyDamage(e, amount, crit, silent){
  e.hp -= amount; if (!silent) e.hit = 0.12;
  if (!silent){
    G.fx.push({t:'num', x:e.x, y:e.y-e.r-6, v:Math.round(amount), life:0.65, crit});
    burst(e.x, e.y, crit ? 9 : 3, crit ? '#ffd24a' : e.t.col, crit ? 220 : 110, 3, 0.35);
  }
}

/* Шанс книги: 0.4% с рядового, впятеро с элиты, в сорок раз с мини-босса.
   Потолка тиров нет — на глубоких этажах книга продолжает расти. */
function tryDropBook(e){
  const mult = e.kind === 'boss' ? 40 : e.kind === 'elite' ? 5 : 1;
  if (Math.random()*100 >= 0.4 * mult) return;
  G.orbs.push({x:e.x, y:e.y, r:9, book:pick(BOOK_KEYS)});
}

function takeBook(key){
  const B = BOOKS[key], cur = G.items[key];
  const tier = cur ? cur.tier + 1 : 1;              // тиров бесконечно: дубликат всегда поднимает
  let val;
  if (tier <= B.tiers.length){                      // первые тиры берутся из таблицы
    const [lo, hi] = B.tiers[tier-1];
    val = lo === hi ? lo : Math.round(rnd(lo, hi));
    if (cur) val = Math.max(val, cur.val + 2);      // повышение обязано читаться
  } else {                                          // дальше растём шагом от достигнутого
    val = cur.val + Math.round(rnd(B.step[0], B.step[1]));
  }
  const prev = cur ? cur.val : 0;
  G.items[key] = {tier, val};
  recalc();
  const p = G.player;
  G.fx.push({t:'ring', x:p.x, y:p.y, r:10, max:160, life:0.6, col:B.col});
  burst(p.x, p.y, 50, B.col, 300, 5, 1.1);
  renderSheet();
  showBookModal(key, prev);
}

/* Сводка по всем книгам — что суммарно даёт коллекция */
function bookTotals(){
  const t = [];
  const bk = k => G.items[k] ? G.items[k].val : 0;
  if (bk('fire'))  t.push(['Флэт-урон огнём',  '+' + bk('fire')  + ' (в бою ' + D.elem.fire.toFixed(1) + ' после процентов)']);
  if (bk('cold'))  t.push(['Флэт-урон холодом','+' + bk('cold')  + ' (в бою ' + D.elem.cold.toFixed(1) + ')']);
  if (bk('poison'))t.push(['Отравление за прок', Math.round(D.bookPoiDps) + ' урона/сек, 3 сек']);
  if (bk('bleed')) t.push(['Кровотечение за прок', Math.round(bookBleedDps()) + ' урона/сек, 4 сек']);
  if (bk('monster'))t.push(['Плотность волн', '+' + bk('monster') + '% врагов']);
  if (bk('xp'))    t.push(['Получаемый опыт', '+' + bk('xp') + '%']);
  return t;
}

function showBookModal(key, prev){
  const B = BOOKS[key], it = G.items[key];
  const unit = (B.pct || key === 'monster' || key === 'xp') ? '%' : '';
  G.paused = true;                                    // игра замирает: находка важная
  const rows = bookTotals().map(([a,b2]) =>
    '<div class="row" style="font-size:17.5px"><span>' + a + '</span><b>' + b2 + '</b></div>').join('');
  $('#ov').style.display = 'flex';
  $('#ov').innerHTML =
    '<div style="font-size:80px;line-height:1;color:' + B.col + '">' + B.ico + '</div>' +
    '<h1 style="color:' + B.col + ';letter-spacing:4px">' + B.nm + '</h1>' +
    '<h2>тир ' + it.tier + (prev ? ' — повышена с +' + prev + unit : ' — первая находка') + '</h2>' +
    '<div style="max-width:620px;text-align:center;font-size:18.8px;line-height:1.6">' + B.desc.replace(/N/g, it.val + unit) + '</div>' +
    '<div style="display:flex;gap:34px;text-align:center">' +
      '<div><div class="k" style="font-size:15px">СИЛА</div>' +
        '<div style="font-size:37.5px;color:' + B.col + '">+' + it.val + unit + '</div>' +
        (prev ? '<div class="k" style="font-size:15px">было +' + prev + unit + '</div>' : '') + '</div>' +
      (B.proc ? '<div><div class="k" style="font-size:15px">ШАНС СРАБАТЫВАНИЯ</div>' +
        '<div style="font-size:37.5px;color:' + B.col + '">' + bookChance(key) + '%</div>' +
        '<div class="k" style="font-size:15px">' + (bookChance(key) >= 100 ? 'потолок достигнут' : '+10% за следующую') + '</div></div>' : '') +
    '</div>' +
    '<div style="width:min(620px,90vw);border-top:1px solid var(--line);padding-top:14px">' +
      '<div class="k" style="font-size:15px;letter-spacing:2px;margin-bottom:6px">ВСЕ КНИГИ СУММАРНО</div>' + rows + '</div>' +
    '<button id="bkok">ПРОДОЛЖИТЬ</button>';
  $('#bkok').onclick = () => {
    G.paused = false;
    $('#ov').style.display = 'none'; $('#ov').innerHTML = '';
    last = performance.now();
    if (G.pending) showLevelUp();                     // если параллельно ждал выбор карты
  };
}

function killEnemy(e, i){
  const b = G.bag, p = G.player;
  tryDropBook(e);
  G.orbs.push({x:e.x, y:e.y, v:e.xp, r:4});                       // сфера опыта
  // Золото: монеты падают отдельно от опыта, крупные враги роняют горстью
  const gv = (2 + G.floor*0.9) * (e.kind === 'boss' ? 22 : e.kind === 'elite' ? 4.5 : 1) * D.goldFind;
  const coins = e.kind === 'boss' ? 6 : e.kind === 'elite' ? 2 : 1;
  for (let ci = 0; ci < coins; ci++)
    G.orbs.push({x:e.x + rnd(-12,12), y:e.y + rnd(-12,12), v:Math.max(1, Math.round(gv/coins*rnd(0.75,1.3))), r:4, gold:true});
  if (D.hasMin){
    G.corpses.push({x:e.x, y:e.y, life:14, big:e.kind !== 'norm'}); // труп — ресурс для призыва
    if (Math.random()*100 < D.minOnKill) spawnMinion(e.x, e.y);     // min.summon_on_kill
  }
  if (D.onKill) heal(D.onKill);
  if (b.has('spdKill')) p.spdKill = 2;
  p.killT = 3;
  if (b.has('novaKill')) nova(e.x, e.y, 110*D.aoeR, avgHit()*0.6, '#ffb340');
  if (Math.random()*100 < D.explode){
    // Мега-взрыв — отдельный ролл поверх сработавшего обычного
    const mega = D.explodeMega > 0 && Math.random()*100 < D.explodeMega;
    const dmgV = avgHit() * (mega ? 1.6 : 0.8);
    const rad  = 105 * D.aoeR * (mega ? 2 : 1);
    nova(e.x, e.y, rad, dmgV, mega ? '#ff7a2f' : '#e0743c',
         mega ? {ignite: dmgV*0.35*D.ailEff} : null);
    if (mega){                                                  // отдельная подача: гуще и ярче
      G.fx.push({t:'ring', x:e.x, y:e.y, r:8, max:rad*0.6, life:0.4, col:'#ffd24a'});
      burst(e.x, e.y, 30, '#ff7a2f', 340, 5, 0.9);
      burst(e.x, e.y, 12, '#ffd24a', 260, 4, 0.7);
      G.fx.push({t:'shake', life:0.12});
    }
    if (b.has('kVolat') && dist(p,{x:e.x,y:e.y}) < rad) hurt(dmgV*0.35, true, true); // цена кейстоуна, но свиту не задевает
  }
  G.fx.push({t:'ring', x:e.x, y:e.y, r:e.r, max:e.r*2.4, life:0.3, col:e.t.col});
  // Смерть: тем крупнее враг — тем гуще брызги
  const grade = e.kind === 'boss' ? 3 : e.kind === 'elite' ? 1.7 : 1;
  burst(e.x, e.y, Math.round(14*grade), e.t.col, 190*grade, 4, 0.75);
  burst(e.x, e.y, Math.round(5*grade),  '#e8eef5', 120*grade, 3, 0.5);
  if (e.dots.fire.dps > 0) burst(e.x, e.y, 10, '#ff7a2f', 160, 3, 0.6);
  if (e.ail.chill  > 0) burst(e.x, e.y, 10, '#7fd6ff', 160, 3, 0.6);
  G.enemies.splice(i,1);
}

/* ---------- ЧАСТИЦЫ ----------
   Мелкие квадратные пиксели, разлетающиеся из точки. Живут недолго,
   тормозят трением и гаснут. Потолок в 700 штук держит кадр стабильным. */
function burst(x, y, n, col, spd, size, life){
  if (G.parts.length > 700) n = Math.min(n, 4);
  for (let i = 0; i < n; i++){
    const a = rnd(0, 6.283), v = rnd(spd*0.2, spd);
    G.parts.push({
      x: x + rnd(-3,3), y: y + rnd(-3,3),
      vx: Math.cos(a)*v, vy: Math.sin(a)*v,
      life: rnd(life*0.45, life), max: life,
      sz: rndi(2, size), col,
    });
  }
}

/* Шок бьёт молнией по округе: до 20 ближайших целей в радиусе 400
   получают долю от того удара, который наложил шок. */
const SHOCK_TARGETS = 20, SHOCK_RANGE = 400, SHOCK_SHARE = 0.20;
/* Аура охлаждения. Радиус намеренно маленький: она должна поощрять бой в толпе,
   а не замораживать комнату с одного прока. Замедление слабее прямого (20% против
   35%), и самого статуса аура НЕ накладывает — см. комментарий в цикле врагов. */
const CHILL_AURA_R = 96, CHILL_AURA_SLOW = 0.20, CHILL_TAKEN = 1.25;
function shockBurst(src, dmg){
  const list = [];
  for (const x of G.enemies){
    if (x === src) continue;
    const d = dist(x, src);
    if (d < SHOCK_RANGE) list.push([d, x]);
  }
  list.sort((a,b) => a[0]-b[0]);
  for (let i = 0; i < Math.min(SHOCK_TARGETS, list.length); i++){
    const t = list[i][1];
    applyDamage(t, dmg, false);
    G.fx.push({t:'bolt', x:src.x, y:src.y, x2:t.x, y2:t.y, life:0.2});
    burst(t.x, t.y, 3, '#ffe14a', 130, 3, 0.3);
  }
}

/* Волна урона по площади вокруг точки */
function nova(x, y, r, dmg, col, opt){
  G.fx.push({t:'ring', x, y, r:8, max:r, life:0.28, col});
  for (const e of G.enemies){
    if (dist(e,{x,y}) >= r + e.r) continue;
    applyDamage(e, dmg, false);
    if (opt && opt.ignite) addDot(e, 'fire', opt.ignite, 3*D.ailDur);   // мега-взрыв поджигает задетых
  }
}

function heal(v){ const p = G.player; p.hp = Math.min(D.life, p.hp + v); }

/* Всплывающее слово над врагом — статус должен читаться мгновенно */
function statusText(e, txt, col){
  G.fx.push({t:'txt', x:e.x, y:e.y - e.r - 14, s:txt, life:0.55, col});
}

/* Эффекты книг. Вызывается и из атак игрока, и из ударов свиты —
   книги работают на всех, как и задумано. */
function applyBookAilments(e, total){
  const it = G.items; if (!it) return;
  const proc = k => it[k] && Math.random()*100 < bookChance(k);
  if (proc('fire'))  addDot(e, 'fire', total * 0.20 * D.ailEff, 1.5 * D.ailDur);
  if (proc('poison')) addDot(e, 'poison', D.bookPoiDps, 3 * D.ailDur);
  if (proc('bleed'))  addDot(e, 'bleed', bookBleedDps(), 4 * D.ailDur);
  if (proc('cold')){
    if (e.ail.chill <= 0) statusText(e, 'SLOWED', '#ffe14a');
    e.ail.chill = Math.max(e.ail.chill, 1.0 * D.ailDur);
  }
}

/* ---------- УРОН СО ВРЕМЕНЕМ: СТАКИ ----------
   Каждое срабатывание добавляет свой урон в общий котёл, а котёл непрерывно
   утекает со скоростью dps/длительность. Математически это тождественно тому,
   как если бы каждый стак жил отдельным таймером и истекал сам, но стоит O(1)
   памяти вместо списка из сотен объектов.
   Установившийся уровень = частота проков x урон за прок x длительность. */
function addDot(e, type, dps, dur){
  // Оберег гасит и урон со временем своей стихии, иначе поджог обходил бы защиту
  if (e.ward && ((e.ward === 'fire' && type === 'fire') || (e.ward === 'poi' && type === 'poison')))
    dps *= 0.4;
  const d = e.dots[type];
  // Длительность у котла одна на всех, а базы у источников разные: поджог от
  // карточки горит 3 секунды, от книги огня — 1.5. Раньше здесь стояло d.dur = dur,
  // то есть длительность задавал последний прок, и слабый прок книги обрезал вдвое
  // весь котёл, накопленный карточкой (замер: −749 из 1500 от прока ценой в 1 урона).
  // Берём средневзвешенную по урону. Это не приближение: суммарный урон котла равен
  // dps × dur, и при таком слиянии он в точности равен сумме вкладов обоих проков.
  const tot = d.dps + dps;
  d.dur = tot > 0 ? (d.dps*d.dur + dps*dur) / tot : dur;
  d.dps = tot; d.n += 1;
}
/* Совместимость: кровотечение теперь просто один из типов DoT */
function addBleed(e, dps){ addDot(e, 'bleed', dps, 6 * D.ailDur); }

/* Виды приспешников. mode задаёт поведение, остальное — внешний вид. */
const MKIND = {
  skeleton:{nm:'Скелет',          sides:3, col:'#8fd4b0', mode:'melee'},
  hunter:  {nm:'Охотник',         sides:4, col:'#d4c98f', mode:'ranged'},
  warlock: {nm:'Колдун',          sides:5, col:'#b98fd4', mode:'caster'},
  golemB:  {nm:'Голем крови',     sides:6, col:'#d4506a', mode:'golemB'},
  golemN:  {nm:'Костяной голем',  sides:5, col:'#e6e2d6', mode:'golemN'},
};
const mCount = k => G.minions.reduce((n,m)=> n + (m.kind === k ? 1 : 0), 0);

/* Здоровье и размер зависят от вида: големы считаются от статов игрока напрямую */
function minionHp(kind){
  if (kind === 'golemB') return D.life * 0.05 * D.golemB;   // 10 уровней → 50% вашего HP
  if (kind === 'golemN') return D.life * 0.03 * D.golemN;
  if (kind === 'hunter') return D.minLife * 0.8;
  if (kind === 'warlock') return D.minLife * 0.7;
  return D.minLife;
}
function minionR(kind){
  return kind === 'golemB' ? 22 : kind === 'golemN' ? 17
       : kind === 'hunter' ? 10 : kind === 'warlock' ? 11 : (D.minTier ? 13 : 10);
}
/* Кого поднимать следующим. Големы идут первыми: каждый стоит до десяти карт,
   и держать их в конце очереди за восемнадцатью рядовыми — значит обесценить вложение. */
function needKind(){
  if (D.golemB > 0 && !mCount('golemB')) return 'golemB';
  if (D.golemN > 0 && !mCount('golemN')) return 'golemN';
  if (mCount('skeleton') < D.maxSkel) return 'skeleton';
  if (mCount('hunter')   < D.maxHunt) return 'hunter';
  if (mCount('warlock')  < D.maxWarl) return 'warlock';
  return null;
}

/* ---------- 6b. ПРИСПЕШНИКИ ----------
   Скелет — самостоятельная сущность: ищет ближайшего врага в радиусе,
   добегает и бьёт. Его урон считается от вашего среднего удара,
   поэтому вся прокачка урона косвенно усиливает и свиту.            */
function spawnMinion(x, y, kind){
  kind = kind || needKind();
  if (!kind) return false;
  const hp = minionHp(kind), px = x !== undefined ? x : G.player.x, py = y !== undefined ? y : G.player.y;
  G.minions.push({
    kind, x: px + rnd(-20,20), y: py + rnd(-20,20),
    r: minionR(kind), hp, max: hp,
    cd: rnd(0, 0.4), rot: rnd(0,6.28), hit:0, born:0,
  });
  G.fx.push({t:'ring', x:px, y:py, r:4, max:26, life:0.25, col:MKIND[kind].col});
  return true;
}

/* Урон приспешника: отдельный, более простой путь — без условных бонусов,
   но с учётом брони цели, шока и крита свиты. */
function minionHit(e, m){
  // Голем крови масштабируется от вас напрямую, остальные — через общий множитель свиты
  let v = m.kind === 'golemB' ? avgHit() * 0.08 * D.golemB : avgHit() * D.minDmgMul;
  if (Math.random()*100 < D.minCrit) v *= D.critMul/100;
  if (e.ail.shock > 0) v *= 1.30;
  if (e.ail.chill > 0) v *= CHILL_TAKEN;   // свита пользуется охлаждением наравне с хозяином
  v = mitigate(e, v);
  applyDamage(e, v, false);
  applyBookAilments(e, v);                           // свита тоже разносит эффекты книг
  if (D.minLeech) heal(v * D.minLeech/100);          // min.leech_to_owner
  if (m.kind === 'golemB'){                          // тяжёлый удар отбрасывает
    const a = Math.atan2(e.y-m.y, e.x-m.x);
    e.kb.x += Math.cos(a)*200; e.kb.y += Math.sin(a)*200;
    burst(e.x, e.y, 8, '#d4506a', 200, 4, 0.5);
  }
}

/* Костяной голем: прямого урона нет вовсе — только кровотечение,
   после чего он сразу уходит к следующей цели. Добить никого не может. */
function boneGolemHit(e){
  addBleed(e, avgHit() * 0.03 * D.golemN * D.ailEff);
  burst(e.x, e.y, 7, '#e0405a', 170, 3, 0.5);
}

/* Выстрел приспешника: тот же снаряд, что у игрока, но с урезанным множителем */
function minionShot(m, e, spell){
  const a = Math.atan2(e.y-m.y, e.x-m.x);
  G.shots.push({
    x:m.x, y:m.y, a,
    vx:Math.cos(a)*470, vy:Math.sin(a)*470,
    r: spell ? 7 : 4, life:1.1,
    pierce:D.pierce, chain:D.chain, ric:0, hitSet:[], orb:false,
    mul:0.20, pierced:0, spell,                       // 20% урона от вашего
  });
}

function killMinion(i){
  if (i < 0 || i >= G.minions.length) return;   // защита от индекса -1 у уже убитого
  const m = G.minions[i];
  if (D.minBoom) nova(m.x, m.y, 95*D.aoeR, avgHit()*D.minDmgMul*1.2, MKIND[m.kind].col);
  G.fx.push({t:'ring', x:m.x, y:m.y, r:m.r, max:m.r*2.2, life:0.25, col:MKIND[m.kind].col});
  burst(m.x, m.y, m.kind.startsWith('golem') ? 26 : 12, MKIND[m.kind].col, 190, 4, 0.7);
  G.minions.splice(i,1);
}

function hurt(v, ignoreDefense, selfBlast){
  const p = G.player, b = G.bag;
  if (p.inv > 0) return;                                          // i-frames рывка
  if (!ignoreDefense){
    if (Math.random()*100 < D.dodge){ G.fx.push({t:'txt',x:p.x,y:p.y-24,s:'уворот',life:.5,col:'#8be04e'}); return; }
    if (Math.random()*100 < D.block) v *= 0.35;
    v *= 1 - D.armor/(D.armor + 90);
    v = Math.max(1, v - D.drFlat);
    v *= 1 - D.dr/100;
  }
  // Ангел-хранитель: один раз в 25 секунд гасим смертельный удар
  if (p.hp - v <= 0 && b.flat('cheat') && p.cheatCd <= 0 && Math.random()*100 < b.flat('cheat')){
    p.cheatCd = 25; p.hp = D.life*0.35; p.inv = 1.2;
    G.fx.push({t:'txt', x:p.x, y:p.y-30, s:'СПАСЕНИЕ', life:1.2, col:'#ffb340'}); return;
  }
  // min.bond / кейстоун «Некромантская связь»: часть урона принимает свита.
  // Свой же взрыв трупа сюда не попадает: перекладывать его на скелетов значит
  // убивать собственную армию за то, что билд работает как задумано.
  if (D.minBond && G.minions.length && !selfBlast){
    const share = v * D.minBond/100; v -= share;
    const m = pick(G.minions); m.hp -= share; m.hit = 0.12;
    if (m.hp <= 0) killMinion(G.minions.indexOf(m));   // индекс проверяется внутри killMinion
  }
  p.hp -= v; p.combatT = Math.max(p.combatT, 0);
  if (b.flat('recoup')) p.recoup += v * b.flat('recoup')/100;     // возврат урона со временем
  if (b.has('retal')) nova(p.x, p.y, 130*D.aoeR, avgHit()*0.5, '#e0405a');
  G.fx.push({t:'shake', life:0.14});
  burst(p.x, p.y, 7, '#e0405a', 150, 3, 0.45);
  if (p.hp <= 0) gameOver();
}

/* ---------- 6c. КРУГОВЫЕ ОРБЫ ----------
   Орбы висят на общем кольце вокруг игрока и равномерно расставлены по нему.
   Урон идёт через обычный damage(), поэтому криты, стихии, книги и статусы
   работают на них так же, как на автоатаке. */
const ORBIT_R = 74, ORBIT_SIZE = 7, ORBIT_SPD = 1.7;

function orbitPos(i){
  const a = G.orbitA + i * Math.PI*2 / D.orbitN;
  const r = ORBIT_R * D.aoeR;                       // радиус кольца растёт от модификаторов области
  return {x: G.player.x + Math.cos(a)*r, y: G.player.y + Math.sin(a)*r};
}

function updateOrbits(dt){
  if (!D.orbitN) return;
  G.orbitA += ORBIT_SPD * dt;
  const size = ORBIT_SIZE * D.projSize;
  for (const e of G.enemies){
    e.orbCd -= dt;
    if (e.orbCd > 0) continue;                      // откат на цель, иначе орб бьёт 60 раз в секунду
    for (let i = 0; i < D.orbitN; i++){
      const o = orbitPos(i);
      if (dist(o, e) > e.r + size) continue;
      damage(e, {mul:0.15});                        // 15% от автоатаки со всеми модификаторами
      burst(o.x, o.y, 3, '#6fb3ff', 120, 3, 0.3);
      e.orbCd = 0.45;
      break;
    }
  }
}

/* ---------- 7. АТАКА ИГРОКА (автоматическая) ----------
   Игрок не целится и не жмёт кнопку: персонаж сам выбирает ближайшего врага
   в пределах дальности оружия и бьёт по готовности отката.
   Остаётся только позиционирование — то есть решение «куда встать», а не «куда кликнуть». */

/* Дальность автозахвата: ближний бой ограничен длиной дуги, дальний — полётом снаряда */
function attackRange(){
  const w = G.weapon;
  if (w.type === 'melee') return w.reach * D.arc;
  return w.type === 'orb' ? 430 : 520;
}

/* Ближайшая цель в радиусе. Расстояние меряем до края врага,
   иначе крупные боссы «не достаются» вплотную. */
function findTarget(range){
  const p = G.player;
  let best = null, bd = Infinity;
  for (const e of G.enemies){
    const d = dist(e,p) - e.r;
    if (d < range && d < bd){ bd = d; best = e; }
  }
  return best;
}

function attack(){
  const p = G.player, w = G.weapon;
  const ang = p.aim;                                              // направление задаёт автозахват
  p.atkCd = D.atkCd;

  if (w.type === 'melee'){
    const reach = w.reach * D.arc, arc = w.arc * D.arc;
    G.fx.push({t:'arc', x:p.x, y:p.y, a:ang, arc, r:reach, life:0.16});
    for (const e of G.enemies){
      if (dist(e,p) > reach + e.r) continue;
      let da = Math.atan2(e.y-p.y, e.x-p.x) - ang;
      da = Math.atan2(Math.sin(da), Math.cos(da));                 // нормализуем угол
      if (Math.abs(da) < arc/2) damage(e, {});
    }
  } else {
    const n = D.projN, spread = D.shotgun ? 0.035 : 0.16;   // дробовик стягивает залп в пучок
    for (let i = 0; i < n; i++){
      const a = ang + (i - (n-1)/2) * spread;
      G.shots.push({
        x:p.x, y:p.y, a,
        vx:Math.cos(a)*w.speed*D.projSpd, vy:Math.sin(a)*w.speed*D.projSpd,
        r:(w.type==='orb'?9:5) * D.projSize, life:w.life,
        pierce:D.pierce, chain:D.chain, ric:D.ricochet, hitSet:[], orb:w.type==='orb',
        mul:1, pierced:0,
      });
    }
  }
}

/* ---------- 8. ГЛАВНЫЙ ЦИКЛ ---------- */
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  if (G && !G.paused && !G.over && !G.pending) update(dt);
  if (G) render();
  requestAnimationFrame(loop);
}

function update(dt){
  const p = G.player, b = G.bag, k = G.keys;
  G.time += dt;

  /* --- Движение игрока: две схемы управления --- */
  let mx = 0, my = 0;
  if (G.control === 'mouse'){
    // Персонаж всё время бежит к курсору. Мёртвая зона вокруг него нужна,
    // чтобы можно было осознанно стоять на месте — иначе «стойка» недостижима,
    // а от неё зависит cond.while_still и прицельная стрельба.
    const dx = G.mouse.x - W/2, dy = G.mouse.y - H/2;
    const d = Math.hypot(dx, dy);
    if (d > MOUSE_DEADZONE){ mx = dx/d; my = dy/d; }
  } else {
    mx = (k['d']||k['arrowright']?1:0) - (k['a']||k['arrowleft']?1:0);
    my = (k['s']||k['arrowdown'] ?1:0) - (k['w']||k['arrowup']  ?1:0);
    const len = Math.hypot(mx,my) || 1; mx/=len; my/=len;
  }
  p.moving = (mx || my) !== 0;
  if (p.moving){ p.faceX = mx; p.faceY = my; }        // запоминаем направление для рывка
  p.stillT = p.moving ? 0 : p.stillT + dt;
  p.combatT = G.enemies.length ? p.combatT + dt : 0;
  p.killT = Math.max(0, p.killT - dt);
  p.cheatCd = Math.max(0, p.cheatCd - dt);
  p.healCd  = Math.max(0, p.healCd  - dt);
  p.spdKill = Math.max(0, (p.spdKill||0) - dt);

  let sp = D.mspd * (p.spdKill > 0 ? 1.4 : 1);
  if (p.dash > 0){
    sp *= 3.4; p.dash -= dt;
    if (!p.moving){ mx = p.faceX; my = p.faceY; }     // рывок с места — в последнюю сторону                                       // рывок = кратковременный разгон
    if (D.dashDmg) for (const e of G.enemies){                     // ТАРАННЫЙ РЫВОК
      if (p.dashHits.includes(e) || dist(e,p) > p.r + e.r + 12) continue;
      p.dashHits.push(e); damage(e, {mul:1.2}); e.ail.dizzy = 2*D.ailDur;
      burst(e.x, e.y, 6, '#ffb340', 200, 3, 0.4);
    }
  }
  p.inv = Math.max(0, p.inv - dt);
  p.dashCd = Math.max(0, p.dashCd - dt);
  if (p.dashN < D.dashMax && p.dashCd <= 0){ p.dashN++; p.dashCd = D.dashCd; }

  p.x = clamp(p.x + mx*sp*dt, -ARENA, ARENA);
  p.y = clamp(p.y + my*sp*dt, -ARENA, ARENA);

  /* --- Восстановление --- */
  if (D.regen) heal(D.regen * dt);
  if (p.leechPool > 0){                                            // вытягивание течёт ~2 сек
    const v = Math.min(p.leechPool, Math.max(6, p.leechPool*1.2) * dt);
    heal(v); p.leechPool -= v;
  }
  if (p.recoup > 0){ const v = Math.min(p.recoup, D.life*0.14*dt); heal(v); p.recoup -= v; }
  if (b.has('autoHeal') && p.hp/D.life < 0.3 && p.healCd <= 0){
    heal(D.life*0.25); p.healCd = 20;
    G.fx.push({t:'txt', x:p.x, y:p.y-30, s:'автолечение', life:1, col:'#4fd1c5'});
  }

  updateOrbits(dt);

  /* --- Атака --- */
  p.atkCd -= dt;
  G.target = findTarget(attackRange());                            // цель обновляем каждый кадр
  if (G.target){
    p.aim = Math.atan2(G.target.y - p.y, G.target.x - p.x);        // корпус доворачивается к цели
    if (p.atkCd <= 0) attack();
  }

  /* --- Появление врагов волнами --- */
  G.spawnT -= dt;
  if (G.spawnQueue > 0 && G.spawnT <= 0 && G.enemies.length < 46){
    const batch = Math.min(G.spawnQueue, rndi(2,4));
    for (let i = 0; i < batch; i++) spawnEnemy();
    G.spawnQueue -= batch;
    G.spawnT = Math.max(0.5, 2.2 - G.floor*0.05);
  }

  /* --- Логика врагов --- */
  const slowAura = b.has('slowAura');
  // Источники ауры охлаждения собираем один раз за кадр: перебирать всех врагов
  // на каждом враге — это n^2 по всей комнате, а охлаждённых обычно единицы
  const chillSrc = G.enemies.filter(x => x.ail.chill > 0);
  // ЗНАМЯ читаем один раз за кадр, а не на каждом враге
  G.banner = false;
  for (const x of G.enemies)
    if (x.kind === 'boss' && x.aff.length && x.aff.some(a => a.id === 'banner')){ G.banner = true; break; }
  for (let i = G.enemies.length-1; i >= 0; i--){
    const e = G.enemies[i];
    e.hit = Math.max(0, e.hit - dt); e.rot += dt*0.8;

    // Тики негативных эффектов
    for (const key in e.ail) if (e.ail[key] > 0) e.ail[key] -= dt;
    // Все три типа урона со временем тикают и утекают по одной формуле
    for (const type in e.dots){
      const d = e.dots[type];
      if (d.dps <= 0) continue;
      const v = d.dps * dt;
      applyDamage(e, v, false, true);
      e.dotAcc[type] += v;
      const k = Math.min(1, dt / d.dur);            // утечка стаков
      d.dps -= d.dps * k; d.n -= d.n * k;
      if (d.dps < 0.02){ d.dps = 0; d.n = 0; }
    }
    // Урон со временем копится и всплывает раз в 0.4 сек своим цветом:
    // огонь красным, яд зелёным, кровотечение багровым
    e.dotT -= dt;
    if (e.dotT <= 0){
      e.dotT = 0.4;
      const emit = (v, col, dx) => { if (v >= 1)
        G.fx.push({t:'num', x:e.x+dx, y:e.y-e.r-4, v:Math.round(v), life:0.7, col}); };
      emit(e.dotAcc.fire,  '#ff4a2f', -14);
      emit(e.dotAcc.poison,'#8be04e',  14);
      emit(e.dotAcc.bleed, '#e0405a',   0);
      e.dotAcc.fire = e.dotAcc.poison = e.dotAcc.bleed = 0;
    }
    // ИНФЕРНО: горящий враг раз в полсекунды поджигает соседей
    if (D.inferno && e.dots.fire.dps > 0){
      e.infT -= dt;
      if (e.infT <= 0){
        e.infT = 0.5;
        for (const o2 of G.enemies){
          if (o2 === e || o2.dots.fire.dps > 0) continue;
          if (dist(o2,e) > 110 + o2.r) continue;
          addDot(o2, 'fire', e.dots.fire.dps*0.5, 3*D.ailDur);
          burst(o2.x, o2.y, 4, '#ff7a2f', 90, 3, 0.4);
        }
      }
    }

    if (e.hp <= 0){ killEnemy(e, i); continue; }

    // Скорость с учётом охлаждения, ауры замедления и оглушения
    let spd = e.spd;
    // Под знаменем вся комната быстрее и злее — это и есть повод убивать босса первым
    const flag = G.banner && e.kind !== 'boss';
    if (flag) spd *= 1.30;
    const edmg = e.dmg * (flag ? 1.20 : 1);
    if (e.ail.chill > 0) spd *= 1 - 0.35*(1 + b.sum('slowMag')/100);
    // АУРА ОХЛАЖДЕНИЯ: соседи охлаждённого тоже вязнут.
    // Аура только замедляет и сам статус не накладывает. Если бы накладывала,
    // один прок расползся бы по всей комнате цепочкой (A морозит B, B морозит C),
    // и каждый враг получил бы +25% к принимаемому урону бесплатно и навсегда.
    e.frost = false;
    if (e.ail.chill <= 0 && chillSrc.length){
      for (const cs of chillSrc){
        if (cs === e || dist(cs, e) > CHILL_AURA_R + e.r) continue;
        e.frost = true; break;
      }
      if (e.frost) spd *= 1 - CHILL_AURA_SLOW*(1 + b.sum('slowMag')/100);
    }
    if (slowAura && dist(e,p) < 260) spd *= 0.75;
    if (e.ail.dizzy > 0) spd *= 0.5;                     // головокружение после отбрасывания
    if (e.ail.stun > 0 || e.ail.freeze > 0) spd = 0;      // оглушение и заморозка держат на месте

    // Выбор цели: свита перехватывает агро. С min.taunt радиус перехвата большой,
    // без него приспешники просто мешают телом на ближней дистанции.
    let tgt = p;
    if (G.minions.length){
      let best = null, bs = Infinity;
      for (const m of G.minions){
        const golem = m.kind === 'golemB';                    // у голема крови своя провокация
        const range = golem ? 430 : (D.minTaunt ? 340 : 120);
        const d = dist(m,e); if (d > range) continue;
        const score = d - (golem ? 250 : 0);                  // голем перетягивает на себя первым
        if (score < bs){ bs = score; best = m; }
      }
      if (best) tgt = best;
    }

    // Аффиксы работают до обычного шага: таран забирает движение себе
    const affLock = e.aff.length ? tickAffixes(e, dt, tgt, edmg) : false;

    const a = Math.atan2(tgt.y-e.y, tgt.x-e.x);
    if (affLock){ /* движением распоряжается аффикс */ }
    else if (e.t.ranged){
      // Стрелок держит дистанцию 260 и стреляет
      const d = dist(e,tgt);
      const dir = d > 300 ? 1 : d < 220 ? -1 : 0;
      e.x += Math.cos(a)*spd*dir*dt; e.y += Math.sin(a)*spd*dir*dt;
      e.cd -= dt;
      if (e.cd <= 0 && d < 460 && e.ail.stun <= 0){
        e.cd = 2.2;
        G.eshots.push({x:e.x, y:e.y, vx:Math.cos(a)*230, vy:Math.sin(a)*230, r:6, life:2.6, dmg:edmg*0.8});
      }
    } else {
      e.x += Math.cos(a)*spd*dt; e.y += Math.sin(a)*spd*dt;
    }
    // Отбрасывание затухает
    e.x += e.kb.x*dt; e.y += e.kb.y*dt;
    e.kb.x *= 0.86; e.kb.y *= 0.86;

    // Контактный урон по текущей цели
    if (dist(e,tgt) < e.r + tgt.r){
      e.cd2 = (e.cd2||0) - dt;
      if (e.cd2 <= 0){
        e.cd2 = 0.6;
        if (tgt === p){
          if (!(D.phasing && p.moving)) hurt(edmg);        // avo.phasing: в движении проходим насквозь
          if (D.reflect) applyDamage(e, edmg * D.reflect/100, false);
        }
        else {
          // Големы каменные: 60% входящего гасится. Иначе провокация их же и убивает.
          const mit = tgt.kind.startsWith('golem') ? 0.4 : 1;
          tgt.hp -= edmg * mit; tgt.hit = 0.12;
          if (tgt.hp <= 0) killMinion(G.minions.indexOf(tgt));
        }
        if (D.thorns) applyDamage(e, D.thorns, false);
      }
    }
  }

  /* --- Свита: трупы, подъём и бой --- */
  if (D.hasMin){
    for (let i = G.corpses.length-1; i >= 0; i--){
      G.corpses[i].life -= dt;
      if (G.corpses[i].life <= 0) G.corpses.splice(i,1);
    }
    // Пока свита неполная — поднимаем из ближайшего трупа, а без трупов ждём таймер
    if (needKind()){
      G.raiseT += dt;
      if (G.corpses.length && G.raiseT >= 0.4){
        const c = G.corpses.shift(); spawnMinion(c.x, c.y); G.raiseT = 0;
      } else {
        const k = needKind();
        const wait = k.startsWith('golem') ? D.minRevive*0.5 : D.minRevive;  // големы возвращаются вдвое быстрее
        if (G.raiseT >= wait){ spawnMinion(undefined, undefined, k); G.raiseT = 0; }
      }
    } else G.raiseT = 0;

    for (let i = G.minions.length-1; i >= 0; i--){
      const m = G.minions[i];
      m.hit = Math.max(0, m.hit - dt); m.rot += dt*2.4; m.cd -= dt; m.born += dt;
      const mode = MKIND[m.kind].mode;
      let best = null, bd = 430;
      if (mode === 'golemN'){
        // Костяной голем целится в того, у кого меньше всего стаков кровотечения:
        // так он сам собой перебегает от одного врага к другому, никого не добивая.
        let bs = Infinity;
        for (const e of G.enemies){
          const d = dist(e,m); if (d > 620) continue;
          const score = e.dots.bleed.n * 500 + d;
          if (score < bs){ bs = score; best = e; bd = d; }
        }
      } else {
        for (const e of G.enemies){ const d = dist(e,m); if (d < bd){ bd = d; best = e; } }
      }

      if (best && mode === 'ranged'){                        // ОХОТНИК: держит дистанцию и стреляет
        const want = 250, spd2 = D.minSpd;
        const a2 = Math.atan2(best.y-m.y, best.x-m.x);
        const dir = bd > want+40 ? 1 : bd < want-60 ? -1 : 0;
        m.x += Math.cos(a2)*spd2*dir*dt; m.y += Math.sin(a2)*spd2*dir*dt;
        if (m.cd <= 0 && bd < 460){ m.cd = 1.0 / D.minAspd; minionShot(m, best, null); }
      } else if (best && mode === 'caster'){                 // КОЛДУН: бьёт заклинанием со статусом
        const want = 290;
        const a2 = Math.atan2(best.y-m.y, best.x-m.x);
        const dir = bd > want+40 ? 1 : bd < want-60 ? -1 : 0;
        m.x += Math.cos(a2)*D.minSpd*dir*dt; m.y += Math.sin(a2)*D.minSpd*dir*dt;
        if (m.cd <= 0 && bd < 500){
          m.cd = 1.5 / D.minAspd;
          minionShot(m, best, pick(['fire','cold','poison']));
        }
      } else if (best){                                      // ближний бой: скелеты и големы
        const reach = m.r + best.r + 3;
        const slow = m.kind === 'golemB' ? 0.65 : m.kind === 'golemN' ? 1.25 : 1;
        if (bd > reach){
          const a2 = Math.atan2(best.y-m.y, best.x-m.x);
          m.x += Math.cos(a2)*D.minSpd*slow*dt; m.y += Math.sin(a2)*D.minSpd*slow*dt;
        } else if (m.cd <= 0){
          if (m.kind === 'golemB'){ m.cd = 1.6 / D.minAspd; minionHit(best, m); }
          else if (m.kind === 'golemN'){ m.cd = 0.55 / D.minAspd; boneGolemHit(best); }
          else { m.cd = 0.78 / D.minAspd; minionHit(best, m); }
        }
      } else {                                               // без врагов держатся у хозяина
        const d = dist(m,p);
        if (d > 74){
          const a2 = Math.atan2(p.y-m.y, p.x-m.x);
          m.x += Math.cos(a2)*D.minSpd*dt; m.y += Math.sin(a2)*D.minSpd*dt;
        }
      }
      if (m.hp <= 0) killMinion(i);
    }
  }

  /* --- Снаряды игрока --- */
  for (let i = G.shots.length-1; i >= 0; i--){
    const s = G.shots[i];
    s.life -= dt;
    // Самонаведение подкручивает вектор к ближайшей цели
    if (D.homing > 0){
      let best = null, bd = 400;
      for (const e of G.enemies){ const d = dist(e,s); if (d < bd){ bd = d; best = e; } }
      if (best){
        const ta = Math.atan2(best.y-s.y, best.x-s.x);
        const cur = Math.atan2(s.vy, s.vx);
        let da = Math.atan2(Math.sin(ta-cur), Math.cos(ta-cur));
        const na = cur + da * Math.min(1, D.homing*dt*4);
        const sp2 = Math.hypot(s.vx, s.vy);
        s.vx = Math.cos(na)*sp2; s.vy = Math.sin(na)*sp2;
      }
    }
    s.x += s.vx*dt; s.y += s.vy*dt;

    // Рикошет от границ арены
    if (s.ric > 0){
      if (Math.abs(s.x) > ARENA){ s.vx *= -1; s.ric--; }
      if (Math.abs(s.y) > ARENA){ s.vy *= -1; s.ric--; }
    }
    let dead = s.life <= 0 || Math.abs(s.x) > ARENA+50 || Math.abs(s.y) > ARENA+50;

    if (!dead) for (const e of G.enemies){
      if (s.hitSet.includes(e)) continue;
      if (dist(e,s) > e.r + s.r) continue;
      damage(e, {mul: s.mul * (D.pierceBonus ? 1 + 0.2*s.pierced : 1)});
      s.hitSet.push(e);
      if (s.spell){                                            // колдун кладёт статус гарантированно
        const base = avgHit() * 0.20;
        if (s.spell === 'fire'){ addDot(e, 'fire', base*0.25*D.ailEff, 3*D.ailDur);
                                 burst(e.x,e.y,5,'#ff7a2f',120,3,0.4); }
        if (s.spell === 'cold'){ if (e.ail.chill<=0) statusText(e,'SLOWED','#ffe14a'); e.ail.chill = 2.5*D.ailDur;
                                 if (D.freeze){ if(e.ail.freeze<=0) statusText(e,'FROZEN','#7fd6ff'); e.ail.freeze = Math.max(e.ail.freeze, 1.4*D.ailDur); }
                                 burst(e.x,e.y,5,'#7fd6ff',120,3,0.4); }
        if (s.spell === 'poison'){ addDot(e, 'poison', base*0.15*D.ailEff*(D.radiation?2:1), 4*D.ailDur);
                                   burst(e.x,e.y,5,'#8be04e',120,3,0.4); }
      }
      if (s.orb){ nova(s.x, s.y, G.weapon.aoe*D.aoeR, avgHit()*0.55, '#c08cff'); dead = true; break; }
      if (s.chain > 0){                                            // отскок на новую цель
        s.chain--;
        if (!D.chainKeep) s.mul *= 0.75;                           // без эко-отскоков урон затухает
        const next = G.enemies.filter(x => !s.hitSet.includes(x)).sort((a2,b2)=>dist(a2,s)-dist(b2,s))[0];
        if (next){ const na = Math.atan2(next.y-s.y, next.x-s.x), sp2 = Math.hypot(s.vx,s.vy);
                   s.vx = Math.cos(na)*sp2; s.vy = Math.sin(na)*sp2; s.life = Math.max(s.life,0.5); }
        else dead = true;
      } else if (s.pierce > 0){ s.pierce--; s.pierced++; }
      else dead = true;
      break;
    }
    if (dead) G.shots.splice(i,1);
  }

  /* --- Снаряды врагов --- */
  for (let i = G.eshots.length-1; i >= 0; i--){
    const s = G.eshots[i];
    s.x += s.vx*dt; s.y += s.vy*dt; s.life -= dt;
    if (dist(s,p) < s.r + p.r){ hurt(s.dmg); G.eshots.splice(i,1); continue; }
    if (s.life <= 0) G.eshots.splice(i,1);
  }

  /* --- Сферы опыта --- */
  const magnet = b.has('magnet');
  for (let i = G.orbs.length-1; i >= 0; i--){
    const o = G.orbs[i], d = dist(o,p);
    const a = Math.atan2(p.y-o.y, p.x-o.x);
    // Внутри радиуса подбора сфера летит к игроку, снаружи — медленно дрейфует,
    // иначе опыт от дальних убийств (особенно свитой) просто оставался бы лежать.
    const pull = (magnet || d < D.pickup) ? (magnet ? 420 : 340) : 75;
    o.x += Math.cos(a)*pull*dt; o.y += Math.sin(a)*pull*dt;
    if (d < p.r + (o.book ? 14 : 6)){
      if (o.book) takeBook(o.book);
      else if (o.gold) G.gold += o.v;
      else gainXp(o.v);
      G.orbs.splice(i,1);
    }
  }

  /* --- Частицы: разлёт с трением --- */
  const friction = Math.pow(0.12, dt);
  for (let i = G.parts.length-1; i >= 0; i--){
    const q = G.parts[i];
    q.life -= dt;
    q.x += q.vx*dt; q.y += q.vy*dt;
    q.vx *= friction; q.vy *= friction;
    if (q.life <= 0) G.parts.splice(i,1);
  }

  /* --- Лужи смолы --- */
  // Урон тикает раз в полсекунды общим таймером, а не каждый кадр и не на каждую
  // лужу: иначе hurt() съедал бы шанс уворота шестьдесят раз в секунду.
  let poolDmg = 0;
  for (let i = G.pools.length-1; i >= 0; i--){
    const pl = G.pools[i]; pl.life -= dt;
    if (pl.life <= 0){ G.pools.splice(i,1); continue; }
    if (pl.arm > 0){ pl.arm -= dt; continue; }                   // лужа ещё растекается
    if (dist(pl, p) < pl.r + p.r) poolDmg = Math.max(poolDmg, pl.dmg);
  }
  p.poolCd = Math.max(0, (p.poolCd||0) - dt);
  if (poolDmg > 0 && p.poolCd <= 0){ p.poolCd = 0.5; hurt(poolDmg*0.5); }

  /* --- Эффекты --- */
  for (let i = G.fx.length-1; i >= 0; i--){
    const f = G.fx[i]; f.life -= dt;
    if (f.t === 'num') f.y -= 26*dt;
    if (f.t === 'txt') f.y -= 34*dt;                    // статусы всплывают быстрее цифр
    if (f.t === 'ring') f.r += (f.max - f.r) * Math.min(1, dt*14);
    if (f.t === 'wave'){
      // Фронт волны бьёт один раз, когда проходит через игрока: значит уцелеть
      // можно либо оставшись вплотную к боссу, либо убежав за её край
      f.r += f.spd*dt;
      if (!f.hit && Math.abs(dist(f, p) - f.r) < 26 + p.r){ f.hit = true; hurt(f.dmg); }
    }
    if (f.life <= 0) G.fx.splice(i,1);
  }

  /* --- Портал на следующий этаж --- */
  if (!G.portal && G.spawnQueue === 0 && G.enemies.length === 0){
    const pa = rnd(0, Math.PI*2);
    G.portal = {x:clamp(p.x+Math.cos(pa)*300,-ARENA+60,ARENA-60),
                y:clamp(p.y+Math.sin(pa)*300,-ARENA+60,ARENA-60), r:34, t:0};
    toast('ПОРТАЛ ОТКРЫТ');
  }
  if (G.portal){
    G.portal.t += dt;
    if (dist(G.portal, p) < G.portal.r + p.r && G.portal.t > 0.6){
      G.gold += Math.round((12 + G.floor*6) * D.goldFind);        // премия за зачистку
      G.floor++; G.rerolls++; heal(D.life*0.25); buildFloor();
    }
  }
}

/* Опыт и повышение уровня */
function gainXp(v){
  G.xp += v * D.xpGain;
  while (G.xp >= G.xpNext){
    G.xp -= G.xpNext; G.lvl++;
    G.xpNext = Math.round(14 * Math.pow(1.17, G.lvl-1));
    G.pending++;
  }
  if (G.pending) showLevelUp();
}

/* ---------- 9. ОТРИСОВКА ---------- */
function drawPoly(x, y, r, sides, rot){
  ctx.beginPath();
  for (let i = 0; i < sides; i++){
    const a = rot + i*Math.PI*2/sides;
    const px = x + Math.cos(a)*r, py = y + Math.sin(a)*r;
    i ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
  }
  ctx.closePath();
}
function drawShape(sh, x, y, r, rot){
  if (sh === 'circle'){ ctx.beginPath(); ctx.arc(x,y,r,0,6.29); }
  else if (sh === 'triangle') drawPoly(x,y,r,3,rot);
  else if (sh === 'square')   drawPoly(x,y,r,4,rot+0.785);
  else if (sh === 'diamond')  drawPoly(x,y,r,4,rot);
  else drawPoly(x,y,r,6,rot);
}

function render(){
  const p = G.player;
  let sx = 0, sy = 0;
  const shake = G.fx.find(f => f.t === 'shake');
  if (shake){ sx = rnd(-5,5); sy = rnd(-5,5); }

  ctx.fillStyle = '#0d1014'; ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2 - p.x + sx, H/2 - p.y + sy);                   // камера следует за игроком

  // Сетка пола
  const step = 80;
  ctx.strokeStyle = '#171d24'; ctx.lineWidth = 1;
  const x0 = Math.floor((p.x - W/2)/step)*step, y0 = Math.floor((p.y - H/2)/step)*step;
  ctx.beginPath();
  for (let x = x0; x < p.x + W/2 + step; x += step){ ctx.moveTo(x, y0); ctx.lineTo(x, y0 + H + step*2); }
  for (let y = y0; y < p.y + H/2 + step; y += step){ ctx.moveTo(x0, y); ctx.lineTo(x0 + W + step*2, y); }
  ctx.stroke();

  // Граница арены
  ctx.strokeStyle = '#2c3742'; ctx.lineWidth = 3;
  ctx.strokeRect(-ARENA, -ARENA, ARENA*2, ARENA*2);

  // Аура замедления
  if (G.bag.has('slowAura')){
    ctx.strokeStyle = '#5ec2e022'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, 260, 0, 6.29); ctx.stroke();
  }

  // Портал
  if (G.portal){
    const t = G.portal.t;
    ctx.strokeStyle = '#4fd1c5'; ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++){
      const rr = G.portal.r * (0.5 + i*0.28) + Math.sin(t*3 + i)*4;
      drawPoly(G.portal.x, G.portal.y, rr, 6, t*(i%2?1:-1)); ctx.stroke();
    }
  }

  // Трупы — ресурс некроманта
  ctx.strokeStyle = '#4a5560'; ctx.lineWidth = 2;
  for (const c of G.corpses){
    const k = clamp(c.life/3,0,1), r = c.big ? 9 : 6;
    ctx.globalAlpha = 0.35 + k*0.5;
    ctx.beginPath();
    ctx.moveTo(c.x-r,c.y-r); ctx.lineTo(c.x+r,c.y+r);
    ctx.moveTo(c.x+r,c.y-r); ctx.lineTo(c.x-r,c.y+r);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Сферы опыта (бирюзовые круги) и золото (янтарные ромбы)
  for (const o of G.orbs){
    if (o.book){
      // Книга — важнейшая находка, поэтому подсвечена нарочито громко:
      // радужный ореол, пульсирующие кольца и искры.
      const B = BOOKS[o.book];
      const puls = 1 + Math.sin(G.time*4)*0.18;
      const R = 62 * puls;
      const hue = (G.time*150) % 360;

      const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, R);
      g.addColorStop(0,    'hsla(' + hue + ',100%,72%,0.55)');
      g.addColorStop(0.45, 'hsla(' + ((hue+80)%360) + ',100%,62%,0.22)');
      g.addColorStop(1,    'hsla(' + ((hue+160)%360) + ',100%,60%,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(o.x, o.y, R, 0, 6.29); ctx.fill();

      ctx.lineWidth = 2;                                  // три кольца, крутятся в разные стороны
      for (let ri = 0; ri < 3; ri++){
        ctx.strokeStyle = 'hsla(' + ((hue + ri*120) % 360) + ',100%,68%,' + (0.75 - ri*0.18) + ')';
        drawPoly(o.x, o.y, (18 + ri*11) * puls, 6, G.time*(ri%2 ? 1.6 : -1.2) + ri);
        ctx.stroke();
      }
      ctx.strokeStyle = 'hsl(' + hue + ',100%,80%)'; ctx.lineWidth = 3;
      ctx.fillStyle = B.col + '66';
      drawPoly(o.x, o.y, 13*puls, 4, 0.785); ctx.fill(); ctx.stroke();

      ctx.fillStyle = '#ffffff';                          // иконка стихии в центре
      ctx.font = 'bold 15px ui-monospace,monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(B.ico, o.x, o.y);
      ctx.textBaseline = 'alphabetic';

      if (Math.random() < 0.30)                           // непрерывный сноп искр
        burst(o.x, o.y, 1, 'hsl(' + ((hue+rnd(0,360))%360) + ',100%,70%)', 90, 3, 0.7);
    }
    else if (o.gold){ ctx.fillStyle = '#f0c040'; drawPoly(o.x, o.y, 4.5, 4, G.time*2); ctx.fill(); }
    else { ctx.fillStyle = '#4fd1c5'; ctx.beginPath(); ctx.arc(o.x,o.y,4,0,6.29); ctx.fill(); }
  }

  // Лужи смолы — под всеми, это часть пола
  for (const pl of G.pools){
    const k = clamp(pl.life/pl.max, 0, 1);
    const arming = pl.arm > 0;
    const rr = arming ? pl.r * (1 - pl.arm/0.55) : pl.r;        // растекается на глазах
    ctx.globalAlpha = arming ? 0.15 : 0.22 + 0.18*k;
    ctx.fillStyle = '#6b4a12'; ctx.beginPath(); ctx.arc(pl.x, pl.y, rr, 0, 6.29); ctx.fill();
    ctx.globalAlpha = 0.5 + 0.4*k;
    ctx.strokeStyle = '#c08a3a'; ctx.lineWidth = 2; ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Враги
  for (const e of G.enemies){
    ctx.lineWidth = e.kind === 'norm' ? 2 : 3;
    ctx.strokeStyle = e.hit > 0 ? '#ffffff' : (e.kind === 'boss' ? '#ff5a4e' : e.kind === 'elite' ? '#ffd24a' : e.t.col);
    ctx.fillStyle = e.hit > 0 ? '#ffffff44' : e.t.col + '22';
    drawShape(e.t.shape, e.x, e.y, e.r, e.rot); ctx.fill(); ctx.stroke();

    // Индикаторы состояний
    if (e.dots.fire.dps > 0){ ctx.strokeStyle = '#ff7a2f'; drawShape(e.t.shape,e.x,e.y,e.r+4,-e.rot); ctx.stroke(); }
    if (e.ail.chill  > 0){
      ctx.strokeStyle = '#7fd6ff'; drawShape(e.t.shape,e.x,e.y,e.r+7,e.rot*0.5); ctx.stroke();
      // Радиус ауры виден, иначе игрок не поймёт, почему соседи вязнут
      ctx.globalAlpha = 0.13 + 0.07*Math.sin(G.time*3);
      ctx.beginPath(); ctx.arc(e.x, e.y, CHILL_AURA_R, 0, 6.29); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (e.frost){                                   // задетый аурой: бледная метка
      ctx.strokeStyle = '#7fd6ff'; ctx.globalAlpha = 0.4;
      drawShape(e.t.shape, e.x, e.y, e.r+5, -e.rot*0.5); ctx.stroke(); ctx.globalAlpha = 1;
    }
    if (e.ail.shock  > 0){ ctx.strokeStyle = '#ffe14a'; ctx.beginPath(); ctx.arc(e.x,e.y,e.r+10,0,6.29); ctx.stroke(); }
    if (e.ail.freeze > 0){ ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; drawPoly(e.x,e.y,e.r+5,6,0.4); ctx.stroke(); }
    // Счётчики стаков: огонь, яд, кровь
    const st = [];
    if (e.dots.fire.n   >= 0.5) st.push(['\u25C6' + Math.round(e.dots.fire.n),   '#ff7a2f']);
    if (e.dots.poison.n >= 0.5) st.push(['\u2620' + Math.round(e.dots.poison.n), '#8be04e']);
    if (e.dots.bleed.n  >= 0.5) st.push(['\u2716' + Math.round(e.dots.bleed.n),  '#e0405a']);
    if (st.length){
      ctx.font = 'bold 13px ui-monospace,monospace'; ctx.textAlign = 'center';
      st.forEach(([txt,col], si) => {
        ctx.fillStyle = col;
        ctx.fillText(txt, e.x + (si - (st.length-1)/2)*22, e.y + e.r + 13);
      });
    }

    // Аффиксы мини-босса: по кольцу на каждый, плюс телеграф тарана
    if (e.aff.length){
      const puls = 0.6 + 0.4*Math.sin(G.time*4);
      e.aff.forEach((a, ai) => {
        ctx.strokeStyle = a.id === 'ward' ? e.wardCol : a.col;
        ctx.globalAlpha = puls; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 11 + ai*6, 0, 6.29); ctx.stroke();
        ctx.globalAlpha = 1;
      });
      if (e.affT.warn > 0){                       // замах тарана: линия по будущей траектории
        ctx.strokeStyle = '#ff5a4e'; ctx.globalAlpha = 0.35 + 0.45*Math.sin(G.time*22);
        ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(e.x, e.y);
        ctx.lineTo(e.x + Math.cos(e.affT.ca)*430, e.y + Math.sin(e.affT.ca)*430);
        ctx.stroke(); ctx.globalAlpha = 1;
      }
    }

    // Полоса здоровья: у раненых, а у босса всегда — по ней читается прогресс боя
    if (e.hp < e.maxHp || e.kind === 'boss'){
      const w = e.r*2, hpw = w * clamp(e.hp/e.maxHp,0,1);
      ctx.fillStyle = '#000a'; ctx.fillRect(e.x-w/2, e.y-e.r-9, w, 3);
      ctx.fillStyle = e.kind === 'boss' ? '#ff5a4e' : '#e0405a'; ctx.fillRect(e.x-w/2, e.y-e.r-9, hpw, 3);
    }
    // Подпись босса: без неё игрок не свяжет кольца с тем, что его убивает
    if (e.kind === 'boss' && e.affNm){
      ctx.font = 'bold 12px ui-monospace,monospace'; ctx.textAlign = 'center';
      ctx.fillStyle = '#ff5a4e99'; ctx.fillText('БОСС', e.x, e.y-e.r-32);
      // Аффикс над самим боссом тоже был серым и мелким — поднимаем до читаемого
      ctx.font = 'bold 16px ui-monospace,monospace'; ctx.fillStyle = '#ffd24a';
      ctx.fillText(e.affNm.toUpperCase(), e.x, e.y-e.r-15);
    }
  }

  // Снаряды врагов
  ctx.fillStyle = '#d95ec2';
  for (const s of G.eshots){ ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.29); ctx.fill(); }

  // Снаряды игрока
  for (const s of G.shots){
    ctx.fillStyle = s.orb ? '#c08cff' : '#ffb340';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.29); ctx.fill();
  }

  // Эффекты
  for (const f of G.fx){
    if (f.t === 'bolt'){
      ctx.strokeStyle = '#ffe14a'; ctx.globalAlpha = clamp(f.life*5,0,1); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(f.x, f.y);
      const seg = 5;                                       // ломаем линию, чтобы читалась как разряд
      for (let k = 1; k <= seg; k++){
        const t2 = k/seg, jitter = k === seg ? 0 : 12;
        ctx.lineTo(f.x + (f.x2-f.x)*t2 + rnd(-jitter,jitter),
                   f.y + (f.y2-f.y)*t2 + rnd(-jitter,jitter));
      }
      ctx.stroke(); ctx.globalAlpha = 1;
    } else if (f.t === 'wave'){
      ctx.strokeStyle = f.col; ctx.globalAlpha = clamp(f.life*0.8, 0, 0.9); ctx.lineWidth = 9;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.29); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (f.t === 'ring'){
      ctx.strokeStyle = f.col; ctx.globalAlpha = clamp(f.life*3,0,1); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,6.29); ctx.stroke(); ctx.globalAlpha = 1;
    } else if (f.t === 'arc'){
      ctx.strokeStyle = '#ffb340'; ctx.globalAlpha = clamp(f.life*7,0,1); ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(f.x,f.y,f.r,f.a-f.arc/2,f.a+f.arc/2); ctx.stroke(); ctx.globalAlpha = 1;
    } else if (f.t === 'num'){
      ctx.globalAlpha = clamp(f.life*2,0,1);
      ctx.fillStyle = f.col || (f.crit ? '#ffd24a' : '#e8eef5');
      ctx.font = (f.crit ? 'bold 19px ' : 'bold 15px ') + 'ui-monospace,monospace';
      ctx.textAlign = 'center'; ctx.fillText(f.v, f.x, f.y); ctx.globalAlpha = 1;
    } else if (f.t === 'txt'){
      ctx.globalAlpha = clamp(f.life*2.5,0,1); ctx.fillStyle = f.col;
      ctx.font = 'bold 17px ui-monospace,monospace'; ctx.textAlign = 'center';
      ctx.fillText(f.s, f.x, f.y); ctx.globalAlpha = 1;
    }
  }

  // Частицы: рисуем квадратами по целым координатам — отсюда «пиксельность»
  for (const q of G.parts){
    ctx.globalAlpha = clamp(q.life/q.max, 0, 1);
    ctx.fillStyle = q.col;
    ctx.fillRect(Math.round(q.x), Math.round(q.y), q.sz, q.sz);
  }
  ctx.globalAlpha = 1;

  // Круговые орбы
  if (D.orbitN){
    const size = ORBIT_SIZE * D.projSize;
    ctx.strokeStyle = '#6fb3ff22'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(p.x, p.y, ORBIT_R*D.aoeR, 0, 6.29); ctx.stroke();
    for (let i = 0; i < D.orbitN; i++){
      const o = orbitPos(i);
      ctx.fillStyle = '#6fb3ff44'; ctx.strokeStyle = '#6fb3ff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(o.x, o.y, size, 0, 6.29); ctx.fill(); ctx.stroke();
    }
  }

  // Свита: костяные треугольники с ниткой к хозяину
  for (const m of G.minions){
    const K = MKIND[m.kind], golem = m.kind.startsWith('golem');
    ctx.strokeStyle = K.col + '22'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(m.x,m.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    ctx.lineWidth = golem ? 3 : 2;
    ctx.strokeStyle = m.hit > 0 ? '#ffffff' : K.col;
    ctx.fillStyle = K.col + (golem ? '33' : '22');
    drawPoly(m.x, m.y, m.r, K.sides, m.rot); ctx.fill(); ctx.stroke();
    if (m.kind === 'golemB'){                       // метка провокации
      ctx.strokeStyle = K.col + '44'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(m.x, m.y, 34, 0, 6.29); ctx.stroke();
    }
    if (m.hp < m.max){
      const w = m.r*2;
      ctx.fillStyle = '#000a'; ctx.fillRect(m.x-w/2, m.y-m.r-7, w, 2);
      ctx.fillStyle = K.col;   ctx.fillRect(m.x-w/2, m.y-m.r-7, w*clamp(m.hp/m.max,0,1), 2);
    }
  }

  // Отметка текущей цели — чтобы было видно, куда бьёт автоатака
  if (G.target){
    const e = G.target, rr = e.r + 7;
    ctx.strokeStyle = '#ffb340aa'; ctx.lineWidth = 2;
    for (let q = 0; q < 4; q++){
      const a0 = q*Math.PI/2 + 0.35;
      ctx.beginPath(); ctx.arc(e.x, e.y, rr, a0, a0 + 0.55); ctx.stroke();
    }
  }

  // Управление мышью: кольцо покоя вокруг игрока и метка курсора
  if (G.control === 'mouse'){
    const mwx = p.x + G.mouse.x - W/2, mwy = p.y + G.mouse.y - H/2;
    const inZone = Math.hypot(G.mouse.x - W/2, G.mouse.y - H/2) <= MOUSE_DEADZONE;
    ctx.strokeStyle = inZone ? '#ffb34066' : '#ffb34022'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(p.x, p.y, MOUSE_DEADZONE, 0, 6.29); ctx.stroke();
    ctx.strokeStyle = '#ffb340aa'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(mwx-7, mwy); ctx.lineTo(mwx+7, mwy);
    ctx.moveTo(mwx, mwy-7); ctx.lineTo(mwx, mwy+7); ctx.stroke();
  }

  // Игрок: янтарный квадрат с указателем направления атаки
  const ang = p.aim;
  ctx.strokeStyle = p.inv > 0 ? '#ffffff' : '#ffb340';
  ctx.fillStyle = '#ffb34033'; ctx.lineWidth = 3;
  drawPoly(p.x, p.y, p.r, 4, 0.785); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(p.x, p.y);
  ctx.lineTo(p.x + Math.cos(ang)*(p.r+11), p.y + Math.sin(ang)*(p.r+11)); ctx.stroke();

  ctx.restore();
  updateHud();
}

/* ---------- 10. ИНТЕРФЕЙС ---------- */
const $ = s => document.querySelector(s);
function updateHud(){
  const p = G.player;
  $('#hpbar i').style.width = clamp(p.hp/D.life*100,0,100) + '%';
  $('#hpbar span').textContent = Math.ceil(Math.max(0,p.hp)) + ' / ' + Math.round(D.life);
  $('#xpbar i').style.width = clamp(G.xp/G.xpNext*100,0,100) + '%';
  $('#lvl').textContent = G.lvl;
  $('#floor').textContent = G.floor;
  $('#left').textContent = 'врагов: ' + (G.enemies.length + G.spawnQueue);
  $('#goldbox').innerHTML = Math.floor(G.gold) + ' <span class="k">золота</span>';
  // Панель мини-босса: имя, аффиксы и здоровье, пока он жив
  const bb = $('#bossbar');
  const bs = G.enemies.find(e => e.kind === 'boss');
  if (bs){
    bb.style.display = 'block';
    // Цвет каждой метки берём из самого аффикса: тогда надпись и кольцо вокруг
    // босса опознаются как одно и то же, а не как два независимых значка.
    // Порядок меток в affNm совпадает с порядком в aff — они собраны вместе.
    const tags = (bs.affNm || '').split(' \u00B7 ').map((txt, i) => {
      const a = bs.aff[i];
      const col = a ? (a.id === 'ward' ? bs.wardCol : a.col) : '#ffd24a';
      return '<span style="color:' + col + '">' + txt + '</span>';
    }).join('<span class="bsep">\u00B7</span>');
    bb.innerHTML = '<div class="bt">БОСС</div>' +
      '<div class="ba">' + tags + '</div>' +
      '<div class="bh"><i style="width:' + clamp(bs.hp/bs.maxHp*100,0,100) + '%"></i></div>';
  } else bb.style.display = 'none';
  // Иконки найденных книг: цвет стихии, значение и тир
  $('#books').innerHTML = BOOK_KEYS.filter(k => G.items[k]).map(k => {
    const B = BOOKS[k], it = G.items[k];
    const val = (B.pct || k === 'monster' || k === 'xp') ? '+' + it.val + '%' : '+' + it.val;
    return '<div class="bk" style="border-color:' + B.col + ';color:' + B.col + '" title="' + B.nm + '">' +
      '<span class="ic">' + B.ico + '</span>' +
      '<span class="vl">' + val + '</span>' +
      (B.proc ? '<span class="tr">' + bookChance(k) + '%</span>' : '') +
      '<span class="tr">T' + it.tier + '</span></div>';
  }).join('');
  $('#dpsinfo').textContent = 'урон/сек ≈ ' + Math.round(avgHit()/D.atkCd*(G.weapon.type==='proj'?D.projN:1))
    + ' · рывки ' + G.player.dashN + '/' + D.dashMax
    + (D.hasMin ? ' · свита ' + G.minions.length + '/' + D.minMax : '');
}

let toastT = null;
function toast(s){
  const el = $('#toast'); el.textContent = s; el.style.opacity = 1;
  clearTimeout(toastT); toastT = setTimeout(()=> el.style.opacity = 0, 1400);
}

/* Тип сложения на карточке словами: «inc» ничего не говорит игроку */
const KIND_HINT = {
  flat:  'к урону плюсом',
  inc:   'суммируется в процентах',
  more:  'отдельный множитель',
  chance:'шанс',
  flag:  'свойство',
};

/* Выбор трёх карточек модификаторов по редкости */
function rollCards(){
  const taken = new Set(G.picks.map(x => x.id));
  const out = [];
  const weight = m => m.w !== undefined ? m.w
                    : m.rar === 3 ? 4 : m.rar === 2 ? 14 : m.rar === 1 ? 40 : 100;
  // Карта должна что-то делать этому классу: дуга удара бесполезна лучнику,
  // пробитие — жезлу (сфера взрывается на первой цели), свита — всем кроме некроманта.
  const fits = m => (!m.wep || m.wep.includes(G.weapon.type))
                 && (!m.req || G.weapon.minions);
  const pool = MODS.filter(m => (!m.show || m.show()) && !(m.hide && m.hide())) // условные ветки прокачки
                   .filter(fits)
                   .filter(m => !(m.rar === 3 && taken.has(m.id)))     // кейстоун берётся один раз
                   .filter(m => !(m.rar === 3 && G.lvl < 4));         // кейстоуны с 4 уровня
  let guard = 0;
  while (out.length < 3 && pool.length && guard++ < 200){
    const total = pool.reduce((s,m)=> s + weight(m), 0);
    let t = Math.random()*total, chosen = pool[0];
    for (const m of pool){ t -= weight(m); if (t <= 0){ chosen = m; break; } }
    if (!out.includes(chosen)) out.push(chosen);
    if (out.length >= pool.length) break;
  }
  // Только что открывшаяся ветка обязана показаться сразу — иначе игрок
  // может не узнать, что его 100% взрыва вообще что-то разблокировали.
  const fresh = MODS.find(m => m.unlock && !taken.has(m.id)
                            && (!m.show || m.show()) && !(m.hide && m.hide()) && fits(m));
  if (fresh && !out.includes(fresh)) out.splice(0, 0, fresh), out.length = 3;

  return out;
}

function showLevelUp(){
  const cards = rollCards();
  const rc = r => ['','r-rare','r-epic','r-key'][r||0];
  const fmt = m => {
    const v = m.r[0] === m.r[1] ? m.r[0] : rnd(m.r[0], m.r[1]);
    const val = m.kind === 'flag' ? '' :
                m.kind === 'more' ? '×' + (1+v/100).toFixed(2) :
                m.kind === 'inc'  ? '+' + Math.round(v) + '%' :
                m.kind === 'chance'? Math.round(v) + '%' :
                '+' + (v < 10 ? v.toFixed(1) : Math.round(v));
    return {v, val};
  };
  const rolled = cards.map(m => ({m, ...fmt(m)}));

  $('#ov').style.display = 'flex';
  $('#ov').innerHTML =
    '<h1>УРОВЕНЬ ' + G.lvl + '</h1><h2>выберите модификатор · осталось повышений: ' + G.pending + '</h2>' +
    '<div class="cards">' + rolled.map((c,i) =>
      '<div class="card ' + rc(c.m.rar) + '" data-i="' + i + '">' +
        '<div class="cat">' + c.m.cat + ' · ' + KIND_HINT[c.m.kind] + '</div>' +
        '<div class="nm">' + c.m.nm + '</div>' +
        '<div class="vl">' + c.val + '</div>' +
        '<div class="nt">' + (c.m.nt || '') + '</div>' +
        '<div class="id">' + c.m.id + '</div>' +
      '</div>').join('') + '</div>' +
    '<button id="rr"' + (G.rerolls ? '' : ' disabled') + '>ПЕРЕБРОСИТЬ (' + G.rerolls + ')</button>';

  document.querySelectorAll('#ov .card').forEach(el => el.onclick = () => {
    const c = rolled[+el.dataset.i];
    G.bag.add(c.m.stat, c.m.kind, c.v);
    G.picks.push({id:c.m.id, nm:c.m.nm, val:c.val, cat:c.m.cat});
    recalc();
    G.pending--;
    if (G.pending > 0) showLevelUp();
    else { $('#ov').style.display = 'none'; $('#ov').innerHTML = ''; last = performance.now(); }
    renderSheet();
  });
  const rr = $('#rr');
  if (rr) rr.onclick = () => { if (G.rerolls > 0){ G.rerolls--; showLevelUp(); } };
}

function renderSheet(){
  const b = G.bag;
  const r = (n,v) => '<div class="row"><span>' + n + '</span><b>' + v + '</b></div>';
  $('#sheet').innerHTML =
    '<h3>ОРУЖИЕ</h3>' + r(G.weapon.nm, G.weapon.id) +
    '<h3>ОСНОВНОЕ</h3>' +
      r('Здоровье', Math.round(D.life)) +
      r('Реген/сек', D.regen.toFixed(1)) +
      r('Урон за удар', Math.round(D.baseMin) + '–' + Math.round(D.baseMax)) +
      r('Средний удар', Math.round(avgHit())) +
      r('Скорость атаки', (1/D.atkCd).toFixed(2) + '/сек') +
      r('Шанс крита', D.critCh.toFixed(1) + '%') +
      r('Множитель крита', Math.round(D.critMul) + '%') +
      r('Скорость бега', Math.round(D.mspd)) +
    '<h3>СТИХИИ</h3>' +
      r('Огонь', D.elem.fire.toFixed(1)) + r('Холод', D.elem.cold.toFixed(1)) +
      r('Молния', D.elem.lit.toFixed(1)) + r('Яд', D.elem.poi.toFixed(1)) +
    '<h3>ЗАЩИТА</h3>' +
      r('Броня', Math.round(D.armor) + ' (−' + Math.round(D.armor/(D.armor+90)*100) + '%)') +
      r('Снижение урона', D.dr + '%') + r('Блок', D.block + '%') + r('Уворот', D.dodge + '%') +
      r('Вампиризм', D.leech.toFixed(1) + '%') +
    '<h3>ГЕОМЕТРИЯ</h3>' +
      r('Снарядов', D.projN) + r('Пробитие', D.pierce) + r('Отскоки', D.chain) +
      r('Радиус AoE', '×' + D.aoeR.toFixed(2)) +
      (D.orbitN ? r('Круговые орбы', D.orbitN + ' / 10 · ' + Math.round(avgHit()*0.15) + ' за касание') : '') +
      r('Взрыв трупа', Math.round(D.explode) + '%') +
      (D.explodeMega ? r('МЕГА-взрыв', Math.round(D.explodeMega) + '%  (радиус ×2, поджог)') : '') +
    (D.hasMin ?
      '<h3>СВИТА</h3>' +
      r('Всего приспешников', G.minions.length + ' / ' + D.minMax) +
      r('Скелеты', mCount('skeleton') + ' / ' + D.maxSkel) +
      (D.maxHunt ? r('Охотники', mCount('hunter') + ' / ' + D.maxHunt) : '') +
      (D.maxWarl ? r('Колдуны',  mCount('warlock') + ' / ' + D.maxWarl) : '') +
      (D.golemB ? r('Голем крови', 'ур. ' + D.golemB + '/10 · ' +
        Math.round(D.life*0.05*D.golemB) + ' HP · ' + Math.round(avgHit()*0.08*D.golemB) + ' урона') : '') +
      (D.golemN ? r('Костяной голем', 'ур. ' + D.golemN + '/10 · кровь ' +
        (avgHit()*0.03*D.golemN*D.ailEff).toFixed(1) + '/сек за стак') : '') +
      r('Урон скелета', Math.round(avgHit()*D.minDmgMul)) +
      r('Здоровье скелета', Math.round(D.minLife)) +
      r('Атак/сек', (D.minAspd/0.78).toFixed(2)) +
      r('Крит свиты', D.minCrit.toFixed(1) + '%') +
      r('Наследование статов', Math.round(D.minInherit*100) + '%') +
      r('Перехват урона', Math.round(D.minBond) + '%') +
      r('Трупов на земле', G.corpses.length)
    : '') +
    (Object.keys(G.items).length ?
      '<h3>НАЙДЕННЫЕ КНИГИ</h3>' +
      BOOK_KEYS.filter(k=>G.items[k]).map(k =>
        '<div class="pick" style="border-left:2px solid ' + BOOKS[k].col + ';padding-left:7px">' +
        BOOKS[k].nm + ' · тир ' + G.items[k].tier + ' <b style="color:' + BOOKS[k].col + '">+' +
        G.items[k].val + ((BOOKS[k].pct||k==='monster'||k==='xp') ? '%' : '') + '</b>' +
        (BOOKS[k].proc ? ' · срабатывает <b>' + bookChance(k) + '%</b>' : '') +
        (k==='poison' ? '<br><i>' + Math.round(D.bookPoiDps) + ' урона/сек за прок</i>' : '') +
        (k==='bleed'  ? '<br><i>' + Math.round(bookBleedDps()) + ' урона/сек за прок</i>' : '') +
        '</div>').join('')
    : '') +
    '<h3>ВЗЯТО МОДИФИКАТОРОВ: ' + G.picks.length + '</h3>' +
      G.picks.map(p => '<div class="pick">' + p.val + ' ' + p.nm + '<br><i>' + p.id + '</i></div>').join('');
}

function gameOver(){
  G.over = true;
  const earned = Math.floor(G.gold);
  Store.data.gold += earned;                                       // золото уносится в банк
  Store.data.best = Math.max(Store.data.best || 0, G.floor);
  Store.save();
  $('#ov').style.display = 'flex';
  $('#ov').innerHTML =
    '<h1 style="color:#e0405a">ВЫ ПАЛИ</h1>' +
    '<h2>этаж ' + G.floor + ' · уровень ' + G.lvl + ' · модификаторов: ' + G.picks.length + '</h2>' +
    '<div style="color:#f0c040;font-size:18.8px;letter-spacing:1px">+' + earned +
      ' золота в банк · всего ' + Store.data.gold +
      '<span style="color:#7d8b9a;font-size:13.8px"> · рекорд: этаж ' + Store.data.best +
      ' · хранилище: ' + Store.mode + '</span></div>' +
    '<div class="cards" style="max-width:640px;font-size:13.8px;color:#7d8b9a;line-height:1.7">' +
      G.picks.map(p => p.val + ' ' + p.nm).join(' · ') + '</div>' +
    '<button id="again">НАЧАТЬ ЗАНОВО</button>';
  $('#again').onclick = startScreen;
}

/* ---------- 11. СТАРТОВЫЙ ЭКРАН ---------- */
function startScreen(){
  $('#sheet').style.display = 'none';
  $('#ov').style.display = 'flex';
  $('#ov').innerHTML =
    '<h1>ГРИНДЕР</h1><h2>выберите класс — он определяет, вокруг чего строить билд</h2>' +
    '<div class="cards">' + Object.keys(WEAPONS).map(k => {
      const w = WEAPONS[k];
      return '<div class="card" data-w="' + k + '">' +
        '<div class="cat">' + w.id + '</div>' +
        '<div class="nm">' + w.nm + '</div>' +
        '<div class="vl">' + w.dmg[0] + '–' + w.dmg[1] + '</div>' +
        '<div class="nt">' + w.desc + '</div></div>';
    }).join('') + '</div>' +
    '<div style="font-size:13.8px;color:#7d8b9a;text-align:center;line-height:1.8">' +
      'Каждое повышение уровня — выбор из трёх модификаторов реального каталога.<br>' +
      'flat складывается · inc суммируется в один процент · more множится отдельно.</div>';
  document.querySelectorAll('#ov .card').forEach(el => el.onclick = () => controlScreen(el.dataset.w));
}

/* Второй шаг стартового экрана: чем играть */
const CONTROLS = {
  keys: {nm:'КЛАВИАТУРА', ico:'WASD',
         desc:'Движение на WASD или стрелках. Точный контроль остановки — удобно для билдов на стрельбу с места.'},
  mouse:{nm:'МЫШЬ', ico:'\u2316',
         desc:'Персонаж непрерывно бежит к курсору. Чтобы встать, наведите курсор на себя — вокруг персонажа есть зона покоя.'},
};
function controlScreen(wk){
  $('#ov').innerHTML =
    '<h1>' + WEAPONS[wk].nm + '</h1><h2>чем управлять? · сменить можно в любой момент на C</h2>' +
    '<div class="cards">' + Object.keys(CONTROLS).map(ck => {
      const C = CONTROLS[ck];
      return '<div class="card" data-c="' + ck + '">' +
        '<div class="cat">управление</div>' +
        '<div class="nm">' + C.nm + '</div>' +
        '<div class="vl">' + C.ico + '</div>' +
        '<div class="nt">' + C.desc + '</div></div>';
    }).join('') + '</div>' +
    '<div class="k" style="font-size:13px">Атака автоматическая в обеих схемах · ПРОБЕЛ — рывок · ESC или P — пауза</div>' +
    '<button id="back">НАЗАД К ВЫБОРУ КЛАССА</button>';
  document.querySelectorAll('#ov .card').forEach(el => el.onclick = () => {
    newGame(wk, el.dataset.c);
    $('#ov').style.display = 'none'; $('#ov').innerHTML = '';
    cv.classList.toggle('mouse-mode', el.dataset.c === 'mouse');
    setHint(); renderSheet(); last = performance.now();
  });
  $('#back').onclick = startScreen;
}

/* Подсказка внизу экрана зависит от выбранной схемы */
/* Смена схемы управления на лету. Обе схемы уже полностью поддержаны в update(),
   так что переключение — это ровно смена флага плюс уборка за прошлой схемой. */
function toggleControl(){
  G.control = G.control === 'mouse' ? 'keys' : 'mouse';
  if (G.control === 'mouse'){
    // Курсор с прошлого раза мог остаться где угодно, а мышиная схема гонит
    // персонажа к нему постоянно. Ставим цель в центр экрана: камера держит
    // игрока ровно там, то есть это центр мёртвой зоны — до первого движения
    // мыши персонаж стоит, а не срывается в сторону.
    G.mouse.x = W/2; G.mouse.y = H/2;
  }
  // Зажатая WASD осталась бы в G.keys как нажатая: keyup по ней уже не придёт
  // в том смысле, в каком его ждёт схема. Гасим всё, что удерживалось.
  for (const k in G.keys) G.keys[k] = false;
  const p = G.player; p.moving = false;
  setHint();
  toast('УПРАВЛЕНИЕ: ' + CONTROLS[G.control].nm);
  G.fx.push({t:'ring', x:p.x, y:p.y, r:8, max:70, life:0.4, col:'#4fd1c5'});
}

function setHint(){
  $('#hint').textContent = (G.control === 'mouse'
      ? 'МЫШЬ — движение к курсору, наведите на себя чтобы встать'
      : 'WASD — движение')
    + ' · атака автоматическая · ПРОБЕЛ — рывок · C — сменить управление · TAB — характеристики · ESC/P — пауза';
}

/* ---------- 12. ВВОД ---------- */
addEventListener('keydown', e => {
  if (!G) return;
  const k = e.key.toLowerCase();
  G.keys[k] = true;
  if (k === ' '){                                                   // рывок
    e.preventDefault();
    const p = G.player;
    if (p.dashN > 0 && p.dash <= 0){ p.dashN--; p.dash = 0.14; p.inv = D.iframe; p.dashHits = []; }
  }
  // e.repeat: браузер шлёт keydown повторно, пока клавиша зажата.
  // Без этой проверки удержание C дёргало бы схему по десять раз в секунду.
  if (k === 'c' && !e.repeat) toggleControl();
  if ((k === 'tab' || k === 'v') && !e.repeat){
    if (k === 'tab') e.preventDefault();          // иначе Tab уводит фокус со страницы
    const sh = $('#sheet');
    sh.style.display = sh.style.display === 'block' ? 'none' : 'block';
    renderSheet();
  }
  if (k === 'p' || k === 'escape'){
    if (G.pending || G.over || $('#ov').style.display === 'flex') return;  // модалки паузу не трогают
    G.paused = !G.paused;
    $('#pauseov').style.display = G.paused ? 'flex' : 'none';
    last = performance.now();
  }
});
addEventListener('keyup', e => { if (G) G.keys[e.key.toLowerCase()] = false; });
cv.addEventListener('mousemove', e => {
  if (!G) return;
  const r = cv.getBoundingClientRect();
  G.mouse.x = e.clientX - r.left; G.mouse.y = e.clientY - r.top;
});
cv.addEventListener('contextmenu', e => e.preventDefault());

/* Подставляется на сборке. Если осталось как есть — файл открыт напрямую. */
const BUILD = '__BUILD__';
$('#build').textContent = BUILD.indexOf('BUILD') >= 0 ? 'dev' : BUILD;

resize();
Store.load().then(() => { startScreen(); requestAnimationFrame(loop); });
</script>
