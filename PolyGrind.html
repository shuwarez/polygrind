  if (m.id === 'ail.shock.chance') return '<b>Когда проверяется:</b> при каждом подходящем попадании.<br><b>Эффект:</b> Шок на 1 секунду даёт цели +10% входящего урона; базовый разряд бьёт до 5 соседей на 15% удара.<br><b>Предел:</b> одна карточка даёт 1–5 п.п.; суммарный шанс не превышает 25%. На потолке открывается «ТЕСЛА».';

}

function hideSkillTip(){ $('#skilltip').style.display = 'none'; }
function skillTipsEnabled(){ return SKILL_TIPS_ENABLED; }
function skillTipsToggleText(){ return SKILL_TIPS_ENABLED ? 'ПОДРОБНЫЕ ПОДСКАЗКИ: ВКЛ' : 'ПОДРОБНЫЕ ПОДСКАЗКИ: ВЫКЛ'; }
function updateSkillTipsButton(){
  const btn = $('#skilltips-toggle');
  if (!btn) return;
  btn.textContent = tr(skillTipsToggleText());
  btn.setAttribute('aria-pressed', String(SKILL_TIPS_ENABLED));
  btn.classList.toggle('tips-off', !SKILL_TIPS_ENABLED);
}
function setSkillTipsEnabled(next){
  SKILL_TIPS_ENABLED = !!next;
  try { localStorage.setItem(SKILL_TIPS_KEY, SKILL_TIPS_ENABLED ? 'on' : 'off'); } catch (e) {}
  hideSkillTip(); updateSkillTipsButton();
}
function moveSkillTip(ev){
  const tip = $('#skilltip'), gap = 18;
  let x = ev.clientX + gap, y = ev.clientY + gap;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  if (x + w > innerWidth - 10) x = Math.max(10, ev.clientX - w - gap);
  if (y + h > innerHeight - 10) y = Math.max(10, innerHeight - h - gap);
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function showFloorFindTip(ev, find, anchor){
  if (!find) return;
  const tip = $('#skilltip');
  tip.innerHTML = '<div class="tt-title" style="color:' + find.col + '">' + find.ico + ' ' + find.name + '</div>' +
    '<b>' + find.detail + '</b><div class="tt-note">' + (find.tip || 'Находка добавлена в текущий забег.') + '</div>';
  tip.style.display = 'block';
  if (anchor){
    const r = anchor.getBoundingClientRect();
    const gap = 14, w = tip.offsetWidth, h = tip.offsetHeight;
    const x = Math.max(10, Math.min(innerWidth-w-10, r.right-w));
    let y = r.top-h-gap;
    if (y < 10) y = Math.min(innerHeight-h-10, r.bottom+gap);
    tip.style.left = x + 'px'; tip.style.top = Math.max(10,y) + 'px';
  } else if (ev && Number.isFinite(ev.clientX)) moveSkillTip(ev);
}
function showSkillTip(ev, card){
  if (!SKILL_TIPS_ENABLED){ hideSkillTip(); return; }
  const m = card.m, tip = $('#skilltip');
  const detail = detailedSkillTip(m, card);

}

   Замер: при 0.30 до десяти орбов игрок доходил за 28 уровней, при 0.52 — за 16. */
const ORBIT_PRIORITY = 0.52;

/* Единая карта классов для level-up UI. Ограничения не дублируются списками id:
   значки вычисляются из тех же полей каталога, по которым карточка реально
   допускается в пул. Поэтому новая wep/req/noMin-карточка получает их сама. */
const CARD_CLASS_ORDER = ['blade','bow','wand','necro'];
const CARD_CLASS_STYLE = Object.freeze({

  bow:{slug:'archer', icon:'<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="M4 1c7 3 7 11 0 14M4 1v14"/><path fill="#d9e6ef" d="M2 7h11v2H2zM11 5l4 3-4 3z"/></svg>'},
  wand:{slug:'mage', icon:'<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="#dfe9f2" d="M2 12l2 2L12 4l-2-2z"/><path fill="currentColor" d="M11 0l1 2 3 1-2 2v3l-2-2-3 1 1-3-2-2h3z"/><path fill="#5ed5e8" d="M11 2h2v2h-2z"/></svg>'},
  necro:{slug:'necromancer', icon:'<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="#e7dfc6" d="M3 3h2V1h6v2h2v2h2v6h-3v4H4v-4H1V5h2z"/><path fill="#15231d" d="M4 6h3v3H4zM9 6h3v3H9zM7 10h2v2H7zM5 13h2v2H5zM9 13h2v2H9z"/><path fill="currentColor" d="M2 4h2V2h2V1H4v1H2zM12 3h2v2h-2z"/></svg>'}
});

function modFitsWeapon(m, weapon){
  return (!m.wep || m.wep.includes(weapon.type))
      && (!m.req || weapon.minions)
      && !(m.noMin && weapon.minions);
}
function allowedClassesForMod(m){
  return CARD_CLASS_ORDER.filter(key => modFitsWeapon(m, WEAPONS[key]));
}
function classAvailabilityHtml(m){
  const keys = allowedClassesForMod(m);
  if (!keys.length || keys.length === CARD_CLASS_ORDER.length) return '';
  const names = keys.map(key => tr(WEAPONS[key].nm));
  const label = tr('ДОСТУПНО:') + ' ' + names.join(', ');
  return '<div class="class-access" role="group" aria-label="' + label + '" title="' + label + '">' +
    '<span class="class-access-label">' + tr('ДОСТУПНО:') + '</span>' +
    keys.map(key => {
      const cls = CARD_CLASS_STYLE[key], name = tr(WEAPONS[key].nm);
      return '<span class="class-icon class-icon-' + cls.slug + '" role="img" aria-label="' + name + '" title="' + name + '">' + cls.icon + '</span>';
    }).join('') + '</div>';
}

/* Карточки свиты у некроманта. Первое место в раздаче отдаётся им ВСЕГДА,
   второе — с шансом MINION_PRIORITY_2. Работает только у некроманта: карточки
   с req:'min' и так показываются только ему.
   Зачем: у него две прокачки в одной партии — своя и свиты, а мест в раздаче
   столько же, сколько у остальных. Замер до правок: карточка свиты попадалась
   в 31.7% роллов и занимала 11.7% мест, то есть некромант качал свиту втрое
   реже, чем себя, и к 30 уровню приходил с базовыми тремя скелетами. */
const MINION_PRIORITY = 1.0, MINION_PRIORITY_2 = 0.55;

/* Выбор трёх карточек модификаторов по редкости */
function rollCards(){
  const taken = new Set(G.picks.map(x => x.id));
  const out = [];
  const weight = m => m.w !== undefined ? m.w
                    : m.rar === 4 ? 3 : m.rar === 3 ? 4 : m.rar === 2 ? 14 : m.rar === 1 ? 40 : 100;
  // Карта должна что-то делать этому классу: дуга удара бесполезна лучнику,
  // пробитие — жезлу (сфера взрывается на первой цели), свита — всем кроме некроманта.
  /* noMin — карточка не показывается классам со свитой. Некромант не стоит
     на месте: он бегает, пока армия дерётся, и «турель-архетип» ему прямо
     противопоказан. Отдельный флаг, а не список исключений по id, чтобы
     следующую такую карточку можно было пометить одним словом. */
  const fits = m => modFitsWeapon(m, G.weapon);
  const pool = MODS.filter(m => (!m.show || m.show()) && !(m.hide && m.hide())) // условные ветки прокачки
                   .filter(fits)
                   // Взятый флаг больше не показываем. Флаг — это переключатель
                   // («есть/нет»), второй раз он перезаписывает ту же единицу и не
                   // даёт ровно ничего. Раньше отсеивались только кейстоуны, и
                   // остальные 24 флага (вспышка при убийстве, дробовик, фазовое
                   // движение, магнит добычи и прочие) продолжали выпадать пустышками.
                   // Правило общее, а не список исключений: любой новый флаг
                   // подхватится сам, и про него не придётся помнить отдельно.
                   .filter(m => !(m.kind === 'flag' && taken.has(m.id)))
                   .filter(m => !(m.rar === 3 && G.lvl < 4));         // кейстоуны с 4 уровня
  const need = cardCount();          // 3, либо 4 если открыта покупка в магазине

  /* Круговой орб — воинская ветка, которая работает только собранной: один орб
     бьёт на 25% автоатаки, десять держат оборону. Наравне со всеми он выпадает редко:
     игрок берёт первый и до второго не доживает. Поэтому начатая ветка получает
     место в раздаче с шансом 52%, пока не упрётся в потолок.
     Сделано отдельным броском, а НЕ повышенным весом в общей рулетке: вес пришлось
     бы подгонять под размер пула, а пул зависит от класса и от уже взятого.
     Замер веса 130 давал 6% вместо 30% — цифру пришлось бы искать заново
     после каждой новой карточки в каталоге. Бросок даёт ровно то, что написано. */
  /* Приоритетные места. Общее правило: сколько бы приоритетов ни сработало,
     хотя бы одно место в раздаче обязано остаться свободным — иначе выбора
     не существует, а показывать игроку заранее известные карточки незачем. */
  const freeSlots = () => need - 1 - out.length;

  /* СВИТА: некромант качает две вещи сразу — себя и свиту, — а мест у него
     столько же, сколько у остальных. Поэтому первое место всегда его свиты,
     второе — в половине случаев. Внутри категории тянем по обычным весам,
     иначе редкие ветки (големы, колдуны, повышение ранга) выпадали бы наравне
     с рядовыми процентами и перестали бы быть событием. */
  if (G.weapon.minions){
    const mins = pool.filter(m => m.req === 'min' && !(m.kind === 'flag' && taken.has(m.id)));
    const drawMin = () => {
      const left = mins.filter(m => !out.includes(m));
      if (!left.length) return false;
      const tw = left.reduce((s2,m)=> s2 + weight(m), 0);
      let t2 = Math.random()*tw, chosen = left[0];
      for (const m of left){ t2 -= weight(m); if (t2 <= 0){ chosen = m; break; } }
      out.push(chosen); return true;
    };
    if (freeSlots() > 0 && Math.random() < MINION_PRIORITY) drawMin();
    if (freeSlots() > 0 && Math.random() < MINION_PRIORITY_2) drawMin();
  }

  const orbHooked = G.picks.some(x => x.id === 'shape.orbit') && D.orbitN < 10;
  if (orbHooked && freeSlots() > 0 && Math.random() < ORBIT_PRIORITY){
    const orb = pool.find(m => m.id === 'shape.orbit');
    if (orb && !out.includes(orb)) out.push(orb);
  }
  let guard = 0;
  while (out.length < need && pool.length && guard++ < 200){
    const total = pool.reduce((s,m)=> s + weight(m), 0);
    let t = Math.random()*total, chosen = pool[0];
    for (const m of pool){ t -= weight(m); if (t <= 0){ chosen = m; break; } }
    if (!out.includes(chosen)) out.push(chosen);
    if (out.length >= pool.length) break;
  }
  // Только что открывшаяся ветка обязана показаться сразу — иначе игрок
  // может не узнать, что его 100% взрыва вообще что-то разблокировали.
  const fresh = MODS.find(m => m.unlock && !taken.has(m.id)
                            && (!m.show || m.show()) && !(m.hide && m.hide()) && fits(m));
  if (fresh && !out.includes(fresh)) out.splice(0, 0, fresh), out.length = need;

  return out;
}

/* Единое место броска числа карточки. int даёт честный целый процент,
   cap обрезает последнюю карточку ровно до остатка. Так в сумке тоже нет
   скрытого перекапа, а UI показывает ровно то, что игрок получит. */
function rollModValue(m, random=Math.random){
  if (m.kind === 'flag') return 1;
  let v;
  if (m.r[0] === m.r[1]) v = m.r[0];
  else if (m.int) v = Math.floor(m.r[0] + random()*(m.r[1]-m.r[0]+1));
  else v = m.r[0] + random()*(m.r[1]-m.r[0]);
  if (m.cap !== undefined){
    const e = G.bag.s[m.stat];
    const current = !e ? 0 : m.kind === 'inc' ? e.inc : m.kind === 'more' ? (e.more-1)*100 : e.flat;
    v = Math.min(v, Math.max(0, m.cap-current));
  }
  return v;
}

function showLevelUp(){
  hideSkillTip();
  const cards = rollCards();
  const rc = r => ['','r-rare','r-epic','r-key','r-blood'][r||0];
  const fmt = m => {
    const v = rollModValue(m);
    const val = m.kind === 'flag' ? '' :
                m.kind === 'more' ? '×' + (1+v/100).toFixed(2) :
                m.kind === 'inc'  ? '+' + Math.round(v) + '%' :
                m.kind === 'chance'? Math.round(v) + '%' :
                '+' + (v < 10 ? v.toFixed(1) : Math.round(v));
    return {v, val};
  };
  const rolled = cards.map(m => ({m, ...fmt(m)}));
  G.levelUpCards = rolled;

  $('#ov').style.display = 'flex';
  $('#ov').innerHTML =
    '<h1>УРОВЕНЬ ' + G.lvl + '</h1><h2>выберите модификатор · осталось повышений: ' + G.pending + '</h2>' +
    '<div class="cards">' + rolled.map((c,i) =>
      '<div class="card ' + rc(c.m.rar) + '" data-i="' + i + '" aria-keyshortcuts="' + (i+1) + '">' +
        '<div class="card-top"><div class="level-key-group"><kbd class="level-key" aria-hidden="true">' + (i+1) + '</kbd><div class="cat">' + c.m.cat + ' · ' + KIND_HINT[c.m.kind] + '</div></div>' + classAvailabilityHtml(c.m) + '</div>' +
        '<div class="nm">' + c.m.nm + '</div>' +
        '<div class="vl">' + c.val +
          (currentOf(c.m) !== null ?
            '<span class="cur">сейчас ' + currentOf(c.m) + '</span>' : '') + '</div>' +
        cardInlineExample(c.m,c) +
        '<div class="nt">' + (c.m.nt || '') + '</div>' +
        (affectsMinions(c.m) ? '<div class="mn">ДЕЙСТВУЕТ И НА СВИТУ</div>' : '') +
        '<div class="id">' + c.m.id + '</div>' +
      '</div>').join('') + '</div>' +
    '<div class="level-actions"><div class="level-key-hint">КЛАВИШИ 1–' + rolled.length + ' — ВЫБОР КАРТОЧКИ</div><button id="rr" aria-keyshortcuts="Space"' + (G.rerolls ? '' : ' disabled') + '><span>ПЕРЕБРОСИТЬ</span> (' + G.rerolls + ') <kbd class="reroll-key">ПРОБЕЛ</kbd></button>' +
    '<button id="skilltips-toggle" type="button" aria-pressed="' + SKILL_TIPS_ENABLED + '"' + (SKILL_TIPS_ENABLED ? '' : ' class="tips-off"') + '>' + skillTipsToggleText() + '</button></div>';

  document.querySelectorAll('#ov .card').forEach(el => {
    const c = rolled[+el.dataset.i];
    el.onmouseenter = ev => showSkillTip(ev, c);
    el.onmousemove = moveSkillTip;
    el.onmouseleave = hideSkillTip;
    el.onclick = () => chooseLevelUpCard(+el.dataset.i);
  });
  const rr = $('#rr');
  if (rr) rr.onclick = rerollLevelUp;
  const tipsToggle = $('#skilltips-toggle');
  if (tipsToggle) tipsToggle.onclick = () => setSkillTipsEnabled(!SKILL_TIPS_ENABLED);
}

function rerollLevelUp(){
  if (!G || G.pending <= 0 || G.rerolls <= 0 || !Array.isArray(G.levelUpCards)) return false;
  G.rerolls--;
  showLevelUp();
  return true;
}

function chooseLevelUpCard(index){
  if (!G || G.pending <= 0 || !Array.isArray(G.levelUpCards)) return false;
  const c = G.levelUpCards[index];
  if (!c) return false;
  // Сразу закрываем текущий набор: один keydown/click не может выбрать две карты.
  G.levelUpCards = null;
  hideSkillTip();
  G.bag.add(c.m.stat, c.m.kind, c.v);
  G.picks.push({id:c.m.id, nm:c.m.nm, val:c.val, v:c.v, cat:c.m.cat});
  recalc();
  G.pending--;
  continueAfterLevelUp();
  renderSheet();
  return true;
}

function continueAfterLevelUp(){
  if (G.pending > 0){ showLevelUp(); return; }
  if (showFloorFindSummary()) return;
  $('#ov').style.display = 'none'; $('#ov').innerHTML = ''; last = performance.now();
}

    '<h3>ТОТЕМЫ · ' + totemKeys.length + '</h3>' + totems +

/* ---------- 11b. ЛЁГКОЕ DEBUG-МЕНЮ СПАВНА ----------
   Все кнопки вызывают канонические spawnEnemy()/spawnPack(). Меню лишь
   переставляет уже готовое существо поближе к игроку и не касается очереди,
   таймера волны, номера этажа или счётчиков убийств. */
function debugSpawnPoint(radius, ignored=[], minDist=100, maxDist=250){
  const p = G.player, margin = Math.max(40, radius + 8);
  const occupied = G.enemies.filter(e => !ignored.includes(e));
  let best = null, bestClearance = -Infinity;
  for (let i = 0; i < 24; i++){
    const a = rnd(0, Math.PI*2), wanted = rnd(minDist, maxDist);
    const x = clamp(p.x + Math.cos(a)*wanted, -ARENA+margin, ARENA-margin);
    const y = clamp(p.y + Math.sin(a)*wanted, -ARENA+margin, ARENA-margin);
    const d = Math.hypot(x-p.x, y-p.y);
    if (d < minDist || d > maxDist) continue;
    let clearance = Infinity;
    for (const e of occupied)
      clearance = Math.min(clearance, Math.hypot(x-e.x, y-e.y) - radius - e.r);
    if (clearance >= 18) return {x,y};
    if (clearance > bestClearance){ bestClearance = clearance; best = {x,y}; }
  }
  if (best) return best;
  const a = Math.atan2(-p.y, -p.x) + rnd(-0.45, 0.45);
  const wanted = (minDist + maxDist) * 0.5;
  return {
    x:clamp(p.x + Math.cos(a)*wanted, -ARENA+margin, ARENA-margin),
    y:clamp(p.y + Math.sin(a)*wanted, -ARENA+margin, ARENA-margin)
  };
}
function debugPlaceEnemy(e){
  const pt = debugSpawnPoint(e.r, [e]);
  e.x = pt.x; e.y = pt.y;
  e.spriteFace = e.x < G.player.x ? 1 : -1;
  return e;
}
function debugSpawnEnemy(typeKey){
  if (!G || !ETYPES[typeKey]) return null;
  return debugPlaceEnemy(spawnEnemy(typeKey));
}
function debugSpawnEliteVariant(variantId){
  if (!G || !ELITE_VARIANTS[variantId]) return null;
  return debugPlaceEnemy(spawnEnemy('pack',null,variantId));
}
function debugSpawnBoss(bossId){
  if (!G || !BOSS_TYPES[bossId]) return null;
  return debugPlaceEnemy(spawnEnemy('boss', bossId));
}
function debugSpawnElitePack(){
  if (!G) return null;
  // До пятого этажа стандартная elite-event логика ещё не даёт аффикс.
  // Debug-кнопка поднимает только уровень каталога пачки до первого валидного,
  // но здоровье/урон участников spawnEnemy() всё равно считает по G.floor.
  const pk = spawnPack(Math.max(5, G.floor));
  const pt = debugSpawnPoint(46, pk.members, 140, 210);
  const n = pk.members.length;
  for (let i = 0; i < n; i++){
    const a = Math.PI*2*i/n, spread = n === 1 ? 0 : 30;
    const e = pk.members[i], margin = Math.max(40, e.r+8);
    e.x = clamp(pt.x + Math.cos(a)*spread, -ARENA+margin, ARENA-margin);
    e.y = clamp(pt.y + Math.sin(a)*spread, -ARENA+margin, ARENA-margin);
    e.spriteFace = e.x < G.player.x ? 1 : -1;
  }
  return pk;
}

  const keys = Object.keys(ETYPES);

}

/* Скрытая от обычного игрока панель для быстрой проверки баланса. Карточки
   берутся из того же MODS, что и обычный level-up, и используют те же броски
   значений. Поиск намеренно работает и по читаемому имени, и по id каталога. */
function testValue(m){
  const v = rollModValue(m);
  const shown = m.kind === 'flag' ? 'свойство' : m.kind === 'more' ? '×' + (1+v/100).toFixed(2) :
    m.kind === 'chance' ? Math.round(v) + '%' : m.kind === 'inc' ? '+' + Math.round(v) + '%' : '+' + (Math.round(v*10)/10);
  return {v, shown};
}
function testPreview(m){
  const rolls = G.testRolls || (G.testRolls = {});
  return rolls[m.id] || (rolls[m.id] = testValue(m));
}
function testSkillMatches(m, q){
  const bothLanguages = m.nm + ' ' + tr(m.nm) + ' ' + m.id + ' ' + m.cat + ' ' + tr(m.cat);
  return !q || bothLanguages.toLowerCase().includes(q);
}
function renderTestPanel(){
  const input = $('#testsearch'), q = input ? input.value.trim().toLowerCase() : '';
  const compatible = m => modFitsWeapon(m, G.weapon);
  const list = MODS.filter(m => compatible(m) && testSkillMatches(m, q)).slice(0, 80);
  $('#testresults').innerHTML = list.length ? list.map(m => {
    const preview = testPreview(m);
    const range = m.kind === 'flag' ? 'постоянное свойство' : m.r[0] === m.r[1] ? preview.shown :
      (m.kind === 'inc' ? '+' : '') + m.r[0] + '…' + m.r[1] + (m.kind === 'more' ? '% множитель' : m.kind === 'flat' ? '' : '%');
    const taken = m.kind === 'flag' && G.bag.has(m.stat);
    return '<div class="testskill" data-test-tip="' + m.id + '"><div class="tsbody"><div class="tsname">' + m.nm + '</div><div class="tsmeta">' + m.cat + ' · ' + range + ' · ' + m.id + '</div>' + classAvailabilityHtml(m) + '</div>' +
      '<button data-test-id="' + m.id + '"' + (taken ? ' disabled' : '') + '>' + (taken ? 'ВЗЯТО' : 'ВЫДАТЬ') + '</button></div>';
  }).join('') : '<div class="k" style="padding:14px">Ничего не найдено.</div>';
  document.querySelectorAll('[data-test-id]').forEach(el => el.onclick = () => grantTestSkill(el.dataset.testId));
  document.querySelectorAll('[data-test-tip]').forEach(el => {
    const m = MODS.find(x => x.id === el.dataset.testTip), preview = testPreview(m);
    const card = {m, v:preview.v, val:preview.shown};
    el.onmouseenter = ev => showSkillTip(ev, card);
    el.onmousemove = moveSkillTip;
    el.onmouseleave = hideSkillTip;
  });
}
function grantTestSkill(id){
  const m = MODS.find(x => x.id === id); if (!m) return;
  if (m.kind === 'flag' && G.bag.has(m.stat)) return;
  const t = testPreview(m);
  delete G.testRolls[m.id];
  G.bag.add(m.stat, m.kind, t.v);
  G.picks.push({id:m.id, nm:m.nm, val:t.shown, v:t.v, cat:m.cat});
  recalc();
  // При тестировании свиты новые лимиты сразу заполняются, чтобы не ждать
  // смерти следующего врага и видеть результат карточки моментально.
  if (D.hasMin) while (G.minions.length < D.minMax) spawnMinion();
  renderSheet(); renderTestPanel();
  $('#testsearch').focus();
}
function closeTestPanel(){
  if (!G || !G.testOpen) return;
  G.testOpen = false; G.paused = false;
  hideSkillTip();
  $('#ov').style.display = 'none'; $('#ov').innerHTML = '';
  last = performance.now();
}
function openTestPanel(){
  if (!G || G.over || G.pending || G.inventoryOpen || $('#ov').style.display === 'flex') return;
  G.testOpen = true; G.testRolls = {}; G.paused = true;
  $('#pauseov').style.display = 'none';
  $('#ov').style.display = 'flex'; $('#ov').classList.remove('menu');
  $('#ov').innerHTML = '<div id="testpanel"><h1>ТЕСТОВАЯ ВЫДАЧА НАВЫКОВ</h1><div class="k">Поиск по названию, категории или ID · значения бросаются в обычном диапазоне</div>' +
    '<input id="testsearch" autocomplete="off" placeholder="Например: чума, crit, скорость, min."><div id="testresults"></div><button id="testclose">ПРОДОЛЖИТЬ</button></div>';
  $('#testsearch').oninput = renderTestPanel;
  $('#testclose').onclick = closeTestPanel;

function gameOver(endedEarly){
  G.over = true;
  G.paused = true;
  G.endedEarly = !!endedEarly;
  const earned = Math.floor(G.gold);
  G.earned = earned;
  Store.data.gold += earned;                                       // золото уносится в банк
  Store.data.best = Math.max(Store.data.best || 0, G.floor);
  G.runRecord = runRecordFromGame();
  // Досрочно завершённый забег остаётся обычным итогом, но не могилой: в
  // кладбище попадают только герои, действительно павшие от входящего урона.
  if (!G.endedEarly) addGraveyardRecord(G.runRecord);
  Store.save();
  G.inventoryOpen = false;
  $('#pauseov').style.display = 'none';
  $('#sheet').style.display = 'none';
  $('#inventory').style.display = 'none';
  deathScreen();
}

function endRun(){
  if (!G || G.over) return;
  if (!confirm('Завершить забег и сохранить ' + Math.floor(G.gold) + ' золота в банк?')) return;
  $('#pauseov').style.display = 'none';
  gameOver(true);
}

function summaryEsc(value){
  return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function summaryFmt(n){ return Math.round(Number(n) || 0).toLocaleString(LANGUAGE === 'ru' ? 'ru-RU' : 'en-US'); }
function summaryTime(seconds){
  const duration = Math.floor(Number(seconds) || 0), mins = Math.floor(duration/60), secs = duration%60;
  return mins + ':' + String(secs).padStart(2, '0');
}
function summaryCell(label, value){ return '<div class="summary-cell"><span>' + label + '</span><b>' + value + '</b></div>'; }
function runSummaryGrid(r){
  return '<div class="summary-grid">' +
    summaryCell('УБИТО ВСЕГО', summaryFmt(r.kills)) + summaryCell('ОБЫЧНЫЕ / ЭЛИТЫ / БОССЫ', summaryFmt(r.normals) + ' / ' + summaryFmt(r.elites) + ' / ' + summaryFmt(r.bosses)) +
    summaryCell('НАНЕСЕНО УРОНА', summaryFmt(r.damage)) + summaryCell('САМЫЙ СИЛЬНЫЙ УДАР', summaryFmt(r.maxHit)) +

    summaryCell('ВОССТАНОВЛЕНО HP', summaryFmt(r.healing)) + summaryCell('ПРОЙДЕНО РАССТОЯНИЕ', summaryFmt(r.distance)) +
    summaryCell('МОДИФИКАТОРОВ', summaryFmt(r.modifiers)) + summaryCell('КНИГИ / ТИРЫ КНИГ', summaryFmt(r.books) + ' / ' + summaryFmt(r.bookTiers)) +
    summaryCell('СНАРЯЖЕНИЕ / ТОТЕМЫ', summaryFmt(r.amulets) + ' / ' + summaryFmt(r.totems)) + summaryCell('ЗАЧИЩЕННЫХ ЭТАЖЕЙ', summaryFmt(r.cleared)) +
    '</div>';
}
function runRecordFromGame(){
  const s = G.stats || {}, death = G.player.deathLog || null;
  const weaponKey = Object.keys(WEAPONS).find(k => WEAPONS[k] === G.weapon || WEAPONS[k].id === G.weapon.id) || 'bow';
  const subclass = (SUBCLASSES[weaponKey] || []).find(it => it.id === G.subclass);
  return {
    stamp:Date.now(), weaponId:G.weapon.id, weaponName:G.weapon.nm,
    subclassName:subclass ? subclass.nm : '', sprite:{bow:'archer',wand:'mage',necro:'necromancer',blade:'warrior'}[weaponKey] || 'archer',
    floor:G.floor, lvl:G.lvl, duration:Math.floor(G.time), earned:G.earned || 0,
    bankAfter:Store.data.gold, bestAfter:Store.data.best || G.floor,
    cause:death ? death.cause : 'неизвестна', deathDmg:death ? death.dmg : 0,
    kills:G.player.kills, normals:s.normals, elites:s.elites, bosses:s.bosses,
    damage:s.damage, maxHit:s.maxHit, crits:s.crits, taken:s.taken, healing:s.healing, distance:s.distance,
    modifiers:G.picks.length, books:Object.keys(G.items).length,
    bookTiers:Object.values(G.items).reduce((n, it) => n + it.tier, 0),
    amulets:AMU_KEYS.filter(k => G.amu[k]).length,
    totems:TOTEM_KEYS.filter(k => totemTier(k)).length,
    cleared:Math.max(0, G.floor-1),
  };
}
function addGraveyardRecord(record){
  const rows = normalizeGraveyard(Store.data);
  Store.data.graveyard = [record].concat(rows).slice(0,10);
  normalizeGraveyard(Store.data);
  return Store.data.graveyard;
}

function refreshShop(back){
  const shop=$('#shop'),scrollTop=shop?Math.max(0,Number(shop.scrollTop)||0):0;
  shopScreen(back,scrollTop);
}

/* Покупка пачкой. Идём по одному уровню: цена растёт после каждого,
   поэтому «купить 10» может закончиться на седьмом — это не ошибка, а честный расчёт. */
function shopBuy(it, n, back){
  const sh = Store.data.shop || (Store.data.shop = {});
  let bought = 0, paid = 0;
  for (let i = 0; i < n; i++){
    const lvl = shopLvl(it.id);
    if (lvl >= it.max) break;
    const c = shopCost(it, lvl);
    if (Store.data.gold < c) break;
    Store.data.gold -= c;
    Store.data.spent = (Store.data.spent || 0) + c;
    sh[it.id] = lvl + 1;
    bought++; paid += c;
  }
  if (!bought) return;
  Store.save();
  // Если магазин открыли посреди партии (а это возможно только с экрана смерти),
  // билд уже собран — покупки вступят в силу со следующей партии.
  refreshShop(back);
}

/* Откат покупки возвращает полную цену отменяемых уровней. Нельзя уйти ниже
   нулевого ранга или получить золото повторно из уже пустой ветки. */
function shopRefund(it, n, back){
  const sh = Store.data.shop || (Store.data.shop = {});
  const refund = shopRefundBatch(it, n);
  if (!refund.cnt) return;
  const nextLvl = shopLvl(it.id) - refund.cnt;
  if (nextLvl > 0) sh[it.id] = nextLvl;
  else delete sh[it.id];
  Store.data.gold += refund.sum;
  Store.data.spent = Math.max(0, (Store.data.spent || 0) - refund.sum);
  Store.save();
  refreshShop(back);
}

/* Один общий откат очищает только канонические магазинные бонусы и возвращает
   точную сумму всех их фактически купленных рангов. */
function shopRefundAll(back){
  const refund=shopRefundTotal();
  if (!refund.cnt) return false;
  const sh=Store.data.shop || (Store.data.shop={});
  for (const it of SHOP) delete sh[it.id];
  Store.data.gold+=refund.sum;
  Store.data.spent=0;
  Store.save();
  refreshShop(back);
  return refund;
}

/* ---------- 10c. СОЗВЕЗДИЯ ----------
   Убийства — условие, не валюта: они никогда не списываются. Каждый клик
   открывает ровно один ранг, чтобы игрок видел, как загорается новый узел. */
function constellationReadyCount(){
  let n = 0;
  for (const it of CONSTELLATIONS){
    const rank = constellationRank(it.id);
    if (rank < 10 && constellationKills(it.id) >= it.req[rank]) n++;
  }
  return n;
}

function constellationUnlock(id, back){
  const it = CONSTELLATIONS.find(x => x.id === id); if (!it) return false;
  const cs = constellationState(), rank = cs.ranks[id];
  if (rank >= 10 || cs.kills[id] < it.req[rank]) return false;
  const list = $('#constellations');
  const scrollTop = list ? Math.max(0, Number(list.scrollTop) || 0) : 0;
  cs.ranks[id] = rank + 1;
  Store.save();
  tone(520, 0.08, 0.035, 'triangle'); tone(780, 0.15, 0.04, 'triangle', 0.07);
  constellationScreen(back, scrollTop);
  return true;
}

/* Временный инструмент разработки: снимает только активные ранги. Накопленные
   убийства остаются условием доступа, поэтому те же узлы можно включить снова. */
function constellationResetBonuses(back){
  const cs = constellationState();
  const removed = CONST_IDS.reduce((sum,id) => sum + cs.ranks[id], 0);
  if (!removed) return false;
  const list = $('#constellations');
  const scrollTop = list ? Math.max(0, Number(list.scrollTop) || 0) : 0;
  for (const id of CONST_IDS) cs.ranks[id] = 0;
  Store.save();
  tone(190, 0.12, 0.035, 'sawtooth');
  constellationScreen(back, scrollTop);
  return removed;
}

function constellationScreen(back, restoreScrollTop=0){
  $('#sheet').style.display = 'none'; $('#inventory').style.display = 'none';
  $('#ov').style.display = 'flex'; $('#ov').classList.add('menu'); menuMode = true;

    const rank = constellationRank(it.id), kills = constellationKills(it.id), maxed = rank >= 10;
    const next = maxed ? it.req[9] : it.req[rank], prev = rank ? it.req[rank-1] : 0;
    const ready = !maxed && kills >= next;
    const pct = maxed ? 100 : clamp((kills-prev) / Math.max(1,next-prev) * 100, 0, 100);
    const nodes = it.req.map((_,i) => '<i class="const-node' + (i < rank ? ' done' : i === rank && ready ? ' ready' : '') + '" title="Ранг ' + (i+1) + ': ' + fmt(it.req[i]) + ' убийств"></i>').join('');

      : ready
        ? '<button class="const-unlock" data-const-id="' + it.id + '">ОТКРЫТЬ РАНГ</button>'
        : '<div class="const-locked">ДО НОВОЙ ЗВЕЗДЫ: ' + fmt(Math.max(0,next-kills)) + '</div>';
    return '<article class="const-card" style="--cc:' + it.col + '">' +
      '<div class="const-head"><canvas class="const-icon" data-const-icon="' + it.id + '" width="54" height="54"></canvas>' +
        '<div class="const-title"><b>' + it.nm + '</b><span>' + it.sub + '</span></div>' +
        '<div class="const-rank">' + rank + '<small>РАНГ / 10</small></div></div>' +
      '<div class="const-effect"><b>+' + (rank*5) + '%</b> к урону, опыту и золоту за этот тип врагов</div>' +
      '<div class="const-nodes">' + nodes + '</div>' +
      '<div class="const-progress-line"><span>УБИТО: <b>' + fmt(kills) + '</b></span><span>' + (maxed ? 'МАКСИМУМ' : 'ЦЕЛЬ: <b>' + fmt(next) + '</b>') + '</span></div>' +
      '<div class="const-progress"><i style="width:' + pct.toFixed(2) + '%"></i></div>' + action + '</article>';
  };
  $('#ov').innerHTML =
    '<h1 style="color:#d9c7ff">СОЗВЕЗДИЯ</h1>' +
    '<h2>вечная охота · убийства не расходуются · каждый открытый узел даёт +5%</h2>' +
    '<div id="constellations"><div class="const-sky"><canvas id="constsky"></canvas><div class="const-sky-copy"><b>КАРТА ВЕЧНОЙ ОХОТЫ</b><span>ШЕСТЬ ПУТЕЙ · ДЕСЯТЬ ЗВЁЗД В КАЖДОМ</span></div></div>' +
      '<div class="const-grid">' + CONSTELLATIONS.map(card).join('') + '</div></div>' +
    '<div class="const-actions"><button id="constreset"' + (invested ? '' : ' disabled') + '>УБРАТЬ БОНУСЫ</button>' +
      '<button id="constback">НАЗАД</button></div>' +
    '<div class="k">Убийства сохранятся — доступные узлы можно открыть заново.</div>';
  document.querySelectorAll('[data-const-id]').forEach(el => el.onclick = () => constellationUnlock(el.dataset.constId, back));
  $('#constreset').onclick = () => constellationResetBonuses(back);
  $('#constback').onclick = () => back();
  const list = $('#constellations');
  if (list) list.scrollTop = Math.max(0, Number(restoreScrollTop) || 0);
  drawConstellationArt(performance.now()/1000);

function constellationPath(g, shape, x, y, r){
  g.beginPath();
  if (shape === 'circle') g.arc(x,y,r,0,Math.PI*2);
  else if (shape === 'triangle'){ g.moveTo(x,y-r); g.lineTo(x+r*.92,y+r*.75); g.lineTo(x-r*.92,y+r*.75); g.closePath(); }
  else if (shape === 'square') g.rect(x-r*.78,y-r*.78,r*1.56,r*1.56);
  else if (shape === 'diamond'){ g.moveTo(x,y-r); g.lineTo(x+r,y); g.lineTo(x,y+r); g.lineTo(x-r,y); g.closePath(); }
  else {
    const points = shape === 'boss' ? 12 : 8;
    for (let i=0;i<points;i++){
      const rr = i%2 ? r*.48 : r, a = -Math.PI/2 + i*Math.PI*2/points;
      if (!i) g.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr); else g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);
    }
    g.closePath();
  }
}

function drawConstellationIcon(cv2, it, t){
  if (!cv2 || !cv2.getContext) return;
  const g = cv2.getContext('2d'), w=cv2.width, h=cv2.height, pulse=0.82+Math.sin(t*2+CONST_IDS.indexOf(it.id))*0.12;
  g.clearRect(0,0,w,h);
  const regular = ENEMY_SPRITE_META[it.id], custom = CONSTELLATION_SPRITES[it.id];
  const sprite = regular ? ENEMY_SPRITES[it.id] : custom;
  if (it.sprite !== false && sprite && sprite.complete && sprite.naturalWidth){
    const frameSize = regular ? (it.id === 'tank' ? 48 : 40) : 48;
    const frame = Math.floor(t*6 + Math.max(0,CONST_IDS.indexOf(it.id))) % 4;
    g.save(); g.imageSmoothingEnabled=false; g.shadowColor=it.col; g.shadowBlur=8*pulse;
    g.drawImage(sprite,frame*frameSize,0,frameSize,frameSize,3,3,48,48); g.restore();
    return;
  }
  g.save(); g.shadowColor=it.col; g.shadowBlur=12*pulse;
  g.strokeStyle=it.col; g.fillStyle=it.col+'22'; g.lineWidth=2;
  constellationPath(g,it.shape,w/2,h/2,17); g.fill(); g.stroke();
  g.fillStyle='#f5efff'; g.shadowBlur=7; g.beginPath(); g.arc(w/2,h/2,2.2,0,Math.PI*2); g.fill(); g.restore();
}

function drawConstellationArt(t){
  const sky = $('#constsky');
  if (sky && sky.getContext){
    const d=window.devicePixelRatio||1, w=sky.clientWidth||900, h=sky.clientHeight||152;
    if (sky.width!==Math.round(w*d)||sky.height!==Math.round(h*d)){ sky.width=Math.round(w*d); sky.height=Math.round(h*d); }
    const g=sky.getContext('2d'); g.setTransform(d,0,0,d,0,0); g.clearRect(0,0,w,h);
    for (let i=0;i<72;i++){
      const x=((i*97+31)%997)/997*w, y=((i*i*29+i*17+13)%389)/389*h;
      const a=.18+.42*(.5+.5*Math.sin(t*(.7+(i%5)*.11)+i));
      g.fillStyle='rgba(226,218,255,'+a.toFixed(3)+')'; g.fillRect(x,y,i%11===0?2:1,i%11===0?2:1);
    }
    const pts=CONSTELLATIONS.map((it,i)=>({x:w*(.14+i*.144),y:h*(.63-Math.sin(i*.92)*.27),it}));
    g.lineWidth=1;
    for(let i=0;i<pts.length-1;i++){ const a=pts[i],b=pts[i+1]; g.strokeStyle='rgba(157,125,224,.34)'; g.beginPath(); g.moveTo(a.x,a.y); g.lineTo(b.x,b.y); g.stroke(); }

function reducedMenuMotion(){
  return typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
}
function drawBrandTitle(t){
  const cv3 = $('#brandnm');
  if (!cv3 || !GRIM_GRIND_LOGO_STRIP || !GRIM_GRIND_LOGO_STRIP.complete || !GRIM_GRIND_LOGO_STRIP.naturalWidth) return;
  const tm = Number.isFinite(t) ? t : performance.now()/1000;
  const frame = reducedMenuMotion() ? 0 : Math.floor(tm*GRIM_GRIND_LOGO_FRAME.fps) % GRIM_GRIND_LOGO_FRAME.count;
  const g = cv3.getContext('2d');
  g.clearRect(0,0,GRIM_GRIND_LOGO_FRAME.w,GRIM_GRIND_LOGO_FRAME.h);
  g.imageSmoothingEnabled = false;
  g.drawImage(GRIM_GRIND_LOGO_STRIP,
    frame*GRIM_GRIND_LOGO_FRAME.w, 0,
    GRIM_GRIND_LOGO_FRAME.w, GRIM_GRIND_LOGO_FRAME.h,
    0, 0, GRIM_GRIND_LOGO_FRAME.w, GRIM_GRIND_LOGO_FRAME.h);
}
function drawBrandTorches(t){
  if (!GRIM_GRIND_TORCH_STRIP || !GRIM_GRIND_TORCH_STRIP.complete || !GRIM_GRIND_TORCH_STRIP.naturalWidth) return;
  const tm = Number.isFinite(t) ? t : performance.now()/1000;
  const frame = reducedMenuMotion() ? 0 : Math.floor(tm*GRIM_GRIND_TORCH_FRAME.fps) % GRIM_GRIND_TORCH_FRAME.count;
  for (const id of ['#brandtorchl','#brandtorchr']){
    const torch=$(id); if (!torch || !torch.getContext) continue;
    const g=torch.getContext('2d'); g.clearRect(0,0,GRIM_GRIND_TORCH_FRAME.w,GRIM_GRIND_TORCH_FRAME.h);
    g.imageSmoothingEnabled=false;
    g.drawImage(GRIM_GRIND_TORCH_STRIP,frame*GRIM_GRIND_TORCH_FRAME.w,0,
      GRIM_GRIND_TORCH_FRAME.w,GRIM_GRIND_TORCH_FRAME.h,
      0,0,GRIM_GRIND_TORCH_FRAME.w,GRIM_GRIND_TORCH_FRAME.h);
  }
}

/* Один тик меню: анимация монет магазина из общего цикла. */
function menuTick(){
  const t = performance.now()/1000;
  drawBrandTitle(t);
  drawBrandTorches(t);
  coinTick(t);
  drawConstellationArt(t);
  drawGraveIcon(t);
}

      '<button id="graveb" class="grave-entry"><canvas id="graveicon" width="46" height="46"></canvas><span class="grave-entry-copy">КЛАДБИЩЕ<small>' +
        (graveCount ? 'последних записей: ' + graveCount : 'ПОКА ПУСТО') + '</small></span></button></div>' +
    '<span id="bank">В БАНКЕ: ' + Math.round(Store.data.gold).toLocaleString(LANGUAGE === 'ru' ? 'ru-RU' : 'en-US') + ' золота</span>';

/* Второй шаг: класс задаёт стиль атаки, подкласс — постоянный рост забега. */
function subclassScreen(wk){
  const W = WEAPONS[wk], choices = SUBCLASSES[wk] || [];
  menuMode = true; $('#ov').classList.add('menu');
  $('#ov').innerHTML =
    brandHtml() +
    '<h2 style="color:var(--amber);letter-spacing:3px;font-size:22px">' + W.nm + '</h2>' +
    '<h2>выберите подкласс · его бонусы растут с каждым уровнем</h2>' +
    '<div class="cards">' + choices.map(s =>
      '<div class="card" data-s="' + s.id + '">' +
        '<div class="cat">подкласс</div><div class="nm">' + s.nm + '</div>' +
        '<div class="vl">' + s.ico + '</div><div class="nt">' + s.desc + '</div>' +
      '</div>').join('') + '</div>' +
    '<button id="back">НАЗАД К ВЫБОРУ КЛАССА</button>';
  drawBrandTitle();
  document.querySelectorAll('#ov .card').forEach(el => el.onclick = () => controlScreen(wk, el.dataset.s));
  $('#back').onclick = startScreen;
}

/* Второй шаг стартового экрана: чем играть */
const CONTROLS = {
  keys: {nm:'КЛАВИАТУРА', ico:'WASD',
         desc:'Движение на WASD или стрелках. Точный контроль остановки — удобно для билдов на стрельбу с места.'},
  mouse:{nm:'МЫШЬ', ico:'\u2316',
         desc:'Персонаж непрерывно бежит к курсору. Чтобы встать, наведите курсор на себя — вокруг персонажа есть зона покоя.'},
};
function controlScreen(wk, subclassKey){
  const subclass = (SUBCLASSES[wk] || []).find(s => s.id === subclassKey);
  menuMode = true; $('#ov').classList.add('menu');
  $('#ov').innerHTML =
    brandHtml() +
    '<h2 style="color:var(--amber);letter-spacing:3px;font-size:22px">' + WEAPONS[wk].nm + '</h2>' +
    '<div class="k" style="font-size:14px">подкласс: ' + (subclass ? subclass.nm : '—') + '</div>' +
    '<h2>чем управлять? · сменить можно в любой момент на C</h2>' +
    '<div class="cards">' + Object.keys(CONTROLS).map(ck => {
      const C = CONTROLS[ck];
      return '<div class="card" data-c="' + ck + '">' +
        '<div class="cat">управление</div>' +
        '<div class="nm">' + C.nm + '</div>' +
        '<div class="vl">' + C.ico + '</div>' +
        '<div class="nt">' + C.desc + '</div></div>';
    }).join('') + '</div>' +
    '<div class="k" style="font-size:13px">Атака автоматическая в обеих схемах · ПРОБЕЛ — рывок · ESC или P — пауза</div>' +
    '<button id="back">НАЗАД К ВЫБОРУ КЛАССА</button>';
  drawBrandTitle();
  document.querySelectorAll('#ov .card').forEach(el => el.onclick = () => {
    newGame(wk, el.dataset.c, subclassKey);
    menuMode = false; $('#ov').classList.remove('menu');
    cv.classList.toggle('mouse-mode', el.dataset.c === 'mouse');
    setHint(); renderSheet(); last = performance.now();
    // Покупка «Первый шаг» выдаёт именно выборы из обычной раздачи: все фильтры,
    // приоритеты и правила классов остаются одними и теми же уже с первого боя.
    if (G.pending) showLevelUp();
    else { $('#ov').style.display = 'none'; $('#ov').innerHTML = ''; }
  });
  $('#back').onclick = () => subclassScreen(wk);
}

/* Подсказка внизу экрана зависит от выбранной схемы */
/* Смена схемы управления на лету. Обе схемы уже полностью поддержаны в update(),
   так что переключение — это ровно смена флага плюс уборка за прошлой схемой. */
function toggleControl(){
  G.control = G.control === 'mouse' ? 'keys' : 'mouse';
  if (G.control === 'mouse'){
    // Курсор с прошлого раза мог остаться где угодно, а мышиная схема гонит
    // персонажа к нему постоянно. Ставим цель в центр экрана: камера держит
    // игрока ровно там, то есть это центр мёртвой зоны — до первого движения
    // мыши персонаж стоит, а не срывается в сторону.
    G.mouse.x = W/2; G.mouse.y = H/2;
  }
  // Зажатая WASD осталась бы в G.keys как нажатая: keyup по ней уже не придёт
  // в том смысле, в каком его ждёт схема. Гасим всё, что удерживалось.
  for (const k in G.keys) G.keys[k] = false;
  const p = G.player; p.moving = false;
  setHint();
  toast('УПРАВЛЕНИЕ: ' + CONTROLS[G.control].nm);
  G.fx.push({t:'ring', x:p.x, y:p.y, r:8, max:70, life:0.4, col:'#4fd1c5'});
}

function setHint(){
  $('#hint').textContent = (G.control === 'mouse'
      ? 'МЫШЬ — движение к курсору, наведите на себя чтобы встать'
      : 'WASD / ЦФЫВ — движение')
    + ' · атака автоматическая · ПРОБЕЛ — рывок · C — сменить управление · TAB — инвентарь · ESC/P — пауза';
}

function tryDash(){
  const p = G.player;
  if (p.dashN <= 0 || p.dash > 0) return false;
  p.dashN--;
  if (p.dashCd <= 0) p.dashCd = D.dashCd;            // откат начинается в момент расходования
  p.dash = DASH_DURATION;
  p.inv = D.iframe;
  p.dashHits = [];
  return true;
}

/* ---------- 12. ВВОД ---------- */
/* e.key зависит от активной раскладки: физическая W при русской раскладке
   приходит как «ц». e.code описывает именно положение клавиши, поэтому
   приводим игровые кнопки к каноническим именам до записи в G.keys.
   Fallback на e.key сохраняет совместимость с тестами и старыми браузерами. */
const PHYSICAL_KEYS = {
  KeyW:'w', KeyA:'a', KeyS:'s', KeyD:'d',
  KeyC:'c', KeyV:'v', KeyK:'k', KeyL:'l', KeyP:'p',
  Digit1:'1', Digit2:'2', Digit3:'3', Digit4:'4',
  Numpad1:'1', Numpad2:'2', Numpad3:'3', Numpad4:'4',
  ArrowUp:'arrowup', ArrowDown:'arrowdown', ArrowLeft:'arrowleft', ArrowRight:'arrowright',
  Space:' ', Tab:'tab', Escape:'escape'
};
function inputKey(e){
  return PHYSICAL_KEYS[e.code] || String(e.key || '').toLowerCase();
}
function handleGameKeyDown(e){
  unlockSound();
  if (!G) return;
  const k = inputKey(e);
  if (G.over) return;
  // Spawn Menu так же перехватывает ввод целиком: K/Escape закрывают окно,
  // остальные клавиши не доходят до движения и боевых действий.
  if (G.spawnOpen){
    if (!e.repeat && (k === 'k' || k === 'escape')){ e.preventDefault(); closeSpawnMenu(); }
    return;
  }
  // Тестовая панель полностью перехватывает клавиатуру, чтобы поиск не двигал
  // героя и не тратил рывок. L либо Escape закрывают её и продолжают бой.
  if (G.testOpen){
    if (!e.repeat && (k === 'l' || k === 'escape')){ e.preventDefault(); closeTestPanel(); }
    return;
  }
  // В окне повышения уровня пробел принадлежит перебросу, а не рывку.
  // Повторный keydown от удержания не должен сжигать весь запас перебросов.
  if (G.pending > 0 && k === ' '){
    e.preventDefault();
    if (!e.repeat) rerollLevelUp();
    return;
  }
  if (G.pending > 0 && ['1','2','3','4'].includes(k)){
    e.preventDefault();
    if (!e.repeat) chooseLevelUpCard(Number(k)-1);
    return;
  }
  if (k === 'k' && !e.repeat){ e.preventDefault(); openSpawnMenu(); return; }
  if (k === 'l' && !e.repeat){ e.preventDefault(); openTestPanel(); return; }
  // Инвентарь — безопасная пауза: пока он открыт, действия персонажа не должны
  // тратить рывки, менять управление или срабатывать от случайных клавиш.
  if (G.inventoryOpen && !['tab','escape','p'].includes(k)) return;
  G.keys[k] = true;
  if (k === ' '){                                                   // рывок
    e.preventDefault();
    tryDash();
  }
  // e.repeat: браузер шлёт keydown повторно, пока клавиша зажата.
  // Без этой проверки удержание C дёргало бы схему по десять раз в секунду.
  if (k === 'c' && !e.repeat) toggleControl();
  if (k === 'tab' && !e.repeat){
    e.preventDefault();                            // иначе Tab уводит фокус со страницы
    toggleInventory();
  }
  if (k === 'v' && !e.repeat && !G.inventoryOpen){
    const sh = $('#sheet');
    sh.style.display = sh.style.display === 'block' ? 'none' : 'block';
    renderSheet();
  }
  if (k === 'p' || k === 'escape'){
    if (G.inventoryOpen){ toggleInventory(); return; }
    if (G.pending || G.over || $('#ov').style.display === 'flex') return;  // модалки паузу не трогают
    G.paused = !G.paused;
    $('#pauseov').style.display = G.paused ? 'flex' : 'none';
    last = performance.now();
  }
}
addEventListener('keydown', handleGameKeyDown);
addEventListener('keyup', e => { if (G) G.keys[inputKey(e)] = false; });
addEventListener('pointerdown', unlockSound, {passive:true});
$('#endrun').onclick = endRun;
cv.addEventListener('mousemove', e => {
  if (!G) return;
  const r = cv.getBoundingClientRect();
  G.mouse.x = e.clientX - r.left; G.mouse.y = e.clientY - r.top;
});
cv.addEventListener('contextmenu', e => e.preventDefault());

/* Подставляется на сборке. Если осталось как есть — файл открыт напрямую. */
const BUILD = '__BUILD__';
$('#build').textContent = BUILD.indexOf('BUILD') >= 0 ? 'dev' : BUILD;

resize();
Store.load().then(() => { startScreen(); requestAnimationFrame(loop); });
</script>
