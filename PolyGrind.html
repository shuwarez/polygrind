<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grim Grind</title>
<style>
/* ============================================================
   СТИЛИ ИНТЕРФЕЙСА
   Палитра: холодный графит + янтарный игрок + кислотные враги.
   ============================================================ */
:root{
  --bg:#0d1014;          /* фон арены */
  --grid:#171d24;        /* линии сетки */
  --ink:#f4f8fc;         /* основной текст */
  --dim:#b3c2d1;         /* второстепенный текст */
  --amber:#ffb340;       /* игрок */
  --hp:#e0405a;          /* здоровье */
  --xp:#4fd1c5;          /* опыт */
  --panel:#11161c;       /* панели UI */
  --line:#38434f;        /* рамки */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);
  font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;overflow:hidden;font-weight:600}
#wrap{position:relative;width:100vw;height:100vh}
canvas{display:block;width:100%;height:100%;cursor:default}
canvas.mouse-mode{cursor:none}

/* --- Верхняя строка состояния --- */
#hud{position:absolute;top:0;left:0;right:0;padding:10px 14px;pointer-events:none;
  display:flex;gap:14px;align-items:flex-start}
.bar{height:14px;background:#000a;border:1px solid var(--line);border-radius:2px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;transition:width .12s linear}
.bar>span{position:absolute;inset:0;font-size:12.5px;line-height:14px;text-align:center;letter-spacing:.5px}
#hpbar{width:280px;transform-origin:left center;transition:transform .06s ease-out,border-color .06s}
#hpbar>b{position:absolute;inset:0 auto 0 0;background:#fff9;pointer-events:none;transition:width .04s linear}
#hpbar>i{position:relative;z-index:1}
#hpbar>span{z-index:2}
#hpbar.hurt{transform:scale(1.045);border-color:#ff9a9a;box-shadow:0 0 12px #ff243f88}
#hpbar.hurt>i{background:#ff1938!important}
#xpbar{width:280px;height:8px;margin-top:4px}
#floorbox{margin-left:auto;text-align:right;font-size:15px;line-height:1.5}
#floorbox b{font-size:25px;color:var(--amber)}
#warriorbuffs{position:absolute;left:14px;bottom:78px;display:none;color:#dbe6ef;
  font-size:12px;line-height:1.55;text-shadow:0 1px 3px #000;pointer-events:none}
#warriorbuffs div{border-left:2px solid #d5a64a;padding-left:7px}
.k{color:var(--dim)}

/* --- Оверлеи (выбор оружия, уровень, смерть) --- */
.overlay{position:absolute;inset:0;background:#070a0dee;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:22px;padding:24px;z-index:10}
.overlay h1{font-size:37.5px;letter-spacing:6px;font-weight:600}

/* --- Главное меню --- */
/* Затемнение краёв собирает внимание на выборе класса. */
.overlay.menu{background:radial-gradient(ellipse 70% 60% at 50% 42%, #12100de8 0%, #05070af2 75%);
  justify-content:safe center;overflow-y:auto;gap:14px;padding:12px 24px 24px}
#brand{display:flex;align-items:center;justify-content:center;gap:clamp(8px,1.4vw,18px);max-width:100%}
/* Логотип и факел хранятся в двух компактных индексированных листах. Canvas
   проигрывает восемь кадров, а CSS только масштабирует готовые пиксели. */
#brandnm{display:block;width:clamp(260px,30vw,340px);height:auto;aspect-ratio:8/3;
  image-rendering:pixelated;image-rendering:crisp-edges;
  filter:drop-shadow(0 8px 8px #000b) drop-shadow(0 0 11px #9b271844)}
.brandtorch{display:block;width:clamp(48px,5vw,64px);height:auto;aspect-ratio:3/8;
  image-rendering:pixelated;image-rendering:crisp-edges;
  filter:drop-shadow(0 7px 5px #000c) drop-shadow(0 0 12px #ff6a1f55)}
#brandtorchr{transform:scaleX(-1)}
/* Тёплое выделение карточек поддерживает золотую палитру игры. */
.overlay.menu .card:hover{border-color:#ff9a2f;box-shadow:0 0 22px #ff8a2f22}
.overlay.menu button{border-color:#6b4a24}
.overlay.menu button:hover{border-color:#ffb340;box-shadow:0 0 16px #ff8a2f33}
.overlay h2{font-size:18.8px;color:var(--dim);font-weight:400;letter-spacing:1px}
.cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:1160px}
.level-actions{display:flex;flex-direction:column;align-items:stretch;gap:8px;min-width:290px}
.level-actions button{width:100%}
.level-key-hint{font-size:11px;letter-spacing:1.1px;text-align:center;color:#8293a6}
.reroll-key{display:inline-block;margin-left:5px;padding:2px 5px;border:1px solid #596574;border-radius:3px;
  background:#0b1016;color:#c8d4e2;font:700 10px/1 monospace;letter-spacing:.8px;vertical-align:1px}
#skilltips-toggle{font-size:12px;padding:7px 14px;color:#a9c7ff;border-color:#496b98;background:#0f1721}
#skilltips-toggle:hover{border-color:#84aef8;box-shadow:0 0 14px #6fa8ff22}
#skilltips-toggle.tips-off{color:#7d8b9a;border-color:#36414e;background:#101419}
/* 1000px разбивали четыре карточки на 3+1: при открытой в магазине четвёртой
   карте ряд обязан вставать в одну строку, иначе выбор читается как «3 и ещё одна». */
.card{width:270px;min-height:160px;background:var(--panel);border:1px solid var(--line);
  border-radius:4px;padding:16px;cursor:pointer;transition:.12s;display:flex;flex-direction:column;gap:8px}
.card:hover{border-color:var(--amber);transform:translateY(-3px)}
.card.class-card{position:relative;min-height:340px;padding:20px 18px 18px;align-items:center;
  text-align:center;gap:14px;overflow:hidden;background:radial-gradient(circle at 50% 46%,#1a2028 0,#11161c 68%)}
.class-card .nm{font-size:23px;letter-spacing:2.5px;line-height:1.2;color:#f7fafc}
.class-card .class-sprite{position:relative;width:150px;height:150px;margin:2px auto 0;
  image-rendering:pixelated;image-rendering:crisp-edges;pointer-events:none;
  filter:drop-shadow(0 8px 6px #000b);transition:transform .12s,filter .12s}
.class-card .nt{display:flex;align-items:flex-start;justify-content:center;min-height:62px;
  margin-top:auto;max-width:225px;font-size:12.8px;line-height:1.45;color:#aebbc8}
.card.class-card:hover .class-sprite{transform:scale(1.06);filter:drop-shadow(0 10px 8px #000c)}
.hero-preview{display:inline-block;flex:0 0 auto;background-repeat:no-repeat;background-position:center;background-size:contain}
.hero-preview.sheet{background-position:0 0;background-size:400% 100%}
.card .cat{font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim)}
.card .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;min-height:24px}
.card .card-top .cat{min-width:0;padding-top:3px}
.level-key-group{display:flex;align-items:flex-start;gap:8px;min-width:0}
.level-key{display:inline-grid;place-items:center;flex:0 0 auto;width:23px;height:23px;padding:0;
  border:1px solid #8b6634;border-radius:3px;background:#1b140b;color:#ffc05a;font:700 13px/1 monospace;
  box-shadow:inset 0 0 0 1px #ffffff0b}
/* Ограничение по классам выводится из тех же wep/req/noMin, что фильтруют пул.
   Универсальные карточки не получают лишней плашки; на остальных маленькие
   пиксельные знаки читаются и цветом, и формой, а названия доступны в tooltip. */
.class-access{display:flex;align-items:center;justify-content:flex-end;gap:4px;flex:0 0 auto}
.class-access-label{font-size:8px;line-height:1;letter-spacing:.8px;color:#647487;text-transform:uppercase;margin-right:1px}
.class-icon{display:inline-grid;place-items:center;width:23px;height:23px;border:1px solid currentColor;
  border-radius:3px;background:#0a0e13;box-shadow:inset 0 0 0 1px #ffffff0b;line-height:0}
.class-icon svg{display:block;width:17px;height:17px;overflow:visible;image-rendering:pixelated;shape-rendering:crispEdges}
.class-icon-warrior{color:#f0a43c}.class-icon-archer{color:#8bd35b}
.class-icon-mage{color:#b58aff}.class-icon-necromancer{color:#89d6b0}
.card .nm{font-size:18.8px;font-weight:600;line-height:1.35}
.card .vl{font-size:27.5px;color:var(--amber);font-weight:700}
.card-example{margin-top:1px;padding:8px 9px;background:#0d151e;border:1px solid #26394d;border-left:2px solid #6fb3ff;
  color:#c8d8e8;font-size:12.2px;line-height:1.45}
.card-example b{display:block;color:#8fbcff;font-size:10px;letter-spacing:1.2px;margin-bottom:2px}
.card .nt{font-size:13.8px;color:var(--dim);line-height:1.5;margin-top:auto}
.card .id{font-size:11.2px;color:#3d4854;letter-spacing:.5px}
.card.r-rare{border-color:#3a6ea5}   .card.r-rare  .vl{color:#6fb3ff}
.card.r-epic{border-color:#7a4fb5}   .card.r-epic  .vl{color:#c08cff}
.card.r-key {border-color:#b55a2a;background:#1a1210} .card.r-key .vl{color:#ff8a3d}
/* Красная редкость: выше кейстоуна. Отдельный уровень нужен потому, что такие
   карточки не выпадают в общей рулетке вообще — их открывает только доведённая
   до потолка ветка, и игрок должен опознать это с одного взгляда. */
/* Метка «действует и на свиту». Показывается только некроманту и только на
   тех карточках, чей бонус реально доходит до приспешников. */
/* «Сейчас» рядом с прибавкой: игрок должен видеть, к чему прибавляет.
   +44% к урону свиты значат разное при нуле и при двухстах уже вложенных. */
.card .vl .cur{display:block;font-size:12.5px;letter-spacing:1px;color:#7d8b9a;
  font-weight:400;margin-top:2px}
.card .mn{display:inline-block;margin-top:7px;font-size:11px;letter-spacing:1.5px;
  color:#8be04e;border:1px solid #8be04e55;border-radius:3px;padding:2px 6px;font-weight:700}
.card.r-blood{border-color:#c02a2a;background:#1c0f11;box-shadow:0 0 18px #ff2a2a22}
.card.r-blood .vl{color:#ff5a4e}
.card.r-blood .nm{color:#ff8a80}
button{font-family:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);
  padding:9px 20px;border-radius:3px;cursor:pointer;font-size:15px;letter-spacing:1px}
button:hover{border-color:var(--amber)}
button:disabled{opacity:.35;cursor:default}
.shop-entry{display:flex;align-items:center;justify-content:center;gap:2px;min-width:250px;min-height:62px;
  padding:6px 16px;border:2px solid #d79b27;background:linear-gradient(180deg,#3d2a0c,#17120a);
  color:#ffe5a0;font-size:19px;font-weight:800;letter-spacing:2px;box-shadow:0 0 18px #e6a52b22}
.shop-entry:hover{border-color:#ffe070;box-shadow:0 0 26px #e6a52b55;transform:translateY(-2px)}
.shop-entry .shopcoin{width:24px;height:24px;image-rendering:pixelated;image-rendering:crisp-edges;pointer-events:none}

/* --- Панель характеристик --- */
#sheet{position:absolute;top:0;right:0;width:400px;height:100%;background:#0b0f14f2;
  border-left:1px solid var(--line);padding:16px;overflow-y:auto;display:none;z-index:9;font-size:15px}
#sheet h3{font-size:13.8px;letter-spacing:2px;color:#cfdae5;margin:14px 0 6px;font-weight:500}
#sheet h3:first-child{margin-top:0}
.row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #2a3440}
.row b{color:var(--amber);font-weight:600}
.pick{padding:5px 0;border-bottom:1px solid #2a3440;line-height:1.45}
.pick i{font-style:normal;color:#9fb0c0;font-size:12.5px}
#inventory{position:absolute;top:0;left:0;width:min(520px,48vw);height:100%;background:#0b0f14f7;
  border-right:1px solid var(--line);padding:16px;overflow-y:auto;display:none;z-index:9;font-size:15px}
#inventory h1{font-size:22px;letter-spacing:3px;color:var(--amber);margin-bottom:4px}
#inventory h3{font-size:13.8px;letter-spacing:2px;color:#cfdae5;margin:18px 0 7px;font-weight:500}
#inventory h3:first-of-type{margin-top:14px}
.invitem{padding:9px 10px;margin:7px 0;background:#11161c;border:1px solid #2a3440;border-left:3px solid var(--line);line-height:1.45}
.invitem b{display:block;font-size:15px}.invitem i{display:block;font-style:normal;color:#9fb0c0;font-size:12.5px;margin-top:3px}
.invempty{color:#7d8b9a;padding:9px 0;line-height:1.5}
.summary-grid{display:grid;grid-template-columns:repeat(2,minmax(190px,1fr));gap:8px;width:min(760px,92vw)}
.summary-cell{background:#11161c;border:1px solid #2a3440;padding:10px 12px}.summary-cell span{display:block;color:#9fb0c0;font-size:12px;letter-spacing:1px}.summary-cell b{display:block;color:var(--amber);font-size:21px;margin-top:3px}
#skilltip{position:fixed;display:none;z-index:30;width:min(440px,calc(100vw - 28px));padding:14px 16px;
  background:#090d12fa;border:1px solid #6b88b8;border-left:3px solid #84aef8;box-shadow:0 12px 34px #000b;
  color:#e7edf5;font-size:14px;line-height:1.5;pointer-events:none}
#skilltip b{color:#a9c7ff}#skilltip .tt-title{color:var(--amber);font-size:16px;letter-spacing:1px;margin-bottom:5px}
#skilltip .tt-note{color:#aebdce;margin-top:7px;font-size:12.5px}
#skilltip .tt-impact{margin:8px 0 10px;padding:9px 10px;background:#101a25;border:1px solid #36506f;border-left:3px solid #6fa8ff}
#skilltip .tt-impact-head{color:#8fbcff;font-size:11px;font-weight:800;letter-spacing:1.35px;margin-bottom:6px}
#skilltip .tt-impact-row{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;align-items:baseline;padding:3px 0;border-top:1px solid #26394d}
#skilltip .tt-impact-row:first-of-type{border-top:0}.tt-impact-row span{color:#b9c7d6;font-size:12.5px}
#skilltip .tt-impact-row b{color:#f3f7fb;white-space:nowrap}.tt-impact-row em{grid-column:2;color:#74df9b;font-size:11px;font-style:normal;text-align:right}
#skilltip .tt-impact-row.loss em{color:#ff8f82}.tt-impact-note{color:#7f91a5;font-size:10.8px;line-height:1.35;margin-top:6px}
.floor-find-list{display:grid;gap:8px;width:min(680px,92vw);max-height:46vh;overflow-y:auto;padding-right:4px}
.floor-find-row{display:grid;grid-template-columns:48px minmax(0,1fr);gap:11px;align-items:center;padding:10px 12px;
  background:#11161c;border:1px solid #2a3440;border-left:3px solid var(--fc,#6fa8ff);text-align:left;cursor:help;outline:none;transition:.12s}
.floor-find-row:hover,.floor-find-row:focus{border-color:var(--fc,#6fa8ff);box-shadow:0 0 0 1px color-mix(in srgb,var(--fc,#6fa8ff) 35%,transparent),0 5px 18px #0007;background:#151c24}
.floor-find-icon{font-size:30px;line-height:1;text-align:center;color:var(--fc,#6fa8ff)}
.floor-find-row b{display:block;color:var(--fc,#e7edf5);font-size:16px}.floor-find-row span{display:block;color:#9fb0c0;font-size:12px;margin-top:3px}
#books{display:flex;gap:6px;margin-top:7px}
.bk{display:flex;align-items:center;gap:5px;padding:3px 8px 3px 6px;border:1px solid;border-radius:3px;
  background:#0b0f14cc;font-size:15px;line-height:1}
.bk .ic{font-size:17.5px}
.bk .tr{font-size:11.2px;opacity:.75;letter-spacing:.5px}
.bk .vl{font-weight:700}
/* Список уже найденных предметов в окне находки. Высота в vh, а не в пикселях:
   26 предметов при полном сборе выталкивали кнопку «Продолжить» за нижний край
   экрана, и её приходилось доставать зумом браузера. Потолок в 30vh держит окно
   в габаритах любого монитора — вместе с иконкой, названием и описанием это
   примерно 360px плюс треть экрана, то есть кнопка видна и на ноутбуке. */
#amuown{width:min(640px,90vw);border-top:1px solid var(--line);padding-top:12px}
#amulist{max-height:28vh;overflow-y:auto;padding-right:8px}
/* Иконка и отступы ужимаются вместе с окном: на ноутбуке с высотой 600
   фиксированные 80px иконки и шесть отступов по 22 съедали столько, что
   кнопка не влезала даже при прокручиваемом списке. */
#amuico{font-size:clamp(34px,7vh,80px);line-height:1}
.overlay{gap:clamp(9px,2.2vh,22px)}
/* Полоса прокрутки видимая: иначе непонятно, что список продолжается */
#amulist::-webkit-scrollbar{width:8px}
#amulist::-webkit-scrollbar-thumb{background:#2a323c;border-radius:4px}
#amulist::-webkit-scrollbar-thumb:hover{background:#3a4450}
#amulist::-webkit-scrollbar-track{background:#0d1116;border-radius:4px}
/* Двумя колонками, когда предметов много: вдвое короче список при той же читаемости */
#amulist.two{column-count:2;column-gap:18px}
#amulist.two .pick{break-inside:avoid}
/* Оверлей тоже прокручиваемый — страховка на случай, если что-то ещё разрастётся */
.overlay{overflow-y:auto}

/* Скрытая тестовая панель: отдельные классы, чтобы не менять боевые карточки. */
#testpanel{width:min(940px,94vw);max-height:72vh;display:flex;flex-direction:column;gap:10px}
#testsearch{font:inherit;font-size:17px;padding:11px 13px;color:var(--ink);background:#0b0f14;border:1px solid #526b8f;border-radius:3px;outline:none}
#testsearch:focus{border-color:#88aefa;box-shadow:0 0 0 2px #6f9cff22}
#testresults{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:7px;overflow-y:auto;padding-right:5px}
.testskill{display:flex;align-items:center;gap:8px;background:#11161c;border:1px solid #2e3b49;padding:9px 10px;text-align:left}
.testskill:hover{border-color:#6b88b8}.testskill .tsbody{min-width:0;flex:1}.testskill .tsname{font-size:14px;color:#e7edf5}.testskill .tsmeta{font-size:11px;color:#8998aa;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.testskill .class-access{justify-content:flex-start;margin-top:5px}.testskill .class-access-label{font-size:7px}
.testskill .class-icon{width:19px;height:19px}.testskill .class-icon svg{width:14px;height:14px}
.testskill button{padding:6px 8px;font-size:11px;white-space:nowrap}

/* Второе debug-меню строится только по K: в игровом цикле для него нет ни
   обновлений DOM, ни обходов каталога существ. */
#spawnpanel{width:min(760px,94vw);max-height:76vh;display:flex;flex-direction:column;gap:10px;overflow-y:auto;padding-right:5px}
#spawnpanel h1{margin-bottom:0}.spawnsection{border-top:1px solid #334151;padding-top:9px}.spawnsection h2{font-size:13px;color:var(--amber);letter-spacing:1.5px;margin:0 0 7px}
.spawngrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:6px}.spawnrow{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#11161c;border:1px solid #2e3b49;padding:7px 8px}.spawnrow span{min-width:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.spawnrow button,.spawnactions button{padding:6px 8px;font-size:11px;white-space:nowrap}
.spawnactions{display:flex;gap:7px;flex-wrap:wrap}.spawnactions button{flex:1;min-width:170px}#spawnstatus{min-height:16px;color:#9fb0c0;font-size:11px}

/* --- Магазин --- */
#shop{width:min(1080px,94vw);max-height:63vh;overflow-y:auto;padding:2px 7px 4px;display:flex;flex-direction:column;gap:18px}
.shopcat{border-top:1px solid #29333e;padding-top:10px}.shopcat:first-child{border-top:0;padding-top:0}
.shopcat-head{display:flex;align-items:baseline;gap:11px;margin:0 0 8px}.shopcat-head b{color:#f0c040;letter-spacing:2px;font-size:14px}.shopcat-head span{color:#748294;font-size:12px}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:8px}
.srow{position:relative;min-height:154px;background:linear-gradient(145deg,#171d24,#10151b);border:1px solid #334151;border-radius:4px;padding:10px 11px;display:flex;flex-direction:column;gap:7px;cursor:help;transition:.14s}
.srow:hover{border-color:#d59d32;box-shadow:0 0 17px #d59d261f;transform:translateY(-1px)}.srow.done{border-color:#3f7650;background:linear-gradient(145deg,#142018,#0f1712)}

.const-card:hover{border-color:color-mix(in srgb,var(--cc) 80%,#fff);transform:translateY(-2px);box-shadow:0 7px 22px #0008,0 0 18px color-mix(in srgb,var(--cc) 20%,transparent)}

.const-locked{margin-top:10px;text-align:center;color:#697687;font-size:10px;letter-spacing:1px}.const-max{color:var(--cc)}
.const-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.const-actions button{margin-top:0}

#hint{position:absolute;bottom:10px;left:14px;font-size:13.8px;color:var(--dim);line-height:1.6;pointer-events:none;text-shadow:0 1px 3px #000}
#toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);font-size:16.2px;
  color:var(--amber);letter-spacing:2px;pointer-events:none;opacity:0;transition:opacity .3s}
/* Объявление повторной книги: крупно, по центру, без паузы и без кнопки.
   Первая находка по-прежнему открывает окно — там игрок читает, что книга
   вообще делает. Вторую и дальше он уже знает, и останавливать бой ради
   строчки «тир 2» значит рвать темп на каждом подъёме. */
#pickup{position:absolute;top:33%;left:50%;transform:translateX(-50%);pointer-events:none;
  opacity:0;transition:opacity .25s;text-align:center;white-space:nowrap}
#pickup .pn{font-size:clamp(30px,4.4vw,54px);font-weight:800;letter-spacing:5px;line-height:1.05}
#pickup .pv{font-size:17.5px;letter-spacing:3px;color:#7d8b9a;margin-top:4px}
/* Полоса босса висит всё время боя: тост живёт 1.4 сек, за это время
   три аффикса прочитать невозможно. */
/* Клеймо сборки: намеренно тусклое, читается только если вглядеться */
#build{position:absolute;right:8px;bottom:6px;font-size:10px;color:#3a4550;
  pointer-events:none;letter-spacing:1px;user-select:text}
/* Панель пачки: снизу, чтобы не спорить с панелью босса сверху.
   Аффиксов у пачки бывает до десяти — кольцами вокруг каждого монстра
   столько не показать, читается только списком. */
#packbar{position:absolute;bottom:46px;left:50%;transform:translateX(-50%);
  pointer-events:none;text-align:center;background:#0b0f14e6;border:1px solid #ffffff22;
  border-radius:8px;padding:7px 18px;max-width:92vw}
#packbar .pt{font-size:11.5px;letter-spacing:4px;color:#7d8b9a;font-weight:700}
#packbar .pa{font-size:16.5px;line-height:1.3;font-weight:700;letter-spacing:.5px;margin-top:2px}
#packbar .psep{color:#4a5561;margin:0 8px;font-weight:400}
/* Язык выбирается только в главном меню: два равноправных флажка, активный
   вариант читается и цветом, и рамкой, поэтому не зависит от одного цвета. */
.language-switch{display:flex;gap:8px;justify-content:center;align-items:center;margin:-4px 0 12px}
.language-switch button{min-width:82px;padding:8px 13px;border-color:#42505f;color:#b8c4d0;
  font-size:14px;letter-spacing:1.5px;background:#0c1118d9}
.language-switch button.active{border-color:#ffb340;color:#fff0a8;background:#2a1c0d;
  box-shadow:0 0 15px #ff9a2f33}
.language-switch button b{font-size:13px}
.language-flag{display:inline-block;width:24px;height:15px;border:1px solid #ffffff66;border-radius:2px;
  box-shadow:0 1px 3px #0008;vertical-align:-3px;margin-right:8px}
.flag-ru{background:linear-gradient(#fff 0 33.33%,#1f57a5 33.33% 66.66%,#d52b1e 66.66%)}
.flag-en{background:
  linear-gradient(90deg,transparent 42%,#cf2135 42% 58%,transparent 58%),
  linear-gradient(0deg,transparent 36%,#cf2135 36% 64%,transparent 64%),
  linear-gradient(33deg,transparent 44%,#fff 44% 56%,transparent 56%),
  linear-gradient(-33deg,transparent 44%,#fff 44% 56%,transparent 56%),#21468b}
</style>

<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div>
      <div class="bar" id="hpbar"><b></b><i style="background:var(--hp)"></i><span></span></div>
      <div class="bar" id="xpbar"><i style="background:var(--xp)"></i></div>
      <div style="font-size:13.8px;margin-top:5px" class="k">Ур. <b id="lvl" style="color:var(--ink)">1</b> · <span id="dpsinfo"></span></div>
      <div id="books"></div>
    </div>
    <div id="floorbox">
      <div class="k">ЭТАЖ</div><b id="floor">1</b>
      <div class="k" id="left">врагов: 0</div>
      <div id="goldbox" style="color:#f0c040;margin-top:4px">0 <span class="k">золота</span></div>
    </div>
  </div>

  <div id="packbar" style="display:none"></div>
  <div id="warriorbuffs"></div>
  <div id="pickup"></div>
  <div id="build"></div>
  <div id="toast"></div>
  <div id="sheet"></div>
  <div id="inventory"></div>
  <div id="skilltip" role="tooltip"></div>
  <div id="hint">WASD — движение · атака автоматическая · ПРОБЕЛ — рывок · TAB — инвентарь · P — пауза</div>

  <div class="overlay" id="pauseov" style="display:none;background:#070a0dcc">
    <h1>ПАУЗА</h1>
    <h2>ESC или P — продолжить</h2>
    <button id="endrun" style="margin-top:18px;border-color:#e0405a;color:#ff9a8a">ЗАВЕРШИТЬ ЗАБЕГ · СОХРАНИТЬ ЗОЛОТО</button>
  </div>
  <div class="overlay" id="ov"></div>
</div>

<script>
"use strict";
/* ---------- 1a. ЛОКАЛИЗАЦИЯ EN / RU ----------
   Русская строка остаётся каноническим ключом, чтобы старые сохранения и тесты
   не зависели от языка. Любой новый видимый текст добавляется сразу парой. */
const LANGUAGE_KEY = 'polygrind_language';
const SKILL_TIPS_KEY = 'polygrind_skill_tooltips';
let LANGUAGE = (() => {
  try {
    const saved = localStorage.getItem(LANGUAGE_KEY);
    return saved === 'ru' ? 'ru' : 'en';
  } catch (e) { return 'en'; }
})();
let SKILL_TIPS_ENABLED = (() => {
  try { return localStorage.getItem(SKILL_TIPS_KEY) !== 'off'; }
  catch (e) { return true; }
})();

const EN_ITEMS = [
  ["ЧЁРНОЕ ЗЕРКАЛО", "BLACK MIRROR"], ["после получения урона рядом встаёт ваша копия на 3 сек и повторяет ваши атаки · откат 10 сек", "when you take damage, a copy of you appears nearby for 3 sec and repeats your attacks · 10 sec cooldown"],
  ["СЕРДЦЕ ГОЛЕМА", "GOLEM HEART"], ["+50 к броне · раз в 10 сек следующий удар по вам гасится полностью", "+50 Armor · once every 10 sec, the next hit against you is completely negated"],
  ["КЛЫК ВАМПИРА", "VAMPIRE FANG"], ["+4% вампиризма · убийство элиты или босса лечит на 15% здоровья", "+4% Life Steal · killing an elite or boss restores 15% health"],
  ["СЕРДЦЕ БУРИ", "HEART OF THE STORM"], ["раз в 8 сек молния бьёт ближайшего врага втройне и шокирует его", "every 8 sec, lightning strikes the nearest enemy for triple damage and Shocks it"],
  ["ПЕПЕЛЬНОЕ СЕРДЦЕ", "ASHEN HEART"], ["+35% к урону огнём · смерть горящего врага лечит на 1% здоровья", "+35% Fire damage · the death of a burning enemy restores 1% health"],
  ["ЛЕДЯНОЙ КРИСТАЛЛ", "ICE CRYSTAL"], ["+35% к урону холодом · заморозка держится на 40% дольше", "+35% Cold damage · Freeze lasts 40% longer"],
  ["ЧУМНОЙ ЗУБ", "PLAGUE TOOTH"], ["+35% к урону ядом · 10% шанс, что с трупа яд перепрыгнет на соседа и продлится на 2 сек", "+35% Poison damage · 10% chance for Poison to jump from a corpse to a nearby enemy and last 2 sec longer"],
  ["ЧАСОВОЙ МЕХАНИЗМ", "CLOCKWORK"], ["+10% к скорости атаки · раз в 30 сек всё вокруг вас замерзает на 1 сек", "+10% Attack Speed · once every 30 sec, everything around you is Frozen for 1 sec"],
  ["ЗЕРКАЛЬНЫЙ ОСКОЛОК", "MIRROR SHARD"], ["10% шанс отбить вражеский снаряд обратно — он летит дальше уже как ваш", "10% chance to reflect an enemy projectile; it continues as your own projectile"],
  ["КОСТЬ УДАЧИ", "LUCKY BONE"], ["каждый двадцатый ваш удар — гарантированный крит", "every twentieth hit you deal is guaranteed to be a critical hit"],
  ["ЧЁРНАЯ СВЕЧА", "BLACK CANDLE"], ["+20% врагов в волнах и +15% к получаемому опыту — сделка, а не подарок", "+20% enemies in waves and +15% experience gained—a bargain, not a gift"],
  ["ТАЛИСМАН ПОКОЯ", "TALISMAN OF STILLNESS"], ["простояли 2 сек — получаете барьер на 10% здоровья · после расхода откат 5 сек", "stand still for 2 sec to gain a barrier equal to 10% of your health · 5 sec cooldown after the barrier is consumed"],
  ["ТАЛИСМАН БЕГУНА", "RUNNER'S TALISMAN"], ["+20% скорости в движении · +20% урона, если стоите дольше секунды", "+20% speed while moving · +20% damage after standing still for more than 1 sec"],
  ["КУКЛА СМЕРТИ", "DEATH DOLL"], ["один раз на этаже отменяет смертельный удар целиком и даёт полторы секунды неуязвимости", "once per floor, completely negates a fatal hit and grants 1.5 sec of invulnerability"],

  ["ПЕРЧАТКИ ГРОМА", "THUNDER GLOVES"], ["каждый двенадцатый удар шокирует цель и бьёт разрядом по округе", "every twelfth hit Shocks the target and releases a lightning discharge nearby"],

  ["<b>Когда срабатывает:</b> сразу после убийства любого врага.<br><b>Эффект:</b> весь подходящий урон получает накопленный процент бонуса ровно на 1 секунду.<br><b>Диапазон:</b> каждая карточка даёт целые 3–7%.<br><b>Накопление:</b> значения складываются без потолка; например, 4% + 6% = +10% урона на следующую секунду.<br><b>Обновление:</b> новое убийство снова выставляет таймер на 1 секунду; длительности не складываются.", "<b>Trigger:</b> immediately after killing any enemy.<br><b>Effect:</b> all eligible damage gains the accumulated percentage bonus for exactly 1 second.<br><b>Range:</b> each card grants a whole 3–7%.<br><b>Stacking:</b> values add with no cap; for example, 4% + 6% = +10% damage for the next second.<br><b>Refresh:</b> another kill resets the timer to 1 second; durations do not stack."],
  ["каждая карточка даёт 3–5% шанса · потолок 50% · базовое оглушение 0,5 секунды", "each card grants 3–5% chance · capped at 50% · base Stun lasts 0.5 seconds"],
  ["Урон за каждую секунду боя", "Damage per Second in Combat"], ["разгон с начала боя, потолок +40%, сбрасывается при зачистке", "ramps from the start of combat, capped at +40%, and resets when the room is cleared"],
  ["<b>Формула:</b> выбранное значение × прошедшее время боя в секундах, пока на арене есть хотя бы один живой враг. Бонус прибавляется к обычным процентам урона и растёт плавно, включая доли секунды.<br><b>Пример:</b> +2% даёт +20% через 10 сек и достигает потолка +40% через 20 сек.<br><b>Сброс:</b> сразу после зачистки, когда живых врагов не остаётся. Работает и на урон свиты.", "<b>Formula:</b> rolled value × elapsed combat time in seconds while at least one enemy is alive in the arena. The bonus is added to regular increased damage and grows smoothly, including fractions of a second.<br><b>Example:</b> +2% grants +20% after 10 sec and reaches the +40% cap after 20 sec.<br><b>Reset:</b> immediately after the room is cleared. Also affects minion damage."],
  ["БРОНЯ В УРОН", "ARMOR INTO DAMAGE"], ["каждые 100 брони превращаются в +12 к урону", "every 100 Armor grants +12 Damage"],
  ["ПРОХОД СКВОЗЬ ВРАГОВ", "PHASE THROUGH ENEMIES"], ["в движении вы проходите сквозь тела и не получаете контактный урон — но не стоя на месте", "while moving, you phase through enemies and take no contact damage; this does not work while stationary"],
  ["ТАРАННЫЙ РЫВОК", "RAMMING DASH"], ["рывок сносит всех на пути (120% урона) и вызывает головокружение", "Dash plows through enemies in its path for 120% damage and Dazes them"],
  ["ОБМАН СМЕРТИ", "CHEAT DEATH"],
  ["100% спасает от смертельного удара, оставляя 1 HP · неуязвимость на 1 сек · +50% скорости передвижения на 1 сек · откат 60 сек",
   "100% prevents a fatal hit, leaving 1 HP · 1 sec invulnerability · +50% movement speed for 1 sec · 60 sec cooldown"],
  ["Шанс отбрасывания", "Knockback Chance"], ["сила толчка: Бегуны −30% · элита −50% · боссы −90%", "knockback force: Runners −30% · elites −50% · bosses −90%"],
  ["ГОЛОВОКРУЖЕНИЕ", "DAZE"], ["после отбрасывания враг ковыляет на 50% медленнее 2 секунды", "after being knocked back, the enemy moves 50% slower for 2 seconds"],
  ["Шанс оглушения", "Stun Chance"],
  ["Урон по замедленным", "Damage to Slowed Enemies"],
  ["каждая карточка даёт 5–10% урона · без потолка · открывается после получения источника замедления", "each card grants 5–10% damage · no cap · unlocked after obtaining a source of slowing"],
  ["<b>Условие появления:</b> сначала получите хотя бы один источник замедления: Охлаждение, Книгу льда, Ботинки морозилки, Колдунов, Головокружение или ауру замедления.<br><b>Что считается замедлением:</b> прямое Охлаждение, ледяная аура вокруг охлаждённого врага, Головокружение и аура замедления героя.<br><b>Эффект:</b> каждая карточка даёт целые 5–10% урона по такой цели.<br><b>Накопление:</b> значения складываются без потолка; например, 6% + 9% = +15% урона.<br><b>Не считается:</b> одно только оглушение или заморозка без Охлаждения.", "<b>Unlock condition:</b> first obtain at least one source of slowing: Chill, the Book of Ice, Frost Boots, Warlocks, Daze, or the slowing aura.<br><b>What counts as slowed:</b> direct Chill, the icy aura around a Chilled enemy, Daze, and the hero's slowing aura.<br><b>Effect:</b> each card grants a whole 5–10% damage against such a target.<br><b>Stacking:</b> values add with no cap; for example, 6% + 9% = +15% damage.<br><b>Does not count:</b> Stun or Freeze by itself without Chill."],
  ["Холодный раскол", "Cold Shatter"],
  ["убийство замедлённого врага охлаждает остальных в радиусе 180 на 0,7 секунды · радиус растёт от области", "killing a slowed enemy Chills others within 180 range for 0.7 sec · radius scales with area"],
  ["<b>Условие появления:</b> сначала получите хотя бы один источник замедления.<br><b>Когда срабатывает:</b> при убийстве врага под прямым Охлаждением, ледяной аурой, Головокружением или аурой замедления.<br><b>Эффект:</b> все остальные живые враги в радиусе 180 получают Охлаждение на базовые 0,7 секунды.<br><b>Масштабирование:</b> радиус растёт от «Радиуса области действия», длительность — от «Длительности всех эффектов».<br><b>Ограничение:</b> синяя уникальная карточка; после выбора дубли больше не выпадают.", "<b>Unlock condition:</b> first obtain at least one source of slowing.<br><b>Trigger:</b> killing an enemy affected by direct Chill, the icy aura, Daze, or the slowing aura.<br><b>Effect:</b> every other living enemy within 180 range is Chilled for a base duration of 0.7 sec.<br><b>Scaling:</b> radius scales with Area of Effect Radius and duration scales with All Ailment Duration.<br><b>Limit:</b> a unique blue card; duplicates cannot appear after it is taken."],
  ["Аура замедления врагов", "Enemy-Slowing Aura"],
  ["−25% скорости всем в радиусе 260", "−25% speed to all enemies within 260 range"],
  ["Взрыв при убийстве (вспышка)", "Explosion on Kill"],
  ["каждая карточка даёт 6–12% шанса · потолок 50% · урон равен среднему урону автоатаки и проходит через защиту цели", "each card grants 6–12% chance · capped at 50% · damage equals average basic-attack damage and is reduced by the target's defenses"],
  ["<b>Когда проверяется:</b> после каждого убийства.<br><b>Шанс:</b> каждая карточка даёт целые 6–12 процентных пунктов; суммарный шанс ограничен 50%.<br><b>Урон:</b> 100% среднего урона автоатаки, после чего применяются броня и остальные защиты каждой задетой цели.<br><b>Цепь:</b> враг, погибший от вспышки, сам может запустить следующую вспышку.<br><b>Развитие:</b> на потолке 50% открывается красная карточка «СИЛЬНЫЙ ВЗРЫВ ПРИ УБИЙСТВЕ».", "<b>Roll:</b> after every kill.<br><b>Chance:</b> each card grants a whole 6–12 percentage points; total chance is capped at 50%.<br><b>Damage:</b> 100% of average basic-attack damage, then Armor and every other defense of each affected target are applied.<br><b>Chain:</b> an enemy killed by the blast can trigger another blast.<br><b>Upgrade:</b> at the 50% cap, unlocks the red STRONG EXPLOSION ON KILL card."],
  ["СИЛЬНЫЙ ВЗРЫВ ПРИ УБИЙСТВЕ", "STRONG EXPLOSION ON KILL"],
  ["шанс становится 65% · урон вспышки 125% среднего удара · слегка расталкивает врагов", "chance becomes 65% · blast deals 125% of average hit damage · lightly knocks enemies away"],
  ["<b>Требование:</b> достигнуть потолка 50% обычного взрыва при убийстве.<br><b>Шанс:</b> вместо 50% становится 65%.<br><b>Урон:</b> вспышка наносит 125% среднего урона автоатаки с учётом защиты каждой цели.<br><b>Отбрасывание:</b> лёгкий импульс от центра взрыва; Бегуны, элита и боссы сохраняют своё сопротивление отбрасыванию.<br><b>Цепь:</b> убийства этой вспышкой по-прежнему могут создавать следующие вспышки.", "<b>Requirement:</b> reach the regular Explosion on Kill cap of 50%.<br><b>Chance:</b> increases from 50% to 65%.<br><b>Damage:</b> the blast deals 125% of average basic-attack damage after applying each target's defenses.<br><b>Knockback:</b> a light impulse away from the blast center; Runners, elites, and bosses retain their knockback resistance.<br><b>Chain:</b> kills caused by this blast can still trigger further blasts."],
  ["Ответный удар при получении урона", "Retaliation when Hit"],
  ["Автолечение при малом здоровье", "Automatic Healing at Low Health"], ["25% HP, откат 20 сек", "25% HP, 20 sec cooldown"],
  ["+% к получаемому опыту", "+% Experience Gained"], ["Находимое золото", "Gold Find"],

  /* Карточки: свита и кейстоуны */
  ["Ещё один скелет", "Additional Skeleton"], ["потолок скелетов — 6", "maximum 6 Skeletons"],
  ["СВИТА ОХОТНИКОВ", "HUNTER RETINUE"], ["до шести стрелков: те же автоатаки, что у вас, но на 20% урона", "up to six ranged Hunters: they use your basic attacks at 20% damage"],
  ["СВИТА КОЛДУНОВ", "WARLOCK RETINUE"], ["до шести чародеев: заклинания на 20% урона, каждое кладёт случайный статус — поджог, холод или яд", "up to six Warlocks: their spells deal 20% damage and apply a random ailment—Ignite, Chill, or Poison"],
  ["ГОЛЕМ КРОВИ", "BLOOD GOLEM"], ["танк с провокацией. Первый уровень: вдвое реже скелета, втрое сильнее. Дальше растёт урон и понемногу темп; на десятом — запас как у 3.5 скелетов", "a taunting tank. At rank 1 it attacks half as often as a Skeleton but hits three times harder. Further ranks increase damage and gradually improve attack speed; at rank 10 it has the health of 3.5 Skeletons"],
  ["КОСТЯНОЙ ГОЛЕМ", "BONE GOLEM"], ["прямого урона не наносит вовсе: вешает кровотечение и сразу бежит к следующему, разнося стаки по всей толпе. Бьёт чаще всех в свите; на десятом уровне запас как у двух скелетов", "deals no direct damage: it applies Bleeding, then immediately seeks a new target to spread stacks through the crowd. It attacks faster than any other minion; at rank 10 it has the health of two Skeletons"],
  ["Урон приспешников", "Minion Damage"], ["на +50% суммарно открывается БУЙСТВО ДЕМОНОВ. Потолка у ветки нет, качается дальше", "at +50% total, unlocks DEMON FRENZY. This branch has no cap and can be upgraded further"],
  ["Поле костей", "Bone Field"], ["+2–4% урона свиты за каждый труп в радиусе 400. Учитывается максимум 15 трупов. Значения карточек складываются без потолка.", "+2–4% minion damage for each corpse within 400 units. Counts up to 15 corpses. Card values stack with no cap."],
  ["урона свиты", "minion damage"],
  ["КРОВАВАЯ БАНЯ", "BLOODBATH"], ["каждый десятый удар свиты вызывает кровотечение — то же самое, что ставит книга крови, и в тот же стак", "every tenth minion hit causes the same Bleeding as the Book of Blood and adds it to the same stack"],
  ["КИПЯЩАЯ КРОВЬ", "BOILING BLOOD"], ["удар по приспешнику с шансом 5% оставляет под ним кипящую лужу на 3 сек: каждую секунду она снимает 5% ТЕКУЩЕГО здоровья всем, кто в ней стоит", "when a minion is hit, it has a 5% chance to leave a boiling pool beneath it for 3 sec. Each second, the pool removes 5% of the CURRENT health of everything standing in it"],
  ["БУЙСТВО ДЕМОНОВ", "DEMON FRENZY"], ["каждый удар свиты добавляет взрыв по площади. Взрыв бьёт на полный урон удара и разносит все ваши эффекты. Радиус растёт от «Радиуса области действия»", "every minion hit triggers an area explosion. The explosion deals the hit's full damage and applies all your effects. Its radius scales with Area of Effect Radius"],
  ["Здоровье приспешников", "Minion Health"], ["на +50% суммарно открываются ВАМПИРЫ ХОЗЯИНА", "at +50% total, unlocks MASTER'S VAMPIRES"],
  ["ВАМПИРЫ ХОЗЯИНА", "MASTER'S VAMPIRES"], ["свита забирает себе 25% нанесённого урона как здоровье. Лечит только их самих — хозяину не достаётся ничего", "minions recover health equal to 25% of the damage they deal. This heals only the minions; their master receives nothing"],
  ["Скорость атаки приспешников", "Minion Attack Speed"], ["на +50% открываются РЕЗКИЕ КОГТИ, на +100% — ВИХРЬ КОГТЕЙ. Потолка у ветки нет", "at +50%, unlocks RAZOR CLAWS; at +100%, unlocks CLAW WHIRLWIND. This branch has no cap"],
  ["РЕЗКИЕ КОГТИ", "RAZOR CLAWS"], ["каждый пятый удар приспешника добавляет второй, на 30% мощности. Считается отдельно у каждого бойца", "every fifth hit by a minion adds a second hit at 30% power. Counted separately for each minion"],
  ["ВИХРЬ КОГТЕЙ", "CLAW WHIRLWIND"], ["каждый десятый удар приспешника рассекает всё вокруг него на 20% мощности", "every tenth hit by a minion cleaves everything around it at 20% power"],
  ["Скорость передвижения свиты", "Minion Movement Speed"], ["на +100% открывается ВНЕЗАПНЫЙ ВЗРЫВ, на +200% — АСТРАЛЬНЫЙ НАБЕГ. Потолка у ветки нет", "at +100%, unlocks SUDDEN BLAST; at +200%, unlocks ASTRAL RAID. This branch has no cap"],
  ["ВНЕЗАПНЫЙ ВЗРЫВ", "SUDDEN BLAST"], ["раз в 10 сек приспешник переносится к своей цели и взрывается на 30% удара. Взрыв идёт как обычная атака — со всеми вашими эффектами", "every 10 sec, a minion teleports to its target and explodes for 30% of a hit. The explosion counts as a regular attack and applies all your effects"],
  ["АСТРАЛЬНЫЙ НАБЕГ", "ASTRAL RAID"], ["перенос раз в 4 сек, взрыв шире и на 50% удара. Заменяет собой ВНЕЗАПНЫЙ ВЗРЫВ, а не складывается с ним", "teleports every 4 sec, with a wider explosion dealing 50% of a hit. Replaces SUDDEN BLAST instead of stacking with it"],
  ["Крит приспешников", "Minion Critical Chance"], ["Взрыв приспешника при смерти", "Minion Death Explosion"],
  ["КОСТЯНОЙ ВЫЗОВ", "BONE DEFIANCE"], ["каждый удар свиты с шансом 1% заставляет атакованного монстра переключиться на ударившего приспешника, пока тот жив", "each minion hit has a 1% chance to make the struck monster target that minion while it remains alive"],
  ["ЛОРД СМЕРТИ", "DEATH LORD"], ["0,1% всего фактически нанесённого свитой урона восстанавливает здоровье Некроманта", "0.1% of all damage actually dealt by minions restores the Necromancer's health"],
  ["Часть урона по вам идёт приспешнику", "Part of Damage Taken Is Redirected to a Minion"], ["потолок ветки — 50%. На пятидесяти открываются КРОВНЫЕ УЗЫ", "this branch is capped at 50%. At 50%, unlocks BLOOD TIES"],
  ["КРОВНЫЕ УЗЫ", "BLOOD TIES"], ["каждое попадание по вам приводит свиту в ярость: вдвое больше урона следующие 3 секунды", "each hit you take enrages your minions, doubling their damage for the next 3 seconds"],
  ["Свита наследует % ваших статов", "Minions Inherit % of Your Stats"], ["урон и здоровье масштабируются от вас", "damage and health scale from your stats"],
  ["Повышение ранга призываемых", "Upgrade Summoned Minions"], ["+60% здоровья и +45% урона всей свите", "+60% health and +45% damage to all minions"],
  ["Некромантская связь", "Necromantic Bond"], ["40% урона по вам уходит свите, но свита бьёт в полтора раза сильнее", "40% of damage taken is redirected to your minions, but minions deal 50% more damage"],
  ["Стеклянная пушка", "Glass Cannon"], ["+60% урона (more), но −40% макс. здоровья", "60% more damage, but −40% maximum health"],
  ["Выверенная техника", "Measured Technique"], ["криты невозможны, но +50% урона (more)", "critical hits are disabled, but you deal 50% more damage"],

  ["Шквал", "Flurry"], ["вдвое быстрее, но вдвое слабее", "attacks are twice as fast but deal half damage"],
  ["Акробатика", "Acrobatics"], ["уклонение удвоено, +15% скорости", "Evasion is doubled and Movement Speed is increased by 15%"],
  ["Чумная смерть", "Plague Death"], ["каждый труп гарантированно даёт чумный взрыв, но радиус чумы уменьшается на 35%", "every corpse always causes a plague explosion, but plague radius is reduced by 35%"],
  ["Налегке", "Unburdened"], ["броня обнуляется, но +35% скорости и +25% скорости атаки", "Armor is set to zero, but you gain +35% Movement Speed and +25% Attack Speed"],

  /* Классы, подклассы, книги, тотемы */
  ["ВОИН", "WARRIOR"], ["Ближний бой. Каждый третий взмах выпускает круговую волну и отбрасывает врагов.", "Close combat. Every third swing releases a circular wave that knocks enemies back."],
  ["ЛУЧНИК", "ARCHER"], ["Быстрый дальний бой. Особенно силён с дополнительными стрелами, пробитием и отскоками.", "Fast ranged combat. Excels with additional arrows, Pierce, and Chains."],
  ["МАГ", "MAGE"], ["Магические сферы взрываются по площади и несут силу стихий.", "Magical orbs explode over an area and carry elemental power."],
  ["НЕКРОМАНТ", "NECROMANCER"], ["Не атакует сам. Поднимает павших врагов скелетами и сражается силами свиты.", "Does not attack directly. Raises fallen enemies as Skeletons and fights through minions."],
  ["ВОР", "THIEF"], ["+2% ко всему получаемому золоту за уровень отдельным множителем. Также +1% скорости передвижения за уровень. Бонуса к уклонению нет.", "+2% to all gold gained per level as a separate multiplier. Also +1% Movement Speed per level. Grants no Evasion."],
  ["ОХОТНИК", "HUNTER"], ["+1% скорости атаки за уровень.", "+1% Attack Speed per level."],
  ["БОЕВОЙ ТАНЦОР", "BATTLE DANCER"], ["+1 рывок (всего 2) и +1 брони за уровень; бонус брони до 60.", "+1 Dash charge (2 total) and +1 Armor per level, up to +60 Armor."],
  ["БЕРСЕРК", "BERSERKER"], ["+1% к урону ближних атак за уровень. При здоровье ниже 40% получает +20% скорости атаки.", "+1% Melee Attack Damage per level. Below 40% Health, gains +20% Attack Speed."],
  ["СТРАЖ", "GUARDIAN"], ["+0,75% максимального здоровья за уровень. Круговая волна, задевшая хотя бы трёх врагов, даёт барьер на 6% здоровья; перезарядка 4 сек.", "+0.75% Maximum Health per level. A circular wave that hits at least three enemies grants a barrier equal to 6% of Maximum Health; 4 sec cooldown."],
  ["МАСТЕР МЕЧА", "SWORDMASTER"], ["+1% к радиусу круговой волны и +1,5% к силе её отбрасывания за уровень, до +60% и +90%. С 30-го уровня волна оглушает обычных врагов на 0,35 сек.", "+1% circular wave radius and +1.5% wave knockback force per level, capped at +60% and +90%. From level 30, the wave Stuns normal enemies for 0.35 sec."],
  ["Длинное лезвие", "Long Blade"], ["+10–25% к дальности обычного взмаха. Складывается до +60%. Не увеличивает радиус круговой волны.", "+10–25% normal swing reach. Stacks up to +60%. Does not increase circular wave radius."],
  ["СМЕРТЕЛЬНЫЙ РАДИУС", "DEADLY RADIUS"], ["Увеличивает радиус круговой волны на 80%.", "Increases circular wave radius by 80%."],

function tr(value){
  if (LANGUAGE === 'ru' || typeof value !== 'string' || !/[А-Яа-яЁё]/.test(value)) return value;
  const exact = EN_TEXT[value];
  if (exact) return exact;
  let out = value;
  for (const pair of EN_PARTS) out = out.split(pair[0]).join(pair[1]);
  return out;
}

const EN_PARTS = Object.entries(EN_TEXT)
  .filter(pair => pair[0].length <= 80 && /[А-Яа-яЁё]/.test(pair[0]))
  .sort((a,b) => b[0].length - a[0].length);

function localizeTree(root){
  if (LANGUAGE !== 'en' || !root || typeof document === 'undefined') return;
  const visit = node => {
    if (node.nodeType === 3){
      const translated = tr(node.nodeValue);
      if (translated !== node.nodeValue) node.nodeValue = translated;
      return;
    }
    if (node.nodeType !== 1) return;
    for (const attr of ['title','placeholder','aria-label']){
      if (node.hasAttribute && node.hasAttribute(attr)){
        const before = node.getAttribute(attr), after = tr(before);
        if (after !== before) node.setAttribute(attr, after);
      }
    }
    for (const child of [...node.childNodes]) visit(child);
  };
  visit(root);
}

function setLanguage(next){
  LANGUAGE = next === 'ru' ? 'ru' : 'en';
  try{ localStorage.setItem(LANGUAGE_KEY, LANGUAGE); }catch(e){}
  if (typeof document !== 'undefined' && document.documentElement) document.documentElement.lang = LANGUAGE;
  // Переключатель доступен только в главном меню. Перезагрузка восстанавливает
  // исходные русские DOM-узлы перед применением выбранного языка и не затрагивает забег.
  if (typeof location !== 'undefined' && location.reload) location.reload();
  else { startScreen(); localizeTree(document.body); }
}

function languageSwitchHtml(){
  return '<div class="language-switch" role="group" aria-label="Language">' +
    '<button type="button" data-language="en" class="' + (LANGUAGE === 'en' ? 'active' : '') + '" aria-label="English"><i class="language-flag flag-en"></i><b>EN</b></button>' +
    '<button type="button" data-language="ru" class="' + (LANGUAGE === 'ru' ? 'active' : '') + '" aria-label="Русский"><i class="language-flag flag-ru"></i><b>RU</b></button></div>';
}

function bindLanguageSwitch(){
  if (typeof document === 'undefined') return;
  document.querySelectorAll('[data-language]').forEach(el => el.onclick = () => setLanguage(el.dataset.language));
}

/* Английская карточка сохраняет формулу и ограничения, но строится из уже
   переведённых декларативных данных. Так новая карточка получает понятную
   подсказку сразу после добавления nm/nt/tip в билингвальный реестр. */
function englishSkillTip(m, card){
  const shown = card && card.val ? card.val : (m.kind === 'flag' ? 'property' : 'value');
  const specific = m.tip || m.nt;
  const effect = specific ? '<b>Effect:</b> ' + tr(specific) + '<br>' : '';
  const formula = {
    flat:'<b>Stacking:</b> the value is added directly before percentage bonuses.',
    inc:'<b>Stacking:</b> added to other increased percentages, then applied to the base value.',
    more:'<b>Stacking:</b> a separate multiplier applied after increased percentages; multiple more multipliers multiply.',
    chance:'<b>Roll:</b> an independent chance on every eligible event.',
    flag:'<b>Duration:</b> this unique property remains active until the end of the current run.'
  }[m.kind] || '';
  const limits = m.cap !== undefined ? '<br><b>Limit:</b> capped at ' + m.cap + '%; the card then leaves the pool.' :
    (m.hide ? '<br><b>Limit:</b> the card leaves the pool when its mechanical cap is reached.' : '');
  const minions = m.req === 'min' ? '<br><b>Class:</b> available only to a minion-based class.' :
    (m.noMin ? '<br><b>Minions:</b> does not affect minions.' : '');
  return effect + '<b>This card:</b> ' + shown + '<br>' + formula + limits + minions;
}

function localizationMissing(){
  const rows = [];
  const add = value => { if (typeof value === 'string' && /[А-Яа-яЁё]/.test(value) && !EN_TEXT[value]) rows.push(value); };
  const scan = list => (list || []).forEach(item => ['cat','nm','nt','desc','tip','st','sub'].forEach(field => add(item && item[field])));
  scan(typeof MODS === 'undefined' ? [] : MODS);
  scan(typeof WEAPONS === 'undefined' ? [] : Object.values(WEAPONS));
  scan(typeof SUBCLASSES === 'undefined' ? [] : Object.values(SUBCLASSES).flat());
  scan(typeof BOOKS === 'undefined' ? [] : Object.values(BOOKS));
  scan(typeof AMULETS === 'undefined' ? [] : Object.values(AMULETS));
  scan(typeof TOTEMS === 'undefined' ? [] : Object.values(TOTEMS));
  scan(typeof CONSTELLATIONS === 'undefined' ? [] : CONSTELLATIONS);
  scan(typeof SHOP === 'undefined' ? [] : SHOP);
  scan(typeof ETYPES === 'undefined' ? [] : Object.values(ETYPES));
  scan(typeof BOSS_TYPES === 'undefined' ? [] : Object.values(BOSS_TYPES));
  scan(typeof BOSS_AFFIXES === 'undefined' ? [] : BOSS_AFFIXES);
  scan(typeof PACK_AFFIXES === 'undefined' ? [] : PACK_AFFIXES);
  scan(typeof MKIND === 'undefined' ? [] : Object.values(MKIND));
  scan(typeof CONTROLS === 'undefined' ? [] : Object.values(CONTROLS));
  return [...new Set(rows)];
}

if (typeof document !== 'undefined' && document.documentElement) document.documentElement.lang = LANGUAGE;
if (typeof MutationObserver !== 'undefined'){
  const languageObserver = new MutationObserver(records => {
    if (LANGUAGE !== 'en') return;
    for (const record of records){
      if (record.type === 'characterData') localizeTree(record.target);
      else for (const node of record.addedNodes) localizeTree(node);
    }
  });
  languageObserver.observe(document.body, {subtree:true, childList:true, characterData:true});
  localizeTree(document.body);
}

const FLOOR_TILE_WORLD_SIZE = 256;                 // 48px-герой больше не теряется рядом с плитами и болтами
const FLOOR_TILE = typeof Image !== 'undefined' ? new Image() : null;
let floorPattern = null;
if (FLOOR_TILE){
  FLOOR_TILE.onload = () => {
    // Затемнение смешивается один раз в маленьком буфере, а не со всем экраном 60 раз/сек.
    const tile = document.createElement('canvas');
    tile.width = FLOOR_TILE_WORLD_SIZE; tile.height = FLOOR_TILE_WORLD_SIZE;
    const g = tile.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.drawImage(FLOOR_TILE, 0, 0, tile.width, tile.height);
    g.fillStyle = '#070a0d18';
    g.fillRect(0, 0, tile.width, tile.height);
    floorPattern = ctx.createPattern(tile, 'repeat');
  };
  FLOOR_TILE.src = FLOOR_TILE_DATA;
}

/* Короткие сигналы синтезируются в браузере: хранить аудиофайлы ради двух блипов
   не нужно. Контекст разрешается только жестом игрока — иначе Chrome/Safari молча
   блокируют звук при первом убийстве. Частотный лимит не даёт толпе слиться в треск. */
let audioCtx = null, lastDeathSfx = -Infinity;
function unlockSound(){
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  if (!AudioCtx) return;
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, dur, vol, type, delay){
  if (!audioCtx || audioCtx.state !== 'running') return;
  const at = audioCtx.currentTime + (delay || 0);
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = type || 'sine'; osc.frequency.setValueAtTime(freq, at);
  gain.gain.setValueAtTime(0.0001, at);
  gain.gain.exponentialRampToValueAtTime(vol, at + 0.004);
  gain.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(at); osc.stop(at + dur + 0.01);
}
function enemyDeathSfx(e){
  if (!audioCtx || audioCtx.state !== 'running') return;
  const now = audioCtx.currentTime;
  if (now - lastDeathSfx < 0.035) return;
  lastDeathSfx = now;
  tone(e.kind === 'boss' ? 110 : e.kind === 'elite' ? 135 : rnd(155,185), 0.035, 0.018, 'square');
}
function levelUpSfx(){
  tone(440, 0.07, 0.028, 'triangle');
  tone(660, 0.11, 0.035, 'triangle', 0.065);
}

/* ---------- 3. СУМКА МОДИФИКАТОРОВ И РАСЧЁТ ХАРАКТЕРИСТИК ---------- */
/* Сумка хранит по каждому стату три накопителя: flat, inc, more.
   Итог = (База + Σflat) × (1 + Σinc/100) × Π(1 + more_i/100)         */
function Bag(){ this.s = {}; }
Bag.prototype.get = function(k){ return this.s[k] || (this.s[k] = {flat:0, inc:0, more:1}); };
Bag.prototype.add = function(k, kind, v){
  const e = this.get(k);
  if (kind === 'more') e.more *= (1 + v/100);       // more перемножается — самый ценный тип
  else if (kind === 'inc') e.inc += v;              // inc складывается в один множитель
  else e.flat += v;                                  // flat и chance просто суммируются
};
Bag.prototype.calc = function(k, base){             // финальная формула из каталога
  const e = this.s[k]; if (!e) return base;
  return (base + e.flat) * (1 + e.inc/100) * e.more;
};
Bag.prototype.flat = function(k){ return this.s[k] ? this.s[k].flat : 0; };
/* sum() — для статов, которые в каталоге объявлены только как inc (или только flat):
   движку нужно одно число, а не разделение на базу и процент. */
Bag.prototype.sum  = function(k){ const e = this.s[k]; return e ? e.flat + e.inc : 0; };
Bag.prototype.has  = function(k){ return this.flat(k) > 0; };

/* ---------- 3a-bis. АМУЛЕТЫ ----------
   Второй тип находки в том же пуле дропа, что и книги. Разница принципиальная:
   книга при повторной находке растит тир, амулет находится РОВНО ОДИН РАЗ за партию.
   Поэтому амулет — не источник цифр, а разовое изменение правил боя, и почти каждый
   висит на своём таймере или условии.

     rar   — 1 редкий, 2 эпический, 3 легендарный; влияет только на вес в дропе
     ico   — значок в интерфейсе
     nt    — что делает, человеческим языком

   Механики живут не здесь, а в точках врезки (recalc, hurt, killEnemy, update):
   амулет — это флаг, который эти точки читают через amu('id'). */
/* Слот — только подпись и группировка в панели: правило «один предмет каждого
   вида за партию» и без того держится по ключу, а ограничений «одно кольцо
   на руку» в игре нет и не планируется. */
const SLOTS = {amu:'АМУЛЕТ', glove:'ПЕРЧАТКИ', boot:'БОТИНКИ', ring:'КОЛЬЦО', rel:'РЕЛИКВИЯ'};

/* ---------- ТОТЕМЫ ----------
   Третий тип находки. Каждый тип входит в пул дропа только после того, как игрок
   нашёл хотя бы одну соответствующую книгу. Ведут себя как книги: тот же тотем
   при повторной находке растёт в ранге, а на четвёртом выпадать перестаёт. Дают процент урона по целям
   с нужным статусом — то есть работают только у того, кто этот статус вообще

/* Мягкая миграция: старые сохранения получают только пустые счётчики и ранги.

   значения, чтобы ручная правка localStorage не дала отрицательный ранг. */
function normalizeConstellations(data){
  const cs = data.constellations && typeof data.constellations === 'object'
    ? data.constellations : (data.constellations = {});
  const kills = cs.kills && typeof cs.kills === 'object' ? cs.kills : (cs.kills = {});
  const ranks = cs.ranks && typeof cs.ranks === 'object' ? cs.ranks : (cs.ranks = {});
  for (const id of CONST_IDS){
    kills[id] = Math.max(0, Math.floor(Number(kills[id]) || 0));
    ranks[id] = clamp(Math.floor(Number(ranks[id]) || 0), 0, 10);
  }
  return cs;
}

function normalizeGraveyard(data){
  const src = Array.isArray(data.graveyard) ? data.graveyard : [];
  const num = (v, max=1e15) => Math.min(max, Math.max(0, Number(v) || 0));

  data.graveyard = src.filter(r => r && typeof r === 'object').slice(0,10).map(r => ({
    stamp:num(r.stamp), weaponId:text(r.weaponId,'wpn.bow'), weaponName:text(r.weaponName,'ЛУЧНИК'),
    subclassName:text(r.subclassName), sprite:['archer','mage','necromancer','warrior'].includes(r.sprite) ? r.sprite : 'archer',

    earned:Math.floor(num(r.earned)), bankAfter:Math.floor(num(r.bankAfter)), bestAfter:Math.floor(num(r.bestAfter,1e5)),
    cause:text(r.cause,'неизвестна'), deathDmg:Math.floor(num(r.deathDmg)), kills:Math.floor(num(r.kills)),
    normals:Math.floor(num(r.normals)), elites:Math.floor(num(r.elites)), bosses:Math.floor(num(r.bosses)),
    damage:num(r.damage), maxHit:num(r.maxHit), crits:Math.floor(num(r.crits)), taken:num(r.taken), healing:num(r.healing),
    distance:num(r.distance), modifiers:Math.floor(num(r.modifiers,1e5)), books:Math.floor(num(r.books,1e4)),

  return data.graveyard;

/* Удалённые защитные товары возвращаются из старых сохранений полностью:
   игрок не теряет вложенное золото, а повторно миграция не срабатывает, потому
   что ключи сразу удаляются. Формула и старые потолки зафиксированы здесь. */
const REMOVED_SHOP_UPGRADES = [
  {id:'dr',    max:60, base:3000, grow:1.075},
  {id:'block', max:60, base:2500, grow:1.07},
];
function migrateRemovedShopUpgrades(data){
  const shop = data.shop && typeof data.shop === 'object' ? data.shop : (data.shop = {});
  let refund = 0;
  for (const it of REMOVED_SHOP_UPGRADES){
    const lvl = Math.min(it.max, Math.max(0, Math.floor(Number(shop[it.id]) || 0)));
    for (let i=0; i<lvl; i++) refund += shopCost(it, i);
    delete shop[it.id];
  }
  if (refund){
    data.gold = Math.max(0, Number(data.gold) || 0) + refund;
    data.spent = Math.max(0, (Number(data.spent) || 0) - refund);
  }
  return refund;
}
/* Старые уровни скорости выше нового потолка не должны ни действовать, ни
   исчезать без компенсации. Возврат считается по прежней кривой 1000 × 1.11^n,
   по которой эти уровни действительно покупались. После первого прохода ранг
   становится 10, поэтому миграция идемпотентна. */
function migrateCappedShopUpgrades(data){
  const shop = data.shop && typeof data.shop === 'object' ? data.shop : (data.shop = {});
  const old = {base:1000,grow:1.11}, raw = Math.max(0, Math.floor(Number(shop.mspd) || 0));
  if (raw <= 10) return 0;
  let refund=0;
  for (let i=10; i<Math.min(raw,50); i++) refund+=shopCost(old,i);
  shop.mspd=10;
  if (refund){
    data.gold=Math.max(0,Number(data.gold)||0)+refund;
    data.spent=Math.max(0,(Number(data.spent)||0)-refund);
  }
  return refund;
}
function normalizeMeta(data){
  normalizeConstellations(data); normalizeGraveyard(data);
  return migrateRemovedShopUpgrades(data)+migrateCappedShopUpgrades(data);
}

/* Ограничение применяется и к старым сохранениям: если прежний потолок товара
   был выше, сохранённые лишние ранги больше не проходят в характеристики. */
const shopLvl = id => {
  const raw = Math.max(0, Math.floor(Number(Store.data.shop && Store.data.shop[id]) || 0));
  const it = SHOP.find(x => x.id === id);
  return it ? Math.min(raw, it.max) : 0;
};

/* Цена следующего уровня. Округляем до трёх значащих цифр — «106 000» читается,
   «105 993» нет, а на баланс разница в четверть процента не влияет. */
function shopCost(it, lvl){
  const raw = it.base * Math.pow(it.grow, lvl);
  const p = Math.pow(10, Math.max(0, Math.floor(Math.log10(raw)) - 2));
  return Math.round(raw / p) * p;
}
/* Цена пачки из n уровней подряд, начиная с текущего. */
function shopBatch(it, n){
  let lvl = shopLvl(it.id), sum = 0, cnt = 0;
  for (let i = 0; i < n && lvl < it.max; i++, lvl++){ sum += shopCost(it, lvl); cnt++; }
  return {sum, cnt};
}
/* Возврат идёт с последнего ранга назад: так игрок получает ровно ту сумму,
   которую заплатил за отменяемые уровни, включая округление цены. */
function shopRefundBatch(it, n){
  let lvl = shopLvl(it.id), sum = 0, cnt = 0;
  for (let i = 0; i < n && lvl > 0; i++){ lvl--; sum += shopCost(it, lvl); cnt++; }
  return {sum, cnt};
}
function shopRefundTotal(){
  let sum=0,cnt=0;
  for (const it of SHOP){
    const part=shopRefundBatch(it,shopLvl(it.id));
    sum+=part.sum; cnt+=part.cnt;
  }
  return {sum,cnt};
}

/* Единственная точка, где покупки превращаются в характеристики.
   Всё идёт через сумку: движку не нужно знать, откуда взялся процент. */
function shopApply(bag){
  if (shopLvl('hpFlat')) bag.add('life', 'flat', shopLvl('hpFlat'));
  if (shopLvl('hpPct'))  bag.add('life', 'inc',  shopLvl('hpPct'));
  if (shopLvl('dmg'))    bag.add('dmg',  'inc',  shopLvl('dmg'));
  if (shopLvl('aspd'))   bag.add('aspd', 'inc',  shopLvl('aspd'));
  if (shopLvl('mspd'))   bag.add('mspd', 'inc',  shopLvl('mspd'));
  if (shopLvl('regen'))  bag.add('regen', 'flat', shopLvl('regen'));
  if (shopLvl('armor'))  bag.add('armor', 'flat', shopLvl('armor'));
  if (shopLvl('drFlat')) bag.add('drFlat', 'flat', shopLvl('drFlat'));
  if (shopLvl('dodge'))  bag.add('dodge', 'flat', shopLvl('dodge'));
  if (shopLvl('dashRecharge')) bag.add('dashRecharge', 'inc', shopLvl('dashRecharge')*5);
  if (shopLvl('dashLength'))   bag.add('dashLength', 'inc', shopLvl('dashLength')*5);
  if (shopLvl('dashN'))  bag.add('dashN', 'flat', shopLvl('dashN'));
  // Опыт и золото — обычные статы сумки, кладём туда же, где карточки и книги
  if (shopLvl('sxp'))    bag.add('xpGain',   'inc', shopLvl('sxp'));
  if (shopLvl('sgold'))  bag.add('goldFind', 'inc', shopLvl('sgold'));
  // Броня и плотность врагов своего стата в сумке не имеют — их читает recalc()
}
