# Публикация PolyGrind на GitHub Pages при каждом пуше в main.
# Никаких внешних хостов: все три действия — первой стороны от GitHub,
# поэтому история с недоступным зеркалом butler здесь невозможна в принципе.
#
# Разовая настройка (один раз, руками):
#   Settings -> Pages -> Source: выбрать "GitHub Actions"
# После этого игра живёт по адресу https://shuwarez.github.io/polygrind/
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:          # кнопка ручного запуска на вкладке Actions

# Права нужны, чтобы задача могла публиковать на Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно идёт только одна публикация; лишние в очереди отменяются
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Проверить структуру и регрессию
        run: |
          node tools/verify-structure.js
          node run-all.js

      - name: Собрать папку публикации и проставить версию
        run: |
          set -e
          BUILD="${GITHUB_SHA::7} · $(date -u +%Y-%m-%d)"
          mkdir -p build
          cp index.html build/index.html
          cp CNAME build/CNAME
          cp -R src build/src
          cp -R assets build/assets
          sed -i "s/__BUILD__/${BUILD}/" build/src/game/input-and-bootstrap.js
          test -f build/assets/manifest.json
          echo "собрано: ${BUILD}, общий размер $(du -sh build | cut -f1)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - id: deployment
        uses: actions/deploy-pages@v4
