# Публикация PolyGrind на GitHub Pages при каждом пуше в main.
# Никаких внешних хостов: все три действия — первой стороны от GitHub,
# поэтому история с недоступным зеркалом butler здесь невозможна в принципе.
#
# Разовая настройка (один раз, руками):
#   Settings -> Pages -> Source: выбрать "GitHub Actions"
# После этого игра живёт по адресу https://shuwarez.github.io/polygrind/
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:          # кнопка ручного запуска на вкладке Actions

# Права нужны, чтобы задача могла публиковать на Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно идёт только одна публикация; лишние в очереди отменяются
concurrency:
  group: pages
  cancel-in-progress: true

env:
  GAME_FILE: GrimGrind.html

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Собрать сборку и проставить версию
        run: |
          set -e
          if [ ! -f "$GAME_FILE" ]; then
            echo "ОШИБКА: не нашёл $GAME_FILE. Имя чувствительно к регистру. Есть:"; ls -1; exit 1
          fi
          BUILD="${GITHUB_SHA::7} · $(date -u +%Y-%m-%d)"
          mkdir -p build
          # Pages отдаёт index.html как главную страницу — переименовываем
          cp "$GAME_FILE" build/index.html
          sed -i "s/__BUILD__/${BUILD}/" build/index.html
          grep -q "</script>" build/index.html || { echo "ОШИБКА: скрипт оборван"; exit 1; }
          echo "собрано: ${BUILD}, размер $(du -h build/index.html | cut -f1)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - id: deployment
        uses: actions/deploy-pages@v4
